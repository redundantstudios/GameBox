<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c9dcc0">
<title>Planet Merge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{
  background:linear-gradient(#d3e4c6,#c2d8b6);
  color:#5c4632;font-family:'Fredoka',sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
}
#bg{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;height:100vh;height:100dvh;max-width:470px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row.top{justify-content:space-between}
.cbtn{border-radius:50%;display:grid;place-items:center;cursor:pointer;border:none;
  background:#fff;box-shadow:0 4px 0 rgba(120,90,60,.18),0 8px 18px rgba(90,60,30,.18);
  color:#e0699f;transition:transform .08s}
.cbtn:active{transform:translateY(3px)}
.cbtn svg{width:45%;height:45%}
.cbtn.b44{width:44px;height:44px}
.cbtn.b38{width:38px;height:38px}
.pills{display:flex;gap:8px}
.pill{background:rgba(56,47,42,.88);border-radius:15px;padding:5px 14px 6px;text-align:center;min-width:92px;
  box-shadow:0 4px 0 rgba(60,45,30,.25)}
.pill span{display:block;font:500 9.5px 'Fredoka';letter-spacing:.18em;color:#c9bcb0;text-transform:uppercase}
.pill b{display:inline-block;font:600 18px/1.15 'Fredoka';color:#fff}
.pill b.gold{color:#ffd75e}
#scoreVal.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:scale(1.35)}}
.row.tools{justify-content:flex-start}
.pbtn{position:relative;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  background:#ee6fa8;box-shadow:0 5px 0 #c94d86,0 10px 20px rgba(180,60,110,.3);
  display:grid;place-items:center;color:#fff;transition:transform .08s,box-shadow .08s,opacity .2s}
.pbtn svg{width:46%;height:46%}
.pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c94d86,0 4px 10px rgba(180,60,110,.3)}
.pbtn[disabled]{opacity:.45;pointer-events:none}
.pbtn.active{background:#f25a5a;box-shadow:0 5px 0 #c93a3a,0 10px 20px rgba(200,60,60,.3)}
.pbadge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#fff;
  border:2.5px solid #ee6fa8;color:#d14e91;font:700 12px/18px 'Fredoka';text-align:center;padding:0 4px;
  box-shadow:0 2px 6px rgba(120,40,80,.25)}
#queuePill{margin-left:auto;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.85);
  border-radius:999px;padding:2px 4px;box-shadow:0 4px 12px rgba(90,60,30,.12),inset 0 2px 6px rgba(255,255,255,.6)}
#queueCvs{display:block}
#boardWrap{position:relative;margin:0 auto;border-radius:24px;
  box-shadow:0 18px 44px rgba(96,58,26,.28)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#announce{position:absolute;top:16%;left:0;right:0;text-align:center;font:600 30px 'Fredoka';letter-spacing:.1em;
  color:#7a4a2a;text-shadow:0 2px 0 rgba(255,255,255,.7),0 6px 18px rgba(120,70,20,.25);opacity:0;pointer-events:none}
#announce.show{animation:ann 1.5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes ann{0%{opacity:0;transform:scale(.5)}14%{opacity:1;transform:scale(1.12)}26%{transform:scale(1)}
  72%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-16px)}}
#eraseBanner{position:absolute;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  background:rgba(255,255,255,.92);border:2px solid #f25a5a;color:#d64545;font:500 12px 'Fredoka';
  padding:6px 14px;border-radius:999px;display:none;box-shadow:0 4px 12px rgba(150,50,50,.25)}
#boardWrap.erasing #eraseBanner{display:block}
#chainWrap{margin:0 auto;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);
  border-radius:999px;padding:6px 12px;display:flex;align-items:flex-end;gap:6px;
  box-shadow:0 4px 12px rgba(90,60,30,.1)}
#chainWrap canvas{filter:drop-shadow(0 2px 3px rgba(90,60,30,.25))}
#chainWrap canvas.locked{opacity:.25;filter:grayscale(.95)}
#chainWrap canvas.pop{animation:chainpop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes chainpop{40%{transform:scale(1.55) translateY(-4px)}}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(210,225,195,.55);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.show{opacity:1;pointer-events:auto}
.card{text-align:center;padding:30px 26px 28px;border-radius:30px;max-width:min(88vw,360px);
  background:#fff8e9;border:3px solid #f3dfb4;box-shadow:0 24px 60px rgba(110,70,30,.3);
  transform:scale(.9);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.overlay.show .card{transform:scale(1)}
.big-title{font:700 40px/1.08 'Fredoka';letter-spacing:.1em;color:#7a4a2a}
.big-title em{font-style:normal;color:#ee6fa8}
.tag{margin-top:10px;color:#a58a68;font:400 14px 'Fredoka'}
#evoStrip{display:flex;align-items:flex-end;justify-content:center;gap:5px;margin:22px 0 2px;flex-wrap:wrap}
#evoStrip canvas{filter:drop-shadow(0 3px 4px rgba(90,60,30,.25))}
.play{margin-top:18px;font:600 20px 'Fredoka';letter-spacing:.1em;padding:14px 54px;border-radius:999px;border:none;cursor:pointer;
  background:#ee6fa8;color:#fff;box-shadow:0 6px 0 #c94d86,0 12px 24px rgba(180,60,110,.35);
  transition:transform .1s,box-shadow .1s}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 #c94d86}
.play[disabled]{opacity:.6;cursor:wait}
.mini{margin-top:14px;font:400 12px 'Fredoka';color:#b09877}
#bootMsg{margin-top:12px;font:500 13px/1.5 'Fredoka';color:#d64545;display:none}
.over-title{font:700 30px 'Fredoka';letter-spacing:.16em;color:#f25a5a}
.result{margin:16px 0 2px}
.result span{display:block;font:500 11px 'Fredoka';letter-spacing:.2em;color:#b09877;text-transform:uppercase}
.result b{font:700 46px/1.1 'Fredoka';color:#ee6fa8}
.result.sub{margin-top:6px}
.result.sub b{font-size:22px;color:#7a4a2a}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:40;pointer-events:none;white-space:nowrap;
  background:rgba(56,47,42,.94);color:#fff;font:500 13px 'Fredoka';
  padding:10px 18px;border-radius:999px;opacity:0;transform:translateX(-50%) translateY(18px);transition:.3s;
  box-shadow:0 8px 20px rgba(60,40,20,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="app">
  <div class="row top">
    <button class="cbtn b44" id="backBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="pills">
      <div class="pill"><span>Best</span><b id="bestVal">0</b></div>
      <div class="pill"><span>Score</span><b id="scoreVal" class="gold">0</b></div>
    </div>
    <div class="row" style="gap:8px">
      <button class="cbtn b38" id="muteBtn" aria-label="Sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
      </button>
      <button class="cbtn b44" id="resetBtn" aria-label="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
  </div>

  <div class="row tools">
    <button class="pbtn" id="eraseBtn" aria-label="Erase">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 4 11.5 12.5"/><path d="M9.5 10.5 14 15l-5.7 5.2c-.9.8-2.2.8-3-.1L4 18.8c-.8-.9-.7-2.2.1-3z"/>
        <path d="M19.2 13.6l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="currentColor" stroke="none"/>
        <path d="M15.6 17.4l.4 1.1 1.1.4-1.1.4-.4 1.1-.4-1.1-1.1-.4 1.1-.4z" fill="currentColor" stroke="none"/>
      </svg>
      <i class="pbadge" id="eraseN">3</i>
    </button>
    <button class="pbtn" id="undoBtn" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <i class="pbadge" id="undoN">3</i>
    </button>
    <div id="queuePill"><canvas id="queueCvs"></canvas></div>
  </div>

  <div id="boardWrap">
    <canvas id="game"></canvas>
    <div id="announce"></div>
    <div id="eraseBanner">Tap a planet to erase &middot; tap the broom to cancel</div>
  </div>

  <div id="chainWrap"></div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="card">
    <h2 class="big-title">PLANET<br><em>MERGE</em></h2>
    <p class="tag">Merge the planets. Build your universe.</p>
    <div id="evoStrip"></div>
    <button class="play" id="playBtn" disabled>LOADING&hellip;</button>
    <p class="mini">Match two identical planets &middot; don't cross the dashed line</p>
    <p id="bootMsg"></p>
  </div>
</div>

<div class="overlay" id="overOverlay">
  <div class="card">
    <h2 class="over-title">GAME OVER</h2>
    <div class="result"><span>Score</span><b id="finalScore">0</b></div>
    <div class="result sub"><span>Best</span><b id="finalBest">0</b></div>
    <button class="play" id="againBtn">PLAY AGAIN</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
function bootGame(){
const {Engine,Bodies,Body,Composite,Events,Query} = Matter;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const now=()=>performance.now();
const DPR=Math.min(2,window.devicePixelRatio||1);
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const store={
  get(k){try{return window.localStorage.getItem(k);}catch(_){return null;}},
  set(k,v){try{window.localStorage.setItem(k,v);}catch(_){}}
};

/* ============================================================
   TUNING
============================================================ */
const CFG={
  gravity:1.0,
  friction:0.32, frictionStatic:0.6,
  restitution:0.2, restitutionBig:0.12,
  frictionAirBase:0.013, frictionAirPerLevel:0.0008,
  densityBase:0.0013, densityPerLevel:0.00005,
  mergeDistance:1.02,
  dangerY:132, dangerTime:1000,
  dropY:46, dropDelay:520, dropSpeed:3,
  spawnWeights:[32,29,22,17],
  undoCount:3, eraseCount:3,
  scores:[10,20,40,80,160,320,640,1280,2560],
  supernovaScore:5000,
  comboWindow:1100, comboBonus:0.5,
};
const BW=420, BH=560, WALL=26;
const RADII=[15,21,28,35,44,54,65,77,90,104];

/* ============================================================
   KAWAII PLANET ART — sticker style: flat body, thick outline,
   face, blush, highlight. Each has its own character.
============================================================ */
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function circlePath(g,R){g.beginPath();g.arc(0,0,R,0,TAU);}
function baseFill(g,R,stops){const gr=g.createRadialGradient(-R*0.2,-R*0.25,R*0.15,0,0,R);for(const s of stops)gr.addColorStop(s[0],s[1]);g.fillStyle=gr;g.fillRect(-R,-R,2*R,2*R);}
function craters(g,R,rnd,n,dark,light){
  for(let i=0;i<n;i++){const a=rnd()*TAU,d=Math.sqrt(rnd())*R*0.8,x=Math.cos(a)*d,y=Math.sin(a)*d,r=(0.06+rnd()*0.08)*R;
    if(Math.abs(x)<R*0.45&&y>-R*0.15&&y<R*0.45)continue; // keep face zone clear
    g.fillStyle=dark;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    g.strokeStyle=light;g.globalAlpha=0.6;g.lineWidth=r*0.3;
    g.beginPath();g.arc(x,y,r*0.7,Math.PI*0.9,Math.PI*1.9);g.stroke();g.globalAlpha=1;}
}
function patches(g,R,rnd,n,color,alpha,maxD){
  for(let i=0;i<n;i++){const a=rnd()*TAU,d=Math.sqrt(rnd())*maxD,x=Math.cos(a)*d,y=Math.sin(a)*d,r=(0.13+rnd()*0.2)*R;
    g.globalAlpha=alpha;g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
  g.globalAlpha=1;
}
function band(g,R,cy,h,color,alpha,amp,ph){
  g.globalAlpha=alpha;g.fillStyle=color;g.beginPath();const N=12;
  for(let i=0;i<=N;i++){const x=-R+2*R*i/N,y=cy+Math.sin(x/R*2.4+ph)*amp;i?g.lineTo(x,y):g.moveTo(x,y);}
  for(let i=N;i>=0;i--){const x=-R+2*R*i/N,y=cy+h+Math.sin(x/R*2.4+ph+0.9)*amp;g.lineTo(x,y);}
  g.closePath();g.fill();g.globalAlpha=1;
}
function bands(g,R,list){for(let k=0;k<list.length;k++){const b=list[k];
  band(g,R,b.y*R,b.h*R,b.c,b.a===undefined?0.5:b.a,(b.amp===undefined?0.05:b.amp)*R,b.ph===undefined?0:b.ph);}}
function smoothBlob(g,x,y,r,rnd){
  const n=9,pts=[];
  for(let i=0;i<n;i++){const a=i/n*TAU,rr=r*(0.62+rnd()*0.55);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}
  g.beginPath();g.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}
  g.closePath();
}
function wave(g,R,y,amp,ph,w,color,alpha){
  g.globalAlpha=alpha;g.strokeStyle=color;g.lineCap='round';g.lineWidth=w;
  g.beginPath();g.moveTo(-R*1.02,y);
  g.quadraticCurveTo(0,y+amp,R*1.02,y+amp*0.4);g.stroke();g.globalAlpha=1;
}
/* --- faces --- */
const INK='#46282a';
function face(g,R,type){
  const ey=-0.05*R, dx=0.33*R, er=0.088*R;
  g.fillStyle=INK;g.strokeStyle=INK;g.lineCap='round';
  function dot(x){g.beginPath();g.arc(x,ey,er,0,TAU);g.fill();}
  function closed(x,squash){g.save();g.translate(x,ey);g.scale(1,squash||1);g.lineWidth=er*0.8;
    g.beginPath();g.arc(0,er*0.35,er*1.2,Math.PI,TAU);g.stroke();g.restore();}
  function smile(y,r){g.lineWidth=er*0.75;g.beginPath();g.arc(0,y,r,Math.PI*0.18,Math.PI*0.82);g.stroke();}
  function openMouth(y,r){
    g.beginPath();g.arc(0,y,r,0,Math.PI);g.closePath();g.fillStyle='#5b2c26';g.fill();
    g.save();g.beginPath();g.arc(0,y,r,0,Math.PI);g.closePath();g.clip();
    g.fillStyle='#f2887a';g.beginPath();g.ellipse(0,y+r*0.55,r*0.62,r*0.45,0,0,TAU);g.fill();g.restore();
    g.fillStyle=INK;
  }
  // blush
  g.fillStyle='rgba(255,110,110,.42)';
  g.beginPath();g.ellipse(-dx-er*1.1,0.13*R,er*1.25,er*0.7,0,0,TAU);g.fill();
  g.beginPath();g.ellipse(dx+er*1.1,0.13*R,er*1.25,er*0.7,0,0,TAU);g.fill();
  g.fillStyle=INK;
  if(type==='happy'){dot(-dx);dot(dx);smile(0.1*R,0.17*R);}
  else if(type==='closed'){closed(-dx);closed(dx);smile(0.1*R,0.17*R);}
  else if(type==='sleepy'){closed(-dx,0.5);closed(dx,0.5);smile(0.11*R,0.13*R);}
  else if(type==='wink'){dot(-dx);closed(dx);openMouth(0.17*R,0.13*R);}
  else if(type==='excited'){dot(-dx);dot(dx);openMouth(0.16*R,0.16*R);}
  else if(type==='grin'){closed(-dx);closed(dx);openMouth(0.15*R,0.21*R);}
}
function highlight(g,R){
  g.fillStyle='rgba(255,255,255,.6)';
  g.beginPath();g.ellipse(-0.36*R,-0.42*R,0.17*R,0.09*R,-0.7,0,TAU);g.fill();
  g.beginPath();g.arc(-0.14*R,-0.55*R,0.05*R,0,TAU);g.fill();
}
const PLANETS=[
{name:'Luna',light:'#f2f4f8',fx:['#e8ebf2','#8f97ab'],seed:11,face:'sleepy',
  paint(g,R,rnd){baseFill(g,R,[[0,'#dde1e9'],[1,'#a5adbf']]);craters(g,R,rnd,7,'#8b93a6','#dde1e9');}},
{name:'Mercury',light:'#f2d9bc',fx:['#eed2b0','#8a6a48'],seed:22,face:'happy',
  paint(g,R,rnd){baseFill(g,R,[[0,'#dcb890'],[1,'#a37e55']]);craters(g,R,rnd,8,'#7d5f3d','#dcb890');}},
{name:'Mars',light:'#ffc9a3',fx:['#ffb489','#b64726'],seed:33,face:'excited',
  paint(g,R,rnd){baseFill(g,R,[[0,'#f6a06b'],[1,'#cf5c2b']]);patches(g,R,rnd,4,'#a8441c',0.3,R*0.75);craters(g,R,rnd,2,'#9c3d1a','#f6a06b');}},
{name:'Venus',light:'#ffe9b3',fx:['#ffe3a6','#c98a2e'],seed:44,face:'wink',
  paint(g,R,rnd){baseFill(g,R,[[0,'#f8d488'],[1,'#dfa143']]);
    wave(g,R,-R*0.42,R*0.14,0.4,R*0.09,'#fbe8b4',0.7);wave(g,R,-R*0.05,R*0.16,2.2,R*0.09,'#c9872f',0.5);
    wave(g,R,R*0.34,R*0.12,4.0,R*0.09,'#fbe8b4',0.6);}},
{name:'Earth',light:'#c6e9ff',fx:['#9fd4ff','#3d8f57'],seed:55,face:'happy',
  paint(g,R,rnd){baseFill(g,R,[[0,'#74c1ee'],[1,'#2f7cc0']]);
    g.fillStyle='#54b063';
    for(let i=0;i<5;i++){const a=rnd()*TAU,d=Math.sqrt(rnd())*R*0.78,x=Math.cos(a)*d,y=Math.sin(a)*d;
      if(Math.abs(x)<R*0.4&&y>-R*0.2&&y<R*0.4)continue;
      smoothBlob(g,x,y,R*(0.15+rnd()*0.17),rnd);g.fill();}
    g.fillStyle='rgba(255,255,255,.65)';
    g.beginPath();g.ellipse(-R*0.42,-R*0.1,R*0.16,R*0.06,-0.4,0,TAU);g.fill();}},
{name:'Neptune',light:'#b9d2ff',fx:['#9cc2ff','#274a9e'],seed:66,face:'closed',
  paint(g,R,rnd){baseFill(g,R,[[0,'#6b97e8'],[1,'#3a5fc2']]);
    bands(g,R,[{y:0.28,h:0.09,c:'#8db2f2',a:0.55,ph:1},{y:0.66,h:0.09,c:'#2c50ac',a:0.5,ph:2.4}]);
    g.globalAlpha=0.5;g.fillStyle='#24418f';g.beginPath();g.ellipse(R*0.3,-R*0.32,R*0.14,R*0.08,-0.2,0,TAU);g.fill();g.globalAlpha=1;}},

const SFX=(()=>{
  let ac=null,master=null,noiseBuf=null,lastBounce=0;
  let muted=store.get('pm_muted')==='1';
  function ensure(){
    if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      ac=new AC();master=ac.createGain();master.gain.value=muted?0:0.5;master.connect(ac.destination);
      noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(ac.state==='suspended')ac.resume();
  }
  function tone(o){if(!ac)return;const f=o.f!==undefined?o.f:440,f2=o.f2||0,type=o.type||'sine',dur=o.dur!==undefined?o.dur:0.2,vol=o.vol!==undefined?o.vol:0.25,delay=o.delay||0;
    const t0=ac.currentTime+delay;
    const osc=ac.createOscillator(),g=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t0);
    if(f2)osc.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+dur+0.06);}
  function noise(o){if(!ac)return;const dur=o.dur!==undefined?o.dur:0.15,vol=o.vol!==undefined?o.vol:0.2,freq=o.freq||900,delay=o.delay||0;
    const t0=ac.currentTime+delay;
    const src=ac.createBufferSource();src.buffer=noiseBuf;
    const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=freq;
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(fl);fl.connect(g);g.connect(master);src.start(t0);src.stop(t0+dur+0.06);}
  return{
    ensure,
    get muted(){return muted;},
    toggle(){muted=!muted;store.set('pm_muted',muted?'1':'0');if(master)master.gain.value=muted?0:0.5;return muted;},
    click(){tone({f:760,type:'triangle',dur:0.06,vol:0.12});},
    drop(){tone({f:340,f2:150,type:'triangle',dur:0.13,vol:0.28});noise({dur:0.06,vol:0.07,freq:1000});},
    bounce(lvl,speed){if(!ac)return;const t=now();if(t-lastBounce<80)return;lastBounce=t;
      const v=Math.min(0.18,0.02+speed*0.018);
      tone({f:Math.max(70,190-lvl*10),type:'sine',dur:0.07,vol:v});noise({dur:0.04,vol:v*0.4,freq:600});},
    merge(lvl,combo){const f0=300*Math.pow(1.15,lvl-1)*(1+0.05*Math.min(6,(combo||1)-1));
      tone({f:f0,type:'triangle',dur:0.15,vol:0.3});
      tone({f:f0*1.5,type:'sine',dur:0.22,vol:0.24,delay:0.06});
      if(lvl>=4)tone({f:f0*2,type:'sine',dur:0.3,vol:0.15,delay:0.12});
      noise({dur:0.1,vol:0.09,freq:1500});},
    pop(){tone({f:540,f2:140,type:'square',dur:0.08,vol:0.15});noise({dur:0.05,vol:0.09,freq:900});},
    undo(){tone({f:230,f2:560,type:'sine',dur:0.17,vol:0.15});},
    supernova(){tone({f:180,f2:40,type:'sine',dur:0.7,vol:0.5});noise({dur:0.5,vol:0.35,freq:400});
      tone({f:900,f2:2200,type:'sine',dur:0.4,vol:0.12,delay:0.05});},
    gameover(){[330,262,196,131].forEach((f,i)=>tone({f,type:'triangle',dur:0.3,vol:0.24,delay:i*0.16}));},
  };
})();

const engine=Engine.create({enableSleeping:false});

function makePlanetBody(lvl,x,y){
  const r=RADII[lvl-1];

    restitution:lvl>=6?CFG.restitutionBig:CFG.restitution,
    friction:CFG.friction,frictionStatic:CFG.frictionStatic,

function destroyBody(b){
  b.plugin.dead=true;merging.delete(b.id);

  const i=planetBodies.indexOf(b);if(i>=0)planetBodies.splice(i,1);

Events.on(engine,'collisionStart',e=>{
  for(const p of e.pairs){
    tryQueueMerge(p.bodyA,p.bodyB,p);

  }
});
Events.on(engine,'collisionActive',e=>{for(const p of e.pairs)tryQueueMerge(p.bodyA,p.bodyB,p);});
function tryQueueMerge(a,b,pair){
  if(state==='over'||state==='start')return;
  if(!a.plugin||!a.plugin.planet||!b.plugin||!b.plugin.planet)return;
  if(a.plugin.lvl!==b.plugin.lvl)return;
  if(merging.has(a.id)||merging.has(b.id))return;
  merging.add(a.id);merging.add(b.id);
  mergeQueue.push({a,b,pair});
}
function processMerges(){
  while(mergeQueue.length){
    const m=mergeQueue.shift();const a=m.a,b=m.b,pair=m.pair;
    if(a.plugin.dead||b.plugin.dead){merging.delete(a.id);merging.delete(b.id);continue;}
    doMerge(a,b,pair);
  }
}
let sweepTick=0;
function proximitySweep(){
  for(let i=0;i<planetBodies.length;i++)for(let j=i+1;j<planetBodies.length;j++){
    const a=planetBodies[i],b=planetBodies[j];
    if(a.plugin.lvl!==b.plugin.lvl)continue;
    const rr=(a.circleRadius+b.circleRadius)*CFG.mergeDistance;
    const dx=a.position.x-b.position.x,dy=a.position.y-b.position.y;
    if(dx*dx+dy*dy<rr*rr)tryQueueMerge(a,b,null);
  }
}
function doMerge(a,b,pair){
  const lvl=a.plugin.lvl;
  let mx,my;
  const sup=pair&&pair.collision&&pair.collision.supports;
  if(sup&&sup.length){let sx=0,sy=0;for(const v of sup){sx+=v.x;sy+=v.y;}mx=sx/sup.length;my=sy/sup.length;}
  else{mx=(a.position.x+b.position.x)/2;my=(a.position.y+b.position.y)/2;}
  const vx=(a.velocity.x+b.velocity.x)*0.22,vy=Math.min(0,(a.velocity.y+b.velocity.y)*0.22);
  destroyBody(a);destroyBody(b);
  if(lvl>=10){
    setScore(score+CFG.supernovaScore);
    floatText('+'+CFG.supernovaScore,mx,my-34,'#e08a1e');
    burst(mx,my,10,20);ringFX(mx,my,60,'#ffcf5c');ringFX(mx,my,30,'#ffffff');
    shake(15);flashA=0.4;SFX.supernova();announce('SUPERNOVA!','#e08a1e');
    return;

  const nl=lvl+1,r=RADII[nl-1],P=PLANETS[nl-1];
  const nb=makePlanetBody(nl,clamp(mx,WALL+r+2,BW-WALL-r-2),clamp(my,CFG.dropY+20,BH-WALL-r-2));
  Body.setVelocity(nb,{x:vx,y:vy-2.4});
  const pts=CFG.scores[lvl-1];
  const t=now();
  comboN=(t-comboT<CFG.comboWindow)?comboN+1:1;comboT=t;
  setScore(score+pts);

    if(bonus>0){setScore(score+bonus);floatText('COMBO x'+comboN,mx,my-r-34,'#f07f2e');}}

}
function impactFX(pair){
  const a=pair.bodyA,b=pair.bodyB;
  if(!a.plugin||!a.plugin.planet||!b.plugin||!b.plugin.planet)return;
  const rv=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);
  if(rv<5)return;
  const t=now();
  if(t-a.plugin.hitCd<120&&t-b.plugin.hitCd<120)return;
  a.plugin.hitCd=t;b.plugin.hitCd=t;
  SFX.bounce(Math.max(a.plugin.lvl,b.plugin.lvl),rv);
  const sup=pair.collision&&pair.collision.supports;
  if(sup&&sup.length){
    const n=Math.min(4,1+Math.floor(rv/4));
    for(let i=0;i<n;i++){const v=sup[i%sup.length];
      parts.push({type:'puff',x:v.x+(Math.random()-0.5)*6,y:v.y+(Math.random()-0.5)*6,
        vx:(Math.random()-0.5)*1.2,vy:-0.4-Math.random(),r:2+Math.random()*3,vr:0.12,
        life:300+Math.random()*200,max:500});}
  }
}

let state='start';

const parts=[],floats=[];
function shake(m){shakeMag=Math.min(15,shakeMag+m);}
function genLevel(){
  let tot=0;for(const w of CFG.spawnWeights)tot+=w;
  let r=Math.random()*tot;
  for(let i=0;i<CFG.spawnWeights.length;i++){r-=CFG.spawnWeights[i];if(r<0)return i+1;}
  return 1;

function pushSnapshot(){
  snapshots.push({
    planets:planetBodies.map(b=>({lvl:b.plugin.lvl,x:b.position.x,y:b.position.y,
      vx:b.velocity.x,vy:b.velocity.y,a:b.angle,av:b.angularVelocity})),
    queue:queue.slice(),score,
  });
  if(snapshots.length>40)snapshots.shift();
}
function restoreSnap(s){
  while(planetBodies.length)destroyBody(planetBodies[0]);
  merging.clear();mergeQueue.length=0;
  for(const p of s.planets){
    const b=makePlanetBody(p.lvl,p.x,p.y);
    Body.setAngle(b,p.a);Body.setAngularVelocity(b,p.av);Body.setVelocity(b,{x:p.vx,y:p.vy});
    b.plugin.spawn=0;
  }
  queue=s.queue.slice();qa.reset(queue);
  score=s.score;scoreVal.textContent=score;
  bestLevel=1;for(const p of s.planets)bestLevel=Math.max(bestLevel,p.lvl);
  state='ready';readyAt=now();dropX=BW/2;targetX=BW/2;
}
function doUndo(){
  if(state==='start'||state==='over')return;
  eraseMode=false;
  if(undos<=0){toast('No undos left');updateHUD();return;}
  const s=snapshots.pop();
  if(!s){toast('Nothing to undo');updateHUD();return;}
  undos--;restoreSnap(s);SFX.undo();flashA=0.2;toast('Rewound one move');updateHUD();
}
function doDrop(){
  if(state!=='ready'&&state!=='aiming')return;
  const lvl=queue[0];if(!lvl)return;
  const r=RADII[lvl-1];
  const x=clamp(dropX,WALL+r+2,BW-WALL-r-2);
  pushSnapshot();
  const b=makePlanetBody(lvl,x,CFG.dropY);
  Body.setVelocity(b,{x:0,y:CFG.dropSpeed});
  Body.setAngularVelocity(b,(Math.random()-0.5)*0.1);
  SFX.drop();
  queue.shift();queue.push(genLevel());
  discover(queue[2]);
  qa.advance(queue);
  comboN=0;
  state='dropping';dropReadyAt=now()+CFG.dropDelay;
  updateHUD();
}
function pickPlanet(p){
  const hit=Query.point(planetBodies,p)[0];
  if(hit)return hit;
  let bestB=null,bd=12;
  for(const b of planetBodies){
    const d=Math.hypot(b.position.x-p.x,b.position.y-p.y)-b.circleRadius;
    if(d<bd){bd=d;bestB=b;}
  }
  return bestB;
}
function doErase(b){

function dangerCheck(dt){

    const above=b.position.y-b.circleRadius<CFG.dangerY;
    const age=now()-b.plugin.born;
    const speed=Math.hypot(b.velocity.x,b.velocity.y);
    const eligible=age>600&&(speed<8||age>1600);
    if(above&&eligible)b.plugin.danger+=dt;else b.plugin.danger=0;

function gameOver(){

}
function resetGame(){
  while(planetBodies.length)destroyBody(planetBodies[0]);
  merging.clear();mergeQueue.length=0;parts.length=0;floats.length=0;
  score=0;scoreVal.textContent='0';
  undos=CFG.undoCount;erases=CFG.eraseCount;
  snapshots.length=0;bestLevel=1;runStartBest=best;newBest=false;comboN=0;
  queue=[];for(let i=0;i<4;i++)queue.push(genLevel());
  discovered.clear();for(let i=0;i<3;i++)discover(queue[i]);
  qa.reset(queue);
  dropX=BW/2;targetX=BW/2;eraseMode=false;hoverBody=null;
  state='ready';readyAt=now();dropReadyAt=0;
  overOverlay.classList.remove('show');
  updateHUD();
}

/* ============================================================
   EFFECTS
============================================================ */
function burst(x,y,lvl,n){
  const P=PLANETS[Math.min(lvl,10)-1];
  const nStar=lvl>=4?3+Math.floor(lvl/2):2;
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,sp=1.5+Math.random()*(2+lvl*0.45);
    const c=Math.random()<0.4?'#ffffff':(Math.random()<0.5?P.fx[0]:P.fx[1]);
    parts.push({type:'dot',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
      r:1.6+Math.random()*2.4+lvl*0.22,c,life:380+Math.random()*320,max:700,rot:Math.random()*TAU});
  }
  for(let i=0;i<nStar;i++){
    const a=Math.random()*TAU,sp=2+Math.random()*2.5;
    parts.push({type:'star',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.4,
      r:4+Math.random()*3+lvl*0.3,c:Math.random()<0.5?'#ffd75e':P.light,
      life:450+Math.random()*250,max:700,rot:Math.random()*TAU,vrot:(Math.random()-0.5)*0.2});
  }
  if(parts.length>240)parts.splice(0,parts.length-240);
}
function ringFX(x,y,r,c){parts.push({type:'ring',x,y,r,vr:2.6,life:320,max:320,c});}
function floatText(text,x,y,c){floats.push({text,x,y,c:c||'#7a4a2a',life:950,max:950});}
function updateFX(dt){
  const k=dt/16.66;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    if(p.type==='ring'){p.r+=p.vr*k;continue;}
    p.x+=p.vx*k;p.y+=p.vy*k;
    if(p.type==='puff'){p.r+=p.vr*k;p.vy-=0.01*k;}
    else{p.vy+=0.05*k;p.vx*=Math.pow(0.985,k);p.vy*=Math.pow(0.985,k);
      if(p.rot!==undefined)p.rot+=(p.vrot||0)*k;}
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.life-=dt;f.y-=0.5*k;
    if(f.life<=0)floats.splice(i,1);
  }
  shakeMag*=Math.pow(0.9,k);if(shakeMag<0.15)shakeMag=0;
  flashA=Math.max(0,flashA-dt*0.0016);
}
const announceEl=$('announce');
function announce(text,color){
  announceEl.textContent=text;announceEl.style.color=color||'#7a4a2a';
  announceEl.classList.remove('show');void announceEl.offsetWidth;announceEl.classList.add('show');
}
const toastEl=$('toast');let toastT=0;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1700);
}

/* ============================================================
   NEXT-QUEUE — glass pill with springy slide / pop animation
============================================================ */
const qCvs=$('queueCvs'),qg=qCvs.getContext('2d');
const QW=158,QH=62,QBASE=[46,34,34],QCENTERS=[31,80,123];
qCvs.width=QW*DPR;qCvs.height=QH*DPR;
qCvs.style.width=QW+'px';qCvs.style.height=QH+'px';
const qa={
  items:[],
  reset(q){
    this.items=q.slice(0,3).map((lvl,i)=>({lvl,x:QCENTERS[i],vx:0,s:0,ts:[1,0.74,0.74][i]}));
  },
  advance(q){
    if(this.items.length&&this.items[0].lvl===q[0]===false){}
    if(this.items[0])this.items[0].leaving=true;
    this.items.push({lvl:q[2],x:QCENTERS[2]+54,vx:0,s:0.05,ts:0.74});
  },
  draw(t){
    qg.setTransform(DPR,0,0,DPR,0,0);
    qg.clearRect(0,0,QW,QH);
    qg.save();
    qg.beginPath();
    if(qg.roundRect)qg.roundRect(0,0,QW,QH,31);else qg.rect(0,0,QW,QH);
    qg.clip();
    let slot=0;
    for(let i=this.items.length-1;i>=0;i--){
      const it=this.items[i];
      let tx,ts,base;
      if(it.leaving){tx=-52;ts=0.6;base=QBASE[0];}
      else{
        const idx=slot++;
        if(idx<3){tx=QCENTERS[idx];ts=[1,0.74,0.74][idx];base=QBASE[idx];}
        else{tx=QCENTERS[2]+(idx-2)*54;ts=0.74;base=QBASE[2];}
      }
      it.vx=(it.vx+(tx-it.x)*0.024)*0.8;it.x+=it.vx;
      it.s+=(ts-it.s)*0.14;
      it.rot=(it.rot||0)+it.vx*0.02;
      if(it.leaving&&it.x<-46){this.items.splice(i,1);continue;}
      const sz=base*Math.max(0.03,it.s);
      let y=QH/2+2;
      if(!it.leaving&&slot===1)y+=Math.sin(t*0.004)*2.2; // slot 0 bob (slot already incremented)
      qg.save();qg.translate(it.x,y);qg.rotate(clamp(it.rot||0,-0.3,0.3));
      qg.globalAlpha=0.25;
      qg.drawImage(SHADOW,-sz*0.55,-sz*0.45+sz*0.12,sz*1.1,sz*1.0);
      qg.globalAlpha=1;
      qg.drawImage(ICONS[it.lvl-1],-sz/2,-sz/2,sz,sz);
      qg.restore();
    }
    // pulse ring around the current slot
    qg.strokeStyle='rgba(255,255,255,'+(0.5+0.3*Math.sin(t*0.005))+')';
    qg.lineWidth=2.5;
    qg.beginPath();qg.arc(QCENTERS[0],QH/2+2,QBASE[0]/2+4+Math.sin(t*0.005)*1.5,0,TAU);qg.stroke();
    qg.restore();
  }
};

/* ============================================================
   EVOLUTION STRIP (bottom) — discovered planets light up
============================================================ */
const discovered=new Set();
const stripItems=[];
function buildChain(container,unlockAll){
  for(let i=0;i<PLANETS.length;i++){
    const s=16+i*2;
    const cv=document.createElement('canvas');
    cv.width=s*2;cv.height=s*2;cv.style.width=s+'px';cv.style.height=s+'px';
    cv.getContext('2d').drawImage(ICONS[i],0,0,s*2,s*2);
    if(!unlockAll)cv.classList.add('locked');
    container.appendChild(cv);
    stripItems.push({lvl:i+1,cv});
  }
}
function discover(lvl){
  if(discovered.has(lvl))return;
  discovered.add(lvl);
  for(const it of stripItems){
    if(it.lvl===lvl){
      it.cv.classList.remove('locked','pop');void it.cv.offsetWidth;it.cv.classList.add('pop');
    }
  }
}

/* ============================================================
   RENDERING
============================================================ */
const wrap=$('boardWrap'),cvs=$('game'),ctx=cvs.getContext('2d');
const view={S:1};
let PAT=null;
function buildPattern(){
  const pc=makeCanvas(104,104),pg=pc.getContext('2d');
  pg.fillStyle='#f7e5b2';pg.fillRect(0,0,104,104);
  pg.fillStyle='#f2dda6';pg.fillRect(0,0,52,52);pg.fillRect(52,52,52,52);
  PAT=ctx.createPattern(pc,'repeat');
}
function roundRectPath(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
const hdr=$('app');
function layout(){
  const chain=$('chainWrap');
  const availW=Math.min(innerWidth-16,440);
  const availH=innerHeight-hdr.querySelector('.row.top').offsetHeight
    -hdr.querySelector('.row.tools').offsetHeight-chain.offsetHeight-44;
  let w=Math.min(availW,432);let h=w*BH/BW;
  if(h>availH){h=Math.max(280,availH);w=h*BW/BH;}
  wrap.style.width=w+'px';wrap.style.height=h+'px';
  cvs.width=Math.round(w*DPR);cvs.height=Math.round(h*DPR);
  view.S=cvs.width/BW;
}
function landingY(x,r){
  let y=BH-WALL-r;
  for(const b of planetBodies){
    const rr=b.circleRadius+r,dx=Math.abs(b.position.x-x);
    if(dx<rr){const cy=b.position.y-Math.sqrt(rr*rr-dx*dx);if(cy<y)y=cy;}
  }
  return Math.max(CFG.dropY,y);
}
function drawRings(g,x,y,r){
  const w=r*5.6;g.drawImage(RINGS,x-w/2,y-w/2,w,w);
}
function drawPlanetAt(g,lvl,x,y,r,angle,t){
  const P=PLANETS[lvl-1];
  if(P.sun){const gp=1+0.05*Math.sin(t*0.003);const gs=r*4.4*gp;
    g.save();g.globalCompositeOperation='lighter';g.globalAlpha=0.8;
    g.drawImage(GLOW,x-gs/2,y-gs/2,gs,gs);g.restore();}
  if(lvl===8)drawRings(g,x,y,r);
  g.save();g.translate(x,y);g.rotate(angle);g.drawImage(SURF[lvl-1],-r,-r,2*r,2*r);g.restore();
}
function drawBody(g,b,t){
  const lvl=b.plugin.lvl,r=b.circleRadius,x=b.position.x,y=b.position.y;
  const age=t-b.plugin.spawn,vis=age<240?easeOutBack(clamp(age/240,0,1)):1;
  const rr=Math.max(0.5,r*vis);
  g.globalAlpha=0.5;
  g.drawImage(SHADOW,x-rr*1.05+r*0.1,y-rr*0.95+r*0.22,rr*2.1,rr*1.9);
  g.globalAlpha=1;
  drawPlanetAt(g,lvl,x,y,rr,b.angle,t);
  if(b.plugin.danger>0){
    const k=Math.min(1,b.plugin.danger/CFG.dangerTime);
    g.strokeStyle='rgba(226,87,76,'+(0.35+0.5*k*(0.6+0.4*Math.sin(t*0.02)))+')';
    g.lineWidth=3.5;g.beginPath();g.arc(x,y,r+3,0,TAU);g.stroke();
  }
  if(eraseMode&&hoverBody===b){
    g.setLineDash([7,6]);g.strokeStyle='#f25a5a';g.lineWidth=3;
    g.beginPath();g.arc(x,y,r+5,t*0.003,t*0.003+TAU);g.stroke();g.setLineDash([]);
  }
}
function drawGuide(g,t){
  const lvl=queue[0];if(!lvl)return;
  const r=RADII[lvl-1],P=PLANETS[lvl-1];
  const x=clamp(dropX,WALL+r+2,BW-WALL-r-2),ly=landingY(x,r);
  g.fillStyle='#e2574c';g.globalAlpha=0.75;
  for(let y=CFG.dropY+r+16;y<ly-r-6;y+=30){
    g.beginPath();g.arc(x,y,4.2,0,TAU);g.fill();
  }
  g.globalAlpha=0.3;
  g.setLineDash([7,7]);g.strokeStyle=P.outline;g.lineWidth=2.5;
  g.beginPath();g.arc(x,ly,r,0,TAU);g.stroke();g.setLineDash([]);
  g.globalAlpha=1;
}
function drawDangerLine(g,t){
  let near=false;
  for(const b of planetBodies)if(b.position.y-b.circleRadius<CFG.dangerY+55){near=true;break;}
  const a=(near?0.95:0.6)*(0.8+0.2*Math.sin(t*0.006));
  g.lineCap='round';
  g.setLineDash([15,22]);g.lineWidth=8.5;
  g.strokeStyle='rgba(226,87,76,'+a+')';
  g.beginPath();g.moveTo(WALL+8,CFG.dangerY);g.lineTo(BW-WALL-8,CFG.dangerY);g.stroke();
  g.setLineDash([]);
}
function drawParticles(g){
  for(const p of parts){
    const a=p.life/p.max;
    if(p.type==='puff'){
      g.globalAlpha=a*0.28;g.fillStyle='#a8815a';
      g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill();
    }else if(p.type==='ring'){
      g.globalAlpha=a*0.85;g.strokeStyle=p.c;g.lineWidth=4+(1-a)*3;
      g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke();
    }else if(p.type==='star'){
      g.globalAlpha=a;g.fillStyle=p.c;
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);
      const R1=p.r,R2=p.r*0.42;
      g.beginPath();
      for(let k=0;k<8;k++){const rad=k%2?R2:R1,an=k/8*TAU;
        k?g.lineTo(Math.cos(an)*rad,Math.sin(an)*rad):g.moveTo(Math.cos(an)*rad,Math.sin(an)*rad);}
      g.closePath();g.fill();g.restore();
    }else{
      g.globalAlpha=a;g.fillStyle=p.c;
      g.beginPath();g.arc(p.x,p.y,p.r*(0.5+0.5*a),0,TAU);g.fill();
    }
  }
  g.globalAlpha=1;
}
function drawFloats(g){
  g.textAlign='center';
  for(const f of floats){
    const a=Math.min(1,f.life/(f.max*0.4));
    g.font="600 20px Fredoka, sans-serif";
    g.globalAlpha=a;
    g.strokeStyle='rgba(255,250,235,.9)';g.lineWidth=5;g.strokeText(f.text,f.x,f.y);
    g.fillStyle=f.c;g.fillText(f.text,f.x,f.y);
  }
  g.globalAlpha=1;
}
function draw(t){
  const g=ctx;
  g.setTransform(view.S,0,0,view.S,0,0);
  g.clearRect(0,0,BW,BH);
  if(shakeMag>0)g.translate((Math.random()*2-1)*shakeMag,(Math.random()*2-1)*shakeMag*0.7);
  // frame body
  roundRectPath(g,1,1,BW-2,BH-2,22);
  g.fillStyle='#b25c3d';g.fill();
  // interior
  g.save();roundRectPath(g,WALL,WALL,BW-WALL*2,BH-WALL*2,14);g.clip();
  g.fillStyle='#f7e5b2';g.fillRect(0,0,BW,BH);
  if(PAT){g.fillStyle=PAT;g.fillRect(WALL,WALL,BW-WALL*2,BH-WALL*2);}
  // danger glow when someone is close
  let near=false;
  for(const b of planetBodies)if(b.position.y-b.circleRadius<CFG.dangerY+55){near=true;break;}
  const ga=0.12+0.06*Math.sin(t*0.005)+(near?0.1:0);
  const dg=g.createLinearGradient(0,CFG.dangerY-52,0,CFG.dangerY);
  dg.addColorStop(0,'rgba(226,87,76,0)');dg.addColorStop(1,'rgba(226,87,76,'+ga+')');
  g.fillStyle=dg;g.fillRect(0,CFG.dangerY-52,BW,52);
  // Saturn rings behind every planet, then all bodies
  for(const b of planetBodies)if(b.plugin.lvl===8){
    const age=t-b.plugin.spawn,vis=age<240?easeOutBack(clamp(age/240,0,1)):1;
    drawRings(g,b.position.x,b.position.y,Math.max(0.5,b.circleRadius*vis));
  }
  for(const b of planetBodies)drawBody(g,b,t);
  drawParticles(g);
  drawFloats(g);
  if((state==='ready'||state==='aiming')&&!eraseMode)drawGuide(g,t);
  drawDangerLine(g,t);
  // inner shadows
  const ts=g.createLinearGradient(0,WALL,0,WALL+30);
  ts.addColorStop(0,'rgba(120,70,25,.16)');ts.addColorStop(1,'rgba(120,70,25,0)');
  g.fillStyle=ts;g.fillRect(WALL,WALL,BW-WALL*2,30);
  const bs=g.createLinearGradient(0,BH-WALL-26,0,BH-WALL);
  bs.addColorStop(0,'rgba(120,70,25,0)');bs.addColorStop(1,'rgba(120,70,25,.14)');
  g.fillStyle=bs;g.fillRect(WALL,BH-WALL-26,BW-WALL*2,26);
  g.restore();
  // frame edges
  roundRectPath(g,WALL-1.5,WALL-1.5,BW-WALL*2+3,BH-WALL*2+3,15);
  g.strokeStyle='#8f4a2c';g.lineWidth=3;g.stroke();
  roundRectPath(g,2.5,2.5,BW-5,BH-5,20);
  g.strokeStyle='rgba(255,235,210,.28)';g.lineWidth=2;g.stroke();
  // current planet floats above the frame
  if((state==='ready'||state==='aiming')&&!eraseMode){
    const lvl=queue[0];
    if(lvl){
      const P=PLANETS[lvl-1],r=RADII[lvl-1];
      const x=clamp(dropX,WALL+r+2,BW-WALL-r-2),y=CFG.dropY-6+Math.sin(t*0.0035)*3;
      const vis=easeOutBack(clamp((t-readyAt)/240,0,1));
      drawPlanetAt(g,lvl,x,y,Math.max(0.5,r*vis),t*0.0005,t);
      g.strokeStyle='rgba(255,255,255,'+(0.55+0.25*Math.sin(t*0.006))+')';
      g.lineWidth=3;g.beginPath();g.arc(x,y,r+5+Math.sin(t*0.006)*2,0,TAU);g.stroke();
    }
  }
  if(flashA>0){g.globalAlpha=flashA;g.fillStyle='#fff6e4';g.fillRect(-24,-24,BW+48,BH+48);g.globalAlpha=1;}
}

/* ============================================================
   INPUT
============================================================ */
function toLogicXY(cx,cy){
  const rect=cvs.getBoundingClientRect();
  return{x:(cx-rect.left)*BW/rect.width,y:(cy-rect.top)*BH/rect.height};
}
function onDown(e){
  if(e.cancelable)e.preventDefault();
  SFX.ensure();
  if(state==='start'||state==='over')return;
  if(activePtr!==null)return;
  activePtr=e.pointerId!==undefined?('p'+e.pointerId):(e.type==='touchstart'?'t':'m');
  isDown=true;
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);
  const cx=e.clientX!==undefined?e.clientX:(t?t.clientX:0);
  const cy=e.clientY!==undefined?e.clientY:(t?t.clientY:0);
  const p=toLogicXY(cx,cy);
  if(eraseMode){const b=pickPlanet(p);if(b)doErase(b);activePtr=null;isDown=false;return;}
  targetX=p.x;
  if(state==='ready')state='aiming';
  if(e.pointerId!==undefined){try{cvs.setPointerCapture(e.pointerId);}catch(_){}}
  updateHUD();
}
function onMove(e){
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);
  const cx=e.clientX!==undefined?e.clientX:(t?t.clientX:0);
  const cy=e.clientY!==undefined?e.clientY:(t?t.clientY:0);
  const p=toLogicXY(cx,cy);
  if(eraseMode){hoverBody=pickPlanet(p);return;}
  targetX=p.x;
}
function onUp(e){
  if(activePtr===null)return;
  if(e.pointerId!==undefined&&activePtr!==('p'+e.pointerId))return;
  activePtr=null;
  if(isDown&&!eraseMode&&(state==='ready'||state==='aiming'))doDrop();
  isDown=false;updateHUD();
}
if(window.PointerEvent){
  cvs.addEventListener('pointerdown',onDown);
  cvs.addEventListener('pointermove',onMove);
  cvs.addEventListener('pointerup',onUp);
  cvs.addEventListener('pointercancel',onUp);
}else{
  cvs.addEventListener('touchstart',onDown,{passive:false});
  cvs.addEventListener('touchmove',function(e){if(e.cancelable)e.preventDefault();onMove(e);},{passive:false});
  cvs.addEventListener('touchend',onUp);
  cvs.addEventListener('touchcancel',onUp);
  cvs.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
}
cvs.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(state==='start'||state==='over')return;
  if(e.key==='ArrowLeft')targetX-=18;
  else if(e.key==='ArrowRight')targetX+=18;
  else if(e.key===' '||e.key==='ArrowDown'){
    e.preventDefault();
    if((state==='ready'||state==='aiming')&&!eraseMode)doDrop();
  }
});

  SFX.ensure();const m=SFX.toggle();refreshMute();
  if(!m)SFX.click();
});
document.addEventListener('pointerdown',()=>SFX.ensure(),{once:true});

/* ============================================================
   MAIN LOOP
============================================================ */
let last=now(),acc=0;const STEP=1000/60;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(50,t-last);last=t;
  if(state!=='start'){
    acc+=dt;let n=0;
    while(acc>=STEP&&n<3){Engine.update(engine,STEP);processMerges();acc-=STEP;n++;}
    if(acc>STEP*3)acc=0;
    if(state==='dropping'&&t>=dropReadyAt){state='ready';readyAt=t;updateHUD();}
    if(state==='ready'||state==='aiming'||state==='dropping'){
      dangerCheck(dt);
      if(++sweepTick%6===0)proximitySweep();
    }
    const lvl=queue[0];
    const tx=lvl?clamp(targetX,WALL+RADII[lvl-1]+2,BW-WALL-RADII[lvl-1]-2):BW/2;
    dropX+=(tx-dropX)*Math.min(1,dt*0.02);
  }
  updateFX(dt);
  drawBG(t);
  draw(t);
  qa.draw(t);
}

/* ============================================================
   INIT
============================================================ */
(function init(){
  buildChain($('chainWrap'),false);
  buildChain($('evoStrip'),true);
  initBG();buildPattern();layout();
  addEventListener('resize',()=>{initBG();layout();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  qa.reset([1,2,3]);
  playBtn.disabled=false;playBtn.textContent='PLAY';
  window.__pmBooted=true;
  requestAnimationFrame(loop);
})();
}

/* ============================================================
   BOOT LOADER — multiple CDNs, on-screen errors
============================================================ */
(function(){
  var msg=document.getElementById('bootMsg');
  var pb=document.getElementById('playBtn');
  var failed=false;
  function fatal(m){
    failed=true;
    msg.textContent=m;msg.style.display='block';
    pb.disabled=false;pb.textContent='RELOAD';
    pb.onclick=function(){location.reload();};
  }
  window.addEventListener('error',function(e){
    if(failed)return;
    var m=(e&&e.message)?e.message:'unknown error';
    if(!window.__pmBooted){fatal('Startup error: '+m);}
    else if(!window.__pmErrShown){window.__pmErrShown=true;
      msg.textContent='Runtime error: '+m;msg.style.display='block';}
  });
  var cdns=[
    'https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js',
    'https://unpkg.com/matter-js@0.19.0/build/matter.min.js'
  ];
  var i=0;
  function boot(){
    try{bootGame();}
    catch(err){fatal('Startup error: '+((err&&err.message)?err.message:err));}
  }
  function tryNext(){
    if(window.Matter){boot();return;}
    if(i>=cdns.length){
      fatal('Could not load the physics engine (Matter.js). Check your internet connection, then tap RELOAD.');
      return;
    }
    var s=document.createElement('script');
    s.src=cdns[i++];
    s.onload=function(){if(window.Matter)boot();else tryNext();};
    s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
