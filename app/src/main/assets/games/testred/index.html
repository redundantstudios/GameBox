<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Red Game</title>
    <style>
        body { background: red; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: white; font-size: 1.5rem; text-align: center; }
        #config { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <div>RED GAME</div>
    <div id="config">Reading config...</div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const config = {
            mode: params.get('mode'),
            skill: params.get('skill'),
            players: params.get('players')
        };
        document.getElementById('config').innerText = JSON.stringify(config, null, 2);
    </script>
</body>
</html>
