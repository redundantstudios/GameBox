<!-- STUDIO_GAME_MANIFEST: {"id":"testbridge", "title":"Bridge Test", "orientation":"any", "minPlayers":1, "maxPlayers":1, "aiSupport":"none", "online":false, "tileColor":"#FFFFFF", "version":"1.0.0"} -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bridge Test</title>
    <style>
        body { background: #F3F4F6; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #1C1E24; }
        .card { background: white; padding: 30px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; width: 80%; max-width: 400px; }
        h1 { font-size: 1.2rem; margin-bottom: 20px; }
        .btn { 
            background: #1C1E24; color: white; border: none; padding: 12px 24px; 
            border-radius: 999px; margin: 10px; font-weight: bold; cursor: pointer; 
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.93); }
        #output { margin-top: 20px; font-family: monospace; background: #eee; padding: 10px; border-radius: 8px; min-height: 40px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bridge Test</h1>
        <button class="btn" onclick="doSave()">SAVE</button>
        <button class="btn" onclick="doLoad()">LOAD</button>
        <button class="btn" onclick="doHaptic()">HAPTIC</button>
        <div id="output">Ready...</div>
    </div>
    <script>
        function doSave() {
            const data = JSON.stringify({"v": 1, "msg": "hello"});
            NativeBridge.save("test", data);
            document.getElementById('output').innerText = "Saved: " + data;
        }
        function doLoad() {
            const val = NativeBridge.load("test");
            document.getElementById('output').innerText = "Loaded: " + (val || "null");
        }
        function doHaptic() {
            NativeBridge.haptic(30);
            document.getElementById('output').innerText = "Haptic fired (30ms)";
        }
    </script>
</body>
</html>
