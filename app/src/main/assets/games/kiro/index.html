   preview lived in its own panel; now it would mean tearing down and rebuilding
   a canvas inside a card the player may be tapping. */
let prevCvEl=null,prevCtx=null;
function previewCanvas(){
  if(!prevCvEl){
    prevCvEl=document.createElement('canvas');
    prevCvEl.className='chShowCv';prevCvEl.width=360;prevCvEl.height=400;
    prevCtx=prevCvEl.getContext('2d');
  }
  return prevCvEl;
}
/* Builds the grid. The selected card spans two columns and two rows and holds
   the preview, the name, the rarity, the blurb and both actions - the old side
   panel is gone, so nothing is duplicated and nothing has to be clicked twice
   to reach the buttons. */
function renderShop(){
  cleanupExpiredTrials();
  if(!shopSel||!charById(shopSel))shopSel=curCh().id;
  $('shopBank').textContent=save.bank;
  const grid=$('charsGrid');grid.innerHTML='';
  for(const ch of CHARS){
    const owned=save.owned.includes(ch.id), trial=trialActive(ch.id), eq=save.equipped===ch.id;
    const rc=RAR[ch.rarity].col, sel=shopSel===ch.id;
    /* A div, not a <button>: the selected card now contains real buttons, and
       nested interactive elements are invalid and mis-handle taps. */
    const card=document.createElement('div');
    card.className='chcard'+(sel?' sel':'');
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    card.style.borderColor=sel?rc:hexA(rc,0.30);
    if(sel)card.style.boxShadow='0 0 16px '+hexA(rc,0.28);
    if(!sel)card.appendChild(charPortrait(ch));
    if(trial&&!sel){
      const tt=document.createElement('div');
      tt.className='chTrialTimer';
      tt.textContent=formatTrial(Number(save.trialUntil[ch.id])-Date.now());
      card.appendChild(tt);
    }
    const nm=document.createElement('div');nm.className='cn';
    nm.innerHTML='<span class="dot" style="background:'+rc+'"></span>'+ch.name;
    card.appendChild(nm);

    if(!sel){
      const pr=document.createElement('div');pr.className='cpr'+((owned||trial)?' own':'');
      pr.innerHTML=owned?(eq?'EQUIPPED':'OWNED'):(trial?'TRIAL':' '+coinIco+' '+ch.price);
      card.appendChild(pr);
      const pick=()=>{shopSel=ch.id;sClick();renderShop();};
      card.onclick=pick;
      card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};
      grid.appendChild(card);
      continue;
    }

    /* ---- the showcase card ---- */
    card.appendChild(previewCanvas());
    const rar=document.createElement('div');rar.className='chRar';
    rar.textContent=RAR[ch.rarity].label;rar.style.color=rc;
    card.appendChild(rar);
    const tag=document.createElement('div');tag.className='chTag';
    tag.textContent=ch.tag;
    card.appendChild(tag);
    const ti=document.createElement('div');ti.className='chTrialInfo';
    const btns=document.createElement('div');btns.className='chBtns';
    const b=document.createElement('button');
    b.className='btn';b.type='button';
    let offerTrial=false;
    if(eq&&owned){b.textContent='EQUIPPED';b.className='btn slate cant';}
    else if(owned||trial){
      b.textContent='EQUIP';b.className='btn teal';
      b.onclick=e=>{e.stopPropagation();save.equipped=ch.id;persist();sCp();renderShop();};
      ti.textContent=owned?'PERMANENT':'TRIAL · '+formatTrial(Number(save.trialUntil[ch.id])-Date.now());
      ti.className='chTrialInfo active';
    }else if(save.bank>=ch.price){
      b.innerHTML='BUY · '+ch.price+' '+coinIco;b.className='btn gold';
      b.onclick=e=>{e.stopPropagation();save.bank-=ch.price;save.owned.push(ch.id);delete save.trialUntil[ch.id];save.equipped=ch.id;persist();sBuy();banner(ch.name+' UNLOCKED!');renderShop();};
      offerTrial=true;
    }else{
      b.textContent='NEED '+(ch.price-save.bank)+' MORE';b.className='btn ghost cant';
      offerTrial=true;
    }
    btns.appendChild(b);
    /* A skin the player does not own always carries the 2-hour ad offer beside
       the coin price, so a locked skin can be tried without being bought.
       Buying with coins is what makes it permanent; the ad only lends it. */
    if(offerTrial){
      const t=document.createElement('button');
      t.type='button';t.className='btn violet';t.textContent='AD · 2H';
      t.onclick=e=>{e.stopPropagation();watchCharacterAd(ch.id);};
      btns.appendChild(t);}
    card.appendChild(ti);
    card.appendChild(btns);
    grid.appendChild(card);
  }
}
/* ---- rewarded: 2-hour skin trial ---- */
function watchCharacterAd(id){
  if(save.owned.includes(id))return;
  if(window.__kiroAdBusy)return;
  window.__kiroAdBusy=true;
  var released=function(){window.__kiroAdBusy=false;};
  /* Real rewarded ad through the shell bridge. The bridge only calls the
     reward callback when it reports "granted", so the trial can never be
     granted by a timer whether or not an ad actually served. */
  Studio.ads.rewarded('kiro.shop.skin_trial',
    function(){
      released();
      save.trialUntil[id]=Date.now()+2*60*60*1000;
      save.equipped=id;
      persist();sBuy();banner(charById(id).name+' · 2H TRIAL!');renderShop();},
    function(why){ released();banner(adMessage(why));}
  );
}
/* watchCharacterAd() is gone with the rest of the old ad set: the 2-hour
   character trial was not on the agreed list. Skins are bought with coins or
   already owned, and the two rewarded ads Kiro keeps are the 30-minute island
   rental and the single extra heart. */

function drawCharInto(g,ch,x,feetY,s,o){
  o=o||{};
  const t=o.t||0,face=o.face||1;
  const blink=o.blink?0.15:1;
  const walk=o.walk?Math.sin(o.phase||0):0;
  const ghost=ch.model==='ghost';
  const hover=ghost?Math.sin(t*2.8)*3.5*s:0;
  const A=o.alpha==null?1:o.alpha;
  if(ch.glow){
    g.save();g.globalCompositeOperation='lighter';
    const gr=g.createRadialGradient(x,feetY-26*s+hover,0,x,feetY-26*s+hover,46*s);
    gr.addColorStop(0,'rgba('+ch.glow+','+(0.20*A)+')');
    gr.addColorStop(1,'rgba('+ch.glow+',0)');
    g.fillStyle=gr;g.fillRect(x-46*s,feetY-72*s+hover,92*s,92*s);
    g.restore();}
  if(o.scarf){
    g.strokeStyle=ch.scarf;g.lineCap='round';g.globalAlpha=A;
    for(let i=0;i<o.scarf.length-1;i++){
      g.lineWidth=Math.max(1,(8-i*1.2)*s);
      g.beginPath();g.moveTo(o.scarf[i].x,o.scarf[i].y);
      g.lineTo(o.scarf[i+1].x,o.scarf[i+1].y);g.stroke();}
    g.globalAlpha=1;}
  g.save();
  g.translate(x,feetY+hover);
  if(o.lean)g.rotate(o.lean);
  if(o.squash)g.scale(o.squash[0],o.squash[1]);
  g.scale(s*face,s);
  g.globalAlpha=A*(ghost?0.88:1);
  if(ch.model==='royal'){
    const fl=Math.sin(t*6)*2;
    g.fillStyle='#7a4fd0';
    g.beginPath();g.moveTo(-6,-40);
    g.quadraticCurveTo(-20+fl*.4,-24,-16-fl,-4);
    g.lineTo(-2,-8);g.closePath();g.fill();}
  if(ghost){
    g.fillStyle=ch.body;
    g.beginPath();
    g.moveTo(-13,-8);
    g.quadraticCurveTo(-15,4,-9,2);
    g.quadraticCurveTo(-5,8,0,2);
    g.quadraticCurveTo(5,8,9,2);
    g.quadraticCurveTo(15,4,13,-8);
    g.closePath();g.fill();
  }else{
    const f1=walk*5,f2=-walk*5;
    const l1=o.walk?Math.max(0,-Math.sin(o.phase||0))*4:-3;
    const l2=o.walk?Math.max(0,Math.sin(o.phase||0))*4:-3;
    g.fillStyle=ch.feet;
    rr(g,-12+f1,-7-l1,11,7,3.5);g.fill();
    rr(g,1+f2,-7-l2,11,7,3.5);g.fill();}
  g.fillStyle=ch.body;rr(g,-13,-42,26,37,10);g.fill();
  g.fillStyle='rgba(0,0,0,.1)';rr(g,-13,-14,26,9,4.5);g.fill();
  g.fillStyle=ch.visor;rr(g,-10,-38,20,12,6);g.fill();
  g.fillStyle=ch.eye;
  if(o.dash){
    g.fillRect(-7,-33,5,2);g.fillRect(2,-33,5,2);
  }else if(ch.model==='gold'){
    g.fillStyle='#102844';rr(g,-11,-35.5,22,5.5,2.75);g.fill();
    g.fillStyle='rgba(255,255,255,.30)';g.fillRect(-9,-34.6,18,1.4);
  }else{
    const es=ch.model==='nova'?2.9:2.4;
    g.save();g.translate(-4.5,-32);g.scale(1,blink);
    g.beginPath();g.arc(0,0,es,0,TAU);g.fill();g.restore();
    g.save();g.translate(4.5,-32);g.scale(1,blink);
    g.beginPath();g.arc(0,0,es,0,TAU);g.fill();g.restore();}
  if(ch.model==='band'){
    g.strokeStyle=ch.visor;g.lineWidth=2;g.lineCap='round';
    g.beginPath();g.moveTo(-8,-40.5);g.lineTo(-2.5,-39);g.stroke();
    g.beginPath();g.moveTo(8,-40.5);g.lineTo(2.5,-39);g.stroke();}
  const bob=Math.sin(t*4)*1.6-(o.vx?clamp(o.vx*0.008,-3,3):0);
  switch(ch.model){
    case 'classic':
      g.strokeStyle='#d8cabb';g.lineWidth=2;g.lineCap='round';
      g.beginPath();g.moveTo(0,-42);g.quadraticCurveTo(bob*.5,-47,bob,-50);g.stroke();
      g.fillStyle=ch.tip;g.beginPath();g.arc(bob,-51,3.2,0,TAU);g.fill();
      break;
    case 'band':
      g.fillStyle=ch.scarf;
      rr(g,-11,-45,22,5,2.5);g.fill();
      g.beginPath();g.arc(11,-42.5,2.6,0,TAU);g.fill();
      g.beginPath();g.moveTo(11,-42.5);g.lineTo(17,-39);g.lineTo(14,-35);g.closePath();g.fill();
      break;
    case 'prop':
      g.fillStyle='#e8b84b';
      g.beginPath();g.arc(0,-42,9,Math.PI,0);g.closePath();g.fill();
      g.fillStyle='#8a5a2b';g.fillRect(-1.6,-53,3.2,4);
      g.save();g.translate(0,-54);g.rotate(t*16);
      g.fillStyle='#ffe9b8';
      g.beginPath();g.ellipse(9,0,9,2.4,0,0,TAU);g.fill();
      g.beginPath();g.ellipse(-9,0,9,2.4,0,0,TAU);g.fill();
      g.restore();
      break;
    case 'sprout':{
      const sw=Math.sin(t*3)*2;
      g.strokeStyle='#5da05f';g.lineWidth=2.4;g.lineCap='round';
      g.beginPath();g.moveTo(0,-42);g.quadraticCurveTo(sw*.5,-48,sw,-52);g.stroke();
      g.fillStyle='#7ec97e';
      g.beginPath();g.ellipse(sw-5,-54,6,3,-0.5,0,TAU);g.fill();
      g.beginPath();g.ellipse(sw+5,-54,6,3,0.5,0,TAU);g.fill();
      break;}
    case 'nova':{
      g.save();g.strokeStyle=ch.eye;g.lineWidth=1.6;g.globalAlpha=A*0.9;
      g.beginPath();g.ellipse(0,-49,11,3.6,Math.sin(t*1.5)*0.5,0,TAU);g.stroke();
      const oa=t*2.4;
      g.fillStyle=ch.eye;
      g.beginPath();g.arc(Math.cos(oa)*11,-49+Math.sin(oa)*3.6,1.8,0,TAU);g.fill();
      g.restore();
      break;}
    case 'gold':
      g.strokeStyle='#b8862f';g.lineWidth=2;g.lineCap='round';
      g.beginPath();g.moveTo(0,-42);g.lineTo(0,-49);g.stroke();
      g.fillStyle='#fff1c4';
      g.beginPath();
      g.moveTo(0,-56);g.lineTo(1.8,-50.5);g.lineTo(6,-50);g.lineTo(2.8,-46.8);
      g.lineTo(4,-42);g.lineTo(0,-44.6);g.lineTo(-4,-42);g.lineTo(-2.8,-46.8);
      g.lineTo(-6,-50);g.lineTo(-1.8,-50.5);
      g.closePath();g.fill();
      break;
    case 'ghost':
      g.fillStyle='rgba(238,244,255,.5)';
      g.beginPath();g.arc(-16+Math.sin(t*5)*2,-46,2.2,0,TAU);g.fill();
      g.beginPath();g.arc(16+Math.cos(t*4)*2,-44,1.8,0,TAU);g.fill();
      break;
    case 'royal':
      g.fillStyle='#ffd257';
      g.beginPath();
      g.moveTo(-9,-44);g.lineTo(-9,-52);g.lineTo(-4.5,-47);
      g.lineTo(0,-54);g.lineTo(4.5,-47);g.lineTo(9,-52);g.lineTo(9,-44);
      g.closePath();g.fill();
      g.fillStyle='#ff5f7a';g.beginPath();g.arc(0,-46,1.6,0,TAU);g.fill();
      break;
  }
  g.restore();
  g.globalAlpha=1;}
/* The preview canvas now lives inside the selected card (see previewCanvas()),
   so there is no fixed #prevCv element to look up any more - it draws only
   when a canvas has actually been built, and paints to whichever card is
   selected this frame. */
let pScarf=[];for(let i=0;i<6;i++)pScarf.push({x:0,y:0});
function drawPreview(){
  if(!prevCtx||!prevCvEl||!prevCvEl.isConnected)return;
  const g=prevCtx;
  g.setTransform(1,0,0,1,0,0);
  const w=prevCvEl.width,h=prevCvEl.height;
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#3a2a5e');gr.addColorStop(1,'#1a1230');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  const ch=charById(shopSel||save.equipped);
  const rc=RAR[ch.rarity].col;
  const rg=g.createRadialGradient(w/2,h*0.42,20,w/2,h*0.42,220);
  rg.addColorStop(0,hexA(rc,0.14));rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,w,h);
  for(let i=0;i<16;i++){
    const sx=(hash(i*3.3)*w+time*8*(0.4+hash(i)*0.5))%w;
    const sy=hash(i*7.7)*h*0.85+Math.sin(time+i)*7;
    g.fillStyle='rgba(255,244,226,'+(0.08+0.14*hash(i*1.9))+')';
    g.fillRect(w-sx,sy,1.8,1.8);}
  const px=w/2+Math.sin(time*1.4)*46;
  const face=Math.cos(time*1.4)>0?1:-1;
  const S=2.6,feet=h*0.795;
  const nx=px-face*11*S,ny=feet-32*S;
  pScarf[0].x=nx;pScarf[0].y=ny;
  for(let i=1;i<pScarf.length;i++){
    pScarf[i].x+=(pScarf[i-1].x-pScarf[i].x)*0.3-face*2;
    pScarf[i].y+=(pScarf[i-1].y-pScarf[i].y)*0.3+2.2+Math.sin(time*6+i);
    const dx=pScarf[i].x-pScarf[i-1].x,dy=pScarf[i].y-pScarf[i-1].y,d=Math.hypot(dx,dy)||1;
    if(d>7*S){pScarf[i].x=pScarf[i-1].x+dx/d*7*S;pScarf[i].y=pScarf[i-1].y+dy/d*7*S;}}
  g.fillStyle='rgba(0,0,0,.35)';
  g.beginPath();g.ellipse(px,feet+8,44,9,0,0,TAU);g.fill();
  drawCharInto(g,ch,px,feet,S,{t:time,face,phase:time*9,walk:true,
    blink:(time%3.4)<0.12,scarf:pScarf});
  g.fillStyle='rgba(255,244,226,.85)';
  g.font='700 11px Outfit';g.textAlign='center';
  g.fillText('— LIVE PREVIEW —',w/2,h-28);
  g.textAlign='left';}

/* ================= gameplay ================= */
function tryDash(){
  if(state!=='play'||p.dead||p.dashCd>0)return;
  const dir=((keys.ArrowRight||keys.KeyD||touch.R)?1:0)-((keys.ArrowLeft||keys.KeyA||touch.L)?1:0);
  if(dir)p.face=dir;
  p.dashT=0.16;p.dashCd=0.55;p.vy=Math.min(p.vy,0);
  sDash();burst(p.x+15,p.y+22,6,['255,190,120','255,107,87'],150);}
function die(){
  if(p.dead||p.inv>0)return;
  p.dead=true;p.deadT=0;p.vx=0;p.vy=0;deaths++;
  lives--;updLives();
  shake=9;sDie();burst(p.x+15,p.y+22,22,['246,234,214','255,107,87','255,200,87'],260);}
function respawn(){
  if(lives<=0){showFail();return;}
  p.x=resp.x;p.y=resp.y;p.vx=0;p.vy=0;p.dead=false;p.inv=1.2;
  p.dashT=0;p.dashCd=0;p.canDJ=true;p.carrier=null;fadeT=.7;
  if(boss&&!boss.dead)resetBoss();
  camX=clamp(p.x-VW/2,0,Math.max(0,lvlW*T-VW));camY=clamp(p.y-VH*.55,0,Math.max(0,lvlH*T-VH));}
function tile(r,c){return(r<0||r>=lvlH||c<0||c>=lvlW)?' ':map[r][c];}
function solid(r,c){
  const t=tile(r,c);
  if(t==='#')return true;
  if(t==='!'){const cr=crumbles[r*lvlW+c];return cr&&cr.st<2;}
  return false;}
function crumbTrigger(r,c){const cr=crumbles[r*lvlW+c];if(cr&&cr.st===0){cr.st=1;cr.t=0.42;}}
function updCrumbles(dt){
  for(const k in crumbles){const cr=crumbles[k];
    if(cr.st===1){cr.t-=dt;
      if(cr.t<=0){cr.st=2;cr.t=2.8;
        const r=(k/lvlW)|0,c=k%lvlW;
        for(let i=0;i<5;i++)addP(c*T+rnd(6,42),r*T+rnd(6,42),rnd(-30,30),rnd(20,120),rnd(.4,.8),rnd(2,4),'152,147,143',false,500,0);}}
    else if(cr.st===2){cr.t-=dt;if(cr.t<=0)cr.st=0;}}}
function updMovers(dt){
  for(const m of movers){
    const px=m.x,py=m.y,o=Math.sin(time*m.spd+m.ph)*m.rg;
    if(m.ax==='h')m.x=m.bx+o;else m.y=m.by+o;
    m.dx=m.x-px;m.dy=m.y-py;}}
function applyCarrier(){
  const m=p.carrier;if(!m)return;
  if(Math.abs(p.y+p.h-m.y)<12&&p.x+p.w>m.x&&p.x<m.x+m.w){p.x+=m.dx;p.y=m.y-p.h;}
  else p.carrier=null;}
function updWalkers(dt){
  for(const w of walkers){
    if(w.dead){w.dead+=dt;continue;}
    w.ph+=dt*10;w.x+=w.dir*(w.spd||48)*dt;
    if(w.x<w.x0){w.x=w.x0;w.dir=1;}if(w.x+w.w>w.x1+T){w.x=w.x1+T-w.w;w.dir=-1;}
    if(state!=='play'||p.dead||p.inv>0)continue;
    if(p.x<w.x+w.w-4&&p.x+p.w>w.x+4&&p.y<w.y+w.h&&p.y+p.h>w.y){
      if(p.vy>0&&p.y+p.h-w.y<22){
        w.dead=0.001;p.vy=-560;p.canDJ=true;p.sy=1.25;p.sx=.8;
        sStomp();burst(w.x+w.w/2,w.y+w.h/2,10,['157,122,197','246,234,214'],160);}
      else die();}}}
function physStep(dt){
  if(p.dead){p.deadT+=dt;if(p.deadT>0.55)respawn();return;}
  const L=keys.ArrowLeft||keys.KeyA||touch.L,R=keys.ArrowRight||keys.KeyD||touch.R;
  const dir=(R?1:0)-(L?1:0);
  const moveSensitivity=1;
  if(p.dashT>0){
    p.dashT-=dt;p.vx=p.face*DASH_V;p.vy=0;
    const last=p.trail[p.trail.length-1];
    if(!last||Math.hypot(p.x-last.x,p.y-last.y)>6)p.trail.push({x:p.x,y:p.y,f:p.face,t:.25});
    if(p.dashT<=0)p.vx=p.face*240;
  }else{
    const acc=(p.onG?2200:1500)*moveSensitivity;
    if(dir!==0){p.vx+=dir*acc*dt;p.face=dir;}
    else{const fr=(p.onG?2300:800)*dt;
      if(Math.abs(p.vx)<=fr)p.vx=0;else p.vx-=Math.sign(p.vx)*fr;}
    p.vx=clamp(p.vx,-MAXV*moveSensitivity,MAXV*moveSensitivity);
    p.vy=Math.min(p.vy+GRAV*dt,1150);}
  p.coyote-=dt;p.dashCd-=dt;p.inv-=dt;jumpBuf-=dt;
  jHeld=keys.Space||keys.ArrowUp||keys.KeyW||touch.J;
  if(jumpBuf>0&&p.dashT<=0){
    if(p.onG||p.coyote>0){jumpBuf=0;p.coyote=0;p.vy=JUMP;p.onG=false;p.canDJ=true;
      p.sy=1.28;p.sx=.78;dust(p.x+15,p.y+p.h,5);sJump();}
    else if(p.canDJ){jumpBuf=0;p.canDJ=false;p.vy=DJUMP;p.sy=1.25;p.sx=.8;
      sDJ();burst(p.x+15,p.y+p.h,8,['246,234,214'],90);}}
  if(!jHeld&&p.vy<-320&&p.dashT<=0)p.vy=-320;
  p.x+=p.vx*dt;
  {const r0=(p.y/T)|0,r1=((p.y+p.h-0.01)/T)|0;
   for(let r=r0;r<=r1;r++){
    if(p.vx>0){
      const c=((p.x+p.w)/T)|0;
      if(solid(r,c)){p.x=c*T-p.w;p.vx=0;p.dashT=0;}
    }else if(p.vx<0){
      const c=(p.x/T)|0;
      if(solid(r,c)){p.x=(c+1)*T;p.vx=0;p.dashT=0;}}}}
  p.x=clamp(p.x,0,lvlW*T-p.w);
  const prevB=p.y+p.h;
  p.y+=p.vy*dt;p.onG=false;
  {const c0=(p.x/T)|0,c1=((p.x+p.w-0.01)/T)|0;
   for(let c=c0;c<=c1;c++){
    if(p.vy>=0){
      const rf=((p.y+p.h)/T)|0,t=tile(rf,c);
      const one=(t==='='&&prevB<=rf*T+6);

function updCam(dt){

function updScarf(dt){

  const s=p.scarf;s[0].x=ax;s[0].y=ay;

    s[i].x+=(s[i-1].x-s[i].x)*Math.min(1,dt*16);
    s[i].y+=(s[i-1].y-s[i].y)*Math.min(1,dt*16)+22*dt;
    const dx=s[i].x-s[i-1].x,dy=s[i].y-s[i-1].y,d=Math.hypot(dx,dy)||1;

function updParts(dt){

    q.l-=dt;if(q.l<=0){parts.splice(i,1);continue;}
    q.vy+=q.gr*dt;q.vx-=q.vx*q.dr*dt;q.vy-=q.vy*q.dr*dt;

function completeLevel(){
  const prev=save.lv[cur]||{};
  const stars=Math.max(1,lives);
  newBest=!!prev.time&&timer<prev.time;
  save.lv[cur]={stars:Math.max(stars,prev.stars||0),time:Math.min(timer,prev.time||1e9)};
  /* Clearing an island normally unlocks the next one for good. An island the
     player BORROWED for 30 minutes must not hand out permanent progression -
     that is the whole difference between earning a level and renting it. The
     permanent win condition is 3 stars, which levelUnlocked() reads straight
     off save.lv. */
  if(cur<save.unlocked)save.unlocked=Math.max(save.unlocked,cur+2);
  persist();
  refreshMenu();
  return stars;}

function update(dt){
  if(state==='layoutEdit'){updScarf(dt);updCam(dt);return;}
  time+=dt;updMel(dt);spawnFx(dt);
  for(const c of clouds)c.x-=c.v*dt;
  birdT-=dt;
  if(birdT<=0){birdT=rnd(6,13);const dir=Math.random()<.5?1:-1,by=rnd(90,280);
    for(let i=0;i<4;i++)birds.push({x:dir>0?-40-i*26:VW+40+i*26,y:by+rnd(-14,14),d:dir,v:rnd(55,75),t:rnd(0,6)});}
  for(let i=birds.length-1;i>=0;i--){const b=birds[i];
    b.x+=b.d*b.v*dt;b.t+=dt;
    if(b.x<-80||b.x>VW+80)birds.splice(i,1);}
  for(const s of streaks){s.x-=s.v*dt;if(s.x<-s.l){s.x=VW+rnd(0,200);s.y=rnd(40,650);}}
  if(comboT>0){comboT-=dt;if(comboT<=0)fuelCombo=0;}
  updMovers(dt);updCrumbles(dt);updWalkers(dt);updParts(dt);updCoinDrops(dt);
  if(boss)bossUpdate(dt);
  updShocks(dt);
  for(const c of cps)c.pop=Math.max(0,c.pop-dt*3);
  for(let i=p.trail.length-1;i>=0;i--){p.trail[i].t-=dt;if(p.trail[i].t<=0)p.trail.splice(i,1);}
  p.sx+=(1-p.sx)*Math.min(1,dt*9);p.sy+=(1-p.sy)*Math.min(1,dt*9);
  p.blink-=dt;if(p.blink<-3.4)p.blink=0.12;
  if(state==='menu'||state==='select'){
    camX=clamp(spawnP.x+15-VW/2+Math.sin(time*.22)*46,0,Math.max(0,lvlW*T-VW));
    camY=clamp(spawnP.y-VH*.55,0,Math.max(0,lvlH*T-VH));
    updScarf(dt);
    if(Math.random()<dt*2)addP(p.x+15+rnd(-50,50),p.y+rnd(-10,40),rnd(-10,10),rnd(-8,-2),rnd(1,1.8),1.4,'255,220,180',true,0,0);
    return;}
  if(state==='play'){
    timer+=dt;
    applyCarrier();
    let rem=dt;const STEP=1/120;let guard=0;
    while(rem>0&&state==='play'&&guard++<40){
      const s=Math.min(rem,STEP);
      physStep(s);rem-=s;}
    bossCollide();
    updScarf(dt);updCam(dt);
    if((timer|0)!==((timer-dt)|0))updHUD();
    if(Math.random()<dt*1.2)addP(p.x+15+rnd(-60,60),p.y+rnd(-20,40),rnd(-15,-5),rnd(-6,6),rnd(.8,1.6),rnd(1,2),'255,220,180',true,0,0);
  }else if(state==='complete'){
    compT+=dt;
    if(exitP){p.x+=((exitP.x-15)-p.x)*Math.min(1,dt*6);
      p.y+=((exitP.y-22)-p.y)*Math.min(1,dt*6);}
    updScarf(dt);updCam(dt);
    if(!panelShown&&compT>1.05)tryShowDone();
    if(!panelShown&&compT>3){panelShown=true;try{show(doneEl,true);}catch(e){}}
    if(Math.random()<dt*16&&exitP)burst(exitP.x+rnd(-16,16),exitP.y+rnd(-20,20),1,['255,200,120'],60);
  }else if(state==='gameover'){
    goT+=dt;
  }
  if(fadeT>0)fadeT=Math.max(0,fadeT-dt*1.8);
}

    ctx.fillStyle='rgba(157,122,197,'+(0.7*a)+')';
    for(let i=0;i<3;i++){
      const ox=s.x-s.dir*i*14,oy=s.y-6-i*7;
      ctx.beginPath();ctx.arc(ox,oy,8-i*1.6,Math.PI,0,false);ctx.fill();}}}
function drawEntities(){
  for(const m of movers){if(!vis(m.x,m.y,96,14))continue;
    ctx.fillStyle='#65859b';rr(ctx,m.x,m.y,96,14,6);ctx.fill();
    ctx.fillStyle='#9ac7d7';ctx.fillRect(m.x+6,m.y+2,84,3);
    ctx.fillStyle='#ff5f7a';
    ctx.beginPath();ctx.arc(m.x+14,m.y+7,3,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(m.x+82,m.y+7,3,0,TAU);ctx.fill();}
  for(const c of cps){if(!vis(c.x-30,c.gy-90,60,90))continue;
    ctx.fillStyle='#163452';ctx.fillRect(c.x-8,c.gy-4,16,4);
    ctx.fillStyle='#d8cfc4';ctx.fillRect(c.x-2,c.gy-66,4,64);
    const sc=1+c.pop*.8;
    ctx.save();ctx.translate(c.x+2,c.gy-64);ctx.scale(sc,sc);
    ctx.fillStyle=c.lit?'#2ed6bd':'#7087a2';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(26,8);ctx.lineTo(0,16);ctx.closePath();ctx.fill();
    ctx.restore();
    if(c.lit){ctx.fillStyle='rgba(46,214,189,.9)';
      ctx.beginPath();ctx.arc(c.x,c.gy-70,2.5+Math.sin(time*5)*1,0,TAU);ctx.fill();}}
  if(exitP&&vis(exitP.x-60,exitP.y-90,120,140)){
    const e=exitP,fl=Math.sin(time*2)*4;
    ctx.fillStyle='rgba(255,220,160,.08)';
    ctx.fillRect(e.x-20,e.y-320,40,270);
    ctx.fillStyle='#244e6c';
    ctx.fillRect(e.x-26,e.y+44,52,10);ctx.fillRect(e.x-16,e.y+30,32,16);
    ctx.save();ctx.translate(e.x,e.y+fl);
    ctx.strokeStyle='#fff3e0';ctx.lineWidth=5;
    ctx.beginPath();ctx.ellipse(0,0,26,34,0,0,TAU);ctx.stroke();
    ctx.strokeStyle='rgba(255,107,87,.85)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(0,0,19,27,0,time*1.4,time*1.4+4.6);ctx.stroke();
    for(let i=0;i<6;i++){const a=time*2+i*TAU/6;
      ctx.fillStyle=i%2?'rgba(255,200,120,.9)':'rgba(255,138,110,.9)';
      ctx.beginPath();ctx.arc(Math.cos(a)*30,Math.sin(a)*40,2.4,0,TAU);ctx.fill();}
    ctx.restore();}
  for(const c of coins){
    if(c.got||c.x<camX-60||c.x>camX+VW+60)continue;
    const y=c.y+Math.sin(time*2+c.ph)*5,wob=Math.cos(time*3.4+c.ph);
    ctx.save();ctx.translate(c.x,y);ctx.scale(Math.max(.25,Math.abs(wob)),1);
    ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(0,0,9,0,TAU);ctx.fill();
    ctx.strokeStyle='#b8862f';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#fff1c4';ctx.beginPath();ctx.arc(-1.5,-1.5,3.6,0,TAU);ctx.fill();
    ctx.restore();}
  for(const w of walkers){
    if(w.x+w.w<camX-40||w.x>camX+VW+40)continue;
    const sq=w.dead?Math.max(.15,1-w.dead*3):1+Math.sin(w.ph)*.06;
    const a=w.dead?Math.max(0,1-w.dead*2.2):1;
    ctx.save();ctx.globalAlpha=a;ctx.translate(w.x+w.w/2,w.y+w.h);
    ctx.scale(1+(1-sq)*.5,sq);
    ctx.fillStyle='#2c6f89';
    ctx.beginPath();ctx.ellipse(0,-12,17,12,0,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.15)';
    ctx.beginPath();ctx.ellipse(0,-6,15,6,0,0,TAU);ctx.fill();
    const st=Math.sin(w.ph)*3;
    ctx.fillStyle='#295b80';
    rr(ctx,-12+st,-4,9,5,2.5);ctx.fill();rr(ctx,3-st,-4,9,5,2.5);ctx.fill();
    ctx.fillStyle='#ffe9d0';
    ctx.beginPath();ctx.arc(-5+w.dir*2,-15,2.2,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(5+w.dir*2,-15,2.2,0,TAU);ctx.fill();
    ctx.restore();ctx.globalAlpha=1;}}
function drawKiro(){
  if(p.dead)return;
  const CH=curCh();
  let a=1;if(p.inv>0)a=.4+.6*Math.abs(Math.sin(time*22));
  let sc=1;
  if(state==='complete')sc=Math.max(0,1-compT/0.85);
  if(sc<=0)return;
  for(const t of p.trail){
    ctx.globalAlpha=t.t*1.4;ctx.fillStyle=CH.body;
    rr(ctx,t.x+2,t.y+4,26,36,9);ctx.fill();}
  ctx.globalAlpha=1;
  const running=p.onG&&Math.abs(p.vx)>30;
  p.run+=Math.abs(p.vx)*0.045;
  drawCharInto(ctx,CH,p.x+15,p.y+p.h,1,{
    t:time,face:p.face,phase:p.run,walk:running,
    blink:p.blink>0,dash:p.dashT>0,scarf:p.scarf,
    alpha:a,squash:[p.sx*sc,p.sy*sc],
    lean:p.face*clamp(Math.abs(p.vx)/MAXV,0,1)*(p.onG?0.03:0.1),
    vx:p.vx});}
function drawParts(glow){
  for(const q of parts){if(q.glow!==glow)continue;
    const a=q.l/q.ml;
    ctx.fillStyle='rgba('+q.c+','+(a*.9)+')';
    ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.4,q.s*a),0,TAU);ctx.fill();}}
let vig=null,vigW=0;
function render(){
  ctx.setTransform(Z,0,0,Z,0,0);
  drawBG();
  ctx.save();ctx.translate(-camX+(Math.random()*2-1)*shake,-camY+(Math.random()*2-1)*shake*.7);
  drawTiles();drawBoss();drawEntities();drawShocks();drawParts(false);
  drawKiro();drawParts(true);
  ctx.restore();
  if(vigW!==VW){vigW=VW;
    vig=ctx.createRadialGradient(VW/2,VH/2,VH*.44,VW/2,VH/2,Math.max(VW,VH)*.72);
    vig.addColorStop(0,'rgba(20,10,26,0)');vig.addColorStop(1,'rgba(20,10,26,.34)');}
  ctx.fillStyle=vig;ctx.fillRect(0,0,VW,VH);
  if(state==='complete'){
    let a;
    if(compT<0.9)a=clamp(compT/0.5,0,1);
    else a=clamp(1-(compT-0.9)/0.9,0,1);
    a*=0.75;
    if(a>0.004&&isFinite(a)){
      ctx.fillStyle='rgba(255,240,220,'+a+')';
      ctx.fillRect(0,0,VW,VH);}}
  drawBossHP();
  if(fadeT>0){ctx.fillStyle='rgba(15,8,22,'+fadeT+')';ctx.fillRect(0,0,VW,VH);}}

/* ================= main loop ================= */
window.addEventListener('error',function(ev){
 try{console.error('[KIRO] uncaught',ev.message);}catch(e){}
 try{if(typeof menuEl!=='undefined'&&menuEl){show(menuEl,true);}}catch(e){}
});

/* BOOT.
   The start page used to sit on an empty sky: no level was ever loaded until
   the player pressed START, so the canvas behind the buttons had nothing in it
   and read as a black background. The world is now loaded quietly at boot and
   the HUD chips go up with it, so the first thing a player sees is the game
   itself - level, character, controls and all - with the menu laid over it. */
(function boot(){
  try{
   cleanupLevelTrials();
   ensureMenuWorld();
   show(menuEl,true);
   refreshMenu();
   /* Apply the saved (or default) control geometry at boot, so the on-screen
      buttons are laid out by the same numbers the editor shows instead of
      falling back to the stylesheet until the editor is opened once. */
   applyControlLayout();
  }catch(e){try{console.error('[KIRO] boot failed',e);}catch(_){}}
})();

/* Boot watchdog: if the boot chain left every overlay hidden, force the
   main menu up so the player is never stranded on a dead screen. */
setTimeout(function(){
 try{
  var anyUp=false;
  ['menuEl','selEl','shopEl','howEl','pauseEl','doneEl','overEl'].forEach(function(k){
   var el=eval(k);
   if(el&&el.classList&&!el.classList.contains('hidden'))anyUp=true;
  });
  if(!anyUp){
   console.warn('[KIRO] no overlay after boot, forcing menu');
   showMenu();
  }
 }catch(e){}
},3500);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(isPortrait)return;
  let dt=(now-last)/1000;last=now;
  if(!isFinite(dt)||dt<0)dt=0;
  if(dt>1/20)dt=1/20;
  if(state==='pause')return;
  try{update(dt);render();}
  catch(err){console.error('frame error:',err);}
  try{
    if(!$('select').classList.contains('hidden'))drawMap();
    if(shopOpen())drawPreview();
    if(howOpen())drawHowIll();
  }catch(err){console.error('ui draw error:',err);}
}
requestAnimationFrame(frame);
</script>
<script>
(function(){
  var prev=window.Game||{};
  function applySettings(s){
    if(!s) return;
    try{
      if(typeof s.sound==='boolean'){
        /* Kiro's audio was reworked: `musicOn` gates music, `muted` gates
           everything else, and applyAudioVolumes() fans both out to the gain
           nodes. The old wiring poked master.gain directly and referred to a
           `muted`-only model that no longer matches the source. Driving the
           game's own helpers keeps its on-screen mute icon honest and means
           we never fight applyAudioVolumes with a half-applied state. */
        muted=!s.sound;
        musicOn=!!s.sound;
        applyAudioVolumes();
        try{updateAudioUI();}catch(e){}
      }
    }catch(e){}
  }
  applySettings(Studio.settings);
  /* Banner polling is BACK. It was removed when banners were disabled app-wide
     and the shim's banner() was a no-op, so the loop only cost a timer. The
     shell forwards it now and this game's manifest opts in (banner: bottom), so
     the strip rides under the island while a run is being played and is gone
     for the menus, the pause screen and the results. */
  var bannerOn=false;
  setInterval(function(){
    var want=(state==='play');
    if(want!==bannerOn){ bannerOn=want; try{ Studio.ads.banner(want); }catch(e){} }
  },400);
  /* Kiro's other ads: two rewarded (30-minute island rental, one extra heart)
     and three interstitials (game-over RETRY, game-over BACK TO MAP, pause
     RESTART / pause MENU). */
  window.Game={
    pause:function(){ try{ if(state==='play') togglePause(); }catch(e){} if(prev.pause) try{ prev.pause(); }catch(e){} },
    resume:function(){ try{ if(state==='pause') togglePause(); }catch(e){} if(prev.resume) try{ prev.resume(); }catch(e){} applySettings(Studio.settings); },
    setMuted:function(m){ try{ muted=!!m; musicOn=!m; applyAudioVolumes(); try{updateAudioUI();}catch(e){} }catch(e){} },
    setSettings:function(s){ applySettings(s); if(s) Studio.pushSettings({sound:s.sound,haptics:s.haptics}); },
    destroy:function(){ if(prev.destroy) try{ prev.destroy(); }catch(e){} }
  };
})();
</script>
