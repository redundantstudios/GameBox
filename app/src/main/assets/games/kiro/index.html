<script>
/* ============================================================
   STUDIO SDK - shell bridge only. Every entry point degrades to
   a no-op in a plain browser tab, so the game still runs from
   file:// on its own.
   ============================================================ */
var __studioAdSeq=0;
var Studio=(function(){
  var bridge=function(){ return window.NativeBridge||null; };
  var ls={get k(){ try{return window.localStorage;}catch(_){return null;} }};
  var settings={sound:true,music:true,haptics:true};
  try{ var raw=bridge()?bridge().load('shell:settings'):(ls.k?ls.k.getItem('shell:settings'):null);
       if(raw) settings=Object.assign(settings,JSON.parse(raw)); }catch(_){}
  /* the shell puts the same values in the launch query string */
  try{ var q=new URLSearchParams(location.search);
       if(q.has('sound')) settings.sound=q.get('sound')!=='0';
       if(q.has('vibe')) settings.haptics=q.get('vibe')!=='0';
  }catch(_){}
  return {
    settings:settings,
    save:function(k,v){ var b=bridge(); if(b){ try{b.save(k,v); return;}catch(_){} }
            try{ if(ls.k) ls.k.setItem(k,v); }catch(_){} },
    load:function(k){ var b=bridge(); if(b) return b.load(k);
            try{ return ls.k?ls.k.getItem(k):null; }catch(_){ return null; } },
    haptic:function(kind){ if(settings.haptics===false) return; var b=bridge(); if(!b) return;
      var map={light:15,medium:30,heavy:60,success:45};
      try{ b.haptic(typeof map[kind]==='number'?map[kind]:0); }catch(_){} },
    exitGame:function(){ var b=bridge(); if(b&&b.exitGame){ try{ b.exitGame(); }catch(_){} } },
    /* the game flipped a switch the shell also owns - keep them in step */
    pushSettings:function(patch){ Object.assign(settings,patch||{});
      this.save('shell:settings',JSON.stringify({sound:!!settings.sound,music:!!settings.music,haptics:!!settings.haptics})); },
    ads:{
      /* Rewarded. ALLOW-LIST, not deny-list.
         The bridge answers with exactly one of:
           "granted"      - reward earned
           "closed"       - the player backed out
           "unavailable"  - no ad / offline
           "limit_reached", "cooldown"  - refused by the ad governor
         Only "granted" may pay out. This used to be `if(result!=='closed'
         &&result!=='unavailable')`, which counted "limit_reached" and
         "cooldown" as SUCCESS - so hitting the cap handed out the reward
         anyway and the cap did nothing. Ten games share this shim, so the
         bug was app-wide. Never grow this back into a deny-list: a new
         refusal token would silently become a reward. */
      rewarded:function(placement,onReward,onFail){
        var b=bridge();
        if(!b||!b.showRewardedAd){ if(onFail) onFail('unavailable'); return; }
        var cb='__studioAdCb'+(++__studioAdSeq);
        window[cb]=function(result){
          try{ delete window[cb]; }catch(_){}
          if(result==='granted'){ if(onReward) onReward(); }
          else if(onFail) onFail(result||'closed');
        };
        /* THREE arguments, always.
           NativeBridge.showRewardedAd(callback, placement, kind) takes three
           parameters, and addJavascriptInterface matches by EXACT arity - a
           one-argument call THROWS instead of defaulting the remaining ones.
           That throw used to be swallowed by the catch below and reported as a
           generic "no ad available", so eighteen of twenty games had a
           rewarded ad that could never run and no way to tell why. Passing
           kind=null lets the bridge infer revive-vs-normal from the placement
           tag, so the once-per-game revive cap still applies. */
        try{ b.showRewardedAd(cb, placement||'', null); }
        catch(err){
          /* Deliberately NOT reported as "unavailable". That token means "no ad
             served", which sends the player off to check their internet
             connection. This is the app failing to make the call at all, and the
             two must stay distinguishable. */
          try{ console.error('[Studio] rewarded bridge call failed: '+((err&&err.message)||err)); }catch(_){}
          try{ delete window[cb]; }catch(_){}
          if(onFail) onFail('bridge_error');
        }
      },
      /* Interstitial break. The shell always answers, so nothing can hang.
         TWO arguments: showInterstitial(callback, placement) takes two
         parameters and addJavascriptInterface matches by EXACT arity, so a
         one-argument call throws - and the catch below used to swallow that,
         leaving every game with an interstitial that silently never appeared.
         The placement is '' rather than 'exit' on purpose: AdPolicy refuses the
         "exit" tag, because AdMob disallows an interstitial on app exit. */
      interstitial:function(onDone,placement){
        var b=bridge();
        if(b&&b.showInterstitial){
          window.__studioInterCb=function(){ if(onDone) onDone(); };
          try{ b.showInterstitial('__studioInterCb', placement||''); return; }
          catch(err){
            try{ console.error('[Studio] interstitial bridge call failed: '+((err&&err.message)||err)); }catch(_){}
          }
        }
        if(onDone) onDone();
      },
      /* BANNERS ARE OFF.
         Banners are disabled app-wide for now. The call is kept so the games that
         still poll for it keep working - it just does nothing, and no banner
         request ever reaches the SDK. Re-enabling banners means restoring the
         bridge handler in GameActivity and the unit in AdMobManager. */
      banner:function(show){
        var b=bridge();
        if(!b)return;
        try{
          if(show){ if(b.showBanner)b.showBanner(); }
          else{ if(b.hideBanner)b.hideBanner(); }
        }catch(_){}
      }
    }
  };
})();
window.Studio=Studio;

/* ============================================================
   CRAZYGAMES SDK SHIM
   The source games were published on CrazyGames and drive their ads
   through `window.CrazyGames.SDK`. The shell is offline and has its own
   ad plumbing, so the external SDK <script> is stripped at integration
   time and this shim stands in for it. Every method the games call keeps
   its original name and callback shape, so none of the game's ad logic
   had to be rewritten - it just talks to the shell now.
   ============================================================ */
window.CrazyGames=window.CrazyGames||{SDK:{}};
(function(){
  var S=window.CrazyGames.SDK;
  var settingsListeners=[];
  S.game=S.game||{};
  S.game.settings={muteAudio:!Studio.settings.sound};
  S.game.gameplayStart=function(){};
  S.game.gameplayStop=function(){};
  S.game.addSettingsChangeListener=function(fn){
    if(typeof fn==='function')settingsListeners.push(fn);
  };
  S.init=function(){
    return Promise.resolve(true);
  };
  /* The portal reported 'local' outside the portal; the shell is the same
     situation, and the games only use this to decide whether ads work. */
  S.environment='shell';
  S.ad=S.ad||{};
  /* requestAd(type, handlers) - the only two types the games use. */
  S.ad.requestAd=function(type,h){
    h=h||{};
    function started(){try{if(h.adStarted)h.adStarted();}catch(_){}}
    function finished(){try{if(h.adFinished)h.adFinished();}catch(_){}}
    function failed(msg){
      try{ if(h.adError) h.adError('error',{reason:msg}); }catch(_){}
    }
    if(type==='rewarded'){
      Studio.ads.rewarded('continue',
        function(){started();finished();},
        function(){started();failed('closed');}
      );
    }else{
      /* Midgame/interstitial: the shell always answers, so the player is
         never left sitting on a result screen. */
      Studio.ads.interstitial(function(){started();finished();});
    }
  };
  /* Remove the startup interstitial as it's not in the requested list.
     The list was: Retry, Map, Menu, and Restart. */
  window.__studioPushAudio=function(on){
    var v=!Studio.settings.sound;
    S.game.settings.muteAudio=v;
    for(var i=0;i<settingsListeners.length;i++){
      try{settingsListeners[i]({muteAudio:v});}catch(_){}
    }
    if(typeof on==='function')try{on();}catch(_){}
  };
})();
</script>

<style id="studioBackTheme">:root{--sb-bg:rgba(23,17,38,.9);--sb-fg:#f6ead6;--sb-bd:rgba(255,107,87,.5);--sb-r:999px;--sb-sh:rgba(0,0,0,.35)}</style>
<script>
/* Shell BACK button. Shown only while the game is on its own front page, so
   it can never sit on top of the board in the middle of play. */
(function(){
  var el=null, on=false;
  function get(){ if(!el) el=document.getElementById('studioBack'); return el; }
  function front(){ try{ var m=document.getElementById('menu'); return !!(m&&!m.classList.contains('hidden')); }catch(_){ return false; } }
  function mount(){
    if(get()) return;
    var d=document.createElement('div'); d.id='studioBack';
    d.textContent='BACK';
    d.setAttribute('role','button'); d.setAttribute('aria-label','Back to the arcade');
    (document.body||document.documentElement).appendChild(d);
    /* touchend, not click: every one of these games sets touch-action:none on
       <body>, which suppresses the synthesised click on a plain <div>. That is
       why the BACK button looked live and did nothing. touchend fires for every
       real tap; the click listener stays as the desktop / AT fallback. */
    function go(e){ e.preventDefault(); e.stopPropagation(); Studio.exitGame(); }
    d.addEventListener('touchend',go,{passive:false});
    d.addEventListener('click',go,true);
  }
  function tick(){
    var b=get();
    if(!b){ setTimeout(tick,250); return; }
    var want=front();
    if(want!==on){ on=want; b.classList.toggle('show',on); }
    setTimeout(tick,250);
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){ mount(); tick(); });
  }else{ mount(); tick(); }
})();
</script>

<style id="mobile-pc-visual-fit">

/* ============ KIRO OVERRIDE BLOCK ============

   rules win the cascade, and this block sits after ALL of them. */

/* Overlays: transparent veil so the game world shows through; lower layers
   never take taps. THIS is the "game as bg" fix: .ov covers the screen but
   only its content box blocks input. */
.ov{align-items:stretch;justify-content:flex-start;padding:0}
.ov.dim{background:transparent;backdrop-filter:none}
.hidden{opacity:0 !important;pointer-events:none !important;visibility:hidden !important}

/* Menu: game canvas behind, buttons in a centered column. */
#menu{background:transparent}
#menu .mWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px}
#menu h1,#menu .bankChip{margin-left:auto;margin-right:auto}
.btnStack{display:flex;flex-direction:column;align-items:center;margin-top:18px;gap:8px}
.btnStack .btn{margin-top:0}
#menu .btn{min-height:46px;min-width:min(300px,76vw);margin-left:auto;margin-right:auto}

/* Map + shop as full pages, not floating cards. */
#select,#shop{padding:0}
#select .card,#shop .card{max-width:none;width:100vw;min-height:100vh;max-height:none;
  border-radius:0;border:none;background:transparent;padding:0;display:flex;flex-direction:column}
#select .card>*,#shop .card>*{flex:0 0 auto}
#select .mapWrap{flex:1 1 auto;min-height:0;margin:0;padding:8px;align-items:stretch}
#select .mapWrap canvas{flex:1 1 auto;width:100%;height:100%;object-fit:contain}
#select .selTop{padding:10px 16px 4px}
#select .btnRow{padding:10px 16px 16px;margin-top:0;gap:12px}

/* Pause: vertical button column. */
.btnCol{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin:18px auto 4px;width:min(300px,72vw)}
.btnCol .btn{width:100%;margin-top:0;min-height:46px}

/* ============ END KIRO OVERRIDE BLOCK ============ */
</style>

<!-- ============================================================
     KIRO LAYOUT BLOCK v2
     ------------------------------------------------------------------
     Every page rule that used to live in the scattered media queries above
     now lives here, at the very end of the stylesheet, with `html body`
     prefixed selectors. The old rules were authored with mixed specificity
     (some bare `.card`, some `body.touchOn #select .card`) so their
     precedence depended on source order and every fix fought the one above
     it. Everything below outranks all of them, so this is the only block
     that needs editing from now on.

       MENU   - live game running behind, HUD + touch controls visible,
                buttons evenly spaced, HOW TO PLAY is a "?" in the corner.
       MAP    - the map IS the page. Canvas fills the screen, every control
                floats on top of it in a corner.
       SHOP   - one full page, no scrolling. The selected skin card turns
                into the showcase card in place.
     ============================================================ -->
<style id="kiro-layout-v2">
:root{--kbh:clamp(38px,7.4vh,52px)}

/* ---------- shared page shell ---------- */
.ov{align-items:stretch;justify-content:flex-start;padding:0}
.ov.dim{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.hidden{opacity:0 !important;pointer-events:none !important;visibility:hidden !important}
.ov>*{pointer-events:auto}

/* The buttons the player should reach for. One size everywhere, so a row of
   them never looks ragged. */
.btnStack{display:flex;flex-direction:column;align-items:center;margin-top:18px;gap:10px}

/* ---------- MENU ---------- */
html body #menu{background:transparent}
html body #menu .mWrap{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
/* An older media query set `#menu .btn+.btn{margin-top:9px}` on top of the
   flex gap, so the gap between buttons was 9px+10px while the gap above the
   first one was 10px - the uneven rhythm reported on the start page. The
   margin rule is outranked here, so the flex gap is the only spacing. */
html body #menu .btnStack .btn{margin-top:0}
html body #menu .btn{min-height:46px;min-width:min(300px,74vw);margin-left:auto;margin-right:auto}
/* `.hidden` only sets opacity/visibility, so the CONTINUE button still occupied
   a flex slot and punched a hole in the stack whenever it was hidden. */
html body #menu .btnStack .btn.hidden{display:none}
/* HOW TO PLAY: a "?" in the top-right corner instead of a fourth button. */
html body .helpFab{position:absolute;right:14px;top:14px;z-index:4;
  width:var(--kbh);height:var(--kbh);min-height:0;margin:0;padding:0;
  border-radius:50%;border:2px solid rgba(246,234,214,.34);
  background:rgba(5,19,34,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:var(--ink);font-family:'Bungee';font-size:calc(var(--kbh)*.46);line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.28)}
html body .helpFab:hover{border-color:var(--coral);color:#fff}
html body .helpFab:active{transform:scale(.94)}

/* The start page is played-over, not played-in: a real level is loaded quietly
   so the world itself is what shows through behind the buttons. The HUD chips
   and the on-screen controls stay hidden here - they belong to the game page,
   and putting them on the front page only made the two read as one screen. */
html body:not(.inGame) #cPause{display:none}

/* ---------- IN-GAME CONTROLS: no overlap, ever ----------
   The four buttons used to be placed at fixed percentages (9% / 19% and
   76% / 89%) while their SIZE was clamp(82px,12vw,108px). On any phone
   narrower than about 690 CSS px the two centres of a pair were closer than
   one button is wide, so LEFT sat on top of RIGHT and DASH on top of JUMP.
   Both the size and the spacing now derive from the same custom property, so
   the gap between a pair is always a real gap. */
html body.touchOn{--cs:clamp(58px,min(12.5vw,25vh),100px)}
html body .tc button{width:var(--cs,clamp(82px,12vw,108px));height:var(--cs,clamp(82px,12vw,108px));
  font-size:clamp(10px,min(2.2vw,4.4vh),15px)}
html body .tc svg{width:calc(var(--cs,90px)*.34);height:calc(var(--cs,90px)*.34)}
html body #tL{left:calc(4% + var(--cs,90px) / 2)}
html body #tR{left:calc(4% + var(--cs,90px) * 1.5 + 9px)}
html body #tD{left:calc(96% - var(--cs,90px) * 1.5 - 9px)}
html body #tJ{left:calc(96% - var(--cs,90px) / 2)}

/* ---------- MAP ---------- */
/* The world map is the page. Canvas fills the screen, every control floats on
   top of it in a corner. */
html body #select{padding:0}
html body #select .mapPage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#040d18}
html body.touchOn #select #mapCv,
html body #select #mapCv{
  position:absolute;left:0;top:0;width:100%;height:100%;
  max-width:none;max-height:none;min-width:0;min-height:0;
  aspect-ratio:auto;object-fit:fill;border:0;border-radius:0;display:block;touch-action:manipulation}
html body #select .mapOverlay{position:absolute;inset:0;z-index:3;pointer-events:none}
html body #select .mapOverlay>*{pointer-events:auto}
html body .cornerBtn{display:inline-flex;align-items:center;gap:7px;margin:0;
  min-height:clamp(34px,6.4vh,44px);padding:0 clamp(10px,1.6vw,16px);
  border-radius:999px;border:2px solid rgba(246,234,214,.3);
  background:rgba(5,19,34,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:var(--ink);font-family:'Outfit';font-weight:800;cursor:pointer;
  font-size:clamp(9px,1.9vh,12px);letter-spacing:.12em;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.3)}
html body .cornerBtn.gold{border-color:rgba(255,209,102,.6);color:#17233c;
  background:linear-gradient(180deg,rgba(255,224,126,.94),rgba(255,209,102,.94))}
html body .cornerBtn:hover{border-color:var(--coral)}
html body #select .cornerBtn.tl{position:absolute;left:12px;top:12px}
html body #select .cornerBtn.tr{position:absolute;right:12px;top:12px}
html body #select .mapTitle{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
  padding:7px clamp(12px,2vw,20px);border-radius:14px;
  background:rgba(5,19,34,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(217,242,255,.12);max-width:70vw}
html body #select #selTitle{font-family:'Bungee';font-size:clamp(12px,2.5vh,18px);color:var(--gold);letter-spacing:.04em}
html body #select #selMeta{font-size:clamp(8px,1.7vh,11px);font-weight:700;letter-spacing:.08em}
html body #select .mapPagers{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
html body #select .mapPagers .pgBtn{width:clamp(32px,6vh,42px);height:clamp(32px,6vh,42px);font-size:clamp(15px,3vh,20px)}

/* ---------- SHOP ---------- */
html body #shop{padding:0}
html body #shop .shopPage{width:100vw;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#10294c 0%,#0a1c33 55%,#06111f 100%)}
html body #shop .shopTopBar{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:clamp(8px,1.4vw,14px);padding:clamp(7px,1.4vh,12px) clamp(10px,1.6vw,16px);
  border-bottom:1px solid rgba(217,242,255,.10)}
html body #shop .shopTopBar h2{margin:0;text-align:center;font-size:clamp(13px,3.2vh,21px)}
html body #shop .shopBackBtn{min-height:clamp(32px,6vh,42px);padding:0 clamp(10px,1.6vw,16px);
  font-size:clamp(9px,1.9vh,12px);letter-spacing:.1em}
html body #shop .bankChip{margin:0;padding:clamp(4px,.9vh,7px) clamp(9px,1.4vw,14px);font-size:clamp(11px,2.2vh,15px)}
html body #shop #charsGrid{flex:1 1 auto;min-height:0;overflow:hidden;
  display:grid;gap:clamp(5px,1vh,9px);padding:clamp(7px,1.4vh,12px) clamp(10px,1.6vw,16px);
  grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(0,1fr);align-content:stretch}

/* A plain skin tile. */
html body #shop .chcard{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(2px,.5vh,4px);min-height:0;overflow:hidden;

  background:rgba(255,255,255,.045);border:2px solid transparent;

  transition:background .15s,transform .15s;-webkit-tap-highlight-color:transparent}
html body #shop .chcard:hover{background:rgba(255,255,255,.09)}
html body #shop .chcard>canvas{width:auto;height:clamp(26px,5.2vh,56px);aspect-ratio:1/1;flex:0 1 auto;min-height:0;display:block}
html body #shop .chcard .cn{display:flex;align-items:center;gap:4px;font-size:clamp(8px,1.7vh,11px);font-weight:700;letter-spacing:.04em}
html body #shop .chcard .dot{width:clamp(5px,.9vh,7px);height:clamp(5px,.9vh,7px);border-radius:50%;flex:0 0 auto}
html body #shop .chcard .cpr{font-size:clamp(7.5px,1.5vh,10.5px);font-weight:700;color:var(--gold);
  display:flex;gap:3px;align-items:center;min-height:0}
html body #shop .chcard .cpr.own{color:rgba(246,234,214,.55)}
html body #shop .chTrialTimer{position:absolute;top:5px;right:5px;z-index:2;padding:2px 4px;border-radius:6px;
  background:rgba(12,25,45,.92);border:1px solid rgba(67,224,196,.55);color:var(--teal);
  font-size:clamp(6px,1.2vh,8px);font-weight:900;line-height:1;white-space:nowrap;pointer-events:none}

/* The island-rental confirm is a MODAL over the world map, not a page swap,
   so the player can still see the island they are deciding about. It keeps its
   own dimmed backdrop - the shared .ov.dim rule makes overlays transparent so
   the game shows through, which is right for the map and wrong for a dialog. */
html body #unlock{z-index:36;background:rgba(2,10,20,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html body #unlock .unlockCard{max-width:min(92vw,460px);width:min(92vw,460px)}
html body #unlock #unlockBody{font-size:clamp(11px,2.2vh,14px);line-height:1.45;color:rgba(236,248,255,.92);text-align:center;margin:0 0 4px}

/* The selected tile BECOMES the showcase card - preview, name, rarity, blurb and
   both actions all live in that one card. There is no separate side panel. */
html body #shop .chcard.sel{grid-column:span 2;grid-row:span 2;gap:clamp(3px,.7vh,6px);

  background:linear-gradient(180deg,#15345a,#1b122e)}
html body #shop .chcard.sel>canvas{flex:1 1 0;min-height:0;height:0;width:100%;

html body #shop .chcard.sel .cpr{font-size:clamp(8px,1.6vh,11px)}

html body #shop .chcard.sel .chRar{font-size:clamp(7px,1.4vh,10px);font-weight:800;letter-spacing:.28em;text-indent:.28em}
html body #shop .chcard.sel .chTrialInfo{min-height:0;font-size:clamp(7.5px,1.5vh,11px);font-weight:800;
  letter-spacing:.05em;color:var(--gold)}

html body #shop .chcard.sel .chBtns{flex:0 0 auto;display:flex;gap:clamp(4px,.8vw,8px);
  width:100%;justify-content:center;align-items:stretch}
html body #shop .chcard.sel .chBtns .btn{flex:1 1 0;min-width:0;margin:0;
  min-height:clamp(28px,5.4vh,40px);padding:0 clamp(5px,1vw,12px);border-radius:11px;
  font-size:clamp(8px,1.6vh,12px);letter-spacing:.06em;text-indent:0;white-space:nowrap;overflow:hidden}

/* ---------- PAUSE ---------- */
.btnCol{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin:18px auto 4px;width:min(300px,72vw)}
.btnCol .btn{width:100%;margin-top:0;min-height:46px}

<script>
'use strict';
/* ================= canvas ================= */
const isMobileDevice=/Android|iPhone|iPad|iPod|Mobile|IEMobile|Windows Phone/i.test(navigator.userAgent) || (navigator.maxTouchPoints>0 && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,Z=1,VW=0;const VH=isMobileDevice?520:720;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  Z=cv.height/VH;VW=cv.width/Z;}
addEventListener('resize',resize);resize();

/* ================= helpers (early) ================= */
const TAU=Math.PI*2,T=48;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
const fmt=t=>{t|=0;return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
const $=id=>document.getElementById(id);

/* ================= landscape lock ================= */
const isMobile=isMobileDevice;
const isCoarse=isMobile;
if(isMobile)document.body.classList.add('touchOn');
let isPortrait=false;
function checkOrient(){
  /* The shell's GameActivity locks the activity to the manifest orientation
     (landscape here), so Kiro can never actually be portrait. The old check
     also blanked the game behind a full-screen 'ROTATE YOUR DEVICE' panel and
     returned early from the frame loop whenever the ratio read as portrait -
     which the shell's own layout pass can briefly do mid-rotation, freezing the
     game. The check is kept (it still drives the overlay) but it no longer
     gates the loop. */
  isPortrait=false;
  $('rotate').classList.remove('show');
}
addEventListener('resize',()=>{resize();checkOrient();});
addEventListener('orientationchange',()=>{setTimeout(()=>{resize();checkOrient();},180);});
let fullscreenAttempted=false;
async function goLandscape(){
  /* No-op: the shell already locked the activity to landscape via the manifest.
     Requesting fullscreen / an orientation lock from inside the WebView fights
     the activity and leaves the game letterboxed.
     Anchored to the CURRENT signature (`async`, `!isMobile`, returns false).
     The old anchor used `function goLandscape(){ if(!isCoarse)return;` and
     stopped matching when this game's source was replaced - the integrator
     refused to build rather than shipping a half-patched game, which is the
     behaviour we want. */
  if(!isMobile)return false;
  return false;
  document.body.classList.add('landscapeRequested');
  const el=document.documentElement;
  const lock=()=>{try{
    if(screen.orientation&&screen.orientation.lock){
      const p=screen.orientation.lock('landscape');
      if(p&&p.catch)p.catch(()=>{});
    }
  }catch(e){}};
  try{
    if(document.fullscreenElement){lock();return true;}
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(req){
      const result=req.call(el,{navigationUI:'hide'});
      if(result&&result.then){
        await result;
      }
      lock();
      return !!document.fullscreenElement;
    }
    lock();
  }catch(e){
    // Fullscreen can be denied by the browser/container; keep the game usable.
  }
  return !!document.fullscreenElement;
}
function requestMobileFullscreen(){
  if(!isMobile)return;
  fullscreenAttempted=true;
  goLandscape();
}
checkOrient();
if(isMobile){
  // Keep the request tied to a real user gesture. Some mobile browsers ignore
  // a one-shot capture listener if the first gesture lands on a browser-owned UI.
  const fsGesture=()=>{requestMobileFullscreen();};
  addEventListener('pointerdown',fsGesture,{capture:true,passive:true});
  addEventListener('touchstart',fsGesture,{capture:true,passive:true});
  addEventListener('click',fsGesture,{capture:true,passive:true});
  addEventListener('fullscreenchange',()=>{
    checkOrient();
    resize();
  });
  addEventListener('webkitfullscreenchange',()=>{checkOrient();resize();});
}

/* ================= AUTOMATIC SAVE — write-through, 6 layers ==========
 Every save writes to ALL layers simultaneously:
   1. localStorage  2. sessionStorage  3. cookies
   4. window.name   5. IndexedDB       6. the page URL (#hash)
 Boot loads from whichever layer holds the richest data. Local storage is
 used for persistence and the URL hash is a recovery layer.               */
const SKEY='kiro_save_v4';
const WNKEY='KIROSAVE1:';
function lsTest(){try{const k='__kt';localStorage.setItem(k,'1');
  const ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);return ok;}catch(e){return false;}}
function ssTest(){try{const k='__kt';sessionStorage.setItem(k,'1');
  const ok=sessionStorage.getItem(k)==='1';sessionStorage.removeItem(k);return ok;}catch(e){return false;}}
function ckTest(){try{document.cookie='__kt=1;max-age=60;path=/;SameSite=Lax';
  return document.cookie.indexOf('__kt=1')>=0;}catch(e){return false;}}
function packSave(s){
  let max=-1;for(const k in s.lv)max=Math.max(max,+k);
  const stars=[],times=[];
  for(let i=0;i<=max;i++){stars.push(s.lv[i]?s.lv[i].stars:0);times.push(s.lv[i]?Math.round(s.lv[i].time):0);}
  const trials=Object.entries(s.trialUntil||{}).filter(([id,t])=>Number.isFinite(+t)&&+t>Date.now()).map(([id,t])=>id+':'+Math.floor(+t)).join(',');
  /* Level AD RENTALS ride the save in the same packed string as everything
     else. Field 9 is new, so the version tag moves 5 -> 6; unpackSave still
     accepts 4 and 5 so every existing Kiro save still loads. */
  const ltrials=Object.entries(s.lvUntil||{}).filter(([id,t])=>Number.isFinite(+t)&&+t>Date.now()).map(([id,t])=>id+':'+Math.floor(+t)).join(',');
  return '6|'+s.bank+'|'+s.unlocked+'|'+(s.seen?1:0)+'|'+s.equipped+'|'+s.owned.join(',')+'|'+stars.join('')+'|'+times.join(',')+'|'+trials+'|'+ltrials;}
function unpackSave(str){
  try{
    const p=String(str).split('|');if(p[0]!=='4'&&p[0]!=='5'&&p[0]!=='6')return null;
    const s={bank:+p[1]||0,unlocked:+p[2]||1,seen:p[3]==='1',equipped:p[4]||'kiro',
      owned:(p[5]||'kiro').split(',').filter(Boolean),lv:{},trialUntil:{},lvUntil:{}};
    const stars=(p[6]||'').split(''),times=(p[7]||'').split(',');
    for(let i=0;i<stars.length;i++){
      const st=+stars[i]||0,tm=+times[i]||0;
      if(st>0||tm>0)s.lv[i]={stars:st,time:tm};}
    if(p[0]!=='4'&&p[8])for(const item of p[8].split(',')){const q=item.split(':');if(q.length===2&&q[0]&&Number.isFinite(+q[1]))s.trialUntil[q[0]]=+q[1];}
    if(p[0]==='6'&&p[9])for(const item of p[9].split(',')){const q=item.split(':');if(q.length===2&&q[0]&&Number.isFinite(+q[1]))s.lvUntil[q[0]]=+q[1];}
    return s;
  }catch(e){return null;}}
function ckSave(s){try{document.cookie='kiro='+encodeURIComponent(packSave(s))+
  ';max-age=31536000;path=/;SameSite=Lax';return true;}catch(e){return false;}}
function ckLoad(){try{const m=document.cookie.match(/(?:^|;\s*)kiro=([^;]+)/);
  return m?unpackSave(decodeURIComponent(m[1])):null;}catch(e){return null;}}
function b64e(str){try{return btoa(unescape(encodeURIComponent(str)));}catch(e){return '';}}
function b64d(str){try{return decodeURIComponent(escape(atob(str)));}catch(e){return '';}}
let idbDb=null;
function idbOpen(){return new Promise(res=>{
  try{const rq=indexedDB.open('kiro_db',1);
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>res(null);rq.onblocked=()=>res(null);
  }catch(e){res(null);}});}
function idbPut(db,val){if(!db)return;
  try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,'save');}catch(e){}}
function idbGet(db){return new Promise(res=>{if(!db)return res(null);
  try{const rq=db.transaction('kv','readonly').objectStore('kv').get('save');
    rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);
  }catch(e){res(null);}});}

function richParse(cand){
  if(!cand)return null;
  let s=null;
  if(typeof cand==='string'){try{s=JSON.parse(cand)||null;}catch(e){s=null;}}
  else s=cand;
  if(!s||typeof s!=='object'||typeof s.bank!=='number')return null;
  if(!s.lv)s.lv={};
  if(!s.trialUntil||typeof s.trialUntil!=='object')s.trialUntil={};
  if(!s.lvUntil||typeof s.lvUntil!=='object')s.lvUntil={};
  if(!Array.isArray(s.owned)||!s.owned.length)s.owned=['kiro'];
  if(typeof s.unlocked!=='number'||s.unlocked<1)s.unlocked=1;
  if(typeof s.equipped!=='string'||!s.equipped)s.equipped='kiro';
  return s;}
function scoreOf(s){return (s.unlocked||0)*100000+(s.bank||0)*10+(s.seen?1:0);}
let bestCand=null,bestScore=-1;
function consider(cand){const s=richParse(cand);
  if(s){const sc=scoreOf(s);if(sc>bestScore){bestScore=sc;bestCand=s;}}}
try{consider(localStorage.getItem(SKEY));}catch(e){}
try{consider(sessionStorage.getItem(SKEY));}catch(e){}
try{consider(ckLoad());}catch(e){}
try{if(window.name&&window.name.indexOf(WNKEY)===0)
  consider(unpackSave(window.name.slice(WNKEY.length)));}catch(e){}
try{if(location.hash&&location.hash.length>1)
  consider(unpackSave(b64d(location.hash.slice(1))));}catch(e){}

let save=bestCand||{unlocked:1,lv:{},seen:0,bank:0,owned:['kiro'],equipped:'kiro',trialUntil:{},lvUntil:{}};
if(!save.trialUntil||typeof save.trialUntil!=='object')save.trialUntil={};
if(!save.lvUntil||typeof save.lvUntil!=='object')save.lvUntil={};
function trialActive(id){return !save.owned.includes(id)&&Number(save.trialUntil[id]||0)>Date.now();}
function hasCharacterAccess(id){return save.owned.includes(id)||trialActive(id);}
function cleanupExpiredTrials(){let changed=false;for(const id of Object.keys(save.trialUntil)){if(Number(save.trialUntil[id]||0)<=Date.now()){delete save.trialUntil[id];if(save.equipped===id){save.equipped='kiro';changed=true;}}}if(changed)persist();}

/* ---------- AD-BORROWED LEVELS ----------
   A rewarded ad lends the player the NEXT island for half an hour. It is a
   RENTAL, not a purchase: the rental lapses, and the only thing that makes an
   island permanent is clearing it with 3 stars - the same rule Sheepdog Trials
   uses. Kept apart from save.lv so a borrowed island never reads as
   "completed".

   SEQUENTIAL, like everything else in Kiro: an ad can only open the one island
   immediately after the player's furthest cleared one. It can never skip a
   level, and it can never be pre-bought further ahead. */
const AD_UNLOCK_MS=30*60*1000;
function levelTrialLeft(i){return Math.max(0,Number(save.lvUntil[i]||0)-Date.now());}
function levelTrialActive(i){return levelTrialLeft(i)>0;}
function levelStars(i){return (save.lv[i]&&save.lv[i].stars)||0;}
/* The single island an ad may open: the next one in line, whatever a stale
   save might say about further ones. */
function adEligibleLevel(){return save.unlocked;}
function levelUnlocked(i){
  if(i<save.unlocked)return true;
  if(levelStars(i)>=3)return true;
  return i===adEligibleLevel()&&levelTrialActive(i);}
function cleanupLevelTrials(){
  let changed=false;
  /* Anything past the eligible island is from an older, looser rule and is
     dropped rather than honoured. */
  for(const k of Object.keys(save.lvUntil)){
    if(+k!==adEligibleLevel()||Number(save.lvUntil[k])<=Date.now()){delete save.lvUntil[k];changed=true;}}
  if(changed)persist();}
/* How far the world map pages. One island beyond the cleared ones is always
   listed, because that is the one carrying the AD chip. */
function progCount(){return save.unlocked+1;}
cleanupExpiredTrials();


const saveMode=lsTest()?'ls':ssTest()?'ss':ckTest()?'ck':'none';
console.log('[KIRO] storage check — localStorage:',lsTest(),
  '| sessionStorage:',ssTest(),'| cookies:',ckTest(),
  '| → save layer:',saveMode);

let hashT=0;
function persist(){
  const json=JSON.stringify(save),packed=packSave(save);
  try{localStorage.setItem(SKEY,json);}catch(e){}
  try{sessionStorage.setItem(SKEY,json);}catch(e){}
  try{ckSave(save);}catch(e){}
  try{window.name=WNKEY+packed;}catch(e){}
  const n=performance.now();
  if(n-hashT>400){hashT=n;
    try{history.replaceState(null,'','#'+b64e(packed));}catch(e){}}
  idbPut(idbDb,save);}
idbOpen().then(db=>{idbDb=db;
  return idbGet(db);}).then(v=>{
  const s=richParse(v);
  if(s&&scoreOf(s)>scoreOf(save)){save=s;refreshMenu();}});
addEventListener('pagehide',()=>{
  try{history.replaceState(null,'','#'+b64e(packSave(save)));}catch(e){}
  persist();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});

/* ================= characters ================= */
const RAR={
  common:{col:'#9aa3b5',label:'COMMON'},
  rare:{col:'#2ed6bd',label:'RARE'},
  epic:{col:'#6f7cff',label:'EPIC'},
  legend:{col:'#ffd166',label:'LEGENDARY'}
};
const CHARS=[
 {id:'kiro',name:'KIRO',tag:'The original explorer',price:0,rarity:'common',model:'classic',
  body:'#f6ead6',feet:'#e2cfae',visor:'#102844',eye:'#86f0ff',scarf:'#ff5f7a',tip:'#ff5f7a'},
 {id:'ruby',name:'RUBY',tag:'Fast. Fearless. Red.',price:100,rarity:'rare',model:'band',

/* Loudness. The game's own mix sat far too low to hear on a phone at full

   before a master of 0.5. These are FIXED bus gains, not user settings, so
   the lift applies to an existing install too - a player who already has
   sound:0.5 stored gets the same headroom as a fresh one. */
const MASTER_BOOST=1.2,SFX_BOOST=1.3,MUSIC_BOOST=1.6;

  if(master)master.gain.value=muted?0:clamp(soundVol*MASTER_BOOST,0,1);
  if(musicGain)musicGain.gain.value=musicOn?MUSIC_BOOST:0;
  if(sfxGain)sfxGain.gain.value=clamp(sfxVol*SFX_BOOST,0,1.5);}

  master=AC.createGain();musicGain=AC.createGain();sfxGain=AC.createGain();
  musicGain.connect(master);sfxGain.connect(master);master.connect(AC.destination);
  applyAudioVolumes();
  const len=AC.sampleRate;noiseB=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const pg=AC.createGain();pg.gain.value=0.028;pg.connect(musicGain);

function tone(f,dur,o={}){if(!AC)return;const{type='sine',vol=0.12,slide=0,delay=0}=o;
  const t0=AC.currentTime+delay,osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t0);
  if(slide)osc.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g);g.connect(sfxGain||master);osc.start(t0);osc.stop(t0+dur+0.05);}
function nz(dur,o={}){if(!AC)return;const{vol=0.12,f=800,type='lowpass',slide=0,delay=0,q=1}=o;
  const t0=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseB;s.loop=true;
  const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t0);
  if(slide)fl.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t0+dur);
  fl.Q.value=q;const g=AC.createGain();
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(sfxGain||master);s.start(t0);s.stop(t0+dur+0.05);}

const keys={};
const touch={L:false,R:false,J:false,D:false};
const gameKeyCodes=new Set([
  'ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
  'KeyA','KeyD','KeyW','KeyS',
  'Space','ShiftLeft','ShiftRight','KeyX','KeyR'
]);
let jumpBuf=0,jHeld=false;

const settingsOpen=()=>!$('settings').classList.contains('hidden');

function pressJump(){jumpBuf=0.12;}
function clearTransientInput(){
  for(const k of gameKeyCodes)keys[k]=false;
  touch.L=touch.R=touch.J=touch.D=false;
  jumpBuf=0;jHeld=false;
}
function normalizeKey(e){
  if(e.code)return e.code;
  const k=String(e.key||'');
  const map={ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',
    ' ':'Space',w:'KeyW',W:'KeyW',a:'KeyA',A:'KeyA',d:'KeyD',D:'KeyD',s:'KeyS',S:'KeyS',
    Shift:'ShiftLeft',x:'KeyX',X:'KeyX',r:'KeyR',R:'KeyR',m:'KeyM',M:'KeyM',p:'KeyP',P:'KeyP'};
  return map[k]||k;
}

/* Keyboard input is captured at document level so buttons/canvas focus cannot
   swallow gameplay keys. Movement is held until keyup; jump/dash are one-shot. */
document.addEventListener('keydown',e=>{
  const c=normalizeKey(e);
  const gameplay=(state==='play');
  const navKey=(c==='ArrowLeft'||c==='ArrowRight'||c==='ArrowUp'||c==='ArrowDown'||c==='Space'||c==='Enter');
  if((gameplay&&gameKeyCodes.has(c)) || (!gameplay&&navKey))e.preventDefault();
  if(c==='KeyM'){if(!e.repeat)initAudio(),toggleMute();return;}

  if(c==='Escape'||c==='KeyP'){
    if(e.repeat)return;
    if(unlockOpen()){clearTransientInput();closeUnlock();return;}
    if(settingsOpen()){clearTransientInput();closeSettings();return;}
    if(shopOpen()){clearTransientInput();closeShop();return;}
    if(howOpen()){clearTransientInput();closeHow();return;}
    if(state==='complete'){clearTransientInput();openSelect();return;}
    if(state==='select'){clearTransientInput();backMenu();return;}
    if(state==='play'||state==='pause'){clearTransientInput();togglePause();return;}
    return;
  }

  if(howOpen()){
    if(c==='ArrowLeft'&&!e.repeat)howMove(-1);
    if(c==='ArrowRight'&&!e.repeat)howMove(1);
    return;
  }

  if(state==='menu'){
    if((c==='Enter'||c==='Space')&&!e.repeat){clearTransientInput();openSelect();}
    return;
  }

  if(state==='select'){
    if((c==='ArrowLeft'||c==='ArrowRight')&&!e.repeat)pageMove(c==='ArrowLeft'?-1:1);
    if(c==='Enter'&&!e.repeat){clearTransientInput();startLevel(Math.min(save.unlocked-1,selIdx));}
    return;
  }

  if(state==='complete'){
    if(c==='Enter'&&!e.repeat){clearTransientInput();nextLevel();}
    return;
  }

  if(state!=='play')return;
  initAudio();

  if(c==='KeyR'&&!e.repeat){clearTransientInput();startLevel(cur);return;}

  if(c==='ArrowLeft'||c==='KeyA'||c==='ArrowRight'||c==='KeyD'||c==='KeyS'){
    keys[c]=true;
    return;
  }
  if(c==='Space'||c==='ArrowUp'||c==='KeyW'){
    keys[c]=true;
    if(!e.repeat)pressJump();
    return;
  }
  if(c==='ShiftLeft'||c==='ShiftRight'||c==='KeyX'){
    keys[c]=true;
    if(!e.repeat)tryDash();
  }
},{capture:true,passive:false});

document.addEventListener('keyup',e=>{
  const c=normalizeKey(e);
  if(gameKeyCodes.has(c))keys[c]=false;
},{capture:true,passive:false});

addEventListener('blur',()=>{

/* Mobile controls: each button owns its own pointer.  Do not use a global
   pointerup to clear every control: that breaks multi-touch (e.g. MOVE + JUMP).
   Movement also gets a short tap pulse, so tap and hold both feel responsive. */
const controlPointers=new Map();
const tapTimers={L:null,R:null,J:null,D:null};
function releaseControlPointer(pointerId){
  const prop=controlPointers.get(pointerId);
  if(!prop)return;
  controlPointers.delete(pointerId);
  const stillHeld=[...controlPointers.values()].includes(prop);
  if(!stillHeld)touch[prop]=false;
}
function bindBtn(id,prop){const b=$(id);if(!b)return;
  const on=e=>{
    e.preventDefault();e.stopPropagation();
    if(controlsEditing||state!=='play'||!isMobile)return;
    try{b.setPointerCapture(e.pointerId);}catch(err){}
    initAudio();
    controlPointers.set(e.pointerId,prop);
    touch[prop]=true;
    /* A quick tap should still register as a small movement input. Holding
       keeps the input active until the same pointer is released. */
    if(prop==='L'||prop==='R'){
      clearTimeout(tapTimers[prop]);
      tapTimers[prop]=setTimeout(()=>{
        const held=[...controlPointers.values()].includes(prop);
        if(!held)touch[prop]=false;
      },140);
    }
    if(prop==='J')pressJump();
    if(prop==='D')tryDash();
  };
  const off=e=>{
    e.preventDefault();e.stopPropagation();
    releaseControlPointer(e.pointerId);
    try{if(e.pointerId!=null)b.releasePointerCapture(e.pointerId);}catch(err){}
  };
  b.addEventListener('pointerdown',on,{passive:false});
  b.addEventListener('pointerup',off,{passive:false});
  b.addEventListener('pointercancel',off,{passive:false});
  b.addEventListener('lostpointercapture',off,{passive:false});
}

  const cp=(x,top)=>cps.push({x:(x+.5)*T,gy:top*T,lit:false,pop:0});

  spawnP=null;

    return 'flat';};
  while(c<lvlW-12){
    let seg=pick();
    if(seg===lastSeg&&R()<0.5)seg=pick();
    lastSeg=seg;
    if(top<7&&(seg==='step'||seg==='planks'))seg='drop';
    if(top>13&&seg==='drop')seg='flat';
    if(seg==='flat'){
      const len=6+Math.floor(R()*6);
      g(c,c+len-1,top);
      if(d>0.12&&len>=9&&R()<0.6)walker(c+2,c+len-3,top);
      coin(c+2,top-1);if(len>=9)coin(c+len-3,top-1);
      c+=len;maybeCP();
    }else if(seg==='gap'){
      let w;if(d<0.2)w=2;else if(d<0.55)w=(R()<0.6?2:3);else w=(R()<0.4?3:4);
      let drop=0;
      if(d>0.3&&R()<0.4){drop=1+Math.floor(R()*2);}
      coin(c+((w/2)|0),top-1);
      g(c+w,c+w+2,top+drop);
      c+=w+3;top+=drop;maybeCP();
    }else if(seg==='step'){
      const rise=1+(R()<0.5?1:0);
      g(c,c+3,top-rise);coin(c+2,top-rise-1);
      c+=4;top-=rise;maybeCP();
    }else if(seg==='drop'){
      const drop=1+Math.floor(R()*2);
      g(c,c+3,top+drop);coin(c+2,top+drop-1);
      c+=4;top+=drop;maybeCP();
    }else if(seg==='spikes'){
      if(d>0.35&&R()<0.45){
        g(c,c+3,top);spk(c+1,c+2,top-1);
        coin(c+1,top-2);coin(c+2,top-2);
        c+=4;
        g(c,c+3,top);spk(c+1,c+2,top-1);
        coin(c+1,top-2);coin(c+2,top-2);
        c+=4;
      }else if(d>0.22&&R()<0.45){
        g(c,c+7,top);spk(c+1,c+6,top-1);
        plat(c+1,top-2,2);plat(c+5,top-2,2);
        coin(c+1,top-3);coin(c+5,top-3);coin(c+3,top-1);
        c+=8;
      }else{
        g(c,c+6,top);spk(c+2,c+3,top-1);
        coin(c+2,top-2);coin(c+3,top-2);
        c+=7;
      }
      maybeCP();
    }else if(seg==='crumble'){
      const len=4+Math.floor(R()*(3+d*3));
      g(c,c+2,top);crb(c+3,top-1,len);g(c+3+len,c+5+len,top);
      for(let i=0;i<len;i+=2)coin(c+3+i,top-2);
      c+=6+len;maybeCP();
    }else if(seg==='planks'){
      plat(c+1,top-2,3);plat(c+5,top-4,3);g(c+9,c+11,top-4);
      if(d>0.5&&R()<0.5){plat(c+13,top-6,3);g(c+17,c+19,top-6);
        coin(c+14,top-7);c+=20;top-=6;}
      else{coin(c+2,top-3);coin(c+6,top-5);coin(c+10,top-5);c+=12;top-=4;}
      maybeCP();
    }else if(seg==='mover'){
      const w=4+(d>0.5&&R()<0.5?1:0);
      g(c,c+2,top);g(c+3+w,c+5+w,top);
      movers.push({bx:(c+3+w/2)*T,by:(top-1)*T,ax:'h',rg:(w/2+0.4)*T,
        spd:1.0+R()*0.3+d*0.5,ph:R()*TAU,x:(c+3+w/2)*T,y:(top-1)*T,dx:0,dy:0,w:96,h:14});
      coin(c+2+w/2,top-1);
      c+=6+w;maybeCP();
    }else{
      const len=8+Math.floor(R()*4);
      g(c,c+len-1,top);
      walker(c+2,c+len-3,top);
      coin(c+3,top-1);coin(c+len-3,top-1);
      c+=len;maybeCP();
    }
  }
  g(c,lvlW-1,top);
  // Keep the goal area clean: the final checkpoint is intentionally NOT at the exit.
  exitP={x:(lvlW-3.5)*T,y:top*T-52};
}
function buildBossArena(wi){

function makeBoss(x,gt,hp){return{x,y:gt-72,w:96,h:72,hp:hp,maxhp:hp,vx:0,vy:0,
  st:'wait',t:1.4,inv:0,flash:0,dead:false,hops:0,dir:-1,groundTop:gt,sx:1,sy:1};}
function bossUpdate(dt){
  if(!boss||boss.dead)return;
  boss.inv-=dt;boss.flash=Math.max(0,boss.flash-dt);
  const gt=boss.groundTop,cx=boss.x+boss.w/2,pcx=p.x+15;
  const wi=worldOf(cur);
  const spd=1+(boss.maxhp-boss.hp)*0.28+Math.min(0.5,wi*0.05);
  boss._shockV=340+wi*22;
  const clX=()=>{boss.x=clamp(boss.x,2*T+2,(lvlW-2)*T-2-boss.w);};
  boss.t-=dt;
  switch(boss.st){
    case 'wait':
      boss.vx=0;boss.sx+=(1-boss.sx)*dt*8;boss.sy+=(1-boss.sy)*dt*8;
      if(boss.t<=0){
        const r=Math.random();
        if(boss.hp<=1&&r<0.4){boss.st='ctell';boss.t=0.4;}
        else if(r<0.6){boss.st='hop';boss.hops=2;boss.vy=-540*spd;boss.vx=clamp(pcx-cx,-170,170)*spd;}
        else{boss.st='tell';boss.t=0.45;}
      }break;
    case 'hop':
      boss.vy+=2500*dt;boss.x+=boss.vx*dt;boss.y+=boss.vy*dt;clX();
      boss.sx=0.9;boss.sy=1.1;
      if(boss.y+boss.h>=gt&&boss.vy>0){
        boss.y=gt-boss.h;boss.vy=0;dust(boss.x+boss.w/2,gt,4);
        if(boss.hops>0){boss.hops--;boss.vy=-540*spd;boss.vx=clamp(pcx-(boss.x+boss.w/2),-170,170)*spd;}
        else{boss.st='wait';boss.t=1.0*(0.55+0.45*boss.hp/boss.maxhp);}
      }break;
    case 'tell':
      boss.vx=0;boss.sx=1.22;boss.sy=0.78;
      if(boss.t<=0){boss.st='slam';boss.vy=-880*spd;
        boss.vx=clamp(pcx-cx,-240,240)*0.5*spd;}
      break;
    case 'slam':
      boss.vy+=2600*dt;boss.x+=boss.vx*dt;boss.y+=boss.vy*dt;clX();
      boss.sx=0.82;boss.sy=1.2;
      if(boss.y+boss.h>=gt&&boss.vy>0){
        boss.y=gt-boss.h;boss.vy=0;boss.vx=0;
        shake=9;sSlam();
        const sv=boss._shockV||340;
        shocks.push({x:cx,y:gt,dir:1,v:sv,life:1.5},{x:cx,y:gt,dir:-1,v:sv,life:1.5});
        burst(cx,gt,12,['157,122,197','201,184,166'],240);
        boss.sx=1.35;boss.sy=0.7;
        boss.st='wait';boss.t=1.15*(0.55+0.45*boss.hp/boss.maxhp);
      }break;
    case 'ctell':
      boss.vx=0;boss.sx=1.15;boss.sy=0.85;
      if(Math.random()<dt*20)addP(boss.x+rnd(0,boss.w),boss.y+rnd(0,20),rnd(-40,40),rnd(-60,0),.3,3,'255,107,87',true,0,0);
      if(boss.t<=0){boss.st='charge';boss.t=0.85;boss.dir=pcx>cx?1:-1;}
      break;
    case 'charge':
      boss.vx=boss.dir*340;boss.x+=boss.vx*dt;clX();
      boss.sx=1.18;boss.sy=0.86;
      if(Math.random()<dt*14)addP(boss.x+boss.w/2-boss.dir*40,boss.y+boss.h-8,-boss.dir*rnd(40,120),rnd(-40,0),.3,3.5,'157,122,197',false,100,0);
      if(boss.t<=0||boss.x<=2*T+4||boss.x>=(lvlW-2)*T-2-boss.w){
        boss.st='wait';boss.t=1.0;}
      break;
  }
}
function bossCollide(){
  if(!boss||boss.dead||p.dead)return;
  const bx=boss.x+8,bw=boss.w-16,by=boss.y+10,bh=boss.h-10;
  if(p.x<bx+bw&&p.x+p.w>bx&&p.y<by+bh&&p.y+p.h>by){
    if(p.vy>140&&p.y+p.h<boss.y+32&&boss.inv<=0){
      boss.hp--;boss.inv=1.4;boss.flash=1;
      sBossHit();shake=6;
      p.vy=-780;p.canDJ=true;p.sy=1.3;p.sx=.75;
      burst(boss.x+boss.w/2,boss.y+8,14,['157,122,197','255,200,87'],220);
      if(boss.hp<=0)killBoss();
      else{boss.st='wait';boss.t=0.9;}
    }else if(boss.inv<=0)die();
  }
}

      drop:{vx:rnd(-170,170),vy:rnd(-520,-240)}});

function updShocks(dt){

    if(!p.dead&&p.inv<=0&&Math.abs((p.y+p.h)-s.y)<34&&Math.abs(p.x+15-s.x)<30)die();

/* Same geometry as the CSS above, expressed in percent for the layout editor.
   The old defaults were 11/24 and 76/89, i.e. 13% apart, which is less than
   one button's width on a small landscape phone - the pair overlapped. 10/26
   and 74/90 keep the same visual weight with a gap that always fits. */
const CONTROL_DEFAULTS={L:{x:10,y:80,scale:.78,opacity:.82},R:{x:26,y:80,scale:.78,opacity:.82},D:{x:74,y:80,scale:.78,opacity:.82},J:{x:90,y:80,scale:.78,opacity:.82}};
let controlLayout=JSON.parse(JSON.stringify(CONTROL_DEFAULTS));
let controlsEditing=false,selectedControl='J';
function normalizeControl(v,k){
  const d=CONTROL_DEFAULTS[k]||CONTROL_DEFAULTS.J;
  return {x:clamp(Number.isFinite(+v.x)?+v.x:d.x,5,95),y:clamp(Number.isFinite(+v.y)?+v.y:d.y,8,92),scale:clamp(Number.isFinite(+v.scale)?+v.scale:d.scale,.7,1.5),opacity:clamp(Number.isFinite(+v.opacity)?+v.opacity:d.opacity,.25,1)};
}
function loadControlLayout(){try{const v=JSON.parse(localStorage.getItem('kiro_controls_v1')||'null');if(v)for(const k of Object.keys(CONTROL_DEFAULTS))if(v[k])controlLayout[k]=normalizeControl(v[k],k);}catch(e){}}

     ad is asked for HERE - at the moment the run actually ends - rather than
     waiting for the player to touch one of the three buttons on the card. Every
     one of those buttons would otherwise be a separate request for the same
     break, and the player would have to guess which tap was the ad one.

     The guard is a same-frame double-ask guard only. It is released as soon as

     next end of a run asks again. */
  if(!outOfLivesAdAsked){

function adMessage(why){
  var m=String(why||'');
  if(m.indexOf('cooldown:')===0)return 'AD READY IN '+parseInt(m.slice(9),10)+'S';
  if(m==='cooldown')return 'AD NOT READY YET';
  if(m==='limit_reached')return 'NO HEARTS LEFT THIS RUN';
  if(m==='offline')return 'OFFLINE - AD UNAVAILABLE';
  if(m==='first_session')return 'AD UNAVAILABLE';
  return 'AD UNAVAILABLE';}
function watchHeartAd(){
  if(heartUsed){restartLevel();return;}
  if(window.__kiroAdBusy)return;
  window.__kiroAdBusy=true;
  var released=function(){window.__kiroAdBusy=false;};
  /* The placement contains "revive", so the shell treats this as a revive:
     one per run, with its own cooldown. */
  Studio.ads.rewarded('kiro.revive.extra-heart',
    function(){
      released();
      heartUsed=true;
      clearTransientInput();show(overEl,false);
      /* keepHeartOffer: this restart continues the same run. */
      startLevel(cur,true);
      /* Exactly one heart, not a fresh set of three. */
      lives=1;updLives();
      banner('+1 HEART');},
    function(why){ released();banner(adMessage(why));}
  );
}

/* Tells the shell a new attempt has begun. The per-run revive cap lives in
   AdPolicy and is only cleared by this call, because a retry happens in page
   and never recreates the Activity - without it the shell still believed the
   previous run had spent its heart and would refuse the next one with
   "limit_reached", which is exactly the dead-button bug this replaced. */
function reportNewRun(){
  try{if(window.NativeBridge&&window.NativeBridge.newRun)window.NativeBridge.newRun();}catch(e){}
}
function startLevel(i,keepHeartOffer){
  i=Math.max(0,Math.floor(i));
  goLandscape();
  clearTransientInput();
  loadLevel(i,false);state='play';
  /* Starting an attempt is a new run, so the single extra heart is offered
     again. The heart's own payout passes keepHeartOffer, because that restart
     continues the SAME run - re-offering the heart there would hand out one
     per death. */
  if(!keepHeartOffer){heartUsed=false;reportNewRun();}
  save.unlocked=Math.max(save.unlocked,Math.min(i+1,1e9));
  persist();
  hideAllPages();
  show(hudEl,true);
  setGameInput(true);
  if(!isMobile)focusGame();
  fadeT=1;
}

  if(state==='play'){state='pause';clearTransientInput();persist();showPage(pauseEl);setGameInput(false);}

let nextTransitionBusy=false;
function nextLevel(){
  const doneVisible=!doneEl.classList.contains('hidden');
  if(nextTransitionBusy||!doneVisible)return;
  nextTransitionBusy=true;
  clearTransientInput();
  const nextIdx=cur+1;
  const b=$('bNext');
  if(b){b.disabled=true;b.textContent='NEXT';b.classList.remove('loading');}
  try{
    show(doneEl,false);
    startLevel(nextIdx);
  }finally{
    nextTransitionBusy=false;
    if(b){b.disabled=false;b.textContent='NEXT';b.classList.remove('loading');}
  }
}

// The editor uses the REAL in-game touch buttons so size, position and appearance
// are exactly the same as during gameplay.
(function bindRealGameControlEditor(){
  const map=[['L','tL'],['R','tR'],['D','tD'],['J','tJ']];
  for(const [key,id] of map){
    const b=$(id); if(!b)continue;
    let dragging=false;
    b.addEventListener('pointerdown',e=>{
      if(!controlsEditing)return;
      e.preventDefault();e.stopPropagation();
      selectedControl=key;updateLayoutEditorUI();
      dragging=true;
      try{b.setPointerCapture(e.pointerId);}catch(err){}
    },{capture:true,passive:false});
    b.addEventListener('pointermove',e=>{
      if(!controlsEditing||!dragging)return;
      e.preventDefault();e.stopPropagation();
      controlLayout[key]={...controlLayout[key],x:clamp(e.clientX/innerWidth*100,5,95),y:clamp(e.clientY/innerHeight*100,8,92)};
      applyControlLayout();
    },{capture:true,passive:false});
    const end=e=>{
      if(!dragging)return;
      e.preventDefault();e.stopPropagation();dragging=false;saveControlLayout();
      try{b.releasePointerCapture(e.pointerId);}catch(err){}
    };
    b.addEventListener('pointerup',end,{capture:true,passive:false});
    b.addEventListener('pointercancel',end,{capture:true,passive:false});
  }
})();

// Drag-to-place editor for mobile controls. Pointer coordinates are stored as percentages.
(function bindControlEditor(){
  const map=[['L','setL'],['R','setR'],['D','setD'],['J','setJ']];
  for(const [key,id] of map){const b=$(id);if(!b)continue;
    let dragging=false;
    b.addEventListener('pointerdown',e=>{if(!controlsEditing)return;e.preventDefault();selectedControl=key;updateLayoutEditorUI();dragging=true;b.setPointerCapture?.(e.pointerId);});
    b.addEventListener('pointermove',e=>{if(!controlsEditing||!dragging)return;e.preventDefault();const r=$('settingsControls').getBoundingClientRect();controlLayout[key]={...controlLayout[key],x:clamp((e.clientX-r.left)/r.width*100,5,95),y:clamp((e.clientY-r.top)/r.height*100,8,92)};applyControlLayout();});
    const end=e=>{if(!dragging)return;dragging=false;saveControlLayout();};
    b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
  }
})();

const mapCv=$('mapCv'),mg=mapCv.getContext('2d');
/* The map is authored at 840x430. It is DRAWN in that fixed design space and
   scaled to cover the screen, so the composition is identical everywhere and
   never letterboxes (a black bar around the map read as "popup"). The backing
   store is resized to the viewport, which also keeps a click at CSS pixel (x,y)
   landing on the same map pixel the node test uses. */
const MAP_W=840,MAP_H=430;
function sizeMapCanvas(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(320,Math.round((innerWidth||800)*dpr));
  const h=Math.max(200,Math.round((innerHeight||450)*dpr));
  if(mapCv.width!==w||mapCv.height!==h){mapCv.width=w;mapCv.height=h;}
}
const MP=[[.09,.58],[.25,.30],[.41,.56],[.57,.28],[.73,.54],[.91,.32]];
function pageMove(d){const maxP=Math.ceil(progCount()/WORLD)-1;
  page=clamp(page+d,0,maxP);buildSelect();sClick();}
function buildSelect(){
  cleanupLevelTrials();
  const reach=progCount();
  const maxP=Math.ceil(reach/WORLD)-1;
  page=clamp(page,0,Math.max(0,maxP));
  const pageStart=page*WORLD;
  const pageEnd=Math.min(pageStart+WORLD-1,Math.max(0,reach-1));
  selIdx=clamp(selIdx,pageStart,pageEnd);
  let tot=0;for(let i=0;i<reach;i++)tot+=(save.lv[i]&&save.lv[i].stars)||0;
  $('selMeta').innerHTML='STARS <b>'+tot+'</b> · BANK <b>'+save.bank+'</b>';
  $('selTitle').textContent='WORLD MAP';
  /* PLAY LV label removed with the button. */
  $('pgL').disabled=page<=0;
  $('pgR').disabled=page>=maxP;
  drawMap();}
function silLayer(g,w,h,type,yb,col,seed){
  g.fillStyle=col;g.beginPath();
  if(type==='hills'||type==='dunes'||type==='canopy'){
    g.moveTo(0,h);
    const a1=type==='dunes'?46:34,a2=type==='dunes'?18:14;
    for(let x=0;x<=w;x+=8){
      const u=x/w*Math.PI*2+seed;
      let y=yb-a1*Math.sin(u*1.7+seed)-a2*Math.sin(u*3.3+seed*2);
      if(type==='canopy')y=yb-30-Math.abs(Math.sin(u*4+seed))*36;
      g.lineTo(x,y);}
    g.lineTo(w,h);
  }else if(type==='trees'){
    g.moveTo(0,h);g.lineTo(0,yb);
    for(let x=0;x<=w;x+=34){
      const t=hash(x*0.7+seed);
      g.lineTo(x,yb);g.lineTo(x+17,yb-46-t*52);g.lineTo(x+34,yb);}
    g.lineTo(w,h);
  }else{
    g.moveTo(0,h);g.lineTo(0,yb-30);
    let up=true;
    for(let x=0;x<=w;x+=w/9){
      const pk=yb-40-hash(x+seed)*110;
      g.lineTo(x,up?pk:yb-24-hash(x*1.3)*40);up=!up;}
    g.lineTo(w,h);}
  g.closePath();g.fill();}
function drawMap(){
  sizeMapCanvas();
  const cw=mapCv.width,ch=mapCv.height;
  const s=Math.max(cw/MAP_W,ch/MAP_H);
  const w=MAP_W,h=MAP_H;
  mg.setTransform(s,0,0,s,(cw-w*s)/2,(ch-h*s)/2);
  const th=THEMES[page%THEMES.length],pl=th.pal;
  const grd=mg.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,pl.top);grd.addColorStop(.6,pl.mid);grd.addColorStop(1,pl.bot);
  mg.fillStyle=grd;mg.fillRect(0,0,w,h);
  if(pl.stars)for(let i=0;i<40;i++){
    const a=.2+.5*Math.abs(Math.sin(time*1.3+i));
    mg.fillStyle='rgba(255,244,226,'+(a*.8)+')';
    mg.fillRect(hash(i*3.1)*w,hash(i*7.7)*h*.5,1.6,1.6);}
  const sx=w*.8,sy=h*pl.sunY;
  const hgr=mg.createRadialGradient(sx,sy,10,sx,sy,pl.sunR*2.4);
  hgr.addColorStop(0,'rgba(255,236,200,.45)');hgr.addColorStop(1,'rgba(255,236,200,0)');
  mg.fillStyle=hgr;mg.fillRect(sx-pl.sunR*2.4,sy-pl.sunR*2.4,pl.sunR*4.8,pl.sunR*4.8);
  mg.fillStyle=pl.sun;mg.beginPath();mg.arc(sx,sy,pl.sunR,0,TAU);mg.fill();
  if(th.sil==='aurora'){
    for(let i=0;i<2;i++){
      mg.save();mg.globalAlpha=.16;
      const ag=mg.createLinearGradient(0,60,0,240);
      ag.addColorStop(0,'#7fffc8');ag.addColorStop(1,'rgba(127,255,200,0)');
      mg.fillStyle=ag;mg.beginPath();
      const y0=70+i*46;
      mg.moveTo(0,y0);
      for(let x=0;x<=w;x+=10)mg.lineTo(x,y0+Math.sin(x*.012+time*.7+i*2)*34);
      mg.lineTo(w,y0+120);mg.lineTo(0,y0+120);
      mg.closePath();mg.fill();mg.restore();}}
  silLayer(mg,w,h,th.sil,h*.86,hexA(pl.far,.75),page*7+3);
  silLayer(mg,w,h,th.sil==='aurora'?'peaks':th.sil,h*1.0,pl.far,page*13+8);
  for(let i=0;i<5;i++){
    const cx=((time*10*(0.4+hash(i)*0.5)+hash(i*9)*w*2)%(w+200))-100;
    const cy=40+hash(i*3)*120;
    mg.fillStyle='rgba(255,255,255,.14)';
    mg.beginPath();
    mg.ellipse(cx,cy,44,14,0,0,TAU);
    mg.ellipse(cx-30,cy+5,26,10,0,0,TAU);
    mg.ellipse(cx+30,cy+4,28,11,0,0,TAU);
    mg.fill();}
  const pts=MP.map(q=>[q[0]*w,q[1]*h]);
  mg.strokeStyle='rgba(255,240,210,.55)';
  mg.lineWidth=4;mg.setLineDash([10,9]);mg.lineCap='round';
  mg.beginPath();mg.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    const mx=(pts[i-1][0]+pts[i][0])/2,my=Math.min(pts[i-1][1],pts[i][1])-52;
    mg.quadraticCurveTo(mx,my,pts[i][0],pts[i][1]);}
  mg.stroke();mg.setLineDash([]);
  mapHits=[];
  const nextLocked=adEligibleLevel();
  for(let n=0;n<WORLD;n++){
    const idx=page*WORLD+n;
    const [x,y]=pts[n];
    const unlocked=levelUnlocked(idx);
    const adOpen=idx===nextLocked;
    const isB=n===WORLD-1;
    const rec=save.lv[idx],st=rec?rec.stars:0;
    const r=isB?27:22;
    mapHits.push({x,y,r:r+14,idx});
    mg.fillStyle='rgba(0,0,0,.3)';
    mg.beginPath();mg.ellipse(x,y+r+5,r*.9,6,0,0,TAU);mg.fill();
    mg.fillStyle=unlocked?'#2e2249':'#221a35';
    mg.strokeStyle=unlocked?(isB?'#ffb35c':'#ffd166'):'rgba(246,234,214,.25)';
    mg.lineWidth=3;
    mg.beginPath();mg.arc(x,y,r,0,TAU);mg.fill();mg.stroke();
    /* An island that is open on a rental wears the teal accent, so borrowed
       progress is never mistaken for earned progress. */
    if(levelTrialActive(idx)){
      mg.strokeStyle='#2ed6bd';mg.lineWidth=2.5;mg.setLineDash([5,4]);
      mg.beginPath();mg.arc(x,y,r+6,0,TAU);mg.stroke();mg.setLineDash([]);}
    /* AD chip on the one island an ad can open. It is drawn ABOVE the node,
       where the compass used to be, so nothing on the map can sit under the
       SHOP button. */
    if(adOpen){
      const left=Math.ceil(levelTrialLeft(idx)/60000);
      const label=left>0?('AD '+left+'m'):'WATCH AD';
      mg.font='800 10px Outfit';mg.textAlign='center';mg.textBaseline='middle';
      const tw=Math.max(34,mg.measureText(label).width+14);
      const ty=y-r-24;
      mg.fillStyle='rgba(8,34,32,.94)';
      rr(mg,x-tw/2,ty,tw,17,8.5);mg.fill();
      mg.strokeStyle=levelTrialActive(idx)?'rgba(67,224,196,.9)':'rgba(255,209,102,.85)';
      mg.lineWidth=1.5;rr(mg,x-tw/2,ty,tw,17,8.5);mg.stroke();
      mg.fillStyle=levelTrialActive(idx)?'#7ff0dc':'#ffd166';
      mg.fillText(label,x,ty+9);
      mg.textBaseline='alphabetic';}
    if(unlocked&&idx===selIdx){
      const pr=8+Math.sin(time*4)*3;
      mg.strokeStyle='rgba(255,200,87,.8)';mg.lineWidth=2.5;
      mg.beginPath();mg.arc(x,y,r+pr,0,TAU);mg.stroke();}
    mg.fillStyle=unlocked?'#f5fbff':'rgba(246,234,214,.4)';
    mg.font=(isB?'15px':'16px')+' Bungee';mg.textAlign='center';mg.textBaseline='middle';
    mg.fillText(unlocked?(n+1):'',x,y+1);
    if(isB&&unlocked){
      mg.fillStyle='#ffd257';
      mg.beginPath();
      mg.moveTo(x-12,y-r-6);mg.lineTo(x-12,y-r-16);mg.lineTo(x-6,y-r-10);
      mg.lineTo(x,y-r-19);mg.lineTo(x+6,y-r-10);mg.lineTo(x+12,y-r-16);mg.lineTo(x+12,y-r-6);
      mg.closePath();mg.fill();}
    if(!unlocked){
      mg.strokeStyle='rgba(246,234,214,.55)';mg.lineWidth=2.4;
      mg.beginPath();mg.arc(x,y-2,5,Math.PI,0);mg.stroke();
      mg.fillStyle='rgba(246,234,214,.55)';
      rr(mg,x-7,y-2,14,11,3);mg.fill();}
    for(let s=0;s<3;s++){
      const sxx=x-16+s*16,syy=y+r+16;
      drawStar(mg,sxx,syy,5.5,s<st);}
    mg.font='700 10px Outfit';mg.fillStyle='rgba(255,244,226,.85)';
    mg.fillText(isB?'BOSS':lvlTitle(idx),x,y+r+32);
    mg.textBaseline='alphabetic';}
  /* Region label, centred between the two corner buttons. The compass that used
     to live in the top-right of the canvas has been removed: it rendered
     directly underneath the SHOP button and looked like part of it. */
  mg.textAlign='center';
  mg.font='20px Bungee';mg.fillStyle='#f5fbff';
  mg.fillText('REGION '+(page+1),w/2,42);
  mg.font='700 12px Outfit';mg.fillStyle='rgba(255,244,226,.75)';
  mg.fillText(th.name,w/2,62);
  mg.textAlign='left';}
/* Node taps: an open island starts, a locked one offers the 30-minute rental.
   The map canvas fills the screen, so the click has to be mapped back through
   the cover transform before it can be compared with mapHits. */
mapCv.addEventListener('click',e=>{
  const r=mapCv.getBoundingClientRect();
  const cx=(e.clientX-r.left)*mapCv.width/r.width;
  const cy=(e.clientY-r.top)*mapCv.height/r.height;
  const sc=Math.max(mapCv.width/MAP_W,mapCv.height/MAP_H);
  const x=(cx-mapCv.width/2)/sc+MAP_W/2;
  const y=(cy-mapCv.height/2)/sc+MAP_H/2;
  for(const nd of mapHits){
    if(Math.hypot(x-nd.x,y-nd.y)<nd.r){
      initAudio();
      if(levelUnlocked(nd.idx))startLevel(nd.idx);
      /* Only the island immediately after the last cleared one can be opened
         with an ad. Every other locked island just refuses - tapping it used to
         offer a rental that could never be honoured, because the sequential
         rule only ever admits one ad-eligible island at a time. */
      else if(nd.idx===adEligibleLevel())askLevelUnlock(nd.idx);
      else sDeny();
      return;}}});
function drawStar(g,x,y,r,fill){
  g.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*0.45:r;
    const px=x+Math.cos(a)*rr2,py=y+Math.sin(a)*rr2;
    i?g.lineTo(px,py):g.moveTo(px,py);}
  g.closePath();
  g.fillStyle=fill?'#ffd166':'rgba(246,234,214,.18)';
  g.fill();}
