<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ================= CONFIG ================= */
const CFG={
  START_BALLOONS:3,
  PLAYER_RADIUS:24, PLAYER_MAX_SPEED:255, PLAYER_ACCEL:1550, PLAYER_FRICTION:0.90,
  BALLOON_RADIUS:19,
  BALLOON_ATTACH_D:[20,29,38],
  BALLOON_ATTACH_H:[18,26,32],
  BALLOON_ATTACH_S:[-18,0,18],
  BALLOON_MAX_DIST:55,
  BALLOON_FOLLOW_SPRING:40,
  BALLOON_FOLLOW_DAMPING:0.70,
  BALLOON_DASH_SPRING_MULT:1.8,
  BALLOON_FOLLOW_FF:1.0,
  BALLOON_BOB_SPEED:2.2, BALLOON_BOB_AMP:2.8,
  ATTACK_RADIUS:55, ATTACK_COOLDOWN:0.22,
  DASH_SPEED:650, DASH_DURATION:0.18, DASH_COOLDOWN:1.35, BUMP_FORCE:110,
  POWERUP_INTERVAL:7, POWERUP_MAX:2, POWERUP_RADIUS:20,
  SPEED_BOOST_DURATION:4, SPEED_BOOST_MULT:1.45,
  SHIELD_DURATION:6,
  PIN_LIFETIME:10, PIN_POWER_TIME:8, PIN_RESPAWN_DELAY:2.5, PIN_FIRST_DELAY:2,
  MAX_PARTICLES:200, HIT_STOP:0.055, POP_DUR:0.14
};
const TAU=Math.PI*2;
const PAL=[
  {main:'#EF4D3C',dark:'#A82C22',light:'#FF9B8A'},
  {main:'#F6B41E',dark:'#B07C0A',light:'#FFDF7E'},
  {main:'#3D8EE0',dark:'#20588F',light:'#8CC4F2'},
  {main:'#A05CD6',dark:'#6B349A',light:'#D3AAF0'}
];
/* THEME FONT. The game is chunky arcade-carnival: heavy, rounded, all-caps.
   "Luckiest Guy" is the house face already bundled for Egg Rush, so the two
   games read as one studio. It is loaded as a data-URI @font-face because
   <canvas> text never triggers a webfont load on its own - without the warm-up
   below every label silently renders in the fallback for the first seconds. */
const FONT='"Luckiest Guy","Trebuchet MS","Segoe UI",Verdana,sans-serif';
/* ================= UTILS ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function store(k,v){try{if(window.NativeBridge&&NativeBridge.setData){NativeBridge.setData(k,String(v));return;}}catch(e){}try{localStorage.setItem(k,String(v));}catch(e){}}
function load(k){try{if(window.NativeBridge&&NativeBridge.getData){const v=NativeBridge.getData(k);if(v!=null)return v;}}catch(e){}try{return localStorage.getItem(k);}catch(e){return null;}}
/* ================= AUDIO ================= */
/* AUDIO LEVELS.
   Two problems were reported: the game was inaudible, and sounds only fired on
   button taps rather than during play.

   - Master was 0.5 with per-voice peaks around 0.1-0.38, so the sum landed
     near 0.05-0.19 of full scale: far too quiet on a phone speaker. The master
     is now 1.0 and every voice was raised, so peaks approach but never exceed
     1.0 (which would clip). Compressor sits in front of the destination as a
     safety net for stacked voices.
   - Gameplay now speaks: pops, bumps, dashes, pickups, the pin, shields,
     eliminations and the victory sting were all already wired to events, and
     the attract/AI loop is muted so the intro stays quiet on purpose. */
const MASTER_VOL=1.0;
const SFX={
  ctx:null,master:null,noiseBuf:null,muted:load('bb_mute')==='1',lastT:{},
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ctx=new AC();this.master=this.ctx.createGain();
    /* Compressor before the destination: several voices can land on the same
       frame (a pop plus a bump), and without this they clip into crackle. */
    this.comp=this.ctx.createDynamicsCompressor();
    this.comp.threshold.value=-14;this.comp.knee.value=22;this.comp.ratio.value=6;
    this.comp.attack.value=0.004;this.comp.release.value=0.20;
    this.master.gain.value=this.muted?0:MASTER_VOL;
    this.master.connect(this.comp);this.comp.connect(this.ctx.destination);
    const len=(this.ctx.sampleRate*0.5)|0;this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=this.noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  },
  setMuted(m){this.muted=m;store('bb_mute',m?'1':'0');if(this.master)this.master.gain.value=m?0:MASTER_VOL;},
  ok(n,gap){
    /* attractSilent silences the AI-vs-AI intro demo WITHOUT touching the
       player's own mute setting (see attractEnter). */
    if(!this.ctx||this.muted||attractSilent)return false;
    const t=this.ctx.currentTime;
    if(this.lastT[n]&&t-this.lastT[n]<gap)return false;
    this.lastT[n]=t;return true;
  },
  tone(f0,f1,dur,type,vol,delay=0){
    if(!this.ctx)return;const t=this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(Math.max(f0,1),t);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.03);
  },
  noise(dur,vol,f0,f1,q=1,delay=0,type='bandpass'){
    if(!this.ctx)return;const t=this.ctx.currentTime+delay;
    const s=this.ctx.createBufferSource();s.buffer=this.noiseBuf;s.loop=true;
    const f=this.ctx.createBiquadFilter();f.type=type;f.Q.value=q;
    f.frequency.setValueAtTime(Math.max(f0,1),t);
    if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+0.03);
  },
  playUI(n){
    /* Menu / UI feedback. Deliberately NOT gated on attractSilent, so the start
       page is never silent: tapping PLAY or a toggle always clicks. Bypasses
       the rate limiter the gameplay voices share, so UI taps stay responsive. */
    if(!this.ctx||this.muted)return;
    switch(n){
      case 'click':this.tone(520,400,0.07,'square',0.5);break;
      case 'open':this.tone(420,760,0.12,'triangle',0.5);
                  this.tone(640,960,0.14,'sine',0.32,0.05);break;
      case 'toggle':this.tone(680,940,0.09,'triangle',0.5);break;
      case 'back':this.tone(700,420,0.11,'triangle',0.45);break;
    }
  },
  play(n){
    if(!this.ctx||this.muted||attractSilent)return;
    /* Volumes raised ~2.5x from the originals (which peaked around 0.1-0.38 and
       were inaudible on a phone speaker). The compressor downstream keeps
       stacked voices from clipping. */

function blobPath(g,cx,cy,hw,hh,rad){
  const L1=2*(hw-rad),L2=2*(hh-rad),AQ=rad*1.5708;
  const per=2*L1+2*L2+TAU*rad;
  g.beginPath();
  for(let i=0;i<=72;i++){
    let d=(i/72)*per,x,y;
    if(d<L1){x=-hw+rad+d;y=-hh;}
    else if((d-=L1)<AQ){const a=-1.5708+d/rad;x=hw-rad+Math.cos(a)*rad;y=-hh+rad+Math.sin(a)*rad;}
    else if((d-=AQ)<L2){x=hw;y=-hh+rad+d;}
    else if((d-=L2)<AQ){const a=d/rad;x=hw-rad+Math.cos(a)*rad;y=hh-rad+Math.sin(a)*rad;}
    else if((d-=AQ)<L1){x=hw-rad-d;y=hh;}
    else if((d-=L1)<AQ){const a=1.5708+d/rad;x=-hw+rad+Math.cos(a)*rad;y=hh-rad+Math.sin(a)*rad;}
    else if((d-=AQ)<L2){x=-hw;y=hh-rad-d;}
    else{const a=3.1416+(d-L2)/rad;x=-hw+rad+Math.cos(a)*rad;y=-hh+rad+Math.sin(a)*rad;}
    let nx=x,ny=y;const nl=Math.hypot(nx,ny)||1;nx/=nl;ny/=nl;
    const w=8+7*Math.sin(d*0.05+2.1)+5*Math.sin(d*0.023+0.7);
    const px=cx+x+nx*w,py=cy+y+ny*w;
    i?g.lineTo(px,py):g.moveTo(px,py);

function makePlayer(i,human,skill,x,y){

/* Spawn each seat at the corner of its OWN control zone so every player
   starts standing on their colored spawn pad, right at their joystick:
     P1 red    -> bottom-left      P2 yellow -> bottom-right
     P3 blue   -> top-left         P4 purple -> top-right
   (Solo uses the 4-corner list, so the human starts on their
   bottom-left joystick.) */
/* Spawn each seat clear of its own controls.
   These used to sit at the arena corners (0.14 / 0.86 of the arena), which is
   exactly where the joysticks and dash buttons are drawn - a player spawned
   UNDER its own joystick, half hidden and unreadable. The pads are now pulled
   toward the middle of each half so every character starts in the open, with
   only the outer edge near its controls. */
function spawnPoints(n){
  const P=(fx,fy)=>({x:AR.x+AR.w*fx,y:AR.y+AR.h*fy});
  if(n===2)return[P(.34,.62),P(.66,.62)];
  if(n===3)return[P(.34,.62),P(.66,.62),P(.34,.24)];
  return[P(.34,.62),P(.66,.62),P(.34,.24),P(.66,.24)];
}
/* Leaving a match: drop the banner (gameplay-only) and bring the attract match
   back up behind the menu, so returning to the intro is seamless. */
function backToMenu(){
  showBannerFor(false);
  clearGameplayInput();
  /* MENU from the results card is a genuine session break - the bout is over, so
     the interstitial belongs here (see exitToShell for why BACK does NOT get
     one). Guarded so it only fires when a match actually finished; if backToMenu
     is ever reached mid-bout there is no ad. */
  if(state==='ENDING')showInterstitialOnce();
  state='MENU';stateT=0;paused=false;showSettings=false;showModes=false;showHow=false;
  howToScroll=0;howToHoldId=-1;
  attractEnter();
}
/* STARTING A BOUT vs REPLAYING ONE - these are NOT the same thing and the ad
   policy differs.

   playWithAd()  - a FINISHED match. PLAY AGAIN / RESTART on the results card,
                   and MENU leading back to the title. The ad runs first and the
                   next step happens in its callback, so the player is never
                   dropped into a countdown behind an ad.

   startMatch()  - the title-screen PLAY button and the seat buttons behind it.
                   NO AD. Those are the "let me play" taps: the first action of
                   a session, and asking for an ad there is punishing someone
                   for starting the game. The same goes for the N PLAYER
                   preselect path, which is just a shortcut to the same title
                   PLAY button.

   The distinction is a deliberate reading of "no ad on PLAY": it means the
   start-page PLAY button and everything it leads to, not the results card. */
function playWithAd(np,solo){
  interstitialShown=false;          /* allow one per session-leg, not once ever */
  showInterstitial(function(){startMatch(np,solo);});
}
function startMatch(np,solo){
  requestMobileFullscreen();
  attractExit();
  showBannerFor(true);
  nPlayers=np;soloMode=solo;
  setupWorld();buildObstacles();buildPUSpots();
  players=[];
  if(solo){
    spawnPts=spawnPoints(4);
    players.push(makePlayer(0,true,aiSkill,spawnPts[0].x,spawnPts[0].y));
    for(let k=1;k<4;k++)players.push(makePlayer(k,false,clamp(aiSkill*rand(0.85,1.15),0.05,1),spawnPts[k].x,spawnPts[k].y));
  }else{
    spawnPts=spawnPoints(np);
    for(let k=0;k<np;k++)players.push(makePlayer(k,true,0,spawnPts[k].x,spawnPts[k].y));
  }
  renderBG();
  powerups=[];winner=null;elimCount=0;confetti=false;
  pin=null;pinHolder=null;pinOwnerId=-1;pinHoldT=0;pinSpawnT=CFG.PIN_FIRST_DELAY;
  resetParticles();
  shake=0;hitStop=0;
  buildZones();
  state='COUNTDOWN';stateT=0;cdNum=4;cdPop=0;paused=false;
}
/* ============ ZONES / INPUT ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â LOCKED SEAT-MAPPED SCREEN LAYOUT ============
   Anchors depend ONLY on zone count + seat index (slot), never on the
   player's world position:
     SOLO : joystick BOTTOM_LEFT, dash BOTTOM_RIGHT (thumbs split L/R)
     2P   : P1 BOTTOM_LEFT, P2 BOTTOM_RIGHT
     3P   : P1 BOTTOM_LEFT, P2 BOTTOM_RIGHT, P3 TOP_LEFT
     4P   : P1 BOTTOM_LEFT, P2 BOTTOM_RIGHT, P3 TOP_LEFT, P4 TOP_RIGHT
   Dash sits BESIDE its joystick (right for left-side seats, left for
   right-side seats), horizontally aligned, except SOLO (bottom-right). */
function buildZones(){
  zones=[];
  for(const p of players){if(!p.human)continue;zones.push({p,slot:zones.length,joyId:-1,dashId:-1,vx:0,vy:0,lx:0,ly:0,joyDX:0,joyDY:0,dashX:0,dashY:0,joyR:54,dashR:40});}
  layoutZones();
}
function layoutZones(){
  if(!zones.length)return;
  const w=cssW,h=cssH,ss=Math.min(w,h);
  readSafeInsets();
  const joyR=clamp(ss*0.075,42,64);
  const dashR=clamp(ss*0.055,34,50);
  const hM=Math.max(clamp(ss*0.035,14,30),safeL,safeR);
  const bM=Math.max(clamp(ss*0.065,28,50),safeB);
  const tM=Math.max(clamp(ss*0.045,20,36),safeT);
  const gap=clamp(ss*0.035,16,28);
  const c2c=joyR+gap+dashR;
  const n=zones.length;
  const botY=h-bM-joyR;
  const topY=tM+joyR;
  const lx=hM+joyR;
  const rx=w-hM-joyR;
  for(const z of zones){
    z.joyR=joyR;z.dashR=dashR;
    const s=z.slot;
    let jx,jy,dx,dy;
    if(n===1){
      jx=lx;jy=botY;
      dx=w-hM-dashR;dy=botY;
    }else if(s===0){
      jx=lx;jy=botY;dx=jx+c2c;dy=jy;
    }else if(s===1){
      jx=rx;jy=botY;dx=jx-c2c;dy=jy;
    }else if(s===2){
      jx=lx;jy=topY;dx=jx+c2c;dy=jy;
    }else{
      jx=rx;jy=topY;dx=jx-c2c;dy=jy;
    }
    z.joyDX=jx;z.joyDY=jy;z.dashX=dx;z.dashY=dy;
    if(z.joyId>=0)updJoy(z,z.lx,z.ly);
  }
}
function updJoy(z,x,y){
  z.lx=x;z.ly=y;
  const R=z.joyR*0.75;
  const dx=x-z.joyDX,dy=y-z.joyDY;
  const len=Math.hypot(dx,dy);
  if(len<10){z.vx=0;z.vy=0;return;}
  const cl=Math.min(len,R);
  z.vx=(dx/len)*(cl/R);z.vy=(dy/len)*(cl/R);
}
function releasePtr(id){
  for(const z of zones){
    if(z.joyId===id){z.joyId=-1;z.vx=0;z.vy=0;}
    if(z.dashId===id)z.dashId=-1;
  }
}
function clearGameplayInput(){
  for(const z of zones){z.joyId=-1;z.dashId=-1;z.vx=0;z.vy=0;}
}
function hitUI(x,y){
  /* REVERSE order. Buttons are pushed in draw order, and a panel pushes its
     buttons AFTER the menu's BACK / settings / PLAY row. Iterating forward let
     the always-present menu buttons underneath win, so a tap on a panel
     toggle fell through to PLAY or HOW TO PLAY - and the toggles never
     responded. The LAST match is the topmost thing drawn, so that is the one
     the player meant to hit. */
  for(let i=uiBtns.length-1;i>=0;i--){
    const b=uiBtns[i];
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){SFX.playUI('click');b.act();return true;}
  }
  return false;
}
/* SOUND FROM THE MOMENT THE GAME OPENS.
   Browsers refuse to start an AudioContext without a user gesture, so audio is
   kicked off as early as the platform allows - on load, and again on the first
   pointer/key event. Previously init() was only called inside onDown(), so the
   very first tap produced NO sound: that same tap was what created the context,
   and the player concluded the game was silent. */
function kickAudio(){
  SFX.init();
  if(SFX.ctx&&SFX.ctx.state==='suspended')SFX.ctx.resume().catch(()=>{});
}
window.addEventListener('pointerdown',kickAudio,{passive:true});
window.addEventListener('keydown',kickAudio,{passive:true});
window.addEventListener('touchstart',kickAudio,{passive:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden)kickAudio();});
kickAudio();
function onDown(e){
  kickAudio();
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  const x=e.clientX,y=e.clientY;
  if(rotateBlock)return;
  if(paused){hitUI(x,y);return;}
  if(state==='MENU'||state==='RESULT'){
    /* While a panel is open it OWNS the screen: a tap either hits a panel
       button (topmost wins) or is swallowed by the scrim and closes it. It must
       never fall through to the menu row underneath. */
    if(showModes||showHow||showSettings){
      /* Holding on the HOW TO PLAY panel scrolls it, so all eight rules are
         reachable. Releasing keeps it open; a plain tap on the scrim (no hold)
         dismisses. */
      if(showHow&&!hitUI(x,y)){howToHoldId=e.pointerId;howToScroll+=18;}
      else if(!hitUI(x,y)){
        SFX.playUI('click');
        showModes=false;showHow=false;showSettings=false;
      }
      return;
    }
    hitUI(x,y);return;
  }
  if(d2(x,y,sysPause.x,sysPause.y)<(sysPause.r+8)*(sysPause.r+8)){SFX.play('click');Game.pause();return;}
  if(d2(x,y,sysMute.x,sysMute.y)<(sysMute.r+8)*(sysMute.r+8)){setSound(SFX.muted);return;}
  if(state!=='PLAYING'&&state!=='COUNTDOWN')return;
  for(const z of zones){const p=z.p;if(!p||p.eliminated)continue;
    const tr=z.dashR*1.25+8;
    if(d2(x,y,z.dashX,z.dashY)<tr*tr){z.dashId=e.pointerId;tryDash(p);return;}}
  for(const z of zones){const p=z.p;if(!p||p.eliminated)continue;
    const tr=z.joyR*1.35+8;
    if(d2(x,y,z.joyDX,z.joyDY)<tr*tr){z.joyId=e.pointerId;updJoy(z,x,y);return;}}
}
function onMove(e){
  if(paused||state==='MENU'||state==='RESULT')return;
  for(const z of zones)if(z.joyId===e.pointerId)updJoy(z,e.clientX,e.clientY);
}
function onUp(e){if(howToHoldId===e.pointerId)howToHoldId=-1;releasePtr(e.pointerId);}
const keys={};let kbDash1=false,kbDash2=false;
/* ================= COMBAT / PIN ================= */
function tryDash(p){
  if(p.dashCD>0||p.eliminated||!isSimLive())return;
  let dx=p.jx,dy=p.jy;const m=Math.hypot(dx,dy);
  if(m<0.25){dx=p.facX;dy=p.facY;}else{dx/=m;dy/=m;}
  p.ddx=dx;p.ddy=dy;p.dashT=CFG.DASH_DURATION;p.dashCD=CFG.DASH_COOLDOWN;
  SFX.play('dash');shake=Math.max(shake,2.5);
  dustPuff(p.x-dx*p.r,p.y,4);
}
function tryAttack(p){
  if(pinHolder!==p)return;
  let best=null,bd=1e18,bq=null,bi=0;
  const rr2=(CFG.ATTACK_RADIUS+CFG.BALLOON_RADIUS)**2;
  for(const q of players){
    if(q===p||q.eliminated)continue;
    for(let i=0;i<q.balloons.length;i++){const b=q.balloons[i];if(!b.alive)continue;
      const dd=d2(p.x,p.y,b.x,b.y);
      if(dd<rr2&&dd<bd){bd=dd;best=b;bq=q;bi=i;}}}
  if(!best)return;
  p.atkCD=CFG.ATTACK_COOLDOWN;
  if(bq.shieldT>0){
    bq.shieldT=0;SFX.play('shield');
    spawnP({type:3,x:bq.x,y:bq.y,r0:14,r1:70,color:'rgba(120,230,255,0.95)',life:0.35});
    for(let i=0;i<6;i++){const a=rand(0,TAU);spawnP({type:4,x:bq.x,y:bq.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,size:5,color:'#8CE8FF',life:0.4});}
    floater(bq.x,bq.y-bq.r*2.4,'BLOCKED!','#7ADCFF',16);
    return;
  }
  popBalloon(bq,bi,p);
}
function popBalloon(q,i,attacker){
  const b=q.balloons[i];if(!b.alive)return;
  b.alive=false;b.popping=true;b.popT=CFG.POP_DUR;
  q.balloonsLeft--;if(attacker)attacker.pops++;
  q.hurtT=0.5;
  popBurst(b.x,b.y,PAL[q.ci].main);
  shake=Math.max(shake,3.2);hitStop=CFG.HIT_STOP;
  SFX.play('pop');
  floater(b.x,b.y-20,'POP!','#FFFFFF',15);
  if(q.balloonsLeft<=0)eliminatePlayer(q);
  checkWin();
}
function eliminatePlayer(q){
  q.eliminated=true;q.vx=0;q.vy=0;
  if(pinHolder===q){pinHolder=null;pinOwnerId=-1;pinSpawnT=1.2;}
  const slot=elimCount++;
  q.specX=WORLD_W*(0.3+0.133*slot);q.specY=AR.y-32;

}
/* One predicate for "is the world actually simulating". The menu keeps
   state==='MENU' (so render() draws the menu) while the attract match runs, so
   every system that used to test `state==='PLAYING'` directly now asks this
   instead. Without it the AI, balloons, attacks and the pin are all skipped on
   the intro and the background sits dead still. */
function isSimLive(){return state==='PLAYING'||(attract&&state==='MENU');}
function checkWin(){
  if(!isSimLive())return;
  /* Never let the attract match push the game into ENDING/RESULT - that would
     replace the menu with a victory screen. attractStep() watches `winner`
     itself and simply restarts. */
  if(attract)return;
  const alive=players.filter(p=>!p.eliminated);
  if(alive.length===1){
    winner=alive[0];winner.joy=true;
    state='ENDING';stateT=0;confetti=true;
    pin=null;pinHolder=null;pinOwnerId=-1;
    SFX.play('victory');
  }else if(alive.length===0){
    winner=null;state='ENDING';stateT=0;confetti=false;
    pin=null;pinHolder=null;pinOwnerId=-1;
  }
}
function spawnPin(){
  for(let t=0;t<14;t++){

    if(players.some(p=>!p.eliminated&&d2(p.x,p.y,s.x,s.y)<180*180))continue;
    if(powerups.some(u=>d2(u.x,u.y,s.x,s.y)<140*140))continue;
    pin={x:s.x,y:s.y,phase:rand(0,TAU),life:CFG.PIN_LIFETIME,born:simT};
    rings.push({x:s.x,y:s.y,t:0,dur:0.5,r1:70,col:'#FFC93C'});
    SFX.play('pin');
    floater(s.x,s.y-64,'PIN!','#FFC93C',18);

  pinSpawnT=1.0;

/* ================= POWER-UPS ================= */
const PU_TYPES=[

function spawnPU(){

function collectPU(p,pu,idx){

/* ================= AI (unchanged) ================= */
function aiUpdate(p,dt){
  p.jx=0;p.jy=0;
  if(!isSimLive())return;
  const sk=p.skill;
  p.aiT-=dt;
  if(p.aiT<=0){
    p.aiT=lerp(0.45,0.13,sk)+rand(0,0.08);
    let ne=null,nd=1e18;
    for(const q of players){if(q===p||q.eliminated)continue;const dd=d2(p.x,p.y,q.x,q.y);if(dd<nd){nd=dd;ne=q;}}
    let npu=null,pd=1e18;
    for(const u of powerups){const dd=d2(p.x,p.y,u.x,u.y);if(dd<pd){pd=dd;npu=u;}}
    let mode='roam';
    if(pin){
      const holderThreat=pinHolder&&pinHolder!==p&&!pinHolder.eliminated&&pinHolder===ne&&nd<240*240;
      if(holderThreat&&Math.random()<0.4+sk*0.5)mode='flee';
      else mode='pin';
    }else if(pinHolder===p){
      mode='attack';
    }else if(pinHolder&&!pinHolder.eliminated){
      mode='flee';
    }else if(ne&&nd<170*170&&Math.random()<0.5+sk*0.4){
      mode='flee';
    }else if(npu&&pd<(160+sk*180)**2&&Math.random()<0.4+sk*0.5){
      mode='pu';
    }
    if(mode==='pin'){
      p.aiTX=pin.x+rand(-1,1)*(1-sk)*24;
      p.aiTY=pin.y+rand(-1,1)*(1-sk)*24;
      p.fleeing=false;
      const dp=Math.sqrt(d2(p.x,p.y,pin.x,pin.y))||1;
      if(p.dashCD<=0&&dp>190&&Math.random()<sk*0.6){
        p.jx=(pin.x-p.x)/dp;p.jy=(pin.y-p.y)/dp;tryDash(p);}
    }else if(mode==='flee'){
      const src=(pinHolder&&!pinHolder.eliminated&&pinHolder!==p)?pinHolder:ne;
      if(src){
        const d=Math.sqrt(d2(p.x,p.y,src.x,src.y))||1;
        p.aiTX=clamp(p.x+(p.x-src.x)/d*300,AR.x+40,AR.x+AR.w-40);
        p.aiTY=clamp(p.y+(p.y-src.y)/d*300,AR.y+40,AR.y+AR.h-40);
        p.fleeing=true;
        if(p.dashCD<=0&&Math.random()<sk*0.8){
          p.jx=(p.x-src.x)/d;p.jy=(p.y-src.y)/d;tryDash(p);}
      }
    }else if(mode==='attack'){
      p.fleeing=false;
      let tgt=null,bs=1e18;
      for(const q of players){if(q===p||q.eliminated)continue;
        for(const b of q.balloons){if(!b.alive)continue;
          const s=d2(p.x,p.y,b.x,b.y)-d2(q.x,q.y,b.x,b.y)*0.6;
          if(s<bs){bs=s;tgt=b;}}}
      if(tgt){
        p.aiTX=tgt.x+tgt.vx*0.22+rand(-1,1)*(1-sk)*40;
        p.aiTY=tgt.y+tgt.vy*0.22+rand(-1,1)*(1-sk)*40;
        const dbt=Math.sqrt(d2(p.x,p.y,tgt.x,tgt.y))||1;
        if(p.dashCD<=0&&dbt>150&&dbt<430&&Math.random()<sk*0.55){
          p.jx=(tgt.x-p.x)/dbt;p.jy=(tgt.y-p.y)/dbt;tryDash(p);}
      }
    }else if(mode==='pu'){
      p.aiTX=npu.x;p.aiTY=npu.y;p.fleeing=false;
    }else{
      const a=rand(0,TAU);
      p.aiTX=WORLD_W/2+Math.cos(a)*rand(80,300);
      p.aiTY=WORLD_H/2+Math.sin(a)*rand(60,220);
      p.fleeing=false;
    }
  }
  let dx=p.aiTX-p.x,dy=p.aiTY-p.y;const d=Math.hypot(dx,dy);
  if(d>14){
    dx/=d;dy/=d;
    for(const o of obstacles){
      const dd=d2(p.x,p.y,o.x,o.y),rrr=o.r+p.r+34;
      if(dd<rrr*rrr){
        const dl=Math.sqrt(dd)||1,ox=(p.x-o.x)/dl,oy=(p.y-o.y)/dl;
        if(ox*dx+oy*dy>0.3){dx+=ox*0.9-oy*0.6;dy+=oy*0.9+ox*0.6;const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;}
      }
    }
    const mg=60;
    if(p.x<AR.x+mg)dx+=0.8;if(p.x>AR.x+AR.w-mg)dx-=0.8;
    if(p.y<AR.y+mg)dy+=0.8;if(p.y>AR.y+AR.h-mg)dy-=0.8;
    const m=Math.hypot(dx,dy)||1;
    const th=clamp(d/70,0.35,1)*(p.fleeing?1:0.9);
    p.jx=dx/m*th;p.jy=dy/m*th;
  }
}
/* ================= SIMULATION ================= */
function collideWorld(p){
  const pad=p.r+4;
  p.x=clamp(p.x,AR.x+pad,AR.x+AR.w-pad);
  p.y=clamp(p.y,AR.y+pad,AR.y+AR.h-pad);
  for(const o of obstacles){
    const rr2=p.r+o.r,dd=d2(p.x,p.y,o.x,o.y);
    if(dd<rr2*rr2&&dd>0.01){
      const d=Math.sqrt(dd),nx=(p.x-o.x)/d,ny=(p.y-o.y)/d;
      p.x=o.x+nx*rr2;p.y=o.y+ny*rr2;
      const vn=p.vx*nx+p.vy*ny;
      if(vn<0){p.vx-=vn*nx*1.4;p.vy-=vn*ny*1.4;
        if(vn<-260){SFX.play('bump');dustPuff(p.x,p.y,3);}}
    }
  }
}
function backDir(p){
  const spd=Math.hypot(p.vx,p.vy);
  if(spd<25)return[-p.facX,-p.facY];
  return[-p.vx/spd,-p.vy/spd];
}
function updBalloonPhysics(p,dt){
  const k=persp(p.y);
  const [bx,by]=backDir(p);
  const D=CFG.BALLOON_ATTACH_D,H=CFG.BALLOON_ATTACH_H,S=CFG.BALLOON_ATTACH_S;
  const spring=CFG.BALLOON_FOLLOW_SPRING*(p.dashT>0?CFG.BALLOON_DASH_SPRING_MULT:1);
  const dmpBase=p.dashT>0?0.62:CFG.BALLOON_FOLLOW_DAMPING;
  let rank=0;
  for(let i=0;i<p.balloons.length;i++){
    const b=p.balloons[i];
    if(!b.alive){if(b.popping){b.popT-=dt;if(b.popT<=0)b.popping=false;}continue;}
    const bob=Math.sin(simT*CFG.BALLOON_BOB_SPEED+b.phase)*CFG.BALLOON_BOB_AMP;
    const tx=p.x+bx*D[rank]+S[rank]*k;
    const ty=p.y+by*D[rank]*0.5-H[rank]*k+bob;
    b.vx+=((tx-b.x)*spring+p.vx*CFG.BALLOON_FOLLOW_FF)*dt;
    b.vy+=((ty-b.y)*spring+p.vy*CFG.BALLOON_FOLLOW_FF)*dt;
    const dmp=Math.pow(dmpBase,dt*60);
    b.vx*=dmp;b.vy*=dmp;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.x=clamp(b.x,36,WORLD_W-36);b.y=clamp(b.y,28,WORLD_H-24);
    const rdx=b.x-p.x,rdy=b.y-p.y;
    const rdd=Math.sqrt(rdx*rdx+rdy*rdy);
    if(rdd>CFG.BALLOON_MAX_DIST){
      const s=CFG.BALLOON_MAX_DIST/rdd;
      b.x=p.x+rdx*s;b.y=p.y+rdy*s;
      const nx=rdx/rdd,ny=rdy/rdd;
      const vn=b.vx*nx+b.vy*ny;
      if(vn>0){b.vx-=vn*nx;b.vy-=vn*ny;}
    }
    rank++;
  }
}
function updPlayer(p,dt){
  p.dashCD=Math.max(0,p.dashCD-dt);p.atkCD=Math.max(0,p.atkCD-dt);
  p.hurtT=Math.max(0,p.hurtT-dt);
  p.speedT=Math.max(0,p.speedT-dt);p.shieldT=Math.max(0,p.shieldT-dt);
  p.blink-=dt;if(p.blink<-0.13)p.blink=rand(2.4,5.5);
  if(p.eliminated){
    const f=1-Math.pow(0.02,dt);
    p.x+=(p.specX-p.x)*f;p.y+=(p.specY-p.y)*f;
    p.walk+=dt*7;
    updBalloonPhysics(p,dt);return;
  }
  if(!isSimLive()){updBalloonPhysics(p,dt);return;}
  const m=Math.hypot(p.jx,p.jy);
  const spMul=p.speedT>0?CFG.SPEED_BOOST_MULT:1;
  if(p.dashT>0){
    p.dashT-=dt;
    p.vx=p.ddx*CFG.DASH_SPEED;p.vy=p.ddy*CFG.DASH_SPEED;
    p.trailT-=dt;
    if(p.trailT<=0){p.trailT=0.022;
      spawnP({type:5,x:p.x,y:p.y-p.r,size:p.r*0.95,color:PAL[p.ci].main,life:0.28});}
    if(p.dashT<=0){p.vx=p.ddx*CFG.PLAYER_MAX_SPEED*0.7;p.vy=p.ddy*CFG.PLAYER_MAX_SPEED*0.7;}
  }else{
    p.vx+=p.jx*CFG.PLAYER_ACCEL*dt;p.vy+=p.jy*CFG.PLAYER_ACCEL*dt;
    if(m<0.05){const f=Math.pow(0.8,dt*60);p.vx*=f;p.vy*=f;}
    else{const f=Math.pow(CFG.PLAYER_FRICTION,dt*60);p.vx*=f;p.vy*=f;}
    const spd=Math.hypot(p.vx,p.vy),mx=CFG.PLAYER_MAX_SPEED*spMul;
    if(spd>mx){p.vx*=mx/spd;p.vy*=mx/spd;}
  }
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  collideWorld(p);
  const spd=Math.hypot(p.vx,p.vy);
  if(spd>30){p.facX=p.vx/spd;p.facY=p.vy/spd;}
  p.walk+=spd*dt*0.06;
  if(spd>210&&Math.random()<dt*8)dustPuff(p.x,p.y+p.r*0.3,1);
  if(p.speedT>0&&spd>150&&Math.random()<dt*18)
    spawnP({type:5,x:p.x,y:p.y-p.r,size:p.r*0.7,color:'#FFD24A',life:0.25});
  updBalloonPhysics(p,dt);
  if(pinHolder===p&&p.atkCD<=0)tryAttack(p);
  if(pin&&d2(p.x,p.y,pin.x,pin.y)<(p.r+26)*(p.r+26))collectPin(p);
  for(let i=powerups.length-1;i>=0;i--){const u=powerups[i];
    if(d2(p.x,p.y,u.x,u.y-26)<(p.r+CFG.POWERUP_RADIUS+6)**2)collectPU(p,u,i);}
}
function bumpPass(){
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j];
    if(a.eliminated||b.eliminated)continue;
    const rr2=a.r*2,dd=d2(a.x,a.y,b.x,b.y);
    if(dd<rr2*rr2&&dd>0.01){
      const d=Math.sqrt(dd),nx=(b.x-a.x)/d,ny=(b.y-a.y)/d,ov=(rr2-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const boost=(a.dashT>0||b.dashT>0)?1.7:1;
      const imp=CFG.BUMP_FORCE*boost;
      a.vx-=nx*imp;a.vy-=ny*imp;b.vx+=nx*imp;b.vy+=ny*imp;
      if(boost>1)shake=Math.max(shake,3);
      SFX.play('bump');
      dustPuff((a.x+b.x)/2,(a.y+b.y)/2,3);
    }
  }
}
function mapInput(){
  for(const p of players){
    if(!p.human)continue;
    p.jx=0;p.jy=0;
    for(const z of zones)if(z.p===p&&z.joyId>=0){p.jx=z.vx;p.jy=z.vy;}
    if(p.jx===0&&p.jy===0){
      if(p.id===1){
        if(keys.KeyW)p.jy-=1;if(keys.KeyS)p.jy+=1;
        if(keys.KeyA)p.jx-=1;if(keys.KeyD)p.jx+=1;
      }else if(p.id===2){
        if(keys.ArrowUp)p.jy-=1;if(keys.ArrowDown)p.jy+=1;
        if(keys.ArrowLeft)p.jx-=1;if(keys.ArrowRight)p.jx+=1;
      }
      const m=Math.hypot(p.jx,p.jy);if(m>1){p.jx/=m;p.jy/=m;}
    }
    if(p.id===1){const d=keys.Space||keys.KeyE;if(d&&!kbDash1)tryDash(p);kbDash1=d;}
    if(p.id===2){const d=keys.Enter||keys.ShiftRight;if(d&&!kbDash2)tryDash(p);kbDash2=d;}
  }
}
function update(sdt,dt){
  simT+=sdt;
  for(const c of clouds){c.x+=c.sp*dt;if(c.x>WORLD_W+160)c.x=-160;}
  switch(state){
    case 'MENU':
      /* The intro runs a real 4-AI match behind the menu, forever. */
      if(attract)attractStep(sdt);
      /* Auto-scroll the HOW TO PLAY panel while a finger is held on it. */
      if(showHow&&howToHoldId>=0)howToScroll+=26*sdt;
      for(const b of menuB){b.y-=0.045*b.s*dt;if(b.y<-0.12){b.y=1.12;b.x=Math.random();}}
      break;
    case 'COUNTDOWN':{
      const n=stateT<3?3-Math.floor(stateT):0;
      if(n!==cdNum){cdNum=n;cdPop=0.3;if(n>0)SFX.play('tick');else SFX.play('go');}
      cdPop=Math.max(0,cdPop-dt);
      for(const p of players)updPlayer(p,sdt);
      updParticles(sdt);
      if(stateT>=3.5){state='PLAYING';stateT=0;}
      break;}
    case 'PLAYING':
      pinSpawnT-=sdt;
      if(!pin&&!pinHolder&&pinSpawnT<=0)spawnPin();
      if(pin){
        pin.life-=sdt;
        if(pin.life<=0){pin=null;pinSpawnT=CFG.PIN_RESPAWN_DELAY;SFX.play('pinlost');}
        else if(Math.random()<sdt*5)
          spawnP({type:4,x:pin.x+rand(-14,14),y:pin.y-30+rand(-10,10),vx:rand(-20,20),vy:rand(-40,-10),size:4,color:'#FFE08A',life:0.5,vr:6});
      }
      if(pinHolder){
        pinHoldT-=sdt;
        if(pinHoldT<=0){
          floater(pinHolder.x,pinHolder.y-pinHolder.r*3,'PIN EXPIRED','#c9c9c9',15);
          pinHolder=null;pinOwnerId=-1;pinSpawnT=CFG.PIN_RESPAWN_DELAY;
          SFX.play('pinlost');
        }
      }
      puT-=sdt;
      if(puT<=0){puT=CFG.POWERUP_INTERVAL*rand(0.85,1.2);spawnPU();}
      mapInput();
      for(const p of players){if(!p.human)aiUpdate(p,sdt);}
      for(const p of players)updPlayer(p,sdt);
      bumpPass();
      updFX(sdt);updParticles(sdt);
      break;
    case 'ENDING':
      updFX(sdt);updParticles(sdt);
      for(const p of players)updPlayer(p,sdt);
      if(confetti&&Math.random()<sdt*22)
        spawnP({type:6,x:rand(0,WORLD_W),y:-10,vx:rand(-40,40),vy:rand(40,120),g:150,size:rand(4,7),
          color:PAL[(Math.random()*4)|0].main,life:rand(1.5,2.6),rot:rand(0,TAU),vr:rand(-6,6)});
      if(stateT>1.6){state='RESULT';stateT=0;}
      break;
    case 'RESULT':
      updFX(sdt);updParticles(sdt);
      if(winner&&Math.random()<sdt*16)
        spawnP({type:6,x:rand(0,WORLD_W),y:-10,vx:rand(-40,40),vy:rand(40,120),g:150,size:rand(4,7),
          color:PAL[(Math.random()*4)|0].main,life:rand(1.5,2.6),rot:rand(0,TAU),vr:rand(-6,6)});
      break;
  }
  shake=Math.max(0,shake-dt*11);
}
let puT=3.5;
function updFX(sdt){
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=sdt;if(rings[i].t>=rings[i].dur)rings.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.life-=sdt;f.y-=30*sdt;if(f.life<=0)floaters.splice(i,1);}
}
function updParticles(dt){
  for(const q of POOL){
    if(!q.on)continue;
    q.life-=dt;
    if(q.life<=0){q.on=false;continue;}
    q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;
  }
}
/* ================= DRAW: WORLD ================= */
function drawCharBody(g,p){
  const C=PAL[p.ci],r=p.r;
  const spd=Math.hypot(p.vx,p.vy),moving=spd>40;
  const bob=Math.sin(simT*2.2+p.id*1.7)*1.5+(moving?-Math.abs(Math.sin(p.walk))*3.2:0);
  const lean=clamp(p.vx*0.0012,-0.24,0.24)+(p.dashT>0?p.ddx*0.3:0);
  let sx=1,sy=1+(moving?Math.sin(p.walk*2)*0.045:Math.sin(simT*2.2+p.id)*0.02);
  if(p.dashT>0){sx=1.16;sy=0.87;}
  g.save();g.translate(0,bob);g.rotate(lean);g.scale(sx,sy);
  const st=moving?Math.sin(p.walk)*r*0.3:0;
  g.fillStyle=C.dark;
  ell(g,-r*0.42+st,-2,r*0.26,r*0.16);g.fill();
  ell(g,r*0.42-st,-2,r*0.26,r*0.16);g.fill();
  const as=moving?Math.sin(p.walk+Math.PI)*r*0.16:Math.sin(simT*2.2+p.id)*r*0.05;
  g.fillStyle=C.main;g.strokeStyle=C.dark;g.lineWidth=2;
  ell(g,-r*0.92,-r*1.05+as,r*0.2,r*0.24);g.fill();g.stroke();
  ell(g,r*0.92,-r*1.05-as,r*0.2,r*0.24);g.fill();g.stroke();
  const gr=g.createLinearGradient(0,-r*2.15,0,0);
  gr.addColorStop(0,C.light);gr.addColorStop(0.45,C.main);gr.addColorStop(1,C.dark);
  ell(g,0,-r*1.02,r,r*1.16);g.fillStyle=gr;g.fill();
  g.strokeStyle=C.dark;g.lineWidth=2.5;g.stroke();
  ell(g,0,-r*0.62,r*0.6,r*0.58);g.fillStyle='rgba(255,255,255,0.32)';g.fill();
  const fx=clamp(p.facX,-1,1)*r*0.1,fy=clamp(p.facY,-1,1)*r*0.06;
  const blink=p.blink<0?0.15:1;
  for(const s of[-1,1]){
    ell(g,s*r*0.3+fx,-r*1.42+fy,r*0.16,r*0.19*blink);
    g.fillStyle='#fff';g.fill();g.strokeStyle='rgba(0,0,0,0.15)';g.lineWidth=1;g.stroke();

  }

  else if(mood==='sad'){g.beginPath();g.arc(fx,-r*0.92,r*0.18,Math.PI*1.15,Math.PI*1.85);g.stroke();}
  else if(mood==='joy'){g.fillStyle='#5b2b20';g.beginPath();g.arc(fx,-r*1.12,r*0.2,Math.PI*0.1,Math.PI*0.9);g.closePath();g.fill();
    for(const s of[-1,1]){g.beginPath();g.arc(s*r*0.3+fx,-r*1.46,r*0.11,Math.PI,TAU);g.stroke();}}
  else{g.beginPath();g.arc(fx,-r*1.14,r*0.2,Math.PI*0.15,Math.PI*0.85);g.stroke();}
  g.restore();

  g.strokeStyle='rgba(80,50,30,0.9)';g.lineWidth=2;
  g.beginPath();g.moveTo(px,-r*1.9);g.lineTo(px,top);g.stroke();
  g.fillStyle=C.main;g.strokeStyle=C.dark;g.lineWidth=1.5;

function drawPl(p){
  const k=persp(p.y);
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,0.25)';ell(ctx,0,2,p.r*1.05*k,p.r*0.4*k);ctx.fill();
  ctx.scale(k,k);
  if(p.eliminated)ctx.globalAlpha=0.55;
  if(pinHolder===p&&!p.eliminated){
    const C=PAL[p.ci];
    const a=0.35+Math.sin(simT*6)*0.15;
    ctx.globalAlpha=a;
    ctx.strokeStyle=C.main;ctx.lineWidth=4;
    ell(ctx,0,-p.r,p.r*1.8,p.r*1.95);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* SHIELD BUBBLE - a rounded dome around the BALLOON CLUSTER.
     The balloons are the thing worth protecting, and they trail BEHIND the
     character, so the dome is built from the real balloon positions: their
     centroid, plus a radius that reaches the outermost one. Two earlier
     versions were wrong:
       1) it used p.y inside ctx.translate(p.x,p.y), so the world Y was added
          twice and the dome landed down in FRONT of the player;
       2) a fixed offset ignored that the cluster swings around behind the
          player as they turn.
     Drawn here, before drawCharBody, so the character is never covered. */
  if(p.shieldT>0&&!p.eliminated){
    const fade=Math.min(1,p.shieldT/1.0);
    const pulse=0.5+0.5*Math.sin(simT*5);
    /* Centroid + reach of the live balloons, in the same translated space as
       the character. dead ones are ignored so the dome shrinks as they pop. */
    let n=0,cx=0,cy=0;
    for(const b of p.balloons){
      if(!b.alive||b.popping)continue;
      cx+=b.x-p.x; cy+=(b.y-p.y)/k; n++;
    }
    let ox,oy,rad;
    if(n>0){
      cx/=n; cy/=n;
      rad=0;
      for(const b of p.balloons){
        if(!b.alive||b.popping)continue;
        const ddx=b.x-p.x-cx, ddy=((b.y-p.y)/k)-cy;
        const d=Math.hypot(ddx,ddy)+b.r+4;   /* +b.r so the dome wraps the balloon body */
        if(d>rad)rad=d;
      }
    }else{
      /* No live balloons: park it just above the head so it is still visible
         (you are shielded, just not carrying anything). */
      ox=0; oy=-p.r*0.9; rad=p.r*0.8;
    }
    if(n>0){ ox=cx; oy=cy; }
    /* Never smaller than a token dome, never absurdly large. */
    rad=clamp(rad,p.r*0.75,p.r*2.1);
    ctx.save();
    ctx.globalAlpha=0.30*fade;
    const gg=ctx.createRadialGradient(ox,oy-rad*0.35,rad*0.15,ox,oy,rad*1.25);
    gg.addColorStop(0,'rgba(150,235,255,0.55)');
    gg.addColorStop(1,'rgba(60,170,230,0.03)');
    ctx.fillStyle=gg;
    ell(ctx,ox,oy,rad*1.02,rad*1.06);ctx.fill();
    ctx.globalAlpha=(0.6+0.3*pulse)*fade;
    ctx.strokeStyle='#9BE9FF';ctx.lineWidth=2.6;
    ell(ctx,ox,oy,rad,rad*1.04);ctx.stroke();
    /* travelling highlight so it reads as a rounded dome, not a flat ring */
    ctx.globalAlpha=0.5*fade;
    ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.8;
    ell(ctx,ox,oy-Math.sin(simT*5)*rad*0.42,rad*0.55,rad*0.28);ctx.stroke();
    ctx.restore();
  }
  /* SPEED MOTION TRAIL. Speed was applied silently, so a boosted player looked
     identical to a normal one. Chevrons behind them make it obvious - to the
     player AND to anyone chasing, which matters because speed makes you a
     visible target. */
  if(p.speedT>0&&!p.eliminated){
    const fade=Math.min(1,p.speedT/1.0);
    const sp0=Math.hypot(p.vx,p.vy);
    if(sp0>40){
      const ux=p.vx/sp0,uy=p.vy/sp0;
      for(let i=0;i<3;i++){
        const back=(i+1)*9+((simT*90)%9);
        const bx=p.x-ux*back, by=p.y-uy*back;
        ctx.save();
        ctx.globalAlpha=(0.45-i*0.12)*fade;
        ctx.strokeStyle='#FFD24A';ctx.lineWidth=3;ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(bx-ux*8-uy*7,by-uy*8+ux*7);
        ctx.lineTo(bx+ux*3,by+uy*3);
        ctx.lineTo(bx-ux*8+uy*7,by-uy*8-ux*7);
        ctx.stroke();
        ctx.restore();
      }
    }
  }
  drawCharBody(ctx,p);
  ctx.globalAlpha=1;
  ctx.restore();
  /* ---- POWER-UP / PIN STATUS RING ----------------------------------------
     The old status was a bare ring with a tiny icon, easy to miss and easy to
     misread. Now each active power is a labelled chip ABOVE the head: a pill
     with the power's icon, its name, and a depleting timer bar. The PIN is
     first and loudest because it changes the game for everyone. */
  const badges=[];
  if(pinHolder===p&&!p.eliminated)badges.push({k:'pin',t:pinHoldT/CFG.PIN_POWER_TIME,name:'PIN',col:PAL[p.ci].main});
  if(p.shieldT>0)badges.push({k:'shield',t:p.shieldT/CFG.SHIELD_DURATION,name:'SHIELD',col:'#4AD6FF'});
  if(p.speedT>0)badges.push({k:'speed',t:p.speedT/CFG.SPEED_BOOST_DURATION,name:'SPEED',col:'#FFD24A'});
  if(badges.length){
    const scale=k;
    const bh=17*scale;
    /* Each pill is stacked, and each is sized to ITS OWN label, so a long
       "SHIELD" chip never clips. The width is computed inside the loop because
       it depends on bd - computing it outside threw "bd is not defined", which
       killed render() and wiped the whole UI off the screen. */
    let by=p.y-(p.r*2.6+30)*k-badges.length*(bh+4*scale);
    for(const bd of badges){
      const bw=Math.max(30,Math.min(62,24+bd.name.length*6.4))*scale;
      const bx=p.x-bw/2;
      ctx.save();
      /* pill plate */
      ctx.fillStyle='rgba(20,14,26,0.72)';
      rr(ctx,bx,by,bw,bh,bh/2);ctx.fill();
      ctx.strokeStyle=bd.col;ctx.lineWidth=2.2*scale;
      rr(ctx,bx,by,bw,bh,bh/2);ctx.stroke();
      /* icon */
      ctx.save();
      ctx.translate(bx+9*scale,by+bh/2);
      drawPUIcon(ctx,bd.k,11*scale);
      ctx.restore();
      /* name */
      txt(ctx,bd.name,bx+18*scale,by+bh/2,Math.min(11,bh*0.62),bd.col,'left');
      /* depleting timer bar along the bottom of the pill */
      const barW=(bw-4*scale),barH=2.6*scale;
      const f=Math.max(0,Math.min(1,bd.t));
      ctx.fillStyle='rgba(255,255,255,0.22)';
      rr(ctx,bx+2*scale,by+bh-barH-1.5*scale,barW,barH,barH/2);ctx.fill();
      ctx.fillStyle=bd.col;
      rr(ctx,bx+2*scale,by+bh-barH-1.5*scale,barW*f,barH,barH/2);ctx.fill();
      ctx.restore();
      by+=bh+4*scale;
    }
  }
}
function drawBal(p,b){
  const k=persp(p.y);
  const [bx,by]=backDir(p);
  const ax=p.x+bx*p.r*0.35,ay=p.y+by*p.r*0.25*k-p.r*0.75*k;
  const mx=(ax+b.x)/2+b.vx*0.04+Math.sin(simT*1.8+b.phase)*2.5;
  const my=(ay+b.y)/2+6+Math.abs(b.vx)*0.015;
  ctx.strokeStyle='rgba(70,50,35,0.6)';ctx.lineWidth=1.5*k;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(mx,my,b.x,b.y+b.r*0.95+6);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.17)';ell(ctx,b.x,p.y+p.r*0.5,b.r*0.6*k,b.r*0.24*k);ctx.fill();
  let sc=1,al=1;
  if(b.popping){const q=1-b.popT/CFG.POP_DUR;sc=1+q*0.5;al=1-q*q;}
  const bs=1+Math.sin(simT*2.2+b.phase)*0.025;
  const v=Math.hypot(b.vx,b.vy),sv=clamp(v*0.0007,0,0.14);
  const ang=Math.atan2(b.vy,b.vx);
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);
  const K=(b.r/CFG.BALLOON_RADIUS)*k*sc*bs;
  ctx.scale(K*(1+sv),K*(1-sv));
  ctx.globalAlpha=al;
  const s=balloonSprites[p.ci];
  ctx.drawImage(s,-s.width/2,-(CFG.BALLOON_RADIUS+3));
  ctx.restore();ctx.globalAlpha=1;
  /* Per-balloon shield rings were removed. Each balloon used to get its own
     small halo, which read as three separate bubbles and clashed with the
     single dome drawn around the whole cluster in drawPl(). */
}

/* PIN BEARER GROUND MARKER.

   character (so it never hides them) and carries three signals:
     - a pulsing ring in the player's own colour
     - an expanding pulse ring, findable in peripheral vision
     - a countdown arc showing exactly how much PIN time is left
   The ring around the head is a hint; this is the read. */
function drawPinBearer(p){
  const k=persp(p.y);
  const C=PAL[p.ci];
  const frac=Math.max(0,Math.min(1,pinHoldT/CFG.PIN_POWER_TIME));
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.scale(k,k);
  /* soft ground glow in the player colour */
  ctx.globalAlpha=0.32;
  ctx.fillStyle=C.main;
  ell(ctx,0,2,p.r*1.9*(0.94+0.06*Math.sin(simT*6)),p.r*0.85);ctx.fill();
  /* main ring, with a dark keyline so it reads on any ground colour */
  ctx.globalAlpha=0.95;
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=6;
  ell(ctx,0,2,p.r*1.35,p.r*0.62);ctx.stroke();
  ctx.strokeStyle=C.main;ctx.lineWidth=4;
  ell(ctx,0,2,p.r*1.35,p.r*0.62);ctx.stroke();
  /* expanding pulse ring */
  const ph=(simT*1.5)%1;

/* ================= ATTRACT MODE ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â 4 AIs, FOREVER =================
   The intro page used to be a flat blue wash with ten balloons drifting up it,
   which said nothing about the game. It now runs a REAL 4-AI match behind the
   menu: the same makePlayer / aiUpdate / updPlayer / pin / power-up systems the
   player fights with, so what you see is the actual game.

   It is a self-contained sandbox: it saves and restores every global it needs
   (players, pin, powerups, state...) and loops forever, restarting the moment
   somebody wins or the last balloon pops. It never plays a sound and never
   touches the shared particle pool, so the menu stays quiet and the real match
   starts from a clean slate. */
let attract=true,attractT=0,attractSave=null,bootError=null;
/* 0 = nothing preselected. Otherwise the seat count the shell's "N PLAYER" tile
   asked for; the matching menu button is highlighted, and tapping PLAY is one
   tap fewer. It is a HIGHLIGHT, not an auto-start: the player still chooses. */
let preselectMode=0;
/* THE REAL BUG THAT BLANKED THE PAGE.
   This used to save/restore the sandbox with `eval(k)` over a list of names.
   That list carried `lastSecTxt` - a variable copied from Bomb Relay that has
   NEVER existed in this game. eval('lastSecTxt') therefore threw on the very
   first frame:

       ReferenceError: lastSecTxt is not defined
           at attractEnter ... at init

   init() died there, and because `requestAnimationFrame(frame)` sat AFTER
   init(), the render loop never started - a permanently blank blue page.
   Confirmed by running the real boot path headless in Node, not by reading.

   Both defects are gone: the phantom key, and eval() on `let` bindings. The
   snapshot is now an explicit object of named reads and writes, so nothing is
   resolved by name at runtime. */
function attractSnapshot(){
  return {
    players:players,obstacles:obstacles,powerups:powerups,puSpots:puSpots,
    rings:rings,floaters:floaters,zones:zones,winner:winner,elimCount:elimCount,
    cdNum:cdNum,cdPop:cdPop,hitStop:hitStop,confetti:confetti,
    nPlayers:nPlayers,soloMode:soloMode,aiSkill:aiSkill,spawnPts:spawnPts,
    pin:pin,pinHolder:pinHolder,pinOwnerId:pinOwnerId,pinHoldT:pinHoldT,
    pinSpawnT:pinSpawnT,paused:paused,state:state,stateT:stateT,simT:simT,
    puT:puT
  };
}
function attractRestore(s){
  players=s.players;obstacles=s.obstacles;powerups=s.powerups;puSpots=s.puSpots;
  rings=s.rings;floaters=s.floaters;zones=s.zones;winner=s.winner;
  elimCount=s.elimCount;cdNum=s.cdNum;cdPop=s.cdPop;hitStop=s.hitStop;
  confetti=s.confetti;nPlayers=s.nPlayers;soloMode=s.soloMode;aiSkill=s.aiSkill;
  spawnPts=s.spawnPts;pin=s.pin;pinHolder=s.pinHolder;pinOwnerId=s.pinOwnerId;
  pinHoldT=s.pinHoldT;pinSpawnT=s.pinSpawnT;paused=s.paused;state=s.state;
  stateT=s.stateT;simT=s.simT;puT=s.puT;
}
function attractEnter(){
  /* Save the real game's globals ONCE. Re-entering (the loop restart) must not
     overwrite the snapshot with the attract sandbox's own state. */
  if(!attractSave)attractSave=attractSnapshot();
  attract=true;attractT=0;
  /* The AI-vs-AI demo stays SILENT - a brawl screaming behind a menu is awful
     and would fight the button feedback. Menu SFX are played by hitUI() and
     are NOT gated on this flag, so PLAY / HOW TO PLAY / the toggles all sound
     normally. Only the gameplay voices the demo itself triggers (pop, bump,
     dash, the pin) are suppressed.

     IMPORTANT: this flag must never touch SFX.muted. An earlier version did
     `attractMute=SFX.muted; SFX.muted=true;` and the demo restarts every 26s -
     so each restart re-captured the already-forced `true`, overwrote the
     player's real setting and latched sound OFF permanently. The player's
     setting is read-only from here. */
  attractSilent=true;
  attractSilent=true;
  setupWorld();buildObstacles();buildPUSpots();
  players=[];
  const sp=spawnPoints(4);
  for(let k=0;k<4;k++)
    players.push(makePlayer(k,false,clamp(0.5+rand(-0.18,0.22),0.2,0.95),sp[k].x,sp[k].y));
  powerups=[];winner=null;elimCount=0;confetti=false;
  pin=null;pinHolder=null;pinOwnerId=-1;pinHoldT=0;pinSpawnT=CFG.PIN_FIRST_DELAY;
  resetParticles();shake=0;hitStop=0;puT=4;
  /* state is deliberately NOT touched: the attract match only ever simulates
     inside attractStep(), and state must stay 'MENU' so render() draws the
     menu on top of the world. */
  buildZones();
}
/* True while the AI-vs-AI intro demo runs. The demo is silent by design so the
   menu stays calm - but this is a SEPARATE flag, never SFX.muted. */
let attractSilent=false;
function attractExit(){
  if(attractSave){
    attractRestore(attractSave);
    attractSave=null;
    resetParticles();
  }
  attractSilent=false;
  attract=false;
}
/* One attract "match": pin, powerups, AI, physics - minus all sound. */
function attractStep(dt){
  attractT+=dt;
  pinSpawnT-=dt;
  if(!pin&&!pinHolder&&pinSpawnT<=0)spawnPin();
  if(pin){
    pin.life-=dt;
    if(pin.life<=0){pin=null;pinSpawnT=CFG.PIN_RESPAWN_DELAY;}
  }
  if(pinHolder){
    pinHoldT-=dt;
    if(pinHoldT<=0){pinHolder=null;pinOwnerId=-1;pinSpawnT=CFG.PIN_RESPAWN_DELAY;}
  }
  puT-=dt;
  if(puT<=0){puT=CFG.POWERUP_INTERVAL*rand(0.85,1.2);spawnPU();}
  for(const p of players){if(!p.human)aiUpdate(p,dt);}
  for(const p of players)updPlayer(p,dt);
  bumpPass();
  updFX(dt);
  shake=Math.max(0,shake-dt*11);
  /* Loop forever: restart on a winner, on the last balloon popping, or after a
     long enough bout that the AI has churned through plenty of action. */
  if(winner||attractT>26||attractT<0){
    attractEnter();
  }
}

function drawBackBtn(){

  ctx.strokeStyle='#EF4D3C';ctx.lineWidth=3.5;rr(ctx,backBtn.x-r,backBtn.y-r, r*2, r*2, 10);ctx.stroke();
  ctx.strokeStyle='#2B2233';ctx.lineWidth=3.4;ctx.lineCap='round';ctx.lineJoin='round';

  ctx.lineTo(backBtn.x-r*0.34,backBtn.y);

    act:()=>{SFX.play('click');try{exitToShell();}catch(e){}}});
}
function exitToShell(){
  /* NO AD HERE, BY DESIGN. BACK is a player's escape hatch out of a bout - the
     one tap they make when they are done and not enjoying themselves. Charging
     an interstitial for it punishes exactly the behaviour you want to encourage.

     The only interstitials in this game are:
       - PLAY on the title screen          (playWithAd)
       - PLAY AGAIN / RESTART on results   (playWithAd)
       - MENU from the results card        (backToMenu, post-match only)

     The pagehide/visibilitychange hook below is the shell's own exit path (app
     backgrounded or closed) and is left alone; it is not reachable from BACK. */
  try{
    if(window.NativeBridge&&window.NativeBridge.exitGame)window.NativeBridge.exitGame();
  }catch(e){}
}

/* ---------- HOW TO PLAY: structured, themed, and it must not overflow ----------
   [icon, heading, body] rows. Both the heading and the body are word-wrapped to
   the panel's inner width, so nothing can spill outside the panel on a narrow
   screen - the original single-line body overflowed badly on a phone. */
const HOW_ROWS=[
  ['move','MOVE','Drag your joystick to run. You steer in any direction - there is no forward button, and bumping into another player is a legal (if risky) tactic.'],
  ['pin','GRAB THE PIN','A golden PIN drops on the island every few seconds. Run over it to pick it up. Only the PIN holder can attack, and only for 8 seconds.'],
  ['attack','ATTACK','With the PIN, get close to a rival and your balloon bursts against them. Without the PIN your hits do nothing.'],
  ['balloon','BALLOONS ARE LIFE','Everyone starts with 3 balloons. Every hit pops one. Pop all of yours and you are out of the round.'],
  ['shield','SHIELD','A blue dome wraps around you. It eats one hit, then pops. The dome fades in its last second, so you can see it running out.'],
  ['speed','SPEED','You move noticeably faster, and a yellow chevron trail follows you. It makes you quicker - and an easier target.'],
  ['last','LAST ONE STANDING','When only one player still has balloons, they win. Go for the leader, not for the weakest.'],
  ['careful','WATCH THE PIN','The ring under the PIN holder burns down as their time runs out. When it empties the PIN drops free for anyone.']
];
const HOW_COLORS={move:'#43A047',pin:'#F6B41E',attack:'#EF4D3C',balloon:'#F45D9C',
  shield:'#4AD6FF',speed:'#FFD24A',last:'#3D8EE0',careful:'#A05CD6'};
/* Greedy word wrap to a pixel width: canvas has no automatic text wrapping. */
function wrapText(g,s,maxW,font){
  g.font=font;
  const words=String(s).split(' ');
  const lines=[];let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(g.measureText(t).width>maxW&&line){lines.push(line);line=w;}
    else line=t;
  }
  if(line)lines.push(line);
  return lines;
}
/* Tiny pictograms inside each coloured disc, drawn in the panel's dark ink so
   they read at any size. */
function drawHowIcon(kind,cx,cy,r){
  ctx.strokeStyle='#2B2233';ctx.fillStyle='#2B2233';
  ctx.lineWidth=Math.max(2,r*0.13);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  if(kind==='pin'){
    /* a pin: tapered body + point */
    ctx.moveTo(cx-r*0.42,cy-r*0.46);ctx.lineTo(cx+r*0.42,cy-r*0.46);
    ctx.lineTo(cx+r*0.16,cy+r*0.14);ctx.lineTo(cx,cy+r*0.5);
    ctx.lineTo(cx-r*0.16,cy+r*0.14);ctx.closePath();ctx.fill();
  }else if(kind==='pop'||kind==='balloon'){
    /* a balloon with a knot */
    ctx.ellipse(cx,cy-r*0.16,r*0.44,r*0.5,0,0,TAU);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx-r*0.12,cy+r*0.32);ctx.lineTo(cx+r*0.12,cy+r*0.32);
    ctx.lineTo(cx,cy+r*0.5);ctx.closePath();ctx.fill();
  }else if(kind==='last'){
    /* a crown: last one standing */
    ctx.moveTo(cx-r*0.5,cy+r*0.36);ctx.lineTo(cx-r*0.5,cy-r*0.3);
    ctx.lineTo(cx-r*0.18,cy+r*0.02);ctx.lineTo(cx,cy-r*0.44);
    ctx.lineTo(cx+r*0.18,cy+r*0.02);ctx.lineTo(cx+r*0.5,cy-r*0.3);
    ctx.lineTo(cx+r*0.5,cy+r*0.36);ctx.closePath();ctx.fill();
  }else if(kind==='shield'){
    /* a shield with a tick */
    ctx.moveTo(cx,cy-r*0.52);ctx.lineTo(cx+r*0.42,cy-r*0.28);
    ctx.lineTo(cx+r*0.34,cy+r*0.16);ctx.lineTo(cx,cy+r*0.54);
    ctx.lineTo(cx-r*0.34,cy+r*0.16);ctx.lineTo(cx-r*0.42,cy-r*0.28);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=Math.max(1.6,r*0.11);
    ctx.beginPath();
    ctx.moveTo(cx-r*0.16,cy-r*0.02);ctx.lineTo(cx-r*0.03,cy+r*0.12);
    ctx.lineTo(cx+r*0.2,cy-r*0.18);ctx.stroke();
  }else if(kind==='speed'){
    /* a lightning bolt */
    ctx.moveTo(cx+r*0.16,cy-r*0.5);ctx.lineTo(cx-r*0.22,cy+r*0.04);
    ctx.lineTo(cx+r*0.02,cy+r*0.04);ctx.lineTo(cx-r*0.14,cy+r*0.52);
    ctx.lineTo(cx+r*0.26,cy-r*0.06);ctx.lineTo(cx+r*0.02,cy-r*0.06);
    ctx.closePath();ctx.fill();
  }else if(kind==='move'){
    /* a joystick: ring + knob */
    ctx.lineWidth=Math.max(2,r*0.14);
    ctx.ellipse(cx,cy,r*0.44,r*0.44,0,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy,r*0.2,r*0.2,0,0,TAU);ctx.fill();
  }else if(kind==='attack'){
    /* crossed swords / impact star */
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2;
      ctx.moveTo(cx+Math.cos(a)*r*0.12,cy+Math.sin(a)*r*0.12);
      ctx.lineTo(cx+Math.cos(a)*r*0.5,cy+Math.sin(a)*r*0.5);
      ctx.lineWidth=Math.max(2,r*0.13);
      ctx.stroke();
    }
  }else{
    /* careful: an eye watching the clock */
    ctx.lineWidth=Math.max(2,r*0.12);
    ctx.beginPath();
    ctx.ellipse(cx,cy,r*0.46,r*0.28,0,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy,r*0.15,r*0.15,0,0,TAU);ctx.fill();
  }
}
function drawHowPanel(){
  const w=Math.min(540,cssW*0.93),h=Math.min(460,cssH*0.93);
  const x=cssW/2-w/2,y=cssH/2-h/2;
  panel(x,y,w,h,'HOW TO PLAY');
  const padX=20;
  const iconR=Math.max(16,Math.min(23,w*0.047));
  const headFs=Math.min(19,w*0.043);
  const bodyFs=Math.min(15,w*0.036);
  const innerW=w-padX*2-iconR*2-12;
  const headFont='bold '+headFs+'px '+FONT;
  const bodyFont='bold '+bodyFs+'px '+FONT;
  let yy=y+78;
  for(const row of HOW_ROWS){
    const col=HOW_COLORS[row[0]];
    const headLines=wrapText(ctx,row[1],innerW,headFont);
    const bodyLines=wrapText(ctx,row[2],innerW,bodyFont);
    const textH=headLines.length*headFs*1.18+bodyLines.length*bodyFs*1.30;
    const rowH=Math.max(iconR*2+8,textH);
    const cy=yy+rowH/2;
    /* icon disc */
    const cx=x+padX+iconR;
    ctx.fillStyle='rgba(0,0,0,0.14)';ell(ctx,cx,cy+2,iconR,iconR);ctx.fill();
    ctx.fillStyle=col;ell(ctx,cx,cy,iconR,iconR);ctx.fill();
    ctx.strokeStyle='#2B2233';ctx.lineWidth=3;ctx.stroke();
    drawHowIcon(row[0],cx,cy,iconR);
    /* heading + body, vertically centred against the disc */
    const tx=x+padX+iconR*2+12;
    let ty=cy-(textH-headFs*0.55)/2;
    for(const hl of headLines){txt(ctx,hl,tx,ty,headFs,'#2B2233','left');ty+=headFs*1.18;}
    ty+=bodyFs*0.22;
    for(const bl of bodyLines){txt(ctx,bl,tx,ty,bodyFs,'#5C5449','left');ty+=bodyFs*1.30;}
    yy+=rowH+14;
  }
}
/* Shared sheet chrome. Themed to the game rather than a plain white box: a
   thick balloon-red rim, a dark outer edge and a warm cream face, matching the
   in-match panels. NO close button - a tap anywhere on the scrim dismisses the
   sheet (see onDown), which is the interaction the player asked for. */
function panel(x,y,w,h,title){
  ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,0,cssW,cssH);
  /* drop shadow, then a dark outer edge, then the red rim, then the face */
  ctx.fillStyle='rgba(0,0,0,0.35)';rr(ctx,x+5,y+9,w,h,20);ctx.fill();
  ctx.fillStyle='#2B2233';rr(ctx,x-3,y-3,w+6,h+6,22);ctx.fill();
  ctx.fillStyle='#FFFBF0';rr(ctx,x,y,w,h,20);ctx.fill();
  ctx.strokeStyle='#EF4D3C';ctx.lineWidth=5;rr(ctx,x,y,w,h,20);ctx.stroke();
  /* title with a coloured underline, so the header has structure */
  txt(ctx,title,x+w/2,y+36,Math.min(27,w*0.075),'#2B2233');
  ctx.strokeStyle='#F6B41E';ctx.lineWidth=4;ctx.lineCap='round';
  const uw=Math.min(w*0.5,30+title.length*12);
  ctx.beginPath();ctx.moveTo(x+w/2-uw/2,y+52);ctx.lineTo(x+w/2+uw/2,y+52);ctx.stroke();
}
function sheetClose(){/* Intentionally empty: no close button. Tapping the scrim
   dismisses the sheet - see the panel branch in onDown. */}
function drawSettingsPanel(){

  drawToggle(x+24,rowY+rowH+gap,w-48,rowH,'HAPTICS',hapticsOn,()=>{setHaptics(!hapticsOn);SFX.playUI('toggle');});

/* A real pill switch, not a bare circle. The old version drew the knob as a
   near-square rounded rect inside a small slot, which read as one big grey
   circle and gave no ON/OFF sense. This is a wide track with a high-contrast
   fill, a dark outline, a clearly offset knob and bold ON/OFF text, so the
   state is unmistakable at a glance and when tapped. */
function drawToggle(x,y,w,h,label,on,act){
  const r=h/2;
  /* row plate */
  ctx.fillStyle=on?'rgba(47,190,106,0.20)':'rgba(0,0,0,0.06)';
  rr(ctx,x,y,w,h,r);ctx.fill();
  ctx.strokeStyle='#2B2233';ctx.lineWidth=3.5;
  rr(ctx,x,y,w,h,r);ctx.stroke();
  /* label on the left */
  txt(ctx,label,x+20,y+h/2,Math.min(19,h*0.40),'#2B2233','left');
  /* switch on the right: track + knob */
  /* The switch itself is now HALF the previous width: the old track was up to
     96px across in an already-narrow panel, which made it read as a slider
     rather than a switch. ~46px reads correctly as a toggle, and the ON/OFF
     word carries the state unambiguously. */
  const sw=Math.min(46,h*1.05),sh=h*0.5;
  const sx=x+w-sw-14,sy=y+(h-sh)/2;
  ctx.fillStyle=on?'#2FBE6A':'#B9BEC6';
  rr(ctx,sx,sy,sw,sh,sh/2);ctx.fill();
  ctx.strokeStyle='#2B2233';ctx.lineWidth=3;
  rr(ctx,sx,sy,sw,sh,sh/2);ctx.stroke();
  /* knob sits at the right when ON, left when OFF */
  const kr=sh/2-3;
  const kx=on?(sx+sw-kr-3):(sx+kr+3);
  ctx.fillStyle=on?'#FFFBF0':'#F2F0EA';
  ell(ctx,kx,sy+sh/2,kr,kr);ctx.fill();
  ctx.strokeStyle='#2B2233';ctx.lineWidth=2.6;ctx.stroke();
  /* state text to the left of the switch */
  txt(ctx,on?'ON':'OFF',sx-12,sy+sh/2,Math.min(15,sh*0.62),
      on?'#1E7A46':'#6B7078','right');
  uiBtns.push({x,y,w,h,act});
}

function drawRotate(){

/* ================= MAIN LOOP ================= */
function render(){
  uiBtns.length=0;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#79bfe6';ctx.fillRect(0,0,canvas.width,canvas.height);
  applyCam();
  const shx=(Math.random()*2-1)*shake,shy=(Math.random()*2-1)*shake;
  ctx.setTransform(camS,0,0,camS,camX+shx*camS,camY+shy*camS);
  if(bgSky)ctx.drawImage(bgSky,0,0,WORLD_W,WORLD_H);
  for(const c of clouds){ctx.globalAlpha=c.a;drawCloud(ctx,c.x,c.y,c.s);}
  ctx.globalAlpha=1;
  if(bgIsland)ctx.drawImage(bgIsland,0,0,WORLD_W,WORLD_H);
  const list=[];
  for(const o of obstacles)list.push({y:o.y+o.r*0.35,f:drawObs,a:o,b:null});
  for(const d of decor)list.push({y:d.y,f:drawDecor,a:d,b:null});
  for(const fl of flagLines)list.push({y:Math.min(fl.y1,fl.y2)+0.1,f:drawFlagLine,a:fl,b:null});
  for(const u of powerups)list.push({y:u.y,f:drawPU,a:u,b:null});
  if(pin)list.push({y:pin.y,f:drawPinGround,a:pin,b:null});
  /* Ground marker under the PIN CARRIER, drawn before the players so it sits
     under their feet. Without it the holder was only identifiable by a faint
     ring around their head - invisible in a 4-player scrum. This is the single
     clearest "that one is armed" signal in the game. */
  if(pinHolder&&!pinHolder.eliminated)
    list.push({y:pinHolder.y-0.5,f:drawPinBearer,a:pinHolder,b:null});
  for(const p of players){
    if(!p.eliminated)for(const b of p.balloons)if(b.alive||b.popping)list.push({y:b.y,f:drawBal,a:p,b});
    list.push({y:p.y,f:drawPl,a:p,b:null});
  }
  list.sort((m,n)=>m.y-n.y);
  for(const e of list)e.f(e.a,e.b);
  drawRingsFx();
  drawParticles();
  drawFloatersFx();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(state==='MENU'){
    /* The attract match is drawn as the real world, then dimmed so the menu
       stays readable on top of it. */
    drawDim();
    drawMenu();
    if(showSettings)drawSettingsPanel();
    if(paused)drawPause();
    if(rotateBlock)drawRotate();
    return;
  }
  if(state==='COUNTDOWN'){drawControls();drawHUD();drawCountdown();}
  else if(state==='PLAYING'){drawControls();drawHUD();}
  else if(state==='ENDING'){drawHUD();}
  else if(state==='RESULT'){drawResult();}
  if(paused)drawPause();
  if(rotateBlock)drawRotate();
}
let lastT=0,rafId=0,running=true,frameWarned=false;
function frame(now){
  if(!running)return;
  rafId=requestAnimationFrame(frame);
  if(!lastT)lastT=now;
  let dt=(now-lastT)/1000;lastT=now;
  if(dt<=0)return;
  if(dt>0.033)dt=0.033;
  stateT+=dt;
  let ts=1;
  if(hitStop>0){hitStop-=dt;ts=0.1;}
  /* A throw anywhere in update()/render() used to kill the rAF loop for good,
     leaving a blank page with no way back. The loop is re-armed ABOVE, so it
     survives; this just stops one bad frame from spamming the console forever. */
  try{
    if(!paused&&!rotateBlock)update(dt*ts,dt);
    render();
  }catch(e){
    if(!frameWarned){frameWarned=true;console.error('Balloon Battle frame error:',e);}
  }
}
/* ================= SDK / LIFECYCLE ================= */
function onVis(){if(document.hidden&&state==='PLAYING'&&!paused)Game.pause();}
/* ADS IN THIS GAME.
   Banner: REMOVED. A joystick game is played with both thumbs, and a banner
   strip sits exactly where the left thumb lives - it swallowed drags and
   covered the controls. showBannerFor() is therefore an explicit no-op and
   nothing in this file calls showBanner()/hideBanner().

   Interstitial: KEPT. It is a studio-wide break between sessions, not a
   gameplay overlay, and it fires on the way out of a match - never on a timer
   and never over live play.

   Rewarded: not used. This game has no continue / reward / power-up purchase,
   so there is nothing honest to sell. If that ever changes, the ad must be
   opt-in and player-triggered.

   The setData/getData aliases are NOT ads - store()/load() need them to reach
   the shell's save bridge on this version of the host. */
if(window.NativeBridge){
  if(!NativeBridge.setData) NativeBridge.setData=function(k,v){return NativeBridge.save(k,String(v));};
  if(!NativeBridge.getData) NativeBridge.getData=function(k){return NativeBridge.load(k);};
}
function showBannerFor(on){
  /* No banner in this game - see the note above. */
}
/* INTERSTITIAL.
   The old version only fired from pagehide/visibilitychange with a callback
   name ('__shell_after_game') that the shell has no global for - so it never
   completed, and nothing on the PLAY / BACK paths could call it at all. That is
   why an ad appeared on the BACK button but never on PLAY or the main menu:
   the game had no callable ad helper, only an exit hook.

   Now it is a callable helper used at the real break points:
     - PLAY on the title screen (rematch / start a new bout)
     - BACK out of a live match (the interstitial then leads to the menu)
   The callback name is '__studioInterCb' (two leading underscores), matching the
   global registered here. It is NOT fired on a timer and never over live play.
   No banner in this game at all - see the ADS note above. */
var interstitialBusy=false;
function showInterstitial(onDone){
  if(interstitialBusy){if(onDone)onDone();return;}
  var b=window.NativeBridge;
  if(b&&b.showInterstitial){
    interstitialBusy=true;
    var fired=false;
    var done=function(){
      if(fired)return;
      fired=true;
      interstitialBusy=false;
      if(onDone)onDone();
    };
    /* The shell invokes the name it was handed. A late second call (the ad
       Activity returning AND visibilitychange) is ignored by `fired`. */
    window.__studioInterCb=done;
    window._studioInterCb=done;
    try{
      b.showInterstitial('__studioInterCb');
      /* Safety net: if the shell never calls back (no ad inventory, a provider
         error), release the UI instead of stranding the player on a dead
         button. */
      setTimeout(function(){done();},4000);
      return;
    }catch(e){}
    done();
    return;
  }
  if(onDone)onDone();
}
/* Kept for the exit path, so a real BACK (not the page being torn down) gets
   its ad. */
var interstitialShown=false;
function showInterstitialOnce(){
  if(interstitialShown)return;
  interstitialShown=true;
  showInterstitial(function(){interstitialShown=false;});
}
window.addEventListener('pagehide',showInterstitialOnce);
document.addEventListener('visibilitychange',function(){if(document.hidden)showInterstitialOnce();});
window.Game={
  pause(){if((state==='PLAYING'||state==='COUNTDOWN')&&!paused){paused=true;clearGameplayInput();SFX.play('click');}},
  resume(){if(paused){paused=false;lastT=0;}},
  setMuted(m){SFX.setMuted(!!m);},
  get muted(){return SFX.muted;},
  /* Pushed by the shell (GameActivity.onResume) when sound / haptics changed
     while this game was paused. persist=false: the SHELL already owns the store
     in that direction, and writing it back would be a pointless round trip. */
  setSettings(s){
    try{
      if(!s)return;
      if(typeof s.sound==='boolean')setSound(!!s.sound,false);
      if(typeof s.haptics==='boolean')setHaptics(!!s.haptics,false);
    }catch(e){}
  },
  setHaptics(on){setHaptics(!!on);},
  destroy(){
    running=false;cancelAnimationFrame(rafId);
    window.removeEventListener('resize',resize);
    window.removeEventListener('orientationchange',onOri);
    document.removeEventListener('visibilitychange',onVis);
    if(window.visualViewport)visualViewport.removeEventListener('resize',resize);
    document.removeEventListener('fullscreenchange',resize);
    document.removeEventListener('webkitfullscreenchange',resize);
    if(screen.orientation&&screen.orientation.removeEventListener)screen.orientation.removeEventListener('change',onOri);
    canvas.removeEventListener('pointerdown',onDown);
    canvas.removeEventListener('pointermove',onMove);
    canvas.removeEventListener('pointerup',onUp);
    canvas.removeEventListener('pointercancel',onUp);
    canvas.removeEventListener('lostpointercapture',onUp);
    window.removeEventListener('keydown',onKD);
    window.removeEventListener('keyup',onKU);
    if(SFX.ctx){try{SFX.ctx.close();}catch(e){}SFX.ctx=null;}
  }
};
function onOri(){setTimeout(resize,80);setTimeout(resize,400);}
function onKD(e){
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
  if(e.code==='Escape'){paused?Game.resume():Game.pause();}
}
function onKU(e){keys[e.code]=false;}
/* ================= INIT ================= */
makeBalloonSprites();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',onOri);
document.addEventListener('visibilitychange',onVis);
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
document.addEventListener('fullscreenchange',resize);
document.addEventListener('webkitfullscreenchange',resize);
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',onOri);
canvas.addEventListener('pointerdown',onDown);
canvas.addEventListener('pointermove',onMove);
canvas.addEventListener('pointerup',onUp);
canvas.addEventListener('pointercancel',onUp);
canvas.addEventListener('lostpointercapture',onUp);
canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',onKD);
window.addEventListener('keyup',onKU);
resize();
/* BOOT GUARD. requestAnimationFrame(frame) used to sit AFTER init(), so any
   throw inside init left the page permanently blank with no way back - which is
   exactly what the lastSecTxt ReferenceError did. Two changes make that
   impossible: the loop is armed FIRST, and init is guarded so a fault is
   reported instead of silently ending the script. */
requestAnimationFrame(frame);
(function init(){
  try{
    const QS=new URLSearchParams(location.search);
    const solo=QS.get('mode')==='solo';
    const sk=parseFloat(QS.get('skill'));
    if(!isNaN(sk))aiSkill=clamp(sk>1?sk/100:sk,0,1);
    /* SHELL PRESELECT. Opened from the shell's "N PLAYER" tile the game is handed
       ?mode=pass&skill=medium&players=N. That tile is the player saying "we are N",
       so the intro should already reflect it instead of making them tap the
       matching button again. N=1 is this game's SOLO mode. A count outside the
       game's 1-4 range is ignored and the menu is left alone. */
    const wantPlayers=parseInt(QS.get('players')||'0',10);
    if(QS.get('mode')==='pass'&&wantPlayers>=1&&wantPlayers<=4){
      preselectMode=wantPlayers;
    }
    setupWorld();buildObstacles();buildPUSpots();spawnPts=null;renderBG();
    if(solo){startMatch(1,true);showBannerFor(true);}
    else if(preselectMode){
      /* OPEN STRAIGHT INTO THE GAME. The shell's "N PLAYER" tile is the player
         already saying "we are N", so re-asking them to tap the matching button
         is a wasted step. The game honours the request and goes straight to the
         bout. The ad still runs first, exactly as if they had tapped PLAY, so
         this path cannot be used to skip it.

         The attract loop is skipped deliberately - the demo would be torn down
         a frame later, which just looks like a glitch. N=1 is SOLO (vs bots). */
      const n=preselectMode;
      preselectMode=0;   /* consumed: the results card must not auto-restart */
      showModes=false;showHow=false;showSettings=false;
      startMatch(n,n===1);
    }
    else{attractEnter();showBannerFor(false);}
  }catch(e){
    bootError=e;
    console.error('Balloon Battle boot error:',e);
    /* Show the menu anyway rather than an empty canvas. */
    try{setupWorld();buildObstacles();renderBG();}catch(_){}
  }
})();
/* The display face is a data-URI @font-face, and <canvas> text NEVER triggers a
   font load on its own - so without this warm-up the title, buttons and every
   HUD label quietly render in the system fallback for the first few seconds.
   Nothing waits on this; when the face lands we repaint once. */
try{
  if(document.fonts&&document.fonts.load){
    Promise.all([
      document.fonts.load('400 54px "Luckiest Guy"'),
      document.fonts.load('400 21px "Luckiest Guy"'),
      document.fonts.load('400 15px "Luckiest Guy"')
    ]).then(()=>{try{render();}catch(e){}}).catch(()=>{});
  }
}catch(e){}
requestAnimationFrame(frame);
</script>
