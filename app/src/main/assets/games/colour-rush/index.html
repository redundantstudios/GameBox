<style>
/* Shell chrome: BACK out of the game, to the arcade grid. */
#studioBack{position:fixed;z-index:2147483000;left:10px;top:max(10px,env(safe-area-inset-top));
width:76px;height:38px;border-radius:19px;display:none;align-items:center;justify-content:center;
background:rgba(8,10,14,.72);border:1px solid rgba(255,255,255,.3);color:#fff;
font:800 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.16em;
cursor:pointer;-webkit-tap-highlight-color:transparent;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#studioBack.show{display:flex}
#studioBack:active{transform:scale(.96)}
</style>

<script>
/* ============================================================
   STUDIO SDK - shell bridge only. Every entry point degrades to
   a no-op in a plain browser tab, so the game still runs from
   file:// on its own.
   ============================================================ */
var __studioAdSeq=0;
var Studio=(function(){
  var bridge=function(){ return window.NativeBridge||null; };
  var ls={get k(){ try{return window.localStorage;}catch(_){return null;} }};
  var settings={sound:true,music:true,haptics:true};
  try{ var raw=bridge()?bridge().load('shell:settings'):(ls.k?ls.k.getItem('shell:settings'):null);
       if(raw) settings=Object.assign(settings,JSON.parse(raw)); }catch(_){}
  /* the shell puts the same values in the launch query string */
  try{ var q=new URLSearchParams(location.search);
       if(q.has('sound')) settings.sound=q.get('sound')!=='0';
       if(q.has('vibe')) settings.haptics=q.get('vibe')!=='0';
  }catch(_){}
  return {
    settings:settings,
    save:function(k,v){ var b=bridge(); if(b){ try{b.save(k,v); return;}catch(_){} }
            try{ if(ls.k) ls.k.setItem(k,v); }catch(_){} },
    load:function(k){ var b=bridge(); if(b) return b.load(k);
            try{ return ls.k?ls.k.getItem(k):null; }catch(_){ return null; } },
    haptic:function(kind){ if(settings.haptics===false) return; var b=bridge(); if(!b) return;
      var map={light:15,medium:30,heavy:60,success:45};
      try{ b.haptic(typeof map[kind]==='number'?map[kind]:0); }catch(_){} },
    exitGame:function(){ var b=bridge(); if(b&&b.exitGame){ try{ b.exitGame(); }catch(_){} } },
    /* the game flipped a switch the shell also owns - keep them in step */
    pushSettings:function(patch){ Object.assign(settings,patch||{});
      this.save('shell:settings',JSON.stringify({sound:!!settings.sound,music:!!settings.music,haptics:!!settings.haptics})); },
    ads:{
      /* Rewarded. The shell fires the callback with NO argument on reward and
         "closed"/"unavailable" otherwise, so anything that is not an explicit
         failure counts as a reward. Every request gets its OWN callback name:
         two requests sharing one global callback let the first ad pay out the
         second action and lost the earlier request. */
      rewarded:function(placement,onReward,onFail){
        var b=bridge();
        if(!b||!b.showRewardedAd){ if(onFail) onFail('unavailable'); return; }
        var cb='__studioAdCb'+(++__studioAdSeq);
        window[cb]=function(result){
          try{ delete window[cb]; }catch(_){}
          if(result!=='closed'&&result!=='unavailable'){ if(onReward) onReward(); }
          else if(onFail) onFail(result);
        };
        try{ b.showRewardedAd(cb); }catch(_){ try{ delete window[cb]; }catch(_){} if(onFail) onFail('unavailable'); }
      },
      /* Interstitial break. The shell always answers, so nothing can hang. */
      interstitial:function(onDone){
        var b=bridge();
        if(b&&b.showInterstitial){
          window.__studioInterCb=function(){ if(onDone) onDone(); };
          try{ b.showInterstitial('__studioInterCb'); return; }catch(_){}
        }
        if(onDone) onDone();
      },
      /* Banner strip under the game (single / two player boards). */
      banner:function(show){ var b=bridge(); if(!b) return;
        try{ show?b.showBanner():b.hideBanner(); }catch(_){} }
    }
  };
})();
window.Studio=Studio;
</script>

<script>
/* Shell BACK button. Shown only while the game is on its own front page, so
   it can never sit on top of the board in the middle of play. */
(function(){
  var el=null, on=false;
  function get(){ if(!el) el=document.getElementById('studioBack'); return el; }
  function front(){ try{ var e=document.getElementById('scr-home'); return !!(e&&e.classList.contains('active')); }catch(_){ return false; } }
  function mount(){
    if(get()) return;
    var d=document.createElement('div'); d.id='studioBack'; d.textContent='BACK';
    d.setAttribute('role','button'); d.setAttribute('aria-label','Back to the arcade');
    (document.body||document.documentElement).appendChild(d);
    d.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); Studio.exitGame(); },true);
    d.addEventListener('touchstart',function(e){ e.preventDefault(); },{passive:false});
  }
  function tick(){
    var b=get();
    if(!b){ setTimeout(tick,250); return; }
    var want=front();
    if(want!==on){ on=want; b.classList.toggle('show',on); }
    setTimeout(tick,250);
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){ mount(); tick(); });
  }else{ mount(); tick(); }
})();
</script>

/* COLOUR-CORNER JOYSTICKS */
#mobile-controls{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;pointer-events:none;display:none}
#mobile-controls.show{display:block}
.stick{position:absolute;width:var(--stk);height:var(--stk);pointer-events:auto;touch-action:none;
 display:flex;align-items:center;justify-content:center}
.stick.tl{left:calc(20px + env(safe-area-inset-left,0px));top:calc(var(--topstk) + env(safe-area-inset-top,0px))}
.stick.tr{right:calc(20px + env(safe-area-inset-right,0px));top:calc(var(--topstk) + env(safe-area-inset-top,0px))}
.stick.bl{left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.stick.br{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.stick-base{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;
 width:100%;height:100%;border:4px solid #2f80f6;transition:filter .12s,transform .12s}
.stick.on .stick-base{filter:brightness(1.45) saturate(1.15);transform:scale(1.03)}
.stick-knob{position:absolute;left:50%;top:50%;border-radius:50%;width:48%;height:48%;
 margin-left:-24%;margin-top:-24%;border:3px solid rgba(255,255,255,.9);
 box-shadow:0 5px 12px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.45),inset 0 -6px 10px rgba(0,0,0,.2);
 opacity:.94;transition:transform .15s ease-out,opacity .12s}
.stick.on .stick-knob{opacity:1;transition:none}
.ripple{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
 border:3px solid rgba(255,255,255,.9);pointer-events:none;animation:rip .45s ease-out forwards}
@keyframes rip{from{transform:scale(.4);opacity:.9}to{transform:scale(3.6);opacity:0}}
#keys-hint{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;
 display:none;gap:14px;align-items:center;background:rgba(8,18,38,.82);border:2px solid #2a4a7d;border-radius:14px;
 padding:7px 14px;pointer-events:none;transition:opacity .6s;flex-wrap:wrap;justify-content:center;max-width:94vw}
.kh-p{display:flex;align-items:center;gap:5px;font-weight:800;font-size:calc(var(--u)*1.5)}
#toasts{position:absolute;top:calc(150px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:rgba(8,18,38,.92);border:2px solid #2a4a7d;color:#fff;font-weight:800;font-size:calc(var(--u)*1.6);padding:.4em 1em;border-radius:12px;animation:toastA 1.8s ease forwards;white-space:nowrap}
.toast i{width:10px;height:10px;border-radius:50%}
@keyframes toastA{0%{opacity:0;transform:translateY(-8px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#countdown{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;z-index:7;pointer-events:none;font-weight:900;font-size:calc(var(--u)*18);color:#fff;
 text-shadow:0 6px 0 #1a3a68,4px 0 0 #1a3a68,-4px 0 0 #1a3a68,0 -4px 0 #1a3a68,4px 4px 0 #1a3a68,-4px 4px 0 #1a3a68,4px -4px 0 #1a3a68,-4px -4px 0 #1a3a68,0 14px 30px rgba(0,0,0,.45)}
#countdown.show{display:flex}
#countdown.pop{animation:cpop .34s ease}
@keyframes cpop{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
.overlay{position:absolute;left:0;top:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.3vh;background:rgba(6,12,26,.78);opacity:0;pointer-events:none;visibility:hidden;transition:opacity .2s,visibility 0s .2s;padding:16px}
.overlay.show{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .2s,visibility 0s 0s}
.overlay h2{font-size:calc(var(--u)*4.4);letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.ov-panel{display:flex;flex-direction:column;align-items:center;gap:15px;
 width:min(88vw,420px);background:linear-gradient(180deg,rgba(16,32,62,.96),rgba(10,22,44,.96));

.ov-panel h2{font-size:clamp(24px,6vh,36px);letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.4);margin-bottom:4px}
.ov-panel .btn{width:100%;min-width:0;max-width:none;min-height:58px;font-size:clamp(16px,3.2vh,21px);border-radius:15px}

.rwin{width:17px;height:17px;flex:none;display:none}.rrow.win .rwin.solo{display:block}
.rk{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;font-size:14px}
.rchip{width:30px;height:22px;border-radius:7px;border:2px solid rgba(0,0,0,.3);flex:none}

.rscore{margin-left:auto;font-size:1.15em}
.res-actions{display:flex;gap:12px;justify-content:center;margin-top:.6vh;flex-wrap:wrap}
.res-right{display:flex;align-items:center;justify-content:center}
.pod-wrap{display:flex;flex-direction:column;align-items:center}
.pod-crown{width:calc(var(--u)*5);height:calc(var(--u)*5);margin-bottom:-10px;z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.pod-row{display:flex;align-items:flex-end;gap:1vw;position:relative;z-index:2;margin-bottom:-8px}
.pod-blob svg,.lose-wrap svg{width:calc(var(--u)*14);height:auto}
.podium{min-width:calc(var(--u)*20);height:calc(var(--u)*9);background:linear-gradient(#ffd977,#f0ab1d);
 border:4px solid #b97f00;border-radius:14px 14px 10px 10px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.25);padding:0 12px}
.pod-ribbon{background:#f4434e;color:#fff;font-weight:900;padding:.35em 1em;border-radius:8px;box-shadow:0 3px 0 #8f1d26;font-size:calc(var(--u)*2.2);letter-spacing:.04em;white-space:nowrap}
#confetti{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:1}
.cf{position:absolute;top:-8vh;display:block;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(680deg)}}
#rotate{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:rgba(8,18,38,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:20px;pointer-events:none}
#rotate .ic{width:64px;height:64px;color:#ffc233;animation:rot 1.6s ease-in-out infinite}
#rotate h3{font-size:22px;letter-spacing:.08em}#rotate p{color:#8fa6c8}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#err{position:fixed;left:0;right:0;bottom:0;z-index:100;display:none;flex-direction:column;gap:6px;background:#3a0d12;
 border-top:3px solid #f4434e;padding:12px 16px;max-height:44vh;overflow:auto}
#err b{color:#ff8a8a;letter-spacing:.1em;font-size:14px}
#err span{color:#ffd9d9;font-size:12px;word-break:break-word;font-family:monospace}
#err button{align-self:flex-start;background:#f4434e;color:#fff;font-weight:800;padding:4px 16px;border-radius:8px;font-size:12px}
</style>

var actx=null,sgain=null,musgain=null,muted=false,musTimer=null,musStep=0,musNext=0,lastThudT=-9;
function initAudio(){
 if(actx){return;}
 try{
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){return;}
  actx=new AC();
  var master=actx.createGain();master.connect(actx.destination);
  sgain=actx.createGain();sgain.connect(master);
  musgain=actx.createGain();musgain.connect(master);
  applyVolumes();startMusic();

function applyVolumes(){if(!actx){return;}var m=muted?0:1;
 sgain.gain.value=m*settings.sfx/100*0.9;musgain.gain.value=m*settings.music/100*0.3;}
function tone(freq,dur,type,vol,slide,when,dest){
 if(!actx||actx.state!=='running'){return;}
 try{
  var t=actx.currentTime+(when||0);
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(freq,t);
  if(slide){o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);}
  g.gain.setValueAtTime(vol||0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(dest||sgain);o.start(t);o.stop(t+dur+0.03);
 }catch(e){}}

  if(!actx){return;}
  if(actx.state!=='running'){musNext=actx.currentTime+0.1;return;}

<script>
'use strict';
var cv=qs('#cv'),ctx=cv.getContext('2d');

var MIN_OBS=12,TARGET_OBS=20;
var cache=null;
var state='idle',players=[],pads=[],rects=[],bumpers=[],pus=[],particles=[],floats=[],motes=[];
var target={color:-1,t:0},targetSerial=0,lockT=0,timer=60,nowSec=0;
var cd=0,cdShown=99,endT=0,shakeT=0,flashT=0,warnT=0,arenaPulse=0,hitStop=0,puT=6,sbDirty=false,lastSec=-1;
var matchMode='bots',matchCount=4;
var PTYPES=['speed','freeze','shield','tele'];
var PUCOL={speed:'#ffc233',freeze:'#2f80f6',shield:'#35c95f',tele:'#a35df2'};
var PUNAME={speed:'SPEED',freeze:'FREEZE',shield:'COLOUR SHIELD',tele:'TELEPORT'};
var SKILLS={
 LOW :{react:[0.45,0.85],speed:0.8 ,reeval:[1.1,2.0],jitter:0.20,pu:0.15,fooled:0.35},
 MED :{react:[0.28,0.55],speed:0.92,reeval:[0.8,1.5],jitter:0.12,pu:0.40,fooled:0.15},
 HIGH:{react:[0.15,0.32],speed:1.0 ,reeval:[0.5,1.0],jitter:0.06,pu:0.70,fooled:0.05}};
var timerEl=qs('#timer-val'),timerChip=qs('#timer-chip'),pillEl=qs('#target-pill'),
    toastsEl=qs('#toasts'),cdEl=qs('#countdown'),
    hudLeft=qs('#hud-left'),hudRight=qs('#hud-right');
var sboxEls=[null,null,null,null];
var lastScores={};
var stickZones=[];

/* collision */
function circleRectDist(px,py,rc){
 var cx=clamp(px,rc.x,rc.x+rc.w),cy=clamp(py,rc.y,rc.y+rc.h);
 return Math.hypot(px-cx,py-cy);}
function resolveCircleRect(o,r,rc){
 var cx=clamp(o.x,rc.x,rc.x+rc.w),cy=clamp(o.y,rc.y,rc.y+rc.h);
 var dx=o.x-cx,dy=o.y-cy,d=Math.sqrt(dx*dx+dy*dy);
 if(d>=r){return null;}
 if(d>0.001){var push=r-d;o.x+=dx/d*push;o.y+=dy/d*push;return{nx:dx/d,ny:dy/d};}
 var l=o.x-rc.x,ri=rc.x+rc.w-o.x,t=o.y-rc.y,b=rc.y+rc.h-o.y,m=Math.min(l,ri,t,b);
 if(m===l){o.x=rc.x-r;return{nx:-1,ny:0};}
 if(m===ri){o.x=rc.x+rc.w+r;return{nx:1,ny:0};}
 if(m===t){o.y=rc.y-r;return{nx:0,ny:-1};}
 o.y=rc.y+rc.h+r;return{nx:0,ny:1};}
function circleFits(x,y,r){
 if(x<PLAY.x+r+6||x>PLAY.x+PLAY.w-r-6||y<PLAY.y+r+6||y>PLAY.y+PLAY.h-r-6){return false;}
 var i;
 for(i=0;i<rects.length;i++){if(circleRectDist(x,y,rects[i])<r+8){return false;}}
 for(i=0;i<bumpers.length;i++){if(Math.hypot(bumpers[i].x-x,bumpers[i].y-y)<r+bumpers[i].r+8){return false;}}
 for(i=0;i<stickZones.length;i++){if(circleRectDist(x,y,stickZones[i])<r+16){return false;}}
 return true;}

/* world gen */
function rectHitsZone(rc,pad){
 for(var z=0;z<stickZones.length;z++){
  var zn=stickZones[z];
  if(rc.x<zn.x+zn.w+pad&&rc.x+rc.w+pad>zn.x&&rc.y<zn.y+zn.h+pad&&rc.y+rc.h+pad>zn.y){return true;}}
 return false;}
function addOb(kind,cx,cy,w,h,col,minGap){
 if(minGap==null){minGap=80;}
 var rc={kind:kind,x:cx-w/2,y:cy-h/2,w:w,h:h,col:col};
 if(rc.x<PLAY.x+24||rc.x+rc.w>PLAY.x+PLAY.w-24||rc.y<PLAY.y+TOPRES-20||rc.y+rc.h>PLAY.y+PLAY.h-40){return false;}
 if(rectHitsZone(rc,26)){return false;}
 for(var i=0;i<rects.length;i++){
  var a=rects[i];
  if(rc.x<a.x+a.w+minGap&&rc.x+rc.w+minGap>a.x&&rc.y<a.y+a.h+minGap&&rc.y+rc.h+minGap>a.y){return false;}}
 for(var j=0;j<bumpers.length;j++){
  var bb={x:bumpers[j].x-bumpers[j].r,y:bumpers[j].y-bumpers[j].r,w:bumpers[j].r*2,h:bumpers[j].r*2};
  if(circleRectDist(cx,cy,bb)<bumpers[j].r+70){return false;}}
 for(var s=0;s<players.length;s++){
  if(Math.hypot(players[s].x-cx,players[s].y-cy)<190){return false;}}
 rects.push(rc);return true;}
function addBumper(cx,cy){
 for(var i=0;i<rects.length;i++){if(circleRectDist(cx,cy,rects[i])<30+70){return false;}}
 for(var j=0;j<bumpers.length;j++){if(Math.hypot(bumpers[j].x-cx,bumpers[j].y-cy)<190){return false;}}
 for(var s=0;s<players.length;s++){if(Math.hypot(players[s].x-cx,players[s].y-cy)<185){return false;}}
 for(var z=0;z<stickZones.length;z++){if(circleRectDist(cx,cy,stickZones[z])<30+40){return false;}}
 bumpers.push({x:cx,y:cy,r:30,hit:0});return true;}
function addCluster(cx,cy){
 var pal=['#5fb7e8','#f4a03d','#9b6df2','#3fcf74','#ff8a3d','#e8657f'];
 var col=pal[irnd(0,pal.length-1)];
 var n=irnd(2,3);
 if(!addOb('block',cx,cy,52,52,col,16)){return;}
 for(var k=0;k<n-1;k++){
  var ox=(k===0?-1:1)*rnd(42,64),oy=rnd(-34,34);
  addOb('block',cx+ox,cy+oy,52,52,col,14);}}
/* OBSTACLES — guaranteed count: ~29 candidates spread over the map,
   placed in passes so at least MIN_OBS (12) always exist; usually ~20. */
function genObstacles(){
 rects=[];bumpers=[];
 var pal=['#5fb7e8','#f4a03d','#9b6df2','#3fcf74','#ff8a3d','#e8657f'];
 function C(){return pal[irnd(0,pal.length-1)];}
 var pw=PLAY.w,ph=PLAY.h;
 function P(fx,fy){return{x:PLAY.x+pw*fx,y:PLAY.y+ph*fy};}
 var cands=[];
 function cand(fx,fy,k,w,h){cands.push({fx:fx,fy:fy,k:k,w:w,h:h});}
 cand(0.18,0.30,'wall',210,28);
 cand(0.50,0.28,'block',170,62);
 cand(0.82,0.30,'cluster',52,52);
 cand(0.12,0.50,'block',120,110);
 cand(0.88,0.50,'cluster',52,52);
 cand(0.50,0.50,'bumper',60,60);
 cand(0.24,0.74,'block',170,62);
 cand(0.50,0.86,'cluster',52,52);
 cand(0.76,0.74,'block',170,62);
 cand(0.34,0.42,'wall',250,30);
 cand(0.66,0.58,'wall',250,30);
 cand(0.50,0.36,'wall',30,160);
 cand(0.16,0.38,'wall',30,140);
 cand(0.84,0.38,'wall',30,140);
 cand(0.32,0.62,'wall',30,130);
 cand(0.68,0.62,'wall',30,130);
 cand(0.08,0.68,'block',120,110);
 cand(0.92,0.68,'block',120,110);
 cand(0.38,0.38,'block',120,54);
 cand(0.62,0.38,'block',120,54);
 cand(0.36,0.66,'cluster',52,52);
 cand(0.64,0.66,'cluster',52,52);
 cand(0.16,0.84,'cluster',52,52);
 cand(0.84,0.84,'cluster',52,52);
 cand(0.30,0.52,'bumper',60,60);
 cand(0.70,0.52,'bumper',60,60);
 cand(0.22,0.84,'bumper',60,60);
 cand(0.78,0.84,'bumper',60,60);
 cand(0.44,0.24,'bumper',60,60);
 shuffleArr(cands);
 function count(){return rects.length+bumpers.length;}
 function place(c,gap){
  var pt=P(c.fx,c.fy);
  if(c.k==='bumper'){return addBumper(pt.x,pt.y);}
  if(c.k==='cluster'){return addCluster(pt.x,pt.y);}
  return addOb(c.k,pt.x,pt.y,c.w,c.h,C(),gap);}
 var i;
 for(i=0;i<cands.length&&count()<TARGET_OBS;i++){place(cands[i],80);}
 if(count()<MIN_OBS){
  for(i=0;i<cands.length&&count()<MIN_OBS;i++){place(cands[i],62);}}
 if(count()<8){
  for(i=0;i<cands.length&&count()<8;i++){place(cands[i],44);}}}
/* PAD DISTRIBUTION — GUARANTEES:
   1) HARD minimum gap: pad centres are always >= PAD_R*2+36 apart
      (a solid visible gap between pad edges) — the gap is NEVER relaxed,
      so pads can never touch or sit side-by-side.
   2) Even spread: 4x3 zone grid; jitter is BOUNDED to (zoneSize-MIN_GAP)/2
      so zone neighbours keep the minimum distance by construction.
   3) All 6 colours in every game: the plan starts with one of each colour
      (shuffled); a colour that fails its zone is retried anywhere valid
      and is never dropped. 12 pads total. */
function placePads(){
 pads=[];
 var x0=PLAY.x+PAD_R+16,x1=PLAY.x+PLAY.w-PAD_R-16;
 var y0=PLAY.y+TOPRES+PAD_R,y1=PLAY.y+PLAY.h-BOTRES-PAD_R;
 var zw=(x1-x0)/4,zh=(y1-y0)/3;
 /* hard minimum distance between pad centres (adaptive only so the
    4x3 grid can satisfy it on any viewport; never below PAD_R*2+36) */
 var MIN_GAP=Math.max(PAD_R*2+36,Math.min(zw*0.7,zh*0.62));
 /* jitter bounded so neighbouring zones always keep MIN_GAP */
 var jxMax=clamp((zw-MIN_GAP)/2,0,Math.max(0,zw*0.5-PAD_R-6));
 var jyMax=clamp((zh-MIN_GAP)/2,0,Math.max(0,zh*0.5-PAD_R-6));
 function farEnough(x,y){
  for(var i=0;i<pads.length;i++){
   if(Math.hypot(pads[i].x-x,pads[i].y-y)<MIN_GAP){return false;}}
  return true;}
 function tryPad(x,y,col){
  if(!circleFits(x,y,PAD_R)){return false;}
  if(!farEnough(x,y)){return false;}
  for(var s=0;s<players.length;s++){
   if(Math.hypot(players[s].x-x,players[s].y-y)<PAD_R+110){return false;}}
  pads.push({x:x,y:y,r:PAD_R,color:col,flash:0,badT:0,ring:0});
  return true;}
 var plan=shuffleArr([0,1,2,3,4,5]).concat(shuffleArr([0,1,2,3,4,5]));
 var zones=[];
 for(var r=0;r<3;r++){for(var c=0;c<4;c++){zones.push({c:c,r:r});}}
 shuffleArr(zones);
 var pending=[];
 for(var z=0;z<zones.length;z++){
  var col=plan[z%plan.length];
  var cx=x0+zw*(zones[z].c+0.5),cy=y0+zh*(zones[z].r+0.5);
  var placed=false;
  for(var att=0;att<40&&!placed;att++){
   var jx=att===0?0:rnd(-jxMax,jxMax);
   var jy=att===0?0:rnd(-jyMax,jyMax);
   if(tryPad(cx+jx,cy+jy,col)){placed=true;}}
  if(!placed){pending.push(col);}}
 for(var p2=0;p2<pending.length;p2++){
  for(var t2=0;t2<200;t2++){
   if(tryPad(rnd(x0,x1),rnd(y0,y1),pending[p2])){break;}}}
 var guard=0;
 while(pads.length<12&&guard<900){
  guard++;
  tryPad(rnd(x0,x1),rnd(y0,y1),(Math.random()*6)|0);}}
function freeSpot(r,awayFromPads){
 for(var t=0;t<100;t++){
  var x=rnd(PLAY.x+r+10,PLAY.x+PLAY.w-r-10);
  var y=rnd(PLAY.y+r+10,PLAY.y+PLAY.h-r-10);
  if(!circleFits(x,y,r)){continue;}
  if(awayFromPads){
   var bad=false;
   for(var p=0;p<pads.length;p++){
    if(Math.hypot(pads[p].x-x,pads[p].y-y)<pads[p].r+r+12){bad=true;}}
   if(bad){continue;}}
  for(var s=0;s<players.length;s++){

  stickZones.push({x:(sx-OX)/SCALE,y:(sy-OY)/SCALE,w:sw/SCALE,h:sh/SCALE});}

/* scoring — arrival penalty + repeated camping penalty */
function scoreRound(dt){

 for(var i=0;i<players.length;i++){
  var p=players[i],on=-1,ci=-1,j;

   if(Math.hypot(pads[j].x-p.x,pads[j].y-p.y)<pads[j].r*0.95){on=j;ci=pads[j].color;break;}}
  if(on<0){p.onPad=-1;p.campT=0;continue;}

   p.campT=0;
   if(p.scoreCd>0||p.penCd>0){p.onPad=on;continue;}

  }else if(p.onPad!==on){
   p.onPad=on;p.campT=0;

   }else{
    p.score=Math.max(0,p.score-1);sbDirty=true;

    p.vx+=kdx/kd*240;p.vy+=kdy/kd*240;

   if(p.penCd<=0){

     p.campT=0;

/* bot AI (isBot only, never humans) */
function pointClear(x,y,r){
 if(x<PLAY.x+r+4||x>PLAY.x+PLAY.w-r-4||y<PLAY.y+r+4||y>PLAY.y+PLAY.h-r-4){return false;}
 for(var i=0;i<rects.length;i++){if(circleRectDist(x,y,rects[i])<r+2){return false;}}
 for(var j=0;j<bumpers.length;j++){if(Math.hypot(bumpers[j].x-x,bumpers[j].y-y)<r+bumpers[j].r+2){return false;}}
 return true;}
function clearPath(x0,y0,x1,y1,r){
 var d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/36);
 for(var i=1;i<n;i++){var t=i/n;
  if(!pointClear(x0+(x1-x0)*t,y0+(y1-y0)*t,r+6)){return false;}}
 return true;}
function botAI(p,dt){
 var b=p.bot;
 if(b.serial!==targetSerial){b.serial=targetSerial;b.reactT=rnd(b.sk.react[0],b.sk.react[1]);b.goal=null;b.puGoal=null;}
 if(b.reactT>0){b.reactT-=dt;return;}
 b.reeval-=dt;
 if((!b.goal&&b.puGoal===null)||b.reeval<=0){
  b.reeval=rnd(b.sk.reeval[0],b.sk.reeval[1]);
  b.puGoal=null;
  if(pus.length&&Math.random()<b.sk.pu){
   var bp=null,bd=1e9;
   for(var pp=0;pp<pus.length;pp++){
    var dpu=Math.hypot(pus[pp].x-p.x,pus[pp].y-p.y);
    if(dpu<bd){bd=dpu;bp=pus[pp];}}
   if(bp&&bd<340&&clearPath(p.x,p.y,bp.x,bp.y,PR)){b.puGoal=bp;b.goal=null;}}
  if(!b.puGoal){
   var fooled=Math.random()<b.sk.fooled;
   var cands=[];
   for(var pc=0;pc<pads.length;pc++){
    if(fooled){if(pads[pc].color!==target.color){cands.push(pads[pc]);}}
    else{if(pads[pc].color===target.color){cands.push(pads[pc]);}}}
   if(!cands.length){for(var pa=0;pa<pads.length;pa++){cands.push(pads[pa]);}}
   var best=null,bs=1e9;
   for(var cd2=0;cd2<cands.length;cd2++){
    var d=Math.hypot(cands[cd2].x-p.x,cands[cd2].y-p.y);
    if(!clearPath(p.x,p.y,cands[cd2].x,cands[cd2].y,PR)){d+=420;}
    d+=rnd(0,120);
    if(d<bs){bs=d;best=cands[cd2];}}
   b.goal=best;}}
 var tx,ty,arrive;
 if(b.puGoal){
  var still=false;
  for(var q=0;q<pus.length;q++){if(pus[q]===b.puGoal){still=true;}}
  if(!still){b.puGoal=null;return;}
  tx=b.puGoal.x;ty=b.puGoal.y;arrive=34;}
 else if(b.goal){tx=b.goal.x;ty=b.goal.y;arrive=b.goal.r*0.4;}
 else{return;}
 var dx=tx-p.x,dy=ty-p.y,d2=Math.hypot(dx,dy);
 if(d2<arrive){p.inX=0;p.inY=0;if(b.puGoal){b.puGoal=null;}return;}
 var ang=Math.atan2(dy,dx);
 if(!clearPath(p.x,p.y,tx,ty,PR)){
  var offs=[0.55,-0.55,1.0,-1.0,1.5,-1.5,2.2,-2.2],found=-1;
  for(var o=0;o<offs.length;o++){
   var a2=ang+offs[o];
   if(pointClear(p.x+Math.cos(a2)*(PR+56),p.y+Math.sin(a2)*(PR+56),PR)){found=a2;break;}}
  ang=(found>=0)?found:ang+Math.PI;}
 ang+=Math.sin(nowSec*3.1+p.id*2.1)*b.sk.jitter;
 p.inX=Math.cos(ang);p.inY=Math.sin(ang);}

/* human input */
function humanInput(p){
 if(p.stick&&p.stick.active){p.inX=p.stick.vx;p.inY=p.stick.vy;return;}
 var km=KEYMAPS[p.id]||KEYMAPS[0],ix=0,iy=0,i;
 for(i=0;i<km.left.length;i++){if(keys[km.left[i]]){ix=-1;}}
 for(i=0;i<km.right.length;i++){if(keys[km.right[i]]){ix=1;}}
 for(i=0;i<km.up.length;i++){if(keys[km.up[i]]){iy=-1;}}
 for(i=0;i<km.down.length;i++){if(keys[km.down[i]]){iy=1;}}
 var l=Math.hypot(ix,iy);
 if(l>1){ix/=l;iy/=l;}
 p.inX=ix;p.inY=iy;}
var KEYMAPS=[
 {up:['KeyW'],left:['KeyA'],down:['KeyS'],right:['KeyD']},
 {up:['ArrowUp'],left:['ArrowLeft'],down:['ArrowDown'],right:['ArrowRight']},
 {up:['KeyI'],left:['KeyJ'],down:['KeyK'],right:['KeyL']},
 {up:['Numpad8'],left:['Numpad4'],down:['Numpad5','Numpad2'],right:['Numpad6']}];
var keys={};
function humansCount(){var n=0;for(var i=0;i<players.length;i++){if(!players[i].isBot){n++;}}return n;}
function buildHint(){
 if(touchSeen||humansCount()<1){return;}

 hintEl.innerHTML=h;hintEl.style.display='flex';hintEl.style.opacity='1';

/* player physics */
function updatePlayer(p,dt){
 p.stunT=Math.max(0,p.stunT-dt);p.frzT=Math.max(0,p.frzT-dt);
 p.speedT=Math.max(0,p.speedT-dt);p.cele=Math.max(0,p.cele-dt);
 p.penCd=Math.max(0,p.penCd-dt);p.moodT=Math.max(0,p.moodT-dt);
 p.hitCd=Math.max(0,p.hitCd-dt);p.scoreCd=Math.max(0,p.scoreCd-dt);
 p.nextBlink-=dt;
 if(p.nextBlink<=0){p.nextBlink=rnd(2.2,4.8);p.blinkT=0.13;}
 p.blinkT=Math.max(0,p.blinkT-dt);
 if(p.isBot){p.inX=0;p.inY=0;botAI(p,dt);}
 else{humanInput(p);}
 var ix=p.inX,iy=p.inY;
 if(p.frzT>0){ix=0;iy=0;}
 else if(p.stunT>0){ix*=0.3;iy*=0.3;}
 var sp=p.sp*p.spMul*(p.speedT>0?1.55:1);
 var k=Math.min(1,dt*10);
 p.vx+=(ix*sp-p.vx)*k;p.vy+=(iy*sp-p.vy)*k;
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 p.x=clamp(p.x,PLAY.x+PR,PLAY.x+PLAY.w-PR);
 p.y=clamp(p.y,PLAY.y+PR,PLAY.y+PLAY.h-PR);
 for(var i=0;i<rects.length;i++){
  var n=resolveCircleRect(p,PR,rects[i]);
  if(n){
   p.vx*=0.55;p.vy*=0.55;
   var spd0=Math.hypot(p.vx,p.vy);
   if(p.hitCd<=0&&spd0>60){p.hitCd=0.28;burst(p.x-n.nx*PR,p.y-n.ny*PR,'#d9c9a8',5);sThud();}}}
 for(var j=0;j<bumpers.length;j++){
  var b=bumpers[j];
  var dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);
  if(d<b.r+PR&&d>0.01){
   var nx=dx/d,ny=dy/d;
   p.x=b.x+nx*(b.r+PR);p.y=b.y+ny*(b.r+PR);
   p.vx+=nx*280;p.vy+=ny*280;
   if(b.hit<=0){b.hit=0.35;sBounce();burst(b.x,b.y-b.r*0.4,'#ffd9a8',6);}}}
 var spd=Math.hypot(p.vx,p.vy);
 p.walk+=dt*(3+spd*0.028);
 if(spd>25){p.fx=p.vx/spd;p.fy=p.vy/spd;}
 if(spd>230&&Math.random()<dt*12&&particles.length<150){
  particles.push({x:p.x+rnd(-7,7),y:p.y+4,vx:-p.fx*40+rnd(-15,15),vy:rnd(-32,-10),life:0.35,col:'rgba(180,160,130,.5)',r:3});}
 if(p.speedT>0&&Math.random()<dt*22&&particles.length<150){
  particles.push({x:p.x-p.fx*16,y:p.y-16+rnd(-7,7),vx:-p.fx*30,vy:-20,life:0.3,col:'rgba(255,194,51,.8)',r:2.5});}}

/* main update */
function update(dt){
 nowSec+=dt;
 if(hitStop>0){hitStop=Math.max(0,hitStop-dt);updFx(dt);return;}
 if(state==='count'){
  cd-=dt;
  var n=Math.ceil(cd);
  if(n!==cdShown){
   cdShown=n;
   cdEl.textContent=n>0?String(n):'GO!';
   cdEl.classList.remove('pop');void cdEl.offsetWidth;cdEl.classList.add('pop');
   if(n>0){sCount();}
   else{sGo();flashT=0.25;burst(W/2,H*0.45,'#ffffff',30);}}
  if(cd<=-0.6){cdEl.classList.remove('show');state='playing';newTarget(true);}
  updFx(dt);return;}
 if(state==='ended'){
  endT-=dt;updFx(dt);
  for(var q=0;q<players.length;q++){updatePlayer(players[q],dt*0.2);}
  if(endT<=0){showResults();}
  return;}
 if(state!=='playing'){return;}
 timer-=dt;
 if(timer<=0){
  timer=0;state='ended';endT=1.6;

   ctx.lineTo(bx-p.fx*(40+i*10),by+2+off);
   ctx.stroke();}}}
function render(){
 if(!cache){return;}
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#0a1428';ctx.fillRect(0,0,cv.width,cv.height);
 var shx=0,shy=0;
 if(shakeT>0){var m=shakeT*9*DPR;shx=rnd(-m,m);shy=rnd(-m,m);}
 ctx.drawImage(cache,shx,shy);
 ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,OX*DPR+shx,OY*DPR+shy);
 for(var i=0;i<pads.length;i++){drawPad(pads[i]);}
 for(var u=0;u<pus.length;u++){drawPowerUp(pus[u]);}
 for(var r=0;r<rects.length;r++){drawObstacle(rects[r]);}
 for(var b=0;b<bumpers.length;b++){drawBumper(bumpers[b]);}
 var order=players.slice().sort(function(a,b2){return a.y-b2.y;});
 for(var p=0;p<order.length;p++){drawPlayer(order[p]);}
 if(arenaPulse>0&&target.color>=0){
  var pr=(1-arenaPulse)*Math.max(W,H)*0.5+50;
  ctx.globalAlpha=arenaPulse*0.35;
  ctx.lineWidth=12;ctx.strokeStyle=COLOURS[target.color].hex;
  ctx.beginPath();ctx.arc(W/2,H/2,pr,0,6.2832);ctx.stroke();
  ctx.globalAlpha=1;}
 ctx.fillStyle='rgba(255,255,255,.14)';
 for(var mt=0;mt<motes.length;mt++){
  var mx=(motes[mt].x+nowSec*8*motes[mt].s)%W;
  var my=(motes[mt].y-nowSec*14*motes[mt].s+H*2)%H;
  ctx.beginPath();ctx.arc(mx,my,2.2*motes[mt].s,0,6.2832);ctx.fill();}
 for(var pt=0;pt<particles.length;pt++){
  ctx.globalAlpha=Math.max(0,Math.min(1,particles[pt].life*1.8));
  ell(particles[pt].x,particles[pt].y,particles[pt].r,particles[pt].r,particles[pt].col);}
 ctx.globalAlpha=1;
 for(var f=0;f<floats.length;f++){
  var fl=floats[f];
  var a=Math.min(1,fl.life/fl.max*2),sc=1+(1-fl.life/fl.max)*0.12;
  ctx.globalAlpha=a;
  wtxt(fl.txt,fl.x,fl.y,fl.size*sc,fl.col,'rgba(15,25,45,.9)',fl.size/4);
  ctx.globalAlpha=1;}
 ctx.setTransform(1,0,0,1,0,0);
 if(flashT>0){
  ctx.globalAlpha=Math.min(1,flashT*3);
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalAlpha=1;}
 if(warnT>0){
  ctx.globalAlpha=Math.min(0.5,warnT*1.5);
  var g=ctx.createRadialGradient(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*0.34,cv.width/2,cv.height/2,Math.max(cv.width,cv.height)*0.72);
  g.addColorStop(0,'rgba(244,67,78,0)');g.addColorStop(1,'rgba(244,67,78,1)');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalAlpha=1;}}
</script>

<!-- ======== BLOCK 4: flow, input, lifecycle, boot ======== -->
<script>
'use strict';
function stickCorner(id){return id===0?'bl':id===1?'tl':id===2?'br':'tr';}
function buildSticks(){
 mctlEl.innerHTML='';
 if(!touchSeen){return;}
 var hs=[];
 for(var i=0;i<players.length;i++){if(!players[i].isBot){hs.push(players[i]);}}
 if(!hs.length){return;}
 for(var h=0;h<hs.length;h++){
  (function(p){
   var el=document.createElement('div');
   el.className='stick '+stickCorner(p.id);
   el.innerHTML='<div class="stick-base"><div class="stick-knob"></div></div>';
   var base=el.querySelector('.stick-base'),knob=el.querySelector('.stick-knob');
   base.style.borderColor=p.col;
   base.style.background='linear-gradient(155deg,'+hexA(p.col,0.34)+',rgba(8,16,34,0.30))';
   base.style.boxShadow='0 8px 22px rgba(0,0,0,.42),0 0 0 5px '+hexA(p.col,0.16)+',inset 0 0 20px '+hexA(p.col,0.28);
   knob.style.background='radial-gradient(circle at 32% 28%,#ffffff 0%,'+p.col+' 46%,'+shade(p.col,-0.28)+' 100%)';
   var st={id:null,vx:0,vy:0,active:false};
   p.stick=st;
   function radius(){return Math.max(30,base.getBoundingClientRect().width*0.37);}
   function ripple(){
    var rp=document.createElement('span');rp.className='ripple';
    base.appendChild(rp);
    setTimeout(function(){if(rp.parentNode){rp.remove();}},480);}
   function handle(x,y){
    var R=radius(),rc=base.getBoundingClientRect();
    var dx=x-(rc.left+rc.width/2),dy=y-(rc.top+rc.height/2);
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d>R){dx*=R/d;dy*=R/d;d=R;}
    knob.style.transform='translate('+dx+'px,'+dy+'px) scale(1.06)';
    var nx=dx/R,ny=dy/R,nl=Math.sqrt(nx*nx+ny*ny);
    if(nl<0.14){st.vx=0;st.vy=0;}else{st.vx=nx;st.vy=ny;}
    st.active=true;el.classList.add('on');}
   function rel(){
    st.id=null;st.active=false;st.vx=0;st.vy=0;
    knob.style.transform='translate(0px,0px) scale(1)';
    el.classList.remove('on');}
   if(HAS_TOUCH_META){
    on(el,'touchstart',function(e){
     e.preventDefault();
     if(st.id!==null){return;}
     var t=e.changedTouches[0];st.id=t.identifier;
     handle(t.clientX,t.clientY);ripple();vib(8);},{passive:false});
    on(el,'touchmove',function(e){
     e.preventDefault();
     for(var k=0;k<e.changedTouches.length;k++){
      var t2=e.changedTouches[k];
      if(t2.identifier===st.id){handle(t2.clientX,t2.clientY);}}},{passive:false});
    var tend=function(e){
     for(var k=0;k<e.changedTouches.length;k++){
      if(e.changedTouches[k].identifier===st.id){rel();break;}}};
    on(el,'touchend',tend);
    on(el,'touchcancel',tend);
   }else if(window.PointerEvent){
    on(el,'pointerdown',function(e){
     e.preventDefault();
     if(st.id!==null){return;}
     st.id=e.pointerId;
     try{el.setPointerCapture(e.pointerId);}catch(_){}
     handle(e.clientX,e.clientY);ripple();});
    on(el,'pointermove',function(e){if(e.pointerId!==st.id){return;}e.preventDefault();handle(e.clientX,e.clientY);});
    on(el,'pointerup',function(e){if(e.pointerId===st.id){rel();}});
    on(el,'pointercancel',function(e){if(e.pointerId===st.id){rel();}});
   }else{
    on(el,'mousedown',function(e){
     if(st.id!==null){return;}
     st.id='m';handle(e.clientX,e.clientY);
     var mv=function(ev){handle(ev.clientX,ev.clientY);};
     var up=function(){rel();document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
     document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
   }
   mctlEl.appendChild(el);
  })(hs[h]);
 }
 computeStickZones();}
function releaseSticks(){
 for(var i=0;i<players.length;i++){
  var p=players[i];
  if(p.stick){p.stick.id=null;p.stick.active=false;p.stick.vx=0;p.stick.vy=0;}}
 var ks=mctlEl.querySelectorAll('.stick');
 for(var j=0;j<ks.length;j++){
  ks[j].classList.remove('on');
  var kn=ks[j].querySelector('.stick-knob');
  if(kn){kn.style.transform='translate(0px,0px) scale(1)';}}}

/* ===== FULLSCREEN — requested from a user gesture (PLAY / START / RESTART).
   Silently skipped on browsers that don't allow it (e.g. iOS Safari). ===== */
function fsElement(){
 return document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement||null;}
function enterFullscreen(){
 if(fsElement()){return;}
 var el=document.documentElement;
 var fn=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen||el.msRequestFullscreen;
 if(!fn){return;}
 try{
  var p=fn.call(el,{navigationUI:'hide'});
  if(p&&p.catch){p.catch(function(){});}
 }catch(e){}}

/* match flow */
function startMatch(){
  /* a new match is the interstitial break; the shell always answers */
  Studio.ads.interstitial(__startMatch);
}
function __startMatch(){
 buildWorld(false);
 buildSticks();
 showScreen('scr-game');
 hideOv('ov-pause');
 paused=false;
 try{buildCache();}catch(e){}
 buildHint();
 if(touchSeen){toast('TOUCH CONTROLS READY',players[0].col);}
 pillEl.textContent='READY';
 pillEl.style.background='#43506a';pillEl.style.borderColor='#26314a';
 timerEl.textContent='60';timerChip.className='';lastSec=-1;
 state='count';cd=3.999;cdShown=99;
 cdEl.classList.add('show');
 requestResize();}

/* RESULTS — dynamic winner only, tie-safe */
function showResults(){
 state='idle';
 var sorted=players.slice().sort(function(a,b){return b.score-a.score;});
 var top=sorted.length?sorted[0].score:0;
 var winners=sorted.filter(function(p){return p.score===top;});
 var isTie=winners.length>1;
 var isFullTie=winners.length===sorted.length;
 var head=qs('#res-head'),rows=qs('#res-rows'),act=qs('#res-actions'),right=qs('#res-right');
 if(isTie){
  head.innerHTML='<div class="res-title win"><span>'+(isFullTie?'DRAW!':'TIE GAME!')+'</span></div>'+
   '<div class="res-ribbon">'+winners.map(function(w){return w.name;}).join(' & ')+(isFullTie?' — ALL TIED!':' TIED!')+'</div>'+
   '<div class="res-sub2">FINAL SCORES</div>';
  right.innerHTML='<div class="pod-wrap"><div class="pod-row">'+
   winners.map(function(w){return '<span class="pod-blob">'+blobSVG(w.col)+'</span>';}).join('')+
   '</div><div class="podium"><span class="pod-ribbon">'+(isFullTie?'DRAW!':'TIE!')+'</span></div></div>';
  confettiGo();sWin();
 }else{
  var w0=winners[0];
  var humanWin=(w0.id===0);
  var celebrate=humanWin||matchMode==='friends';
  if(celebrate){
   head.innerHTML='<div class="res-title win"><span>TIME UP!</span></div>'+
    '<div class="res-ribbon">'+w0.name+' WINS!</div>'+
    '<div class="res-sub2">FINAL SCORES</div>';
   right.innerHTML='<div class="pod-wrap"><span class="pod-crown ic">'+ICONS.crown+'</span>'+
    '<div class="pod-row"><span class="pod-blob">'+blobSVG(w0.col)+'</span></div>'+
    '<div class="podium"><span class="pod-ribbon">'+w0.name+' WINS!</span></div></div>';
   confettiGo();sWin();
  }else{
   head.innerHTML='<div class="res-title lose">GAME OVER</div>'+
    '<div class="res-ribbon" style="background:'+w0.col+';box-shadow:0 4px 0 rgba(0,0,0,.35)">'+w0.name+' WINS!</div>'+
    '<div class="res-sub2" style="color:#ff8a8a">BETTER LUCK NEXT TIME!</div>';
   right.innerHTML='<div class="lose-wrap">'+blobSVG('#9aa4b5',true)+'</div>';
   sLose();}}
 var MEDALS=['#ffc233','#c9d6ea','#e0955c','#8fa6c8'];
 rows.innerHTML=sorted.map(function(p,i){
  var tied=(p.score===top);
  var crown=(tied&&!isTie)?'<span class="rwin ic solo">'+ICONS.crown+'</span>':'<span class="rwin"></span>';
  return '<div class="rrow'+(tied?' win':'')+'">'+crown+
   '<span class="rk" style="background:'+MEDALS[i]+';color:'+(tied?'#5a3c00':'#fff')+'">'+(i+1)+'</span>'+
   '<span class="rchip" style="background:linear-gradient(150deg,'+shade(p.col,0.28)+','+p.col+')"></span>'+
   '<span class="rtag">'+(p.isBot?'BOT':'HUMAN')+'</span>'+
   '<b class="rscore">'+p.score+'</b></div>';}).join('');
 act.innerHTML='<button class="btn btn-green" id="res-retry">PLAY AGAIN</button><button class="btn" id="res-menu">MAIN MENU</button>';
 mountIcons(qs('#scr-results'));
 bindTap(qs('#res-retry'),function(){qs('#confetti').innerHTML='';enterFullscreen();startMatch();});
 bindTap(qs('#res-menu'),function(){Studio.ads.interstitial(function(){showScreen('scr-home');});});
 showScreen('scr-results');}
function confettiGo(){
 var conf=qs('#confetti');conf.innerHTML='';
 var cs=['#f4434e','#ffc233','#35c95f','#2f80f6','#a35df2','#ff5fa2'];
 for(var i=0;i<70;i++){
  var d=document.createElement('i');d.className='cf';
  d.style.cssText='left:'+(Math.random()*100)+'%;background:'+cs[i%6]+';width:'+(6+Math.random()*7)+'px;height:'+(9+Math.random()*8)+'px;animation-duration:'+(2.4+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*1.2)+'s;border-radius:'+(Math.random()<0.4?'50%':'2px');
  conf.appendChild(d);}}

/* pause / resume */
function gamePause(){
 if(!inGame||paused||destroyed){return;}
 if(state!=='playing'&&state!=='count'&&state!=='ended'){return;}
 paused=true;showOv('ov-pause');releaseSticks();setSticksVisible(false);keys={};
 if(actx&&actx.state==='running'){actx.suspend();}}
function gameResume(){
 if(!inGame||destroyed||!paused){return;}
 paused=false;hideOv('ov-pause');
 setSticksVisible(true);
 if(actx&&actx.state==='suspended'){actx.resume();}}

/* navigation — PLAY / START / RESTART / PLAY AGAIN enter fullscreen */
bindTap(qs('#btn-play'),function(){enterFullscreen();showScreen('scr-setup');renderSetup();});
bindTap(qs('#btn-how'),function(){showScreen('scr-how');});
bindTap(qs('#btn-settings'),function(){showScreen('scr-settings');});
bindTap(qs('#how-back'),function(){showScreen('scr-home');});
bindTap(qs('#set-back'),function(){showScreen('scr-home');});
bindTap(qs('#btn-start'),function(){enterFullscreen();startMatch();});
bindTap(qs('#btn-pause'),function(){gamePause();});
bindTap(qs('#ov-resume'),function(){gameResume();});
bindTap(qs('#ov-restart'),function(){enterFullscreen();startMatch();});
bindTap(qs('#ov-menu'),function(){paused=false;state='idle';showScreen('scr-home');});
bindTap(qs('#err-ok'),function(){qs('#err').style.display='none';});
bindTap(qs('#mode-friends'),function(){setup.mode='friends';saveSetup();renderSetup();});
bindTap(qs('#mode-bots'),function(){setup.mode='bots';saveSetup();renderSetup();});
on(document,'click',function(e){if(e.target.closest&&e.target.closest('button')){sClick();}});

/* keyboard */
on(window,'keydown',function(e){
 keys[e.code]=true;
 if(inGame&&(e.code.indexOf('Arrow')===0||e.code==='Space')){e.preventDefault();}
 if((e.code==='Escape'||e.code==='KeyP')&&inGame){
  if(paused){gameResume();}else{gamePause();}}});
on(window,'keyup',function(e){keys[e.code]=false;});

/* touch hygiene */
on(document,'touchmove',function(e){
 if(e.target.closest&&(e.target.closest('.car-track')||e.target.closest('input[type=range]')||e.target.closest('.screen.scrollable')||e.target.closest('.stick'))){return;}
 e.preventDefault();},{passive:false});
on(document,'gesturestart',function(e){e.preventDefault();});
on(document,'contextmenu',function(e){e.preventDefault();});
on(document,'dblclick',function(e){e.preventDefault();});

/* audio unlock + joystick auto-recovery */
on(document,'touchstart',function(){
 touchSeen=true;
 initAudio();
 if(actx&&actx.state==='suspended'&&!paused){actx.resume();}
 if(inGame&&!paused&&players.length&&!mctlEl.childElementCount){
  buildSticks();setSticksVisible(true);}
},true);
on(document,'pointerdown',function(){
 initAudio();
 if(actx&&actx.state==='suspended'&&!paused){actx.resume();}},true);

/* orientation hint (never blocks) */
function updRotate(){
 qs('#rotate').style.display=(touchSeen&&CH>0&&CH>CW)?'flex':'none';}

/* safe resize — also fired when fullscreen mode changes */
var resizeQueued=false;
function requestResize(){
 if(resizeQueued){return;}
 resizeQueued=true;
 requestAnimationFrame(function(){resizeQueued=false;doResize();});}
function viewportSize(){
 var vv=window.visualViewport;
 var w=(vv&&vv.width>50)?vv.width:window.innerWidth;
 var h=(vv&&vv.height>50)?vv.height:window.innerHeight;
 return{w:Math.round(w),h:Math.round(h)};}
function doResize(){
 try{
  var v=viewportSize(),w=v.w,h=v.h;
  if(!(w>0)||!(h>0)){return;}
  var prevA=(CW>0&&CH>0)?CW/CH:0;
  CW=w;CH=h;
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  if(!(cv.width>0&&cv.height>0)){return;}
  cv.style.width=CW+'px';cv.style.height=CH+'px';
  var rs=document.documentElement.style;
  rs.setProperty('--u',(Math.min(CH,900)/100)+'px');
  rs.setProperty('--w',(Math.min(CW,1600)/100)+'px');
  var S=stickSizePx();
  rs.setProperty('--stk',S+'px');
  var sideRoom=(CW/2)-hudRowHalf();
  rs.setProperty('--topstk',(sideRoom>=S+22)?14:156+'px');
  if(inGame&&players.length&&prevA>0&&(state==='playing'||state==='count')&&Math.abs(CW/CH-prevA)>0.08){
   buildWorld(true);
   buildSticks();setSticksVisible(!paused);
  }else if(inGame){
   fitView();computeStickZones();
  }
  buildCache();
  updRotate();
 }catch(e){showFatal(e);}}
on(window,'resize',requestResize);
on(window,'orientationchange',function(){requestResize();setTimeout(requestResize,300);});
on(document,'fullscreenchange',requestResize);
on(document,'webkitfullscreenchange',requestResize);
if(window.visualViewport&&window.visualViewport.addEventListener){
 on(window.visualViewport,'resize',requestResize);
 on(window.visualViewport,'scroll',requestResize);}
on(window,'blur',function(){if(inGame&&!paused){gamePause();}});
on(document,'visibilitychange',function(){
 if(document.hidden){if(inGame&&!paused){gamePause();}}
 else if(actx&&actx.state==='suspended'&&!paused){actx.resume();}});

/* single game loop */
var raf=0,lastT=performance.now();
function frame(t){
 if(destroyed){return;}
 raf=requestAnimationFrame(frame);
 var dt=Math.min(0.05,Math.max(0,(t-lastT)/1000));
 lastT=t;
 if(inGame&&!paused){try{update(dt);}catch(e){showFatal(e);}}
 if(inGame){try{render();}catch(e){showFatal(e);}}}
raf=requestAnimationFrame(frame);

/* STUDIO SDK LIFECYCLE — window.Game */
window.Game={
 pause:function(){gamePause();},
 resume:function(){gameResume();},
 setMuted:function(m){muted=!!m;applyVolumes();},
 destroy:function(){
  destroyed=true;
  cancelAnimationFrame(raf);
  LISTENERS.forEach(function(l){try{l[0].removeEventListener(l[1],l[2],l[3]);}catch(e){}});
  LISTENERS.length=0;
  if(musTimer){clearInterval(musTimer);musTimer=null;}
  try{if(actx){actx.close();}}catch(e){}
  actx=null;
  players=[];pads=[];rects=[];bumpers=[];pus=[];particles=[];floats=[];motes=[];stickZones=[];
  mctlEl.innerHTML='';mctlEl.classList.remove('show');
  hudLeft.innerHTML='';hudRight.innerHTML='';
  qs('#confetti').innerHTML='';toastsEl.innerHTML='';
  state='idle';inGame=false;paused=false;cache=null;}};

/* boot */
(function boot(){
 try{
  if(typeof buildWorld!=='function'||typeof update!=='function'||typeof render!=='function'){
   showFatal('Engine block failed to load. Check the syntax error above.');
   return;}
  mountIcons(document);
  buildHome();
  renderSetup();
  buildCarousel();
  bindSettings();
  doResize();
 }catch(e){showFatal(e);}
})();
</script>
<script>
(function(){
  var prev=window.Game||{};
  /* Shell sound is a master switch here: the game's own SFX / music sliders keep
     their own level, so neither side overwrites the other's slider. */
  function applySettings(s){
    if(!s) return;
    try{
      if(typeof s.sound==='boolean'){ muted=!s.sound; }
      if(typeof s.haptics==='boolean'){ settings.vib=s.haptics; }
      applyVolumes();
      var c=document.getElementById('set-vib'); if(c) c.classList.toggle('on',!!settings.vib);
    }catch(e){}
  }
  applySettings(Studio.settings);
  /* Banner: board-type arena, so it rides under the board on the game screen. */
  var want=false;
  setInterval(function(){
    var g=document.getElementById('scr-game');
    var show=!!(g&&g.classList.contains('active')&&!paused);
    if(show!==want){ want=show; Studio.ads.banner(show); }
  },400);
  window.Game=Object.assign({},prev,{
    pause:function(){ if(prev.pause) try{ prev.pause(); }catch(e){} },
    resume:function(){ if(prev.resume) try{ prev.resume(); }catch(e){} applySettings(Studio.settings); },
    setMuted:function(m){ muted=!!m; applyVolumes(); },
    setSettings:function(s){ applySettings(s); if(s) Studio.pushSettings({sound:s.sound,haptics:s.haptics}); }
  });
})();
</script>
