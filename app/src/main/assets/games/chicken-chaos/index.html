REDUNDANT STUDIOS — GAMEBOX MANIFEST
game: Chicken Chaos | version: 4
tier: 1 (Vanilla JS + Canvas 2D) | ads: interstitial when the player taps PLAY AGAIN
        or MENU on the result card — never over the result itself. The shell's banner
        is untouched, rewarded helper wired to the bridge.
locked: landscape (the SHELL owns the turn — GameActivity → SENSOR_LANDSCAPE), one
        in-game exit (BACK), settings synced both ways (Game.setSettings), lifecycle
        pause/resume/destroy, gesture-gated audio unlock, no input lock.
modes: 2-4 players on one screen | VS BOTS (1 human + 1-3 bots)
changelog 4: Device-feedback round on the v3 look. Back / gear are now the game's own
        UNSELECTED toggle button — the dark translucent brown of LOCAL / VS BOTS —
        with white icons, and the in-game pause keeps its ORIGINAL dark translucent
        disc with a light rim ('rgba(40,30,20,.6)' / 'rgba(255,255,255,.4)'). Catch
        boxes are a little SMALLER than the round pause button (37 vs 43 px here).
        The GRAB THE CHICKEN hint moved to the BOTTOM band (it was crowding the HUD
        strip at the top). Result card: narrower (658 px here, was 776 = 90% of the
        screen), the board is a cream-to-wood vertical gradient, the LEFT half is a
        grass paddock SIZED TO THE BIRD with the START-PAGE chicken standing on it —
        plain white, no colour wash, drawn straight onto the canvas so the comb and
        beak are no longer cropped by the old sprite box — and the win/tie headline
        wears the TIME UP! styling (yellow ' #ffd23e' with the dark-brown outline).
changelog 3: In-game texts are now captions, not billboards: GO!, the countdown
        digits, the "GRAB THE CHICKEN" pill (which hugs its text) and TIME UP! are
        all viewport-scaled and much smaller. Back / gear / pause are drawn as the
        game's OWN green action button (same face, outline and gloss as PLAY) with a
        white icon — the shell's cream card look is gone from the chrome. The DASH
        caption is removed, so the chevrons sit exactly on the button centre. Result
        card rebuilt: the winner's chicken fills the LEFT half (own contact shadow +
        winner-colour halo, sized from the half), the RIGHT half carries
        "NAME WINS!" / "IT'S A TIE!", a per-player catch table (colour chip, colour
        name, count, and the winner named in words) and the two buttons. The colour
        WINNER BAND and every star are gone. The winner chicken's tint no longer
        leaves a translucent colour square across the bird's lower half — the tint
        rect now covers the whole sprite instead of one quadrant. Interstitial moved
        off match end: it runs when the player taps PLAY AGAIN / MENU.
changelog 2: A chicken caught is now the ONLY score (the "/10" target is gone and
        nobody can end the match early — the winner is whoever caught more inside
        MATCH_TIME). Square, larger catch boxes flanking the timer / pause. In-game
        texts (GO! / hint pill / TIME UP!) size to the viewport and auto-fit instead
        of being fixed 100-140px. Chicken slowed (208 → 168, calmer panic sprint,
        slower turn). Last-10-second warning ticks, harder inside the last 5. DASH
        icon centred on its button. Result pop-up rebuilt in the game's cream/wood
        card language with one catch tile per player. Interstitial ad on match end.
        Back / gear / pause chrome drawn in the game theme (no flat "cut" gloss, no
        offset glyphs). First tap is audible: the pre-unlock audio queue can no
        longer be eaten by the idle cluck. Game.setSettings + shell volume, WebView
        fullscreen request removed (the shell's turn is the only display change).

<script>
"use strict";

/* ============================================================
   STUDIO SDK
============================================================ */
const Studio = (() => {
  const bridge = () => window.NativeBridge || null;
  const ls = {
    get k(){
      try{return localStorage;}
      catch{return null;}
    }
  };
  let settings = { sound: true, haptics: true };
  try {
    const s = (
      bridge()
        ? bridge().load('shell:settings')
        : ls.k?.getItem('shell:settings')
    );
    if (s) settings = Object.assign(settings, JSON.parse(s));
  } catch{}
  return {
    save:(k,v)=>{
      const b=bridge();
      if(b) b.save(k,v);
      else try{ls.k.setItem(k,v);}catch{}
    },
    load:(k)=>{
      const b=bridge();
      if(b) return b.load(k);
      try{return ls.k?.getItem(k)||null;}catch{return null;}
    },
    haptic:(kind)=>{
      if(!settings.haptics) return;
      const b=bridge();
      if(!b) return;
      const map={
        light:15,
        medium:30,
        heavy:60,
        success:45
      };
      try{
        b.haptic(typeof map[kind]==='number'?map[kind]:0);
      }catch(_){}
    },
    settings,
    /* Ask the shell to leave the game and return to the menu. A no-op in a
       plain browser tab, where there is no shell to go back to. */
    exitGame(){
      const b=bridge();
      if(b&&b.exitGame){ try{ b.exitGame(); }catch(_){} }
    },
    ads:{
      /* The shell fires the rewarded callback with NO argument on success (and
         "closed" / "unavailable" otherwise), so testing for 'granted' swallowed
         every reward — the same landmine Ludo hit (PROGRESS.md). Anything that
         is not an explicit failure counts as a reward. */
      rewarded(placement,onReward){
        const b=bridge();
        if(!b||!b.showRewardedAd) return;
        window.__studioAdCb=function(result){
          if(result!=='closed'&&result!=='unavailable'&&onReward) onReward();
        };
        try{ b.showRewardedAd('__studioAdCb'); }catch(_){}
      },
      /* Match-end break. The shell always answers — 'closed' when the ad played,
         'unavailable' when it could not (offline / no fill) — so the game always
         gets its continuation back and can never hang on a missing callback. */
      interstitial(onDone){
        const b=bridge();
        if(b&&b.showInterstitial){
          window.__studioInterCb=function(){ if(onDone) onDone(); };
          try{ b.showInterstitial('__studioInterCb'); return; }catch(_){}
        }
        if(onDone) onDone();
      }
    }
  };
})();

/* ============================================================
   ERROR HANDLING
============================================================ */
function showErr(e){
  try{
    const d=document.getElementById('err');
    document.getElementById('errmsg').textContent=(e&&(e.message||e))||'Unknown error';
    d.style.display='flex';
  }catch(_){}
}
window.addEventListener('error',ev=>{ if(document.getElementById('err').style.display!=='flex') showErr(ev.error||ev.message); });

/* ============================================================
   CFG — all tunable gameplay numbers
============================================================ */
const CFG = {
  MATCH_TIME: 60,
  /* Last seconds of the match get a per-second warning tick; inside the final
     five the tick is louder and the handset buzzes. */
  WARN_SEC: 10,
  FINAL_SEC: 5,

  PLAYER_RADIUS: 24,
  PLAYER_OBSTACLE_RADIUS: 18,
  PLAYER_MAX_SPEED: 255,
  PLAYER_ACCEL: 1550,
  PLAYER_FRICTION: 0.86,
  CARRY_SPEED_MULT: 0.9,

  CHICKEN_RADIUS: 17,
  /* Slower bird: a carrying player (255 x 0.9 = 229) can actually close on it.
     Panic is a nudge, not a sprint, and the turn rate keeps it catchable. */
  CHICKEN_SPEED: 168,
  CHICKEN_TURN: 4.6,
  CHICKEN_FLEE: 132,
  CHICKEN_PANIC: 1.10,

  CARRY_TIME: 2,

  DASH_SPEED: 640,
  DASH_DURATION: 0.19,
  DASH_COOLDOWN: 1.35,

  STEAL_THRESH: 235,
  DASH_STEAL: 130,

  PU_INTERVAL: 7,
  PU_LIFETIME: 10,
  PU_MAX: 3,

  SPEED_BOOST_DURATION: 4,
  SPEED_BOOST_MULT: 1.45,

  SHIELD_DURATION: 6,

  FREEZE_DURATION: 2.2,
  FREEZE_RADIUS: 430,
  FREEZE_SLOW: 0.14,

  MAX_PARTICLES: 210,
  CAMERA_SHAKE_MAX: 4.5
};

/* ============================================================
   CONSTANTS & PALETTE
============================================================ */
const TAU=Math.PI*2, PI=Math.PI;
const WORLD_W=1720, WORLD_H=1040;
const FZ={x:120,y:180,w:1480,h:770};              // fence line
const AR={x:140,y:200,w:1440,h:730};              // playable arena
const OUT='#3b2b1e';
const PCOL=[
  {n:'P1', cn:'RED',    m:'#ef4d3c', d:'#a82c22', l:'#ff9b8a'},
  {n:'P2', cn:'YELLOW', m:'#f6b41e', d:'#b07c0a', l:'#ffdf7e'},
  {n:'P3', cn:'BLUE',   m:'#3d8ee0', d:'#20588f', l:'#8cc4f2'},
  {n:'P4', cn:'PURPLE', m:'#a05cd6', d:'#6b349a', l:'#d3aaf0'}
];
const FONT="'Luckiest Guy','Trebuchet MS','Segoe UI',Verdana,sans-serif";

/* ============================================================
   UTILITIES
============================================================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const nang=a=>Math.atan2(Math.sin(a),Math.cos(a));
const dsc=y=>0.88+0.28*clamp((y-AR.y)/AR.h,0,1); // depth scale: far small, near big
function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
/* One shared capability probe + a cached letterSpacing: both were being
   re-evaluated on EVERY text run (the game draws 20-50 of them a frame), and
   writing ctx.letterSpacing twice per run forced the text engine to rebuild
   its shaping cache each time. That is what made the whole game crawl. */
const CAN_TRACK = (() => {
  try { return 'letterSpacing' in document.createElement('canvas').getContext('2d'); }
  catch (_) { return false; }
})();
let _lsPx = '';
function txt(g,s,x,y,size,fill,stroke,lw,weight,align){
  g.font=(weight||900)+' '+size+'px '+FONT;
  if(CAN_TRACK){
    const want=(size*0.055)+'px';
    if(want!==_lsPx){ g.letterSpacing=want; _lsPx=want; }
  }
  g.textAlign=align||'center'; g.textBaseline='middle';
  if(stroke){ g.lineJoin='round'; g.lineWidth=lw||Math.max(3,size/7); g.strokeStyle=stroke; g.strokeText(s,x,y); }
  g.fillStyle=fill; g.fillText(s,x,y);
}
const hap=k=>Studio.haptic(k);

/* ============================================================
   UI PALETTE — the game's own wood-and-cream language, shared by
   every piece of chrome (HUD, settings panel, result card, corner
   buttons) so the look can never drift apart again.
============================================================ */
const UI={
  face:'#fdf6e4',        /* cream card / button face */
  edge:'#4a3323',        /* the dark brown outline used everywhere */
  icon:'#fff',           /* icons drawn ON a dark chrome button */
  ink:'#3b2b1e',         /* body text on cream */
  dim:'#7a5a3a',
  shadow:'rgba(30,20,10,.34)',
  /* the UNSELECTED toggle face (LOCAL / VS BOTS) — the corner chrome uses this
     pair so back / gear read as the game's own controls, never as shell cards */
  btnDark:'rgba(60,50,35,.72)', btnDarkEdge:'#241c10',
  green:'#59c126', greenEdge:'#2e6b12',
  amber:'#f6b41e', amberEdge:'#8f6206',
  grey:'#8a8f98', greyEdge:'#4c5058'
};
/* Width of a text run in the game's display font (tracking included). */
function measureTxt(s,size,weight){
  try{
    ctx.font=(weight||900)+' '+size+'px '+FONT;
    return ctx.measureText(s).width*1.07;    /* txt() adds 0.055em tracking */
  }catch(_){ return String(s).length*size*0.45; }
}
/* Text that must always fit its plate: shrink until it does. */
function fitSize(s,maxW,start,min,weight){
  let fs=start;
  const w=measureTxt(s,fs,weight);
  if(w>maxW&&w>0) fs=Math.max(min||8,fs*maxW/w);
  return fs;
}

/* ============================================================
   CANVAS / MEASURE / SAFE AREA / ORIENTATION
   DISPLAY SIZE: 100% of the viewport, guaranteed by CSS.
   measure() NEVER touches canvas style width/height, so a bad
   measurement can never shrink the display. It only syncs the
   INTERNAL backing store to the displayed size x DPR.
   cw/ch are always CSS pixels of the ACTUAL displayed canvas.
============================================================ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cw=320,ch=240,DPR=1,safeL=0,safeT=0,safeR=0,safeB=0,vig=null;
let portrait=false;
function readSafe(){
  const p=getComputedStyle(document.getElementById('probe'));
  safeL=parseFloat(p.paddingLeft)||0; safeT=parseFloat(p.paddingTop)||0;
  safeR=parseFloat(p.paddingRight)||0; safeB=parseFloat(p.paddingBottom)||0;
}
function buildVignette(){
  vig=document.createElement('canvas'); vig.width=Math.max(2,cw); vig.height=Math.max(2,ch);
  const g=vig.getContext('2d');
  const rad=g.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.42,cw/2,ch/2,Math.max(cw,ch)*0.72);
  rad.addColorStop(0,'rgba(20,40,10,0)'); rad.addColorStop(1,'rgba(18,38,8,0.26)');
  g.fillStyle=rad; g.fillRect(0,0,cw,ch);
}
function measure(){
  let r=null;
  try{ r=cv.getBoundingClientRect(); }catch(_){}
  const de=document.documentElement;
  const w=(r&&r.width>2)? r.width : (de.clientWidth||window.innerWidth||320);

/* ============================================================
   AUDIO — synthesized, one central manager
============================================================ */
const Snd=(()=>{
  const BASE_VOL=0.5;                    /* the shell's volume multiplies this */
  let ac=null,master=null,noiseBuf=null,pending=null,pendingAt=0,vol=1;
  const lastAt={};
  function init(){
    if(ac) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ac=new AC();
    master=ac.createGain(); master.gain.value=game.muted?0:BASE_VOL*vol;
    const comp=ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*0.6),ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  /* Unlock the context AND warm it up: one silent sample makes the graph really
     start on WebView builds that only report "running" once a buffer has played. */
  function resume(){
    if(!ac) return;
    if(ac.state==='suspended'){
      try{ const p=ac.resume(); if(p&&p.catch) p.catch(()=>{}); }catch(_){}
    }
    try{
      const s=ac.createBufferSource();
      s.buffer=ac.createBuffer(1,1,ac.sampleRate);
      s.connect(master||ac.destination);
      s.start(0);
    }catch(_){}
  }
  function setMuted(m){ if(master) master.gain.value=m?0:BASE_VOL*vol; }
  function setVolume(v){
    vol=clamp(typeof v==='number'?v:1,0,1);
    if(master) master.gain.value=game.muted?0:BASE_VOL*vol;
  }
  /* Fires the moment the context reports "running": replay the request made
     during the unlocking gesture, but ONLY if it is fresh. A sound queued before
     the first touch (the idle chicken clucking at the menu) must never stand in
     for the tap that actually unlocked audio. */
  function onCtxState(){
    if(!ac||ac.state!=='running') return;
    const n=pending, at=pendingAt;
    pending=null;
    if(n&&performance.now()-at<400) play(n);
  }
  function ok(n){ const t=performance.now(); if(lastAt[n]&&t-lastAt[n]<70) return false; lastAt[n]=t; return true; }
  function tone(o){
    if(!ac) return;
    const t0=ac.currentTime+(o.at||0);
    const osc=ac.createOscillator(); osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f,t0);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(28,o.f2),t0+o.d);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(o.v||0.2,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+o.d);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0+o.d+0.06);
  }
  function noise(o){
    if(!ac) return;
    const t0=ac.currentTime+(o.at||0);
    const src=ac.createBufferSource(); src.buffer=noiseBuf;
    const f=ac.createBiquadFilter(); f.type=o.ft||'bandpass';
    f.frequency.setValueAtTime(o.f,t0);
    if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.f2),t0+o.d);
    f.Q.value=o.q||1;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(o.v||0.15,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+o.d);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+o.d+0.06);
  }
  function play(n){
    if(!ac) init();
    if(!ac) return;
    if(ac.state!=='running'){
      /* A context created inside this very gesture is still suspended, and
         anything scheduled on it now is dropped - that was the "no sound until
         the second tap" bug. Keep only the NEWEST request plus its timestamp and
         let onCtxState replay it the moment the context starts running. */
      try{ ac.resume(); }catch(_){ }
      pending=n; pendingAt=performance.now();
      if(!ac.onstatechange) ac.onstatechange=onCtxState;
      return;
    }
    if(!ok(n)) return;
    switch(n){
      case 'click': tone({type:'square',f:700,f2:520,d:0.07,v:0.14}); break;
      case 'tick': tone({type:'triangle',f:520,d:0.1,v:0.22}); noise({f:1800,d:0.05,v:0.05}); break;
      case 'warn': tone({type:'triangle',f:760,f2:600,d:0.13,v:0.26}); noise({ft:'highpass',f:2200,d:0.05,v:0.05}); break;
      case 'go': tone({type:'triangle',f:840,d:0.3,v:0.26}); tone({type:'sine',f:1240,d:0.32,v:0.14,at:0.02}); break;
      case 'catch': tone({type:'triangle',f:480,f2:900,d:0.1,v:0.24}); tone({type:'triangle',f:720,f2:1250,d:0.12,v:0.18,at:0.06}); noise({f:1400,d:0.05,v:0.06}); break;
      case 'cluck': tone({type:'square',f:340,f2:200,d:0.08,v:0.1}); tone({type:'square',f:300,f2:170,d:0.07,v:0.08,at:0.09}); break;
      case 'score': [660,880,1180].forEach((f,i)=>tone({type:'triangle',f,d:0.14,v:0.2,at:i*0.07})); noise({ft:'highpass',f:4000,d:0.12,v:0.05,at:0.1}); break;
      case 'bump': tone({type:'sine',f:150,f2:75,d:0.11,v:0.22}); noise({ft:'lowpass',f:320,d:0.07,v:0.1}); break;
      case 'impact': tone({type:'sine',f:190,f2:55,d:0.22,v:0.36}); noise({ft:'lowpass',f:900,f2:180,d:0.16,v:0.24}); tone({type:'square',f:120,f2:60,d:0.14,v:0.1}); break;
      case 'dash': noise({f:500,f2:2400,d:0.17,v:0.18}); break;
      case 'power': [520,700,940,1250].forEach((f,i)=>tone({type:'sine',f,d:0.09,v:0.15,at:i*0.05})); break;
      case 'shield': tone({type:'sine',f:900,f2:1400,d:0.12,v:0.18}); tone({type:'sine',f:1350,d:0.1,v:0.12,at:0.03}); break;
      case 'drop': tone({type:'square',f:640,f2:210,d:0.26,v:0.2}); tone({type:'square',f:330,f2:170,d:0.08,v:0.08,at:0.12}); break;
      case 'freeze': tone({type:'sine',f:1500,f2:420,d:0.35,v:0.16}); noise({ft:'highpass',f:3000,d:0.2,v:0.07}); break;
      case 'victory': [523,659,784,1046,1318].forEach((f,i)=>tone({type:'triangle',f,d:0.2,v:0.2,at:i*0.11})); break;
      case 'timeup': tone({type:'triangle',f:880,d:0.4,v:0.22}); tone({type:'triangle',f:660,d:0.45,v:0.2,at:0.24}); break;
      case 'pop': tone({type:'square',f:500,f2:900,d:0.08,v:0.12}); break;
    }
  }
  return {init,resume,play,setMuted,setVolume,get ctx(){return ac;}};
})();

const ptrBtn=new Map();

  ctx.fillStyle='rgba(30,20,10,.3)'; rr(ctx,b.x,b.y+5,b.w,b.h,r); ctx.fill();
  ctx.fillStyle=b.fill||'#59c126'; rr(ctx,b.x,b.y+dy,b.w,b.h,r); ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.24)'; rr(ctx,b.x+6,b.y+dy+4,b.w-12,b.h*0.3,8); ctx.fill();

/* ROUND CHROME (back / gear) — the game's OWN unselected toggle button (the dark
   translucent brown of LOCAL / VS BOTS when they are OFF) with a white icon, so
   the corner buttons belong to Chicken Chaos and not to the shell's cream cards.
   The gloss is painted INSIDE a clip, so nothing can leave a straight "cut" edge
   across the button the way an unclipped half-disc highlight would. */
drawBtn=function(b){
  if(b.flat) return;
  if(!b.round){ _drawBtn(b); return; }
  const dy=b.down?2:0, cx=b.x+b.round, cyy=b.y+b.round, r=b.round;
  ctx.save();

  ctx.fillStyle=b.fill||UI.btnDark;

  ctx.lineWidth=Math.max(4,r*0.19); ctx.strokeStyle=b.stroke||UI.btnDarkEdge; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cyy+dy,r,0,TAU); ctx.clip();

  gg.addColorStop(0.55,'rgba(255,255,255,.04)');
  gg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cx,cyy+dy,r,0,TAU); ctx.fill();
  ctx.restore();
  if(b.label) txt(ctx,b.label,cx,cyy+dy+1,b.fs||r*0.9,b.labelCol||UI.icon,null,0);

const zones={};
/* COMPACT responsive layout from the ACTUAL DISPLAYED viewport.
   Dash BESIDE the joystick: left seats -> dash RIGHT of joy,
   right seats -> dash LEFT of joy; dash Y == joystick Y. */
function computeZones(){
  if(game.state==='MENU'||game.state==='RESULT'||portrait){
    for(const k in zones) delete zones[k];
    return;
  }
  const base=Math.min(cw,ch);              // displayed CSS px
  const jr=clamp(base*0.115,34,52);        // joystick radius (⌀ 68-104)
  const dr=clamp(base*0.09,27,40);         // dash radius (⌀ 54-80)
  const m=clamp(base*0.032,8,18);          // edge margin (8-18 CSS px)
  const gv=clamp(jr*0.22,8,14);            // joystick<->dash gap
  const humans=players.filter(p=>!p.ai);
  const soloLayout=game.solo&&humans.length===1;

  for(const p of humans){
    const s=p.seat;
    let jx,jy,dx,dy;
    if(soloLayout){
      // SOLO VS BOT: joystick bottom-left, dash bottom-right
      jx=safeL+jr+m; jy=ch-safeB-jr-m;
      dx=cw-safeR-dr-m; dy=jy;
    }else{
      const left=(s===0||s===2), bottom=(s<2);
      // Joystick hugs its corner (safe-area aware)
      jx=left? safeL+jr+m : cw-safeR-jr-m;
      jy=bottom? ch-safeB-jr-m : safeT+jr+m;
      // Dash immediately BESIDE the joystick, aligned on Y
      dx=left? jx+jr+gv+dr : jx-jr-gv-dr;
      dy=jy;
    }
    let z=zones[s];
    if(!z){
      zones[s]={jx,jy,jr,dx,dy,dr,vec:{x:0,y:0},joyId:-1,dashId:-1,dashDown:0,flash:0};
    }else{
      // Update ONLY geometry. NEVER reset input state.
      z.jx=jx; z.jy=jy; z.jr=jr; z.dx=dx; z.dy=dy; z.dr=dr;
    }
  }
  for(const k in zones){
    if(!players.some(pp=>!pp.ai&&String(pp.seat)===String(k))) delete zones[k];
  }
}
function resetZonePointers(){
  for(const k in zones){ const z=zones[k];
    z.joyId=-1; z.dashId=-1; z.vec.x=0; z.vec.y=0;
  }
}
/* Analog vector: normalized, clamped to ±1, small deadzone. */
function updJoy(z,x,y){
  const maxDist=z.jr*0.78;
  let dx=x-z.jx;
  let dy=y-z.jy;
  const len=Math.hypot(dx,dy);
  if(len<maxDist*0.12){
    z.vec.x=0;
    z.vec.y=0;
    return;
  }
  if(len>maxDist){
    dx/=len;
    dy/=len;
    z.vec.x=dx;
    z.vec.y=dy;
  }else{
    z.vec.x=dx/maxDist;
    z.vec.y=dy/maxDist;
  }
  z.vec.x=clamp(z.vec.x,-1,1);
  z.vec.y=clamp(z.vec.y,-1,1);
}
function releasePointer(e){
  try{
    if(cv.hasPointerCapture(e.pointerId)){
      cv.releasePointerCapture(e.pointerId);
    }
  }catch(_){}
}

const keys={}, dashKeys=new Set();

/* Priority: registered UI (PAUSE beside timer) -> joystick -> dash.
   clientX/clientY are CSS px — same space as zone geometry. */
function onDown(e){
  e.preventDefault(); Snd.init(); Snd.resume();
  if(portrait) return;
  const x=e.clientX, y=e.clientY;
  const b=hitBtn(x,y);
  if(b){
    pressedBtn=b; b.down=true; Snd.play('click'); hap('light');
    ptrBtn.set(e.pointerId,b);
    try{
      cv.setPointerCapture(e.pointerId);
    }catch(_){}
    return;
  }
  if(game.state==='PLAYING'||game.state==='COUNTDOWN'||game.state==='TIMEUP'){
    for(const p of players){
      if(p.ai) continue;
      const z=zones[p.seat]; if(!z) continue;
      const dj=dist(x,y,z.jx,z.jy);
      const dd=dist(x,y,z.dx,z.dy);
      // 1) Joystick — compact visual, comfortable hit area
      if(dj<=z.jr*1.2 && dj<=dd){
        if(z.joyId===-1){
          z.joyId=e.pointerId;
          try{
            cv.setPointerCapture(e.pointerId);
          }catch(_){}
          updJoy(z,x,y); // vector set IMMEDIATELY
        }
        return;
      }
      // 2) Dash — own pointerId, trigger once per press
      if(dd<=z.dr*1.25){
        if(z.dashId===-1){
          z.dashId=e.pointerId;
          p.wantDash=true;
          z.dashDown=0.15;
          z.flash=0.25;
          try{

          }catch(_){}

  }

function onMove(e){

    return;
  }

/* Identical cleanup for pointerup and pointercancel */
function releasePointerState(e){
  const b=ptrBtn.get(e.pointerId);
  if(b){
    ptrBtn.delete(e.pointerId);
    if(b.down&&pressedBtn===b&&b.fn) b.fn();
    b.down=false;
    if(pressedBtn===b) pressedBtn=null;
  }
  for(const s in zones){
    const z=zones[s];
    if(z.joyId===e.pointerId){
      z.joyId=-1;
      z.vec.x=0;
      z.vec.y=0;
    }
    if(z.dashId===e.pointerId){

function onUp(e){ releasePointerState(e); }
function onCancel(e){ releasePointerState(e); }
function onLostPointerCapture(e){
  for(const s in zones){
    const z=zones[s];
    if(z.joyId===e.pointerId){
      z.joyId=-1;
      z.vec.x=0;
      z.vec.y=0;
    }
    if(z.dashId===e.pointerId){
      z.dashId=-1;
    }
  }
  const b=ptrBtn.get(e.pointerId);
  if(b){

    if(pressedBtn===b) pressedBtn=null;

/* ============================================================
   LANDSCAPE LOCK — best effort, user-gesture only.
   The SHELL owns the real turn (GameActivity applies the manifest's landscape
   via SENSOR_LANDSCAPE), so this is only a nudge for a plain browser tab.
   The old WebView requestFullscreen() call is GONE on purpose: a WebView
   fullscreen request is routed to the native custom-view path and can blank a
   game that already fills the screen.
============================================================ */
function tryLandscapeLock(){
  if(!('ontouchstart' in window)) return;
  try{

    if(so&&so.lock){
      const p=so.lock('landscape');
      if(p&&p.catch) p.catch(()=>{});
    }
  }catch(_){}
}

function mk(w,h){ const c=document.createElement('canvas'); c.width=w*2; c.height=h*2;

function buildSprites(){

  {const s=mk(30,62),g=s.g;

   g.fillStyle='#b9884c';
   rr(g,6,8,18,50,5); g.fill();
   g.lineWidth=3; g.strokeStyle=O; g.stroke();
   g.save(); rr(g,6,8,18,50,5); g.clip();

const parts=[];
function spawnP(o){
  if(parts.length>=CFG.MAX_PARTICLES){
    const i=parts.findIndex(p=>p.life<=0);
    if(i<0) return; parts[i]=o; return;
  }
  parts.push(o);
}
function dust(x,y,n,c){
  for(let i=0;i<n;i++) spawnP({k:'dust',x:x+rand(-8,8),y:y+rand(-4,4),
    vx:rand(-50,50),vy:rand(-40,-6),life:rand(0.3,0.6),max:0.6,r:rand(4,8),c:c||'rgba(215,195,150,'});
}
function feathers(x,y,n){
  for(let i=0;i<n;i++) spawnP({k:'feather',x,y,vx:rand(-120,120),vy:rand(-190,-40),
    life:rand(0.6,1.1),max:1.1,r:rand(4,6),rot:rand(0,TAU),vr:rand(-6,6),c:'#ffffff'});
}
function stars(x,y,n){
  for(let i=0;i<n;i++){ const a=rand(0,TAU),s=rand(80,220);
    spawnP({k:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(0.4,0.8),max:0.8,
      r:rand(4,7),rot:rand(0,TAU),vr:rand(-8,8),c:'#ffd23e'});}
}
function ringFx(x,y,c,r0,r1){
  spawnP({k:'ring',x,y,vx:0,vy:0,life:0.35,max:0.35,r:r0,r1:r1,c:c});
}
function sparks(x,y,n,c){
  for(let i=0;i<n;i++){ const a=rand(0,TAU),s=rand(120,320);
    spawnP({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.15,0.35),max:0.35,c:c||'#fff'});}
}
function addFloat(x,y,t,c,size){ floats.push({x,y,txt:t,col:c,t:0,size:size||30}); }
function drawParticles(){
  for(const p of parts){
    if(p.life<=0) continue;
    const t=p.life/p.max;
    if(p.k==='dust'){ ctx.fillStyle=p.c+(t*0.55)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.7-t*0.7),0,TAU); ctx.fill(); }
    else if(p.k==='spark'){ ctx.strokeStyle=p.c; ctx.globalAlpha=t; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.04,p.y-p.vy*0.04); ctx.stroke(); ctx.globalAlpha=1; }
    else if(p.k==='star'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=t;
      ctx.fillStyle=p.c; ctx.beginPath();
      for(let i=0;i<8;i++){ const r=i%2?p.r*0.42:p.r,a=i/8*TAU; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
      ctx.closePath(); ctx.fill(); ctx.restore(); }
    else if(p.k==='ring'){ ctx.strokeStyle=p.c; ctx.globalAlpha=t*0.8; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+(1-t)*p.r1,0,TAU); ctx.stroke(); ctx.globalAlpha=1; }
    else if(p.k==='feather'){ ctx.save(); ctx.translate(p.x+Math.sin(p.life*10)*6,p.y); ctx.rotate(p.rot+Math.sin(p.life*8)*0.5);
      ctx.globalAlpha=Math.min(1,t*2); ctx.fillStyle=p.c; ctx.strokeStyle='#cfcfc8'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.45,0,0,TAU); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
}
function updParticles(dt){
  for(const p of parts){
    if(p.life<=0) continue;
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.k==='feather'){ p.vy+=90*dt; p.vx*=0.97; p.rot+=p.vr*dt; }
    else if(p.k==='star'){ p.vy+=260*dt; p.rot+=p.vr*dt; }
    else if(p.k==='dust'){ p.vy-=20*dt; }
    else { p.vx*=0.9; p.vy*=0.9; }
  }
  for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
}
function updFloats(dt){
  for(const f of floats) f.t+=dt;
  for(let i=floats.length-1;i>=0;i--) if(floats[i].t>1) floats.splice(i,1);
}
function drawFloats(){
  for(const f of floats){
    const t=f.t, sc=t<0.18? 0.5+t/0.18*0.6 : 1.1-Math.min(0.1,(t-0.18));
    ctx.globalAlpha=t>0.7?1-(t-0.7)/0.3:1;
    txt(ctx,f.txt,f.x,f.y-40*t-f.size,f.size*sc,f.col,OUT,f.size/6);
    ctx.globalAlpha=1;
  }
}

/* ============================================================
   PLAYERS
============================================================ */
const SPAWNQ=[[AR.x+250,AR.y+AR.h-160],[AR.x+AR.w-250,AR.y+AR.h-160],[AR.x+250,AR.y+170],[AR.x+AR.w-250,AR.y+170]];
function buildPlayers(demo){
  players=[];
  const n=demo?4:game.playerCount;
  for(let i=0;i<n;i++){
    const ai=demo||(game.solo&&i>0);
    players.push({seat:i,col:PCOL[i],x:SPAWNQ[i][0],y:SPAWNQ[i][1],vx:0,vy:0,r:CFG.PLAYER_RADIUS,
      or:CFG.PLAYER_OBSTACLE_RADIUS,
      ai,skill:demo?0.55:game.skill,inX:0,inY:0,lx:0,ly:1,animT:rand(0,9),sq:1,hitT:0,pop:0,
      dashT:0,dashCD:0,dashX:1,dashY:0,ldx:1,ldy:0,
      carrying:false,carryT:0,score:0,scorePop:0,
      boostT:0,shieldT:0,freezeT:0,
      blinkT:rand(1,4),aiT:rand(0,0.3),aiTgt:null,aiErr:0,stuck:0,wantDash:false});
  }
}
function readInput(p){
  let ix=0,iy=0;
  const z=zones[p.seat];
  if(z&&z.joyId>=0){ ix=z.vec.x; iy=z.vec.y; }
  const km=KEYMAP[p.seat];
  if(km&&!p.ai){
    if(kd(km.l))ix-=1; if(kd(km.r))ix+=1;
    if(kd(km.u))iy-=1; if(kd(km.d))iy+=1;
  }
  if(dashKeys.has(p.seat)&&!p.ai){ p.wantDash=true; dashKeys.delete(p.seat); }
  const m=Math.hypot(ix,iy);
  if(m>1){ix/=m;iy/=m;}
  if(m>0.14){ p.ldx=ix/m; p.ldy=iy/m; }
  p.inX=ix; p.inY=iy;
}
function updatePlayers(dt,simActive){
  for(const p of players){
    p.dashCD-=dt; p.boostT-=dt; p.shieldT-=dt; p.freezeT-=dt;
    p.hitT-=dt; p.blinkT-=dt; p.pop=Math.max(0,p.pop-dt*2.4);
    if(p.blinkT<-0.13) p.blinkT=rand(1.8,4.5);
    p.sq+=(1-p.sq)*Math.min(1,dt*9);
    let ix=0,iy=0;
    if(simActive){ if(p.ai) aiUpdate(p,dt); else readInput(p); ix=p.inX; iy=p.inY; if(p.freezeT>0){ix=0;iy=0;} }
    else { p.wantDash=false; }
    if(p.wantDash){
      p.wantDash=false;
      if(p.dashCD<=0&&p.dashT<=0&&p.freezeT<=0){
        const m=Math.hypot(ix,iy);
        if(m>0.2){p.dashX=ix/m;p.dashY=iy/m;}
        else {p.dashX=p.ldx;p.dashY=p.ldy;}
        p.dashT=CFG.DASH_DURATION; p.dashCD=CFG.DASH_COOLDOWN;
        Snd.play('dash'); hap('medium'); dust(p.x,p.y+4,5); ringFx(p.x,p.y,'rgba(255,255,255,',6,30);
        if(zones[p.seat]) zones[p.seat].flash=0.25;
      }
    }
    const st=p.dashT>0?1+p.dashT/CFG.DASH_DURATION*0.2:1;
    p.sqx=(2-p.sq)/st; p.sqy=p.sq*st;
    if(p.dashT>0){
      p.dashT-=dt;
      p.vx=p.dashX*CFG.DASH_SPEED; p.vy=p.dashY*CFG.DASH_SPEED;
      if(Math.random()<0.7) spawnP({k:'spark',x:p.x-p.dashX*14,y:p.y+rand(-8,8),
        vx:-p.dashX*120,vy:-p.dashY*120,life:0.2,max:0.2,c:p.col.l});
      if(p.dashT<=0){ p.vx*=0.35; p.vy*=0.35; }
    } else if(simActive){
      const maxs=CFG.PLAYER_MAX_SPEED*(p.boostT>0?CFG.SPEED_BOOST_MULT:1)*(p.carrying?CFG.CARRY_SPEED_MULT:1)*(p.freezeT>0?CFG.FREEZE_SLOW:1);
      p.vx+=ix*CFG.PLAYER_ACCEL*dt; p.vy+=iy*CFG.PLAYER_ACCEL*dt;
      const fr=Math.pow(CFG.PLAYER_FRICTION,dt*60);
      p.vx*=fr; p.vy*=fr;
      const sp=Math.hypot(p.vx,p.vy);
      if(sp>maxs){ p.vx*=maxs/sp; p.vy*=maxs/sp; }
      if(p.boostT>0&&sp>120&&Math.random()<0.4)
        spawnP({k:'spark',x:p.x-p.vx*0.05,y:p.y+rand(-6,6),vx:-p.vx*0.3,vy:-p.vy*0.3,life:0.22,max:0.22,c:'#ffb020'});
    } else { p.vx*=0.8; p.vy*=0.8; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<AR.x+p.r){p.x=AR.x+p.r; if(p.vx<0)p.vx*=-0.35;}
    if(p.x>AR.x+AR.w-p.r){p.x=AR.x+AR.w-p.r; if(p.vx>0)p.vx*=-0.35;}
    if(p.y<AR.y+p.r){p.y=AR.y+p.r; if(p.vy<0)p.vy*=-0.35;}
    if(p.y>AR.y+AR.h-p.r){p.y=AR.y+AR.h-p.r; if(p.vy>0)p.vy*=-0.35;}
    collideObstacles(p);
    const sp=Math.hypot(p.vx,p.vy);
    p.animT+=dt*(0.6+sp/160);
    const tl=Math.hypot(ix,iy);
    if(tl>0.14){ p.lx+=((ix/tl)-p.lx)*Math.min(1,dt*10); p.ly+=((iy/tl)-p.ly)*Math.min(1,dt*10); }
    p.face=p.vx<-20?-1:p.vx>20?1:p.face;
    if(p.carrying){ p.carryT+=dt; if(p.carryT>=CFG.CARRY_TIME) scoreCarry(p); }
  }
  playerCollisions();
}
function playerCollisions(){
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),rs=a.r+b.r;
    if(d<rs&&d>0.001){
      const nx=dx/d,ny=dy/d,ov=rs-d;
      a.x-=nx*ov/2; a.y-=ny*ov/2; b.x+=nx*ov/2; b.y+=ny*ov/2;
      const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rel>0){
        const car=a.carrying?a:(b.carrying?b:null);
        const atk=car===a?b:(car===b?a:null);
        if(car&&atk){
          const th=atk.dashT>0?CFG.DASH_STEAL:CFG.STEAL_THRESH;
          if(rel>th){
            if(car.shieldT>0){
              car.shieldT=0; Snd.play('shield'); ringFx(car.x,car.y,'rgba(120,220,255,',10,55);
              a.vx-=nx*rel*0.8; a.vy-=ny*rel*0.8; b.vx+=nx*rel*0.8; b.vy+=ny*rel*0.8;
              hap('medium'); continue;
            }
            steal(car,atk,nx,ny,rel); continue;
          }
        }
        const push=clamp(rel*0.55,50,300);
        a.vx-=nx*push*0.6; a.vy-=ny*push*0.6;
        b.vx+=nx*push*0.6; b.vy+=ny*push*0.6;
        if(rel>150&&!car){ Snd.play('bump'); dust((a.x+b.x)/2,(a.y+b.y)/2,4); }
      }
    }
  }
}
function steal(car,atk,nx,ny,rel){
  car.carrying=false; car.carryT=0; car.hitT=0.28; car.sq=0.72;
  const k=clamp(170+rel*0.7,200,430);
  ck.state='pop'; ck.carrier=null;
  ck.x=car.x+nx*26; ck.y=car.y+ny*26-6;
  ck.vx=nx*k+atk.vx*0.35; ck.vy=ny*k+atk.vy*0.35-130;
  ck.grace=0.45; ck.flap=1;
  atk.vx+=nx*80; atk.vy+=ny*80;
  feathers(ck.x,ck.y,7); ringFx(ck.x,ck.y,'rgba(255,255,255,',8,44); dust(car.x,car.y,6);
  addFloat(car.x,car.y-70,'STEAL!',atk.col.l,26);
  Snd.play('drop'); Snd.play('impact'); hap('heavy');
  game.hitStop=0.07; cam.shake=CFG.CAMERA_SHAKE_MAX;
}
function scoreCarry(p){
  /* SCORE = CHICKENS CAUGHT, and that is the whole win condition: nobody can
     end a match early, so the player who caught more inside MATCH_TIME wins. */
  p.score++; p.pop=1; p.scorePop=1;
  p.carrying=false; p.carryT=0;
  ck.state='pop'; ck.carrier=null;
  ck.vx=rand(-140,140); ck.vy=rand(-300,-160); ck.grace=0.5; ck.flap=1;
  addFloat(p.x,p.y-60,'+1','#ffd23e',38);
  stars(p.x,p.y-40,8); ringFx(p.x,p.y,'rgba(255,210,62,',10,50);
  Snd.play('score'); Snd.play('pop'); hap('medium'); cam.shake=1.6;
}
function collideObstacles(e){
  const er=(e.or!==undefined)? e.or : e.r;
  for(const o of obstacles){
    if(dist(e.x,e.y,o.x,o.y)>o.colR+er+8) continue;
    if(o.box){
      const cx=clamp(e.x,o.x-o.hx,o.x+o.hx),cy=clamp(e.y,o.y-o.hy,o.y+o.hy);
      let dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);
      if(d<er){
        if(d<0.001){
          const px=(o.hx+er)-Math.abs(e.x-o.x),py=(o.hy+er)-Math.abs(e.y-o.y);
          if(px<py){ e.x+=(e.x>o.x?px:-px); e.vx*=-0.3; }
          else{ e.y+=(e.y>o.y?py:-py); e.vy*=-0.3; }
        } else {
          const nx=dx/d,ny=dy/d,pu=er-d;
          e.x+=nx*pu; e.y+=ny*pu;
          const vn=e.vx*nx+e.vy*ny;
          if(vn<0){ e.vx-=vn*nx*1.3; e.vy-=vn*ny*1.3; }
        }
      }
    } else {
      const dx=e.x-o.x,dy=e.y-o.y,d=Math.hypot(dx,dy),rs=o.colR+er;
      if(d<rs&&d>0.001){
        const nx=dx/d,ny=dy/d,pu=rs-d;
        e.x+=nx*pu; e.y+=ny*pu;
        const vn=e.vx*nx+e.vy*ny;
        if(vn<0){ e.vx-=vn*nx*1.3; e.vy-=vn*ny*1.3; }
      }
    }
  }
}

/* ============================================================
   CHICKEN
============================================================ */
function resetChicken(){
  ck.x=WORLD_W/2; ck.y=WORLD_H/2+30; ck.vx=0; ck.vy=0;
  ck.a=rand(0,TAU); ck.state='free'; ck.carrier=null; ck.grace=0.6; ck.wt=null;
}
function updateChicken(dt){
  ck.grace-=dt; ck.cluckT-=dt; ck.flap=Math.max(0,ck.flap-dt);
  if(ck.cluckT<=0){ ck.cluckT=rand(2.5,6); ck.open=0.18; if(!game.demo||Math.random()<0.5) Snd.play('cluck'); }
  ck.open=Math.max(0,ck.open-dt);
  if(ck.state==='carried'){
    const p=ck.carrier;
    if(p){ ck.x=p.x; ck.y=p.y; }
    return;
  }
  if(ck.state==='pop'){
    const fr=Math.pow(0.9,dt*60);
    ck.vx*=fr; ck.vy*=fr;
    ck.x+=ck.vx*dt; ck.y+=ck.vy*dt;
    bounceArena(ck);
    collideObstacles(ck);
    if(Math.hypot(ck.vx,ck.vy)<70){ ck.state='free'; ck.a=Math.atan2(ck.vy,ck.vx)||ck.a; }
  } else {
    ck.decT-=dt;
    if(ck.decT<=0||!ck.wt||dist(ck.x,ck.y,ck.wt.x,ck.wt.y)<60){
      ck.decT=rand(1.1,2.2);
      ck.wt={x:rand(AR.x+90,AR.x+AR.w-90),y:rand(AR.y+80,AR.y+AR.h-80)};
    }
    let dx=ck.wt.x-ck.x,dy=ck.wt.y-ck.y;
    const dl=Math.hypot(dx,dy)||1; dx/=dl; dy/=dl;
    let panic=false;
    for(const p of players){
      const d=dist(ck.x,ck.y,p.x,p.y);
      if(d<CFG.CHICKEN_FLEE&&d>1){
        const w=(1-d/CFG.CHICKEN_FLEE)*1.7;
        dx+=(ck.x-p.x)/d*w; dy+=(ck.y-p.y)/d*w;
        if(d<110) panic=true;
      }
      if(d<ck.r+p.r&&ck.grace<=0){ catchChicken(p); return; }
      else if(d<ck.r+p.r+4){
        const px=(ck.x-p.x)/(d||1),py=(ck.y-p.y)/(d||1);
        ck.x+=px*2; ck.y+=py*2;
      }
    }
    for(const o of obstacles){
      const d=dist(ck.x,ck.y,o.x,o.y),rr2=o.colR+66;
      if(d<rr2&&d>1){ const w=(1-d/rr2)*2.3; dx+=(ck.x-o.x)/d*w; dy+=(ck.y-o.y)/d*w; }
    }
    const m=80;
    if(ck.x-AR.x<m)dx+=(1-(ck.x-AR.x)/m)*1.8; if(AR.x+AR.w-ck.x<m)dx-=(1-(AR.x+AR.w-ck.x)/m)*1.8;
    if(ck.y-AR.y<m)dy+=(1-(ck.y-AR.y)/m)*1.8; if(AR.y+AR.h-ck.y<m)dy-=(1-(AR.y+AR.h-ck.y)/m)*1.8;
    const l2=Math.hypot(dx,dy)||1;
    const ta=Math.atan2(dy/l2,dx/l2);
    const turn=CFG.CHICKEN_TURN*(panic?1.35:1);
    ck.a+=clamp(nang(ta-ck.a),-turn*dt,turn*dt);
    const sp=CFG.CHICKEN_SPEED*(panic?CFG.CHICKEN_PANIC:1);
    ck.x+=Math.cos(ck.a)*sp*dt; ck.y+=Math.sin(ck.a)*sp*dt;
    bounceArena(ck); collideObstacles(ck);
    ck.runT+=dt*(0.7+sp/160);
    if(Math.random()<dt*6) dust(ck.x-Math.cos(ck.a)*12,ck.y,1);
    ck.face=Math.cos(ck.a)>=0?1:-1;
  }
}
function bounceArena(e){
  if(e.x<AR.x+e.r){e.x=AR.x+e.r; if(e.vx<0)e.vx*=-0.5;}
  if(e.x>AR.x+AR.w-e.r){e.x=AR.x+AR.w-e.r; if(e.vx>0)e.vx*=-0.5;}
  if(e.y<AR.y+e.r){e.y=AR.y+e.r; if(e.vy<0)e.vy*=-0.5;}
  if(e.y>AR.y+AR.h-e.r){e.y=AR.y+AR.h-e.r; if(e.vy>0)e.vy*=-0.5;}
}
function catchChicken(p){
  p.carrying=true; p.carryT=0; p.sq=1.2;
  ck.state='carried'; ck.carrier=p; ck.grace=0;
  ringFx(p.x,p.y,'rgba(255,255,255,',8,40); dust(p.x,p.y+4,4);
  Snd.play('catch'); hap('light');
}

/* ============================================================
   AI
============================================================ */
function aiUpdate(p,dt){
  p.aiT-=dt;
  if(p.aiT<=0){
    const sk=p.skill;
    p.aiT=lerp(0.42,0.15,sk)*rand(0.75,1.3);
    p.aiErr=rand(-1,1)*lerp(0.7,0.08,sk);
    const bx=v=>clamp(v,AR.x+40,AR.x+AR.w-40), by=v=>clamp(v,AR.y+40,AR.y+AR.h-40);
    if(p.carrying){
      let opp=null,od=1e9;
      for(const q of players) if(q!==p){ const d=dist(p.x,p.y,q.x,q.y); if(d<od){od=d;opp=q;} }
      if(opp){
        const d=Math.max(1,od);
        p.aiTgt={x:bx(p.x+(p.x-opp.x)/d*260+rand(-60,60)),y:by(p.y+(p.y-opp.y)/d*260+rand(-60,60))};
        if(od<150&&p.dashCD<=0&&Math.random()<0.25+sk*0.6) p.wantDash=true;
      }
    } else if(ck.state==='carried'&&ck.carrier!==p){
      const h=ck.carrier,lead=lerp(0.1,0.45,sk);
      p.aiTgt={x:bx(h.x+h.vx*lead),y:by(h.y+h.vy*lead)};
      if(dist(p.x,p.y,h.x,h.y)<190&&p.dashCD<=0&&Math.random()<0.3+sk*0.65) p.wantDash=true;
    } else if(ck.state!=='carried'){
      const lead=clamp(dist(p.x,p.y,ck.x,ck.y)/CFG.CHICKEN_SPEED,0,0.8)*lerp(0.3,1,sk);
      p.aiTgt={x:bx(ck.x+ck.vx*lead),y:by(ck.y+ck.vy*lead)};
      if(dist(p.x,p.y,ck.x,ck.y)<160&&p.dashCD<=0&&Math.random()<sk*0.8) p.wantDash=true;
    }
  }
  let dx=(p.aiTgt?p.aiTgt.x-p.x:0),dy=(p.aiTgt?p.aiTgt.y-p.y:0);
  let l=Math.hypot(dx,dy);
  if(l<14){ p.inX=0; p.inY=0; return; }
  dx/=l; dy/=l;
  const ea=Math.atan2(dy,dx)+p.aiErr*0.5;
  dx=Math.cos(ea); dy=Math.sin(ea);
  for(const o of obstacles){
    const d=dist(p.x,p.y,o.x,o.y),rr2=o.colR+52;
    if(d<rr2&&d>0.1){ const w=(1-d/rr2)*2.4; dx+=(p.x-o.x)/d*w; dy+=(p.y-o.y)/d*w; }
  }
  const m=70;
  if(p.x-AR.x<m)dx+=(1-(p.x-AR.x)/m)*1.6; if(AR.x+AR.w-p.x<m)dx-=(1-(AR.x+AR.w-p.x)/m)*1.6;
  if(p.y-AR.y<m)dy+=(1-(p.y-AR.y)/m)*1.6; if(AR.y+AR.h-p.y<m)dy-=(1-(AR.y+AR.h-p.y)/m)*1.6;
  const l2=Math.hypot(dx,dy)||1;
  p.inX=dx/l2; p.inY=dy/l2;
  if(Math.hypot(p.vx,p.vy)<25){
    p.stuck+=dt;
    if(p.stuck>0.9){
      p.aiT=0; p.stuck=0;
      p.aiTgt={x:clamp(p.x+rand(-220,220),AR.x+60,AR.x+AR.w-60),y:clamp(p.y+rand(-220,220),AR.y+60,AR.y+AR.h-60)};
    }
  } else p.stuck=0;
}

/* ============================================================
   POWER-UPS
============================================================ */
const PUT={speed:'#ffb020',shield:'#39b7e8',freeze:'#7fd0ff'};
function updatePowerups(dt,active){
  game.puT-=dt;
  if(active&&game.puT<=0&&powerups.length<CFG.PU_MAX){
    game.puT=CFG.PU_INTERVAL*rand(0.8,1.2);
    const cx=ck.x,cy=ck.y;
    const spots=PUSPOTS.filter(s=>players.every(p=>dist(s.x,s.y,p.x,p.y)>170)&&dist(s.x,s.y,cx,cy)>150
      &&powerups.every(u=>dist(s.x,s.y,u.x,u.y)>200));
    if(spots.length){
      const s=spots[Math.floor(Math.random()*spots.length)];
      powerups.push({x:s.x,y:s.y,type:['speed','shield','freeze'][Math.floor(Math.random()*3)],life:CFG.PU_LIFETIME,bob:rand(0,TAU)});
      ringFx(s.x,s.y,'rgba(255,255,255,',4,30);
    }
  }
  for(let i=powerups.length-1;i>=0;i--){
    const u=powerups[i];
    u.life-=dt;
    if(u.life<=0){ powerups.splice(i,1); continue; }
    if(!active) continue;
    for(const p of players){
      if(dist(p.x,p.y,u.x,u.y)<p.r+20){
        applyPU(p,u.type);
        powerups.splice(i,1);
        break;
      }
    }
  }
}
function applyPU(p,t){
  if(t==='speed'){ p.boostT=CFG.SPEED_BOOST_DURATION; addFloat(p.x,p.y-70,'SPEED!','#ffb020',24); Snd.play('power'); }
  else if(t==='shield'){ p.shieldT=CFG.SHIELD_DURATION; addFloat(p.x,p.y-70,'SHIELD!','#39b7e8',24); Snd.play('shield'); }
  else {
    addFloat(p.x,p.y-70,'FREEZE!','#7fd0ff',24); Snd.play('freeze');
    for(const q of players) if(q!==p){
      if(dist(p.x,p.y,q.x,q.y)<CFG.FREEZE_RADIUS) q.freezeT=CFG.FREEZE_DURATION;
      else q.freezeT=Math.max(q.freezeT,CFG.FREEZE_DURATION*0.5);
      ringFx(q.x,q.y,'rgba(160,220,255,',8,40);
    }
  }
  stars(p.x,p.y-20,6);
  ringFx(p.x,p.y,'rgba(255,255,255,',8,42);
  hap('light');
}
function drawPU(u){
  const s=dsc(u.y), bob=Math.sin(game.simT*3+u.bob)*4;

  ctx.save(); ctx.translate(u.x,u.y); ctx.scale(s,s);

  ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.ellipse(0,2,24,10,0,0,TAU); ctx.stroke();
  ctx.globalAlpha=u.life<2?0.4+0.6*Math.abs(Math.sin(u.life*8)):1;
  ctx.translate(0,-30+bob);
  ctx.fillStyle='#fffdf4'; rr(ctx,-18,-18,36,36,10); ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle=col; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)'; rr(ctx,-12,-14,24,8,4); ctx.fill();

    ctx.beginPath(); ctx.moveTo(3,-11); ctx.lineTo(-7,2); ctx.lineTo(-1,2); ctx.lineTo(-3,11); ctx.lineTo(7,-2); ctx.lineTo(1,-2);
    ctx.closePath(); ctx.fill();
  } else if(u.type==='shield'){
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(10,-7); ctx.lineTo(10,2); ctx.quadraticCurveTo(10,9,0,12);
    ctx.quadraticCurveTo(-10,9,-10,2); ctx.lineTo(-10,-7); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(-1,4); ctx.lineTo(5,-4); ctx.stroke();
  } else {
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.lineCap='round';
    for(let i=0;i<3;i++){
      const a=i*PI/3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*11,Math.sin(a)*11); ctx.lineTo(-Math.cos(a)*11,-Math.sin(a)*11);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*7-Math.cos(a+1.2)*3.5,Math.sin(a)*7-Math.sin(a+1.2)*3.5);
      ctx.lineTo(Math.cos(a)*7,Math.sin(a)*7);
      ctx.lineTo(Math.cos(a)*7-Math.cos(a-1.2)*3.5,Math.sin(a)*7-Math.sin(a-1.2)*3.5);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ============================================================
   ENTITY DRAWING — characters, chicken
============================================================ */
function drawChickenShape(g,o){
  const t=o.t||0, run=o.run||0, flip=o.face||1;
  g.save(); g.scale(flip,1);
  const bounce=o.carried?Math.sin(t*6)*2:run>0.2?Math.abs(Math.sin(run*13))*2.5:Math.sin(t*3)*1.2;
  if(o.pop) g.rotate(Math.sin(t*26)*0.14);
  g.strokeStyle='#e8862a'; g.lineWidth=3.2; g.lineCap='round';
  if(o.carried){
    const sw=Math.sin(t*9)*3;
    g.beginPath(); g.moveTo(-4,4); g.lineTo(-5+sw,11); g.moveTo(4,4); g.lineTo(5-sw,11); g.stroke();
    g.beginPath(); g.moveTo(-8+sw,11); g.lineTo(-2+sw,11); g.moveTo(2-sw,11); g.lineTo(8-sw,11); g.stroke();
  } else if(o.pop){
    g.beginPath(); g.moveTo(-4,4); g.lineTo(-5,9); g.moveTo(4,4); g.lineTo(5,9); g.stroke();
  } else if(run>0.2){
    const w=Math.sin(run*13);
    g.beginPath(); g.moveTo(-3,4); g.lineTo(-3+w*5,10); g.moveTo(3,4); g.lineTo(3-w*5,10); g.stroke();
    g.beginPath(); g.moveTo(-8+w*5,10); g.lineTo(-1+w*5,10); g.moveTo(-1-w*5,10); g.lineTo(7-w*5,10); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-3,4); g.lineTo(-3,10); g.moveTo(3,4); g.lineTo(3,10); g.stroke();
    g.beginPath(); g.moveTo(-8,10); g.lineTo(1,10); g.moveTo(-1,10); g.lineTo(8,10); g.stroke();
  }
  g.fillStyle='#fff';
  for(let i=0;i<3;i++){
    g.save(); g.translate(-12,-4+bounce); g.rotate(-0.7+i*0.35+(o.flap>0?Math.sin(t*30)*0.2:0));
    g.beginPath(); g.ellipse(-5,0,7,3.5,0,0,TAU); g.fill();
    g.lineWidth=2.4; g.strokeStyle='#c9c9c0'; g.stroke(); g.restore();
  }
  g.beginPath(); g.ellipse(0,-2+bounce,15,12,0,0,TAU); g.fill();
  g.lineWidth=3; g.strokeStyle=OUT; g.stroke();
  g.fillStyle='rgba(0,0,0,.08)';
  g.beginPath(); g.ellipse(2,2+bounce,11,6,0,0,TAU); g.fill();
  g.save(); g.translate(-1,-3+bounce);
  g.rotate(o.pop||o.flap>0?Math.sin(t*32)*0.7:run>0.2?Math.sin(run*13)*0.35:0.1);
  g.fillStyle='#f2f2ec';
  g.beginPath(); g.ellipse(0,2,8.5,5.5,-0.3,0,TAU); g.fill();
  g.lineWidth=2.4; g.strokeStyle='#b9b9ae'; g.stroke(); g.restore();
  const hx=9,hy=-13+bounce;
  g.fillStyle='#fff';
  g.beginPath(); g.arc(hx,hy,8.5,0,TAU); g.fill();
  g.lineWidth=3; g.strokeStyle=OUT; g.stroke();
  g.fillStyle='#e8483f';
  [[-3,-1.5],[0.5,-2.5],[4,-1]].forEach(c=>{
    g.beginPath(); g.arc(hx+c[0],hy-8+c[1],2.8,0,TAU); g.fill();});
  g.fillStyle='#f6a01a'; g.strokeStyle='#b96e0e'; g.lineWidth=2;
  if(o.open>0){
    g.beginPath(); g.moveTo(hx+7,hy-2); g.lineTo(hx+16,hy-4); g.lineTo(hx+7,hy-5); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(hx+7,hy-1); g.lineTo(hx+14,hy+3); g.lineTo(hx+7,hy+2); g.closePath(); g.fill(); g.stroke();
  } else {
    g.beginPath(); g.moveTo(hx+7,hy-3); g.lineTo(hx+16,hy-0.5); g.lineTo(hx+7,hy+2); g.closePath(); g.fill(); g.stroke();
  }
  g.fillStyle='#e8483f'; g.beginPath(); g.arc(hx+6,hy+4.5,2.2,0,TAU); g.fill();
  g.fillStyle='#2a2a2a'; g.beginPath(); g.arc(hx+2.5,hy-2,2.3,0,TAU); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(hx+3.3,hy-2.8,0.9,0,TAU); g.fill();
  g.restore();
}
function drawChickenAt(x,y,sc,o){
  ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);

  if(p.freezeT>0){
    ctx.fillStyle='rgba(150,205,255,.4)'; rr(ctx,-24,cy-24,48,58,12); ctx.fill();
    ctx.strokeStyle='rgba(220,240,255,.85)'; ctx.lineWidth=2.5; rr(ctx,-24,cy-24,48,58,12); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-14,cy-10); ctx.lineTo(-4,cy-20); ctx.moveTo(6,cy+16); ctx.lineTo(16,cy+6); ctx.stroke();
  }
  ctx.restore();
  if(p.shieldT>0){
    ctx.save(); ctx.translate(p.x,p.y-30*s); ctx.scale(s,s);
    const pl=1+Math.sin(game.simT*6)*0.04;
    ctx.fillStyle='rgba(150,225,255,.15)';
    ctx.beginPath(); ctx.arc(0,0,34*pl,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(140,220,255,.9)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,34*pl,0,TAU); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(0,0,28*pl,-2.2,-1.2); ctx.stroke();
    ctx.restore();
  }
  if(p.carrying){
    const frac=clamp(p.carryT/CFG.CARRY_TIME,0,1);
    drawChickenAt(p.x,p.y-58*s,0.82*s,{t:game.simT+p.seat,carried:1,face:p.face,open:ck.open,flap:1});
    ctx.save(); ctx.translate(p.x,p.y-92*s); ctx.scale(s,s);
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(0,0,15,0,TAU); ctx.stroke();
    ctx.strokeStyle='#ffd23e'; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,15,-PI/2,-PI/2+TAU*frac); ctx.stroke();
    ctx.restore();
  }
  if(p.hitT>0){
    ctx.save(); ctx.globalAlpha=p.hitT*2.2;
    txt(ctx,'!',p.x,p.y-70*s,26*s,'#fff',OUT,4);
    ctx.restore();
  }
}

/* ============================================================
   CAMERA
============================================================ */
function updateCam(dt){
  let tx=0,ty=0,n=0;
  const pts=[];
  for(const p of players){ pts.push([p.x,p.y]); }
  if(ck.state!=='carried'){ pts.push([ck.x,ck.y],[ck.x,ck.y]); }
  for(const q of pts){ tx+=q[0]; ty+=q[1]; n++; }
  tx/=n||1; ty/=n||1;
  let spread=0;
  for(const q of pts) spread=Math.max(spread,dist(tx,ty,q[0],q[1]));
  const zt=game.state==='MENU'?1:clamp(1.22-spread*0.00048,0.95,1.12);
  cam.zoom+=(zt-cam.zoom)*Math.min(1,dt*2.5);
  const bs=Math.min(cw/1280,ch/720);
  const vw=cw/(bs*cam.zoom),vh=ch/(bs*cam.zoom);
  let cx2=vw>=WORLD_W?WORLD_W/2:clamp(tx,vw/2,WORLD_W-vw/2);
  let cy2=vh>=WORLD_H+170?WORLD_H/2:clamp(ty,vh/2-170,WORLD_H-vh/2);
  if(game.state==='MENU'){ cx2=WORLD_W/2+Math.sin(game.simT*0.13)*60; cy2=WORLD_H/2-20+Math.cos(game.simT*0.1)*30; }
  cam.x+=(cx2-cam.x)*Math.min(1,dt*3.5);
  cam.y+=(cy2-cam.y)*Math.min(1,dt*3.5);
  cam.shake=Math.max(0,cam.shake-dt*9);
  cam.sx=(Math.random()*2-1)*cam.shake;
  cam.sy=(Math.random()*2-1)*cam.shake;
}
function worldTransform(){
  const bs=Math.min(cw/1280,ch/720);
  const S=bs*cam.zoom;
  ctx.setTransform(DPR*S,0,0,DPR*S,DPR*(cw/2-cam.x*S+cam.sx),DPR*(ch/2-cam.y*S+cam.sy));
}

/* ============================================================
   WORLD RENDER
============================================================ */
function renderWorld(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#bfe8f7'; ctx.fillRect(0,0,cw,ch);
  worldTransform();
  ctx.fillStyle='#6cc24e'; ctx.fillRect(-1400,150,WORLD_W+2800,WORLD_H+1600);
  if(GR&&GR.c) ctx.drawImage(GR.c,0,0,WORLD_W,WORLD_H);
  drawSideFence();
  const sh=(x,y,rx,ry,a)=>{ ctx.globalAlpha=a; ctx.drawImage(SPR.shadow.c,x-rx,y-ry*0.5,rx*2,ry); ctx.globalAlpha=1; };
  for(const p of players){ const s=dsc(p.y); sh(p.x,p.y+2,26*s,26*s,0.9);
    if(p.carrying){
      const frac=clamp(p.carryT/CFG.CARRY_TIME,0,1);
      ctx.strokeStyle='rgba(255,210,62,.3)'; ctx.lineWidth=6;
      ctx.beginPath(); ctx.ellipse(p.x,p.y+2,36*s,15*s,0,0,TAU); ctx.stroke();
      ctx.strokeStyle='#ffd23e'; ctx.lineCap='round';
      ctx.beginPath(); ctx.ellipse(p.x,p.y+2,36*s,15*s,0,-PI/2,-PI/2+TAU*frac); ctx.stroke();
      ctx.globalAlpha=0.35+0.2*Math.sin(game.simT*7);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(p.x,p.y+2,42*s,18*s,0,0,TAU); ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  if(ck.state!=='carried'){ const s=dsc(ck.y); sh(ck.x,ck.y+2,18*s,14*s,0.85); }
  for(const o of obstacles) sh(o.x,o.y+3,(o.colR+8)*1.05,(o.colR+8)*0.85,0.8);
  for(const t of trees) sh(t.x,t.y+4,48,26,0.7);
  for(const u of powerups){
    ctx.strokeStyle=PUT[u.type]; ctx.globalAlpha=0.35+0.25*Math.sin(game.simT*5+u.bob);
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(u.x,u.y+2,22,9,0,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }
  const items=[];
  for(const t of trees) items.push(t);
  for(const o of obstacles) items.push(o);
  for(const d of deco) items.push(d);
  for(const f of fenceBits) if(f.k!=='rv') items.push(f);
  items.push({k:'barn',x:400,y:176});
  items.push({k:'mill',x:1180,y:176});
  for(const u of powerups) items.push({k:'pu',x:u.x,y:u.y,u});
  for(const p of players) items.push({k:'pl',x:p.x,y:p.y,p});
  if(ck.state!=='carried') items.push({k:'ck',x:ck.x,y:ck.y});
  items.sort((a,b)=>a.y-b.y);
  for(const it of items){
    switch(it.k){
      case 'barn': bl(SPR.barn,it.x,it.y,dsc(it.y)); break;
      case 'mill':{ const s=dsc(it.y); bl(SPR.mill,it.x,it.y,s);
        drawBlades(it.x,it.y-212*s,s*0.9,game.simT*0.7); break; }
      case 'tree': case 'tree2': bl(it.k==='tree2'?SPR.tree2:SPR.tree,it.x,it.y,dsc(it.y)); break;
      case 'crate': bl(SPR.crate,it.x,it.y+4,dsc(it.y)); break;
      case 'hay': bl(SPR.hay,it.x,it.y+4,dsc(it.y)); break;
      case 'barrel': bl(SPR.barrel,it.x,it.y+4,dsc(it.y)); break;
      case 'rock': bl(SPR.rock,it.x,it.y+4,dsc(it.y)); break;
      case 'bush': bl(SPR.bush,it.x,it.y+6,dsc(it.y)); break;
      case 'post': bl(SPR.post,it.x,it.y,dsc(it.y)); break;
      case 'rh': drawRailH(it); break;
      case 'pu': drawPU(it.u); break;
      case 'pl': drawPlayer(it.p); break;
      case 'ck':{ const s=dsc(it.y)*1.05;
        drawChickenAt(it.x,it.y,s,{t:game.simT,run:ck.state==='free'?ck.runT:0,face:ck.face,
          pop:ck.state==='pop',open:ck.open,flap:ck.flap});
        break; }
    }
  }
  // (Floating P1-P4 player labels removed — color-coded characters + HUD)
  if(ck.state==='free'){
    const yy=ck.y-46*dsc(ck.y)+Math.sin(game.simT*5)*3;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(ck.x-8,yy); ctx.lineTo(ck.x+8,yy); ctx.lineTo(ck.x,yy+10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#e8483f'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  }
  drawParticles();
  drawFloats();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(vig) ctx.drawImage(vig,0,0,cw,ch);
}

/* ============================================================
   UI — TOP HUD: color score boxes (no captions) around an
   EXACTLY CENTERED timer; corner controls; screens
============================================================ */
/* CATCH BOX — one per player, in that player's own colour, holding ONLY the
   number of chickens they have caught: no "/10" target and no caption, because
   the colour IS the player's name. Square and larger so the count reads at a
   glance mid-chase. */
function drawScoreBox(p,cx,cy,s){
  p.scorePop=Math.max(0,p.scorePop-0.03);
  const sc=1+p.scorePop*0.18;
  const darkText=(p.seat===1);        // yellow bg -> dark text
  const rad=s*0.30;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(sc,sc);
  ctx.fillStyle=UI.shadow; rr(ctx,-s/2+2,-s/2+4,s,s,rad); ctx.fill();
  ctx.fillStyle=p.col.m; rr(ctx,-s/2,-s/2,s,s,rad); ctx.fill();
  ctx.lineWidth=p.carrying?4.5+Math.sin(game.simT*8)*1.2:3.5;
  ctx.strokeStyle=p.col.d; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.30)';
  rr(ctx,-s/2+s*0.10,-s/2+s*0.09,s*0.80,s*0.20,rad*0.5); ctx.fill();
  txt(ctx,''+p.score,0,s*0.03,s*0.56,
      darkText?'#3b2b1e':'#fff8ec',
      darkText?null:'rgba(0,0,0,.35)',3);
  ctx.restore();
}
/* BIG CENTER TIMER — arcade badge. The ONLY gameplay timer.
   x is passed in pre-centered so it is ALWAYS at 50% viewport. */
function drawTimer(x,y,w,h){
  const t=Math.ceil(game.matchT);
  const hot=t<=10&&(game.state==='PLAYING'||game.state==='TIMEUP');
  const pul=hot?1+Math.sin(game.simT*9)*0.04:1;
  ctx.save(); ctx.translate(x+w/2,y+h/2); ctx.scale(pul,pul);
  ctx.fillStyle='rgba(20,12,6,.32)'; rr(ctx,-w/2+3,-h/2+6,w,h,h*0.3); ctx.fill();
  ctx.fillStyle=hot?'#e8483f':'#3a2a20';
  rr(ctx,-w/2,-h/2,w,h,h*0.3); ctx.fill();
  ctx.lineWidth=Math.max(4,h*0.09); ctx.strokeStyle='#f2e3c0'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.16)';
  rr(ctx,-w/2+8,-h/2+6,w-16,h*0.26,6); ctx.fill();
  const fs=h*0.58;
  txt(ctx,''+t,0,3+h*0.05,fs,'rgba(0,0,0,.4)',null,0);
  txt(ctx,''+t,0,h*0.05,fs,'#fff8ec',null,0);
  ctx.restore();
}
/* HUD row: [LEFT catch boxes] [TIMER dead centre] [PAUSE] [RIGHT catch boxes]
   2P:  RED | TIMER | PAUSE | YELLOW
   3P:  RED YELLOW | TIMER | PAUSE | BLUE
   4P:  RED YELLOW | TIMER | PAUSE | BLUE PURPLE
   The left group is right-aligned against the timer and the right group starts
   once past the pause button, so the two groups stay balanced around a timer
   that is always EXACTLY centred. No captions under the boxes. */
function drawHUD(){
  const act=players.filter(p=>!game.demo);
  if(!act.length) return;
  const timH=clamp(ch*0.13,58,88);
  const timW=clamp(timH*1.6,110,190);
  const bs=clamp(Math.min(cw,ch)*0.09,32,45);       /* square catch box: kept a
                                                       little SMALLER than the
                                                       round pause button */
  const gap=clamp(Math.min(cw,ch)*0.022,7,13);
  const pr=clamp(Math.min(cw,ch)*0.052,16,22);      /* pause radius */
  const showPause=(game.state==='PLAYING'||game.state==='COUNTDOWN');
  const left=act.filter(p=>p.seat<2), right=act.filter(p=>p.seat>=2);
  // TIMER EXACTLY CENTERED — independent of box count / pause
  const tX=(cw-timW)/2, ty=safeT+6, cyT=ty+timH/2;
  // left group: the innermost box sits closest to the timer
  let x=tX-gap-bs/2;
  for(let i=left.length-1;i>=0;i--){
    drawScoreBox(left[i],x,cyT,bs);
    x-=bs+gap;
  }
  drawTimer(tX,ty,timW,timH);
  // right side: PAUSE beside the timer, then the right group
  x=tX+timW+gap;
  if(showPause){
    /* the ORIGINAL in-game pause look: dark translucent disc, light rim */
    circleBtn('pause',x+pr,cyT,pr,'',
      {fill:'rgba(40,30,20,.6)',stroke:'rgba(255,255,255,.4)',fn:()=>Game.pause()});
    const bw2=pr*0.26, bh2=pr*0.82, gp=pr*0.3;
    ctx.fillStyle=UI.icon;
    rr(ctx,x+pr-gp/2-bw2,cyT-bh2/2,bw2,bh2,3); ctx.fill();
    rr(ctx,x+pr+gp/2,cyT-bh2/2,bw2,bh2,3); ctx.fill();
    x+=pr*2+gap;
  }
  for(const p of right){
    drawScoreBox(p,x+bs/2,cyT,bs);
    x+=bs+gap;
  }
}
function drawControls(){
  if(game.state==='MENU'||game.state==='RESULT') return;
  for(const p of players){
    if(p.ai) continue;
    const z=zones[p.seat]; if(!z) continue;
    const C=p.col;
    const act=z.joyId>=0;
    ctx.fillStyle='rgba(22,30,18,.38)';
    ctx.beginPath(); ctx.arc(z.jx,z.jy,z.jr,0,TAU); ctx.fill();
    ctx.strokeStyle=C.m; ctx.globalAlpha=act?1:0.78; ctx.lineWidth=4.5; ctx.stroke(); ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(z.jx,z.jy,z.jr*0.55,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.3)';
    [[0,-1],[0,1],[-1,0],[1,0]].forEach(d=>{
      ctx.save(); ctx.translate(z.jx+d[0]*z.jr*0.78,z.jy+d[1]*z.jr*0.78); ctx.rotate(Math.atan2(d[1],d[0]));
      ctx.beginPath(); ctx.moveTo(-4,-5); ctx.lineTo(4,0); ctx.lineTo(-4,5); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
    let vx=z.vec.x,vy=z.vec.y;
    const vl=Math.hypot(vx,vy);
    if(vl>1){vx/=vl;vy/=vl;}
    const tx=z.jx+vx*z.jr*0.62, ty=z.jy+vy*z.jr*0.62;
    ctx.fillStyle=C.m;
    ctx.beginPath(); ctx.arc(tx,ty,z.jr*0.42*(act?1.06:1),0,TAU); ctx.fill();
    ctx.lineWidth=3.5; ctx.strokeStyle=OUT; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(tx-z.jr*0.1,ty-z.jr*0.14,z.jr*0.16,0,TAU); ctx.fill();
    const dsc2=0.92+Math.max(z.flash,z.dashDown)*0.5+(z.dashId>=0?0.06:0);
    ctx.save(); ctx.translate(z.dx,z.dy); ctx.scale(dsc2,dsc2);
    const ready=p.dashCD<=0;
    ctx.globalAlpha=ready?1:0.78;
    ctx.fillStyle=C.m;
    ctx.beginPath(); ctx.arc(0,0,z.dr,0,TAU); ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle=OUT; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.arc(0,-z.dr*0.24,z.dr*0.55,PI,TAU); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=z.dr*0.14; ctx.lineCap='round'; ctx.lineJoin='round';
    /* Icon only — the DASH caption is gone, so the two mirrored chevrons now sit
       on the exact centre of the button (no group offset to compensate for). */
    ctx.save();
    for(const off of [-z.dr*0.16,z.dr*0.16]){
      ctx.beginPath();
      ctx.moveTo(off-z.dr*0.13,-z.dr*0.27); ctx.lineTo(off+z.dr*0.13,0); ctx.lineTo(off-z.dr*0.13,z.dr*0.27);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha=1;
    if(!ready){
      const frac=clamp(p.dashCD/CFG.DASH_COOLDOWN,0,1);
      ctx.fillStyle='rgba(15,18,12,.6)';
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,z.dr+2,-PI/2,-PI/2+TAU*frac); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    z.flash=Math.max(0,z.flash-0.016);
    z.dashDown=Math.max(0,z.dashDown-0.016);
  }
}

function drawSettingsPanel(){

    fs:th*0.38,fn:()=>{setHaptics(!hapOn);}});
  const dw=0; /* DONE button removed — tap outside the panel closes it */
}
function drawCountdown(){
  const n=Math.ceil(game.countT);
  const frac=game.countT-Math.floor(game.countT);
  const sc=1+frac*0.4;
  ctx.save(); ctx.translate(cw/2,ch/2); ctx.scale(sc,sc);
  ctx.globalAlpha=clamp(1.4-frac,0,1);
  txt(ctx,''+n,0,0,clamp(ch*0.115,34,60),'#fff',OUT,Math.max(8,ch*0.017));
  ctx.restore();
}
function drawGo(){
  const t=1-game.goT/0.8;
  const sc=1.6-t*0.6;
  const fs=clamp(ch*0.105,30,56);    /* hero, but only ~1.3x the timer digits */
  ctx.save(); ctx.translate(cw/2,ch*0.42); ctx.scale(sc,sc);
  ctx.globalAlpha=clamp(game.goT*2.5,0,1);
  txt(ctx,'GO!',0,0,fs,'#7ee04a',OUT,fs*0.15);
  ctx.restore();
}
function drawHint(){
  if(game.hintT<=0) return;
  ctx.globalAlpha=clamp(game.hintT,0,1);
  const msg='GRAB THE CHICKEN - HOLD IT FOR 2 SECONDS!';
  const fs=clamp(ch*0.036,12,16);              /* a caption, not a billboard */
  const h=Math.max(fs*2.0,clamp(ch*0.085,30,40));
  const w=Math.min(cw*0.70,measureTxt(msg,fs)+fs*2.2);
  /* BOTTOM band, not the top: the top strip is the HUD and the middle is the
     countdown, so the hint sits along the bottom edge, clear of the corner
     joystick / dash controls. */
  const y=clamp(ch-safeB-h-ch*0.055,safeT+4,Math.max(safeT+4,ch-h-4));
  ctx.fillStyle='rgba(30,22,14,.72)'; rr(ctx,cw/2-w/2,y,w,h,h/2); ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,233,168,.45)'; ctx.stroke();
  txt(ctx,msg,cw/2,y+h/2,fs,'#ffe9a8');
  ctx.globalAlpha=1;
}
function drawPortraitSplash(){
  /* Shown only in the brief portrait beat before the shell rotates the
     game to landscape — same characters as the landscape menu, centred. */
  ctx.fillStyle='rgba(20,30,10,.30)'; ctx.fillRect(0,0,cw,ch);
  const ts=clamp(cw*0.115,40,92);
  const ty=safeT+ch*0.22;
  txt(ctx,'CHICKEN',cw/2,ty,ts,'#ffd23e',OUT,ts*0.17);
  txt(ctx,'CHAOS',cw/2,ty+ts*1.02,ts,'#ff5c52',OUT,ts*0.17);
  const sc=clamp(cw*0.0062,1.4,3.2);
  const hy=ch*0.68;
  ctx.save();
  const sh2=ctx.createRadialGradient(cw/2,hy+10,4,cw/2,hy+10,70*sc/2.6);
  sh2.addColorStop(0,'rgba(15,35,10,.4)'); sh2.addColorStop(1,'rgba(15,35,10,0)');
  ctx.fillStyle=sh2; ctx.beginPath(); ctx.ellipse(cw/2,hy+10,60*sc/2.6,16*sc/2.6,0,0,TAU); ctx.fill();
  ctx.restore();
  drawChickenAt(cw/2,hy,sc,{t:game.simT,face:1,open:ck.open});
}
/* Back arrow, drawn as lines so it stays crisp at any radius. Tip, arms and
   shaft are mirrored about the button centre, so the glyph can never read as
   sitting off-centre (the old version ended its shaft at +0.42r — a stub). */
function drawBackIcon(x,y,r,col){
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle=col||UI.icon; ctx.lineWidth=r*0.22;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(-r*0.34,0); ctx.lineTo(r*0.34,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.12,-r*0.40); ctx.lineTo(-r*0.34,0); ctx.lineTo(r*0.12,r*0.40); ctx.stroke();
  ctx.restore();
}
function drawMenu(){
  ctx.fillStyle='rgba(20,30,10,.25)'; ctx.fillRect(0,0,cw,ch);
  const g=ctx.createLinearGradient(0,ch*0.45,0,ch);
  g.addColorStop(0,'rgba(20,26,10,0)'); g.addColorStop(1,'rgba(18,24,8,.65)');
  ctx.fillStyle=g; ctx.fillRect(0,ch*0.45,cw,ch*0.55);
  /* Back to the shell, top-left of the start page — same size, same 14px inset
     and the same theme as the gear opposite it, so the pair reads as one pair. */
  const br=clamp(Math.min(cw,ch)*0.058,23,29);
  circleBtn('backBtn',safeL+br+14,safeT+br+14,br,'',
    {fn:()=>{ try{ Studio.exitGame(); }catch(_){} }});
  drawBackIcon(BTN.backBtn.x+br,BTN.backBtn.y+br,br*0.62);
  /* Drop-in choreography: each beat eases in after the portrait->landscape
     rotation (menuT resets on Game.onOrientationChange and on toMenu). */
  const mt=game.menuT||0;
  const beat=(d,dur)=>{const k=clamp((mt-d)/dur,0,1);return 1-Math.pow(1-k,3);};
  const back=t=>{const c=2.0;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

  /* ---------- LEFT: game title + chicken graphic ---------- */
  const kT=beat(0.05,0.5);
  const tx=Math.max(cw*0.24,safeL+ch*0.28);
  const ts=clamp(ch*0.16,44,104);
  ctx.save();
  ctx.globalAlpha=kT;
  ctx.translate(tx-(1-kT)*70,safeT+ch*0.24);
  ctx.rotate(-0.04+(1-kT)*0.12);
  txt(ctx,'CHICKEN',0,0,ts,'#ffd23e',OUT,Math.max(9,ts*0.17));
  txt(ctx,'CHAOS',0,ts*0.99,ts,'#ff5c52',OUT,Math.max(9,ts*0.17));
  ctx.restore();
  const kC=back(beat(0.22,0.55));
  const csc=clamp(ch*0.0062,1.4,3.4)*(0.55+0.45*kC);
  const hx=tx, hy=safeT+ch*0.70;
  ctx.save();
  const sh2=ctx.createRadialGradient(hx,hy+10,4,hx,hy+10,70*csc/2.6);
  sh2.addColorStop(0,'rgba(15,35,10,.4)'); sh2.addColorStop(1,'rgba(15,35,10,0)');
  ctx.fillStyle=sh2; ctx.beginPath(); ctx.ellipse(hx,hy+10,60*csc/2.6,16*csc/2.6,0,0,TAU); ctx.fill();
  ctx.restore();
  drawChickenAt(hx,hy,csc,{t:game.simT,face:1,open:ck.open});

  /* ---------- RIGHT: play menu, vertically centered ---------- */
  const bw=clamp(cw*0.30,240,380);
  const rx=Math.min(cw*0.72,cw-safeR-bw/2-24);
  const bh=clamp(ch*0.16,54,86);
  const th=clamp(ch*0.105,38,54);
  /* Stack height: PLAY + gap + LOCAL/VSAI + gap + PLAYERS label +
     player row + caption. Start Y = (ch - stack)/2 so the whole
     right column is centered vertically on screen. */
  const labelH=clamp(th*0.4,14,19);
  const stackH=bh+16+th+20+labelH+12+th*0.9+44;
  const by=Math.max(safeT+16,(ch-stackH)/2);
  const kP=beat(0.36,0.4);
  uiBtn('play',rx-bw/2,by+(1-kP)*46,bw,bh,'PLAY',{fill:'#59c126',stroke:'#2e6b12',fs:bh*0.46,fn:startMatch});
  const kM=beat(0.46,0.4);
  const ty2=by+bh+16+(1-kM)*46;
  uiBtn('loc',rx-bw/2,ty2,bw/2-6,th,'LOCAL',{fill:!game.solo?'#f6b41e':'rgba(60,50,35,.7)',stroke:!game.solo?'#8f6206':'#241c10',fs:th*0.34,fn:()=>{game.solo=false;savePref();}});
  uiBtn('sol',rx+6,ty2,bw/2-6,th,'VS BOTS',{fill:game.solo?'#f6b41e':'rgba(60,50,35,.7)',stroke:game.solo?'#8f6206':'#241c10',fs:th*0.34,fn:()=>{game.solo=true;savePref();}});
  const kN=beat(0.56,0.4);
  const cy3=ty2+th+20+(1-kN)*46;
  txt(ctx,game.solo?'BOTS':'PLAYERS',rx,cy3,clamp(th*0.4,14,19),'#ffe9b0','rgba(0,0,0,.4)',3);
  const pw3=(bw-16)/3;
  const lo=game.solo?1:2;              /* BOTS row counts bots 1-3; PLAYERS row counts humans 2-4 */
  const sel=game.solo?game.playerCount-1:game.playerCount;
  for(let i=lo;i<lo+3;i++){
    uiBtn('pc'+i,rx-bw/2+(i-lo)*(pw3+8),cy3+12+(1-kN)*46,pw3,th*0.9,''+i,{
      fill:sel===i?'#59c126':'rgba(60,50,35,.7)',
      stroke:sel===i?'#2e6b12':'#241c10',fs:th*0.42,
      fn:()=>{game.playerCount=game.solo?i+1:i;savePref();}});
  }
  const kC2=beat(0.66,0.4);
  ctx.globalAlpha=kC2;
  txt(ctx,game.solo?('YOU vs '+(game.playerCount-1)+' BOT'+(game.playerCount>2?'S':'')+' CHALLENGERS'):'PASS-AND-PLAY ON ONE SCREEN',rx,cy3+12+th*0.9+26+(1-kC2)*10,clamp(th*0.36,13,17),'rgba(255,240,200,.85)','rgba(0,0,0,.35)',3);
  ctx.globalAlpha=1;

  /* settings gear (top right) + its panel on top of everything */
  drawSettingsBtn();
  drawSettingsPanel();
}
function savePref(){ try{ Studio.save('cc:pref',JSON.stringify({players:game.playerCount,solo:game.solo})); }catch(_){} }

/* (the 5-point star helper used by v2's result panel is gone — no stars now) */

/* ============================================================
   RESULT CARD — one cream board in the game's own language.
   LEFT HALF: the winner's chicken at full size. RIGHT HALF: who
   won, then the catch table, then the two options. No colour band
   and no stars: the winner is said in words and shown by the
   colour of their own row and of the bird.
============================================================ */
function hexA(h,a){                     /* '#rrggbb' + alpha -> rgba() */
  const n=parseInt(String(h).slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function drawResult(){
  ctx.fillStyle='rgba(20,26,10,.55)'; ctx.fillRect(0,0,cw,ch);
  for(const c of confetti){
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.fillStyle=c.c; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore();
  }
  const ranked=[...players].sort((a,b)=>b.score-a.score);
  const win=ranked[0];
  const tie=ranked.length>1&&ranked[1].score===win.score;
  const wc=tie?UI.amber:win.col.m;                   /* the accent colour */
  const wtxt=tie?"IT'S A TIE!":(win.col.cn+' WINS!');
  const pop=clamp(1-(1.2-game.stateT)*3,0,1);
  const psc=0.94+0.06*pop;                           /* a small settle, so the drawn
                                                        card stays inside the taps */

  /* Narrower than the first cut: the right half only carries a headline, the
     catch table and two buttons, so the card does not need the whole screen. */
  const ph=clamp(ch*0.92,210,ch*0.97), pw=clamp(ch*1.60,330,cw*0.84);
  const px=cw/2-pw/2, py=(ch-ph)/2;
  const rad=clamp(ph*0.075,14,26);
  const pad=clamp(ph*0.055,10,22);
  const gap=clamp(pw*0.022,7,16);
  const leftW=pw*0.44;                               /* LEFT HALF: the paddock */
  const rx=px+leftW+gap*0.6, rw=px+pw-pad-rx;         /* RIGHT HALF: text+table */
  const bh=clamp(ch*0.11,42,54);
  const bw=(rw-gap)/2;
  const by=py+ph-pad-bh;

  ctx.save();
  ctx.translate(cw/2,py+ph/2); ctx.scale(psc,psc);
  ctx.translate(-cw/2,-(py+ph/2));

  /* --- the board: cream warming into the game's wood tan, brown outline --- */
  ctx.fillStyle='rgba(15,10,5,.42)'; rr(ctx,px+5,py+9,pw,ph,rad); ctx.fill();
  const bg=ctx.createLinearGradient(0,py,0,py+ph);
  bg.addColorStop(0,'#fffdf6'); bg.addColorStop(1,'#f0ddb8');
  ctx.fillStyle=bg; rr(ctx,px,py,pw,ph,rad); ctx.fill();
  ctx.lineWidth=7; ctx.strokeStyle=UI.edge; ctx.stroke();

  /* --- LEFT HALF: a grass paddock with the winner's chicken standing on it ---
     The paddock is sized to the BIRD (not to the card's full height), so the
     grass reads as ground under it instead of an empty green column. */
  const gx0=px+pad*0.62, gw=leftW-pad*1.24;
  const csc=clamp((gw-pad*1.2)/52,1.1,6.0);
  const gh=Math.min(ph-pad*1.24,37.5*csc+pad*2.6);
  const gy0=py+(ph-gh)/2;
  const ggd=ctx.createLinearGradient(0,gy0,0,gy0+gh);
  ggd.addColorStop(0,'#82d35c'); ggd.addColorStop(1,'#57a838');
  ctx.fillStyle=ggd; rr(ctx,gx0,gy0,gw,gh,rad*0.7); ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle=UI.edge; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.14)';              /* sun on the grass */
  rr(ctx,gx0+5,gy0+5,gw-10,gh*0.24,rad*0.5); ctx.fill();
  const ccx=gx0+gw/2, ccy=gy0+gh/2;
  const bx0=ccx-csc, by0=ccy+7.4*csc;                 /* ink centre above the feet */
  const shR=52*csc/2.6;                               /* the menu's contact shadow */
  const sh=ctx.createRadialGradient(bx0,by0+11*csc+2,2,bx0,by0+11*csc+2,shR);
  sh.addColorStop(0,'rgba(12,32,8,.40)'); sh.addColorStop(1,'rgba(12,32,8,0)');
  ctx.fillStyle=sh; ctx.beginPath();
  ctx.ellipse(bx0,by0+11*csc+2,shR*0.92,shR*0.30,0,0,TAU); ctx.fill();
  /* the start-page chicken itself: plain white, no colour tint */
  drawChickenAt(bx0,by0,csc,{t:game.simT,face:1,open:ck.open});

  /* --- RIGHT HALF: who won, in the TIME UP! headline style + a 6px accent rule --- */
  const titleFs=fitSize(wtxt,rw,clamp(ph*0.155,20,40),14);
  const titleY=py+pad+titleFs*0.62;
  ctx.fillStyle=wc; rr(ctx,rx,titleY-titleFs*0.46,6,titleFs*0.92,3); ctx.fill();
  txt(ctx,wtxt,rx+18,titleY,titleFs,'#ffd23e',OUT,Math.max(3,titleFs*0.16),'900','left');

  /* --- the catch table: one row per player, the winner named in words --- */
  const capFs=clamp(ph*0.042,11,15);
  const capY=titleY+titleFs*0.82;
  txt(ctx,tie?'EVERYONE CAUGHT THE SAME':'CHICKENS CAUGHT',rx+18,capY,capFs,UI.dim,null,0,'900','left');
  const rgap=clamp(ph*0.016,4,8);
  const listTop=capY+capFs*1.5, room=(by-16)-listTop;    /* keep 16px clear of the buttons */
  const rowH=clamp(Math.min(ph*0.125,(room-(ranked.length-1)*rgap)/ranked.length),26,50);
  const listH=ranked.length*rowH+(ranked.length-1)*rgap;
  const listY=listTop+Math.max(0,(room-listH)/2);
  ranked.forEach((p,i)=>{
    const ry=listY+i*(rowH+rgap), isTop=p.score===win.score;
    ctx.fillStyle=isTop?hexA(p.col.m,0.22):'rgba(74,51,35,.06)';
    rr(ctx,rx,ry,rw,rowH,rowH*0.34); ctx.fill();
    ctx.lineWidth=isTop?4:2.5;
    ctx.strokeStyle=isTop?p.col.d:'rgba(74,51,35,.20)'; ctx.stroke();
    const chip=rowH*0.56;                            /* the player's colour chip */
    ctx.fillStyle=p.col.m;
    rr(ctx,rx+rowH*0.30,ry+rowH/2-chip/2,chip,chip,chip*0.32); ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    txt(ctx,p.col.cn,rx+rowH*0.30+chip+rowH*0.26,ry+rowH/2,
        clamp(rowH*0.36,11,17),isTop?UI.ink:UI.dim,null,0,'900','left');
    const sfs=clamp(rowH*0.52,14,26), sww=measureTxt(''+p.score,sfs);
    txt(ctx,''+p.score,rx+rw-rowH*0.34,ry+rowH/2,sfs,
        isTop?p.col.d:UI.ink,null,0,'900','right');
    if(isTop&&!tie){                                 /* said in words, not a star */
      const tag='WINNER', t2=clamp(rowH*0.30,9,14), tw2=measureTxt(tag,t2)+16;
      const tX=rx+rw-rowH*0.34-sww-10-tw2;
      ctx.fillStyle=UI.face; rr(ctx,tX,ry+rowH/2-rowH*0.19,tw2,rowH*0.38,rowH*0.19); ctx.fill();
      ctx.lineWidth=2.4; ctx.strokeStyle=p.col.d; ctx.stroke();
      txt(ctx,tag,tX+tw2/2,ry+rowH/2,t2,p.col.d);
    }
  });

  /* --- the two options: the ad runs only when one of THESE is chosen --- */
  uiBtn('rem',rx,by,bw,bh,'PLAY AGAIN',
    {fill:UI.green,stroke:UI.greenEdge,fs:bh*0.30,fn:()=>adBreak(startMatch)});
  uiBtn('menu',rx+bw+gap,by,bw,bh,'MENU',
    {fill:UI.grey,stroke:UI.greyEdge,fs:bh*0.30,fn:()=>adBreak(toMenu)});
  ctx.restore();
}
function drawPaused(){
  ctx.fillStyle='rgba(20,26,10,.6)'; ctx.fillRect(0,0,cw,ch);
  txt(ctx,'PAUSED',cw/2,ch*0.28,clamp(ch*0.11,44,64),'#fff',OUT,12);
  const bw=Math.min(280,cw*0.34),bh=clamp(ch*0.115,52,66);
  const bx=cw/2-bw/2;

  by+=bh+14;

  by+=bh+14;

}
function drawTimeUp(){
  ctx.fillStyle='rgba(20,26,10,.35)'; ctx.fillRect(0,0,cw,ch);
  const sc=1+Math.sin(game.simT*6)*0.02;
  const fs=clamp(ch*0.095,28,54);    /* was a fixed 100px, then still too loud */
  ctx.save(); ctx.translate(cw/2,ch*0.42); ctx.scale(sc,sc);
