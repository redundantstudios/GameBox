}

/* ============================================================
   ROTATE OVERLAY
============================================================ */
function drawRotate(){
  ctx.fillStyle='rgba(14,20,8,.93)'; ctx.fillRect(0,0,cw,ch);
  const s=Math.min(cw,ch);
  const cxp=cw/2, cyp=ch*0.36;
  const rot=PI/2*(0.5+0.5*Math.sin(game.simT*2.0));
  ctx.save(); ctx.translate(cxp,cyp); ctx.rotate(rot);
  const pw2=s*0.17, ph2=s*0.30;
  ctx.fillStyle='#f2e3c0'; rr(ctx,-pw2/2,-ph2/2,pw2,ph2,pw2*0.18); ctx.fill();
  ctx.lineWidth=Math.max(3,s*0.012); ctx.strokeStyle=OUT; ctx.stroke();
  ctx.fillStyle='#79b95c'; rr(ctx,-pw2/2+5,-ph2/2+7,pw2-10,ph2-14,4); ctx.fill();
  ctx.fillStyle='#e8483f';
  ctx.beginPath(); ctx.arc(0,-ph2*0.18,4,0,TAU); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-ph2*0.10,7,0,TAU); ctx.fill();
  ctx.fillStyle='#f6a01a'; ctx.beginPath(); ctx.moveTo(5,-ph2*0.10); ctx.lineTo(12,-ph2*0.06); ctx.lineTo(5,-ph2*0.04); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.arc(2,-ph2*0.12,1.6,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)'; rr(ctx,-pw2/2+5,-ph2/2+7,pw2-10,6,3); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(cxp,cyp);
  ctx.strokeStyle='#ffd23e'; ctx.lineWidth=Math.max(4,s*0.016); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,s*0.30,-0.9,0.7); ctx.stroke();
  const ax2=Math.cos(0.7)*s*0.30, ay2=Math.sin(0.7)*s*0.30, aa=0.7+PI/2;
  ctx.fillStyle='#ffd23e';
  ctx.beginPath();
  ctx.moveTo(ax2+Math.cos(aa)*s*0.045,ay2+Math.sin(aa)*s*0.045);
  ctx.lineTo(ax2+Math.cos(aa+2.5)*s*0.045,ay2+Math.sin(aa+2.5)*s*0.045);
  ctx.lineTo(ax2-Math.cos(aa)*s*0.03,ay2-Math.sin(aa)*s*0.03);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  const ts=clamp(cw*0.075,26,54);
  txt(ctx,'ROTATE YOUR DEVICE',cw/2,ch*0.68,ts,'#fff',OUT,ts/6);
  txt(ctx,'THIS GAME IS LANDSCAPE ONLY',cw/2,ch*0.68+ts*0.95,clamp(ts*0.42,13,20),'#ffe9a8',null,0);
}

/* ============================================================
   STATE / MATCH FLOW
============================================================ */
function startMatch(){
  tryLandscapeLock();
  measure();
  game.demo=false;
  buildPlayers(false);
  resetChicken();
  powerups.length=0; floats.length=0; parts.length=0;
  resetZonePointers();
  game.puT=3; game.matchT=CFG.MATCH_TIME;
  game.state='COUNTDOWN'; game.countT=3.0; game.prevC=4; game.goT=0; game.hintT=0;
  game.warnSec=0;
  cam.x=WORLD_W/2; cam.y=WORLD_H/2; cam.zoom=1;
}
function toMenu(){
  game.demo=true;
  buildPlayers(true);
  resetChicken();
  powerups.length=0; floats.length=0; confetti.length=0;
  resetZonePointers();
  game.puT=2; game.state='MENU'; game.autoPaused=false;
  game.warnSec=0; game.adBusy=false;
  game.menuT=0; game.settingsOpen=false; game.setT=0;
}
function endMatch(){
  game.state='RESULT'; game.stateT=1.2;
  const ranked=[...players].sort((a,b)=>b.score-a.score);
  game.winnerSeat=ranked[0].seat;
  game.tie=ranked.length>1&&ranked[1].score===ranked[0].score;
  confetti=[];
  for(let i=0;i<110;i++) confetti.push({x:rand(0,cw),y:rand(-ch,0),vx:rand(-30,30),vy:rand(60,160),
    rot:rand(0,TAU),vr:rand(-4,4),w:rand(6,11),h:rand(4,7),
    c:[PCOL[i%4].m,'#ffd23e','#7ee04a','#fff'][i%4]});
  stars(cw/2,ch*0.3,14);
  ringFx(cw/2,ch*0.3,'rgba(255,210,62,',10,60);
  Snd.play('victory'); hap('success');
}
/* Result-card ad: ONE interstitial, asked of the shell only when the player
   CHOOSES to leave the card (PLAY AGAIN / MENU) — never popped over the result
   the instant the match ends. The shell always answers (too-early, frequency
   cap, not-loaded and offline all call back immediately), so the game never
   waits on it, and `next` is whatever the player actually tapped. */
function adBreak(next){
  let done=false;
  const go=function(){ if(done) return; done=true; game.adBusy=false; if(next) next(); };
  if(game.demo||game.adBusy){ if(next) next(); return; }   /* one ask at a time */
  game.adBusy=true;
  try{ Studio.ads.interstitial(go); }catch(_){ go(); }
}
function updateConfetti(dt){
  for(const c of confetti){
    c.x+=c.vx*dt+Math.sin(game.simT*3+c.rot)*20*dt;
    c.y+=c.vy*dt; c.rot+=c.vr*dt;
    if(c.y>ch+20){ c.y=rand(-60,-10); c.x=rand(0,cw); }
  }
}

/* ============================================================
   MAIN UPDATE
============================================================ */
function update(dt){
  game.simT+=dt;
  if(game.settingsOpen) game.setT=Math.min(0.3,(game.setT||0)+dt);
  if(game.hitStop>0){ game.hitStop-=dt; dt=0.0001; }
  if(portrait){
    if(game.state==='PLAYING'||game.state==='COUNTDOWN'||game.state==='TIMEUP'){
      if(!game.autoPaused){
        game.autoPaused=true; game.prevState=game.state;
        game.state='PAUSED'; resetZonePointers();
      }
    }
  } else if(game.autoPaused&&game.state==='PAUSED'){
    game.autoPaused=false;
    game.state=game.prevState;
    lastT=performance.now();
  }
  const st=game.state;
  if(st==='COUNTDOWN'){
    // FULL GAMEPLAY FREEZE during 3-2-1: no player/chicken/AI
    // movement, no physics, no collision updates. Only the
    // countdown itself ticks. Dash presses made during the
    // countdown are flushed so nothing fires at GO. Joystick
    // visuals may still track touch, but no input pass runs,
    // so it cannot affect player position.
    game.countT-=dt;
    const n=Math.ceil(Math.max(0,game.countT));
    if(n<game.prevC&&n>0){ game.prevC=n; Snd.play('tick'); hap('light'); }
    for(const p of players) p.wantDash=false;
    if(game.countT<=0){ game.state='PLAYING'; game.goT=0.8; game.hintT=2.6; Snd.play('go'); hap('medium'); }
  }
  else if(st==='PLAYING'){
    if(game.goT>0) game.goT-=dt;
    game.hintT-=dt;
    game.matchT-=dt;
    const active=game.matchT>0;
    updatePlayers(dt,active);
    updateChicken(dt);
    updatePowerups(dt,active);
    updParticles(dt); updFloats(dt);
    /* Last seconds: one tick per second, harder inside the final five. */
    const sec=Math.ceil(game.matchT);
    if(sec>0&&sec<=CFG.WARN_SEC&&sec!==game.warnSec){
      game.warnSec=sec;
      Snd.play(sec<=CFG.FINAL_SEC?'warn':'tick');
      if(sec<=CFG.FINAL_SEC) hap('light');
    }
    if(game.matchT<=0){
      game.matchT=0; game.state='TIMEUP'; game.stateT=1.3;
      Snd.play('timeup'); hap('medium');
    }
  }
  else if(st==='TIMEUP'){
    game.stateT-=dt;
    updatePlayers(dt,false); updateChicken(dt);
    updParticles(dt); updFloats(dt);
    if(game.stateT<=0) endMatch();
  }
  else if(st==='MENU'){
    game.menuT=Math.min(2,(game.menuT||0)+dt);
    updatePlayers(dt,true);
    updateChicken(dt);
    updatePowerups(dt,true);
    updParticles(dt); updFloats(dt);
  }
  else if(st==='RESULT'){
    updatePlayers(dt,false); updateChicken(dt);
    updParticles(dt); updFloats(dt);
    updateConfetti(dt); game.stateT+=dt;
  }
  else if(st==='PAUSED'){ /* frozen */ }
  updateCam(st==='PAUSED'?0.0001:dt);
}

/* ============================================================
   MAIN RENDER
============================================================ */
function render(){
  uiButtons=[];
  if(portrait){
    renderWorld();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    /* Menu shows a branded splash in the brief portrait beat before the
       shell rotates; gameplay states keep the rotate hint. */
    if(game.state==='MENU'){ drawPortraitSplash(); }
    else drawRotate();
    return;
  }
  renderWorld();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const st=game.state;
  if(st==='MENU'){ drawMenu(); }
  else if(st==='RESULT'){ drawResult(); }
  else if(st==='PAUSED'){ drawPaused(); }
  else {
    drawHUD();
    drawControls();
    if(st==='COUNTDOWN') drawCountdown();
    if(st==='PLAYING'){ if(game.goT>0) drawGo(); drawHint(); }
    if(st==='TIMEUP') drawTimeUp();
  }
}

/* ============================================================
   MAIN LOOP & LIFECYCLE
============================================================ */
let rafId=0,lastT=performance.now(),running=true;
function frame(now){
  if(!running) return;
  rafId=requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.05) dt=0.05;
  if(dt<=0) return;
  try{
    computeZones();
    update(dt);
    render();
  }catch(e){ showErr(e); running=false; }
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&(game.state==='PLAYING'||game.state==='COUNTDOWN')) Game.pause();
  else lastT=performance.now();
});
const Game={
  pause(){
    if(game.state==='PLAYING'||game.state==='COUNTDOWN'){
      game.prevState=game.state; game.state='PAUSED';
      resetZonePointers();
    }
  },
  resume(){
    if(game.state==='PAUSED'){ game.state=game.prevState; lastT=performance.now(); }
  },
  setMuted(m){ setMuted(!!m); },
  /* Pushed in by the shell (GameActivity.onResume) whenever sound / haptics /
     volume changed while this game was paused — same contract as Ludo's. */
  setSettings(s){
    try{
      if(!s) return;
      if(typeof s.sound==='boolean') setMuted(!s.sound);
      if(typeof s.haptics==='boolean') Studio.settings.haptics=!!s.haptics;
      if(typeof s.volume==='number') Snd.setVolume(s.volume>1? s.volume/100 : s.volume);
      saveSettings();
    }catch(_){}
  },
  onOrientationChange(){
    /* Called by the shell when its portrait->landscape rotation completes —
       the menu replays its drop-in choreography from this beat. */
    measure();
    if(game.state==='MENU') game.menuT=0;
  },
  destroy(){
    running=false;
    cancelAnimationFrame(rafId);
    cv.removeEventListener('pointerdown',onDown);
    cv.removeEventListener('pointermove',onMove);
    cv.removeEventListener('pointerup',onUp);
    cv.removeEventListener('pointercancel',onCancel);
    cv.removeEventListener('lostpointercapture',onLostPointerCapture);
    window.removeEventListener('keydown',onKey);
    window.removeEventListener('keyup',onKey);
    window.removeEventListener('resize',measure);
    if(window.visualViewport&&visualViewport.removeEventListener)
      visualViewport.removeEventListener('resize',measure);
    if(Snd.ctx){ try{Snd.ctx.close();}catch(_){} }
  }
};
window.Game=Game;

/* ============================================================
   BOOT
============================================================ */
function boot(){
  measure();
  // Canvas text cannot trigger @font-face loading by itself — kick it here so
  // the display font is ready by the first frames (fallback until resolved).
  try{ if(document.fonts&&document.fonts.load) document.fonts.load('20px "Luckiest Guy"'); }catch(_){}
  buildSprites();
  buildGround();
  buildWorld();
  toMenu();
  Snd.setMuted(game.muted);
  lastT=performance.now();
  rafId=requestAnimationFrame(frame);
}
try{ boot(); }catch(e){ showErr(e); }
</script>
