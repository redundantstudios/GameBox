plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // Code package AND the Play-facing id, now that the app is listed fresh.
    // They used to differ (namespace ...arcade, applicationId ...minigames);
    // the old listing has been deleted, so the new one is created under
    // com.redundantstudios.arcade and the two no longer need to diverge.
    namespace 'com.redundantstudios.arcade'
    compileSdk 36

    defaultConfig {
        // THE ID GOOGLE PLAY SEES. It must match the Play Console listing
        // EXACTLY, or the upload is rejected. The fresh listing is created
        // under this id.
        applicationId "com.redundantstudios.arcade"
        minSdk 24
        // Google Play requires a target at API 35+ for new uploads as of
        // Aug 2025, and this app is now on 36 so the newest behaviour changes
        // (edge-to-edge, predictive back) are what we actually test on device.
        targetSdk 36
        // Fresh Play listing: the first upload is versionCode 1.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing.
    //
    // The passwords are NOT in this file and must never be committed. They are
    // read from keystore.properties, which is gitignored - see the sample at
    // keystore.properties.sample for the exact keys. The keystore itself is
    // gitignored too, so keep a backup somewhere safe: losing the key means you
    // can never update the app on Play again (unless you enrol in Play App
    // Signing key reset).
    //
    // If the file is missing (a fresh clone, or someone who only wants to run
    // the debug build), signing falls back to environment variables and then to
    // null. assembleDebug needs none of this, so a contributor can clone and
    // build the debug APK without ever holding the release secrets.
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def storePwd = props.getProperty('storePassword')
                ?: System.getenv('KEYSTORE_STORE_PASSWORD')
            def keyPwd = props.getProperty('keyPassword')
                ?: System.getenv('KEYSTORE_KEY_PASSWORD')
            def alias = props.getProperty('keyAlias')

            storeFile file('../release-key.jks')
            if (storePwd != null) storePassword storePwd
            if (alias != null) keyAlias alias
            if (keyPwd != null) keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            // R8 strips unused classes and methods. The rules that keep the
            // WebView bridge and XML-inflated views alive live in
            // app/proguard-rules.pro - read it before changing anything here.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Single source of truth for the AdMob APPLICATION_ID, injected into
    // AndroidManifest.xml as ${admobAppId}. It must be the APP id that owns the
    // unit ids in AdMobManager.kt - the app part has to read
    // ca-app-pub-9565881819222312 or the SDK rejects those units and no ad loads.
    // The numeric part after the ~ is published by the AdMob console.
    defaultConfig {
        manifestPlaceholders += [admobAppId: "ca-app-pub-9565881819222312~4278086469"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // AdMob & UMP
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'

    // Local notifications (WorkManager scheduling)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'
}