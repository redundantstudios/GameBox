buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.2.2 refused compileSdk 36 ("installed Build Tools revision X is
        // corrupted" / max supported 34). 8.7.3 is the first line that compiles
        // against android-36 and needs Gradle 8.9+, so BUILD/BUNDLE now call the
        // 8.11.1 distribution in ~/.gradle-dist.
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
    }
}
