<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8AD8E8">
<title>Lickety Split — tongue-swinging frog mayhem</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#35263B;--cream:#FFF6E4;--yellow:#FFC93C;--pink:#FF6B8A}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#8AD8E8;font-family:'Baloo 2','Trebuchet MS',sans-serif}
#game{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
.otl{color:var(--cream);text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 6px 0 var(--ink)}
.otlBig{color:var(--cream);text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 5px 0 var(--ink)}
/* ============ HUD (aligned to the portrait stage by JS) ============ */
#hud{position:fixed;top:0;bottom:0;left:0;width:100%;pointer-events:none;z-index:5}
#hHeight{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-family:'Titan One';font-size:clamp(36px,10vw,52px);line-height:1;letter-spacing:1px}
#hHeight small{font-size:.42em}
#hLeft{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;display:flex;flex-direction:column;gap:2px}
.stat{display:flex;align-items:center;gap:7px;font-family:'Titan One';font-size:clamp(15px,4.4vw,19px);line-height:1.35}
#combo{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-family:'Titan One';font-size:28px;color:var(--yellow);text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),0 5px 0 var(--ink);transition:opacity .2s}
#combo.off{opacity:0}
#combo.pop{animation:cpop .2s}
@keyframes cpop{0%{transform:translateX(-50%) scale(1.7)}100%{transform:translateX(-50%) scale(1)}}
#topRight{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:10px}
.iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:13px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .1s,box-shadow .1s}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.iconbtn .x{display:none}.iconbtn.muted .x{display:block}.iconbtn.muted .w{display:none}
/* ============ banner + hint ============ */
#banner{position:fixed;top:18%;left:0;right:0;text-align:center;z-index:6;pointer-events:none;opacity:0;font-family:'Titan One'}
#banner .b1{font-size:clamp(30px,8vw,54px)}
#banner .b2{font-size:clamp(14px,3.6vw,22px);color:var(--cream)}
#banner.show{animation:bpop 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bpop{0%{opacity:0;transform:scale(.4)}10%{opacity:1;transform:scale(1.1)}17%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
#hint{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-weight:800;font-size:clamp(14px,4vw,17px);color:var(--cream);text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);opacity:0;transition:opacity .35s;z-index:6;pointer-events:none;padding:0 24px}
#hint.show{opacity:1}
/* ============ overlays — all text inside the panels ============ */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:rgba(53,38,59,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
.hidden{display:none!important}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink),0 22px 50px rgba(0,0,0,.24);padding:24px 26px 20px;text-align:center;max-width:min(520px,94vw);animation:pin .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes pin{from{opacity:0;transform:translateY(18px) scale(.93)}to{opacity:1;transform:none}}
.logo{font-family:'Titan One';line-height:1;font-size:clamp(34px,10vw,56px);text-align:center;pointer-events:none;margin-bottom:8px}
.logo span{display:inline-block;animation:bnc 1.5s ease-in-out infinite;animation-delay:calc(var(--i)*.07s)}
.logo .r2 span{animation-name:bnc2}
@keyframes bnc{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes bnc2{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.logo .r2{color:var(--yellow)}
.tag{font-weight:800;color:#6B5A6E;margin-bottom:16px;font-size:clamp(13.5px,3.8vw,15.5px);line-height:1.4}
.tag b{color:var(--ink)}
.hr{height:3px;background:rgba(53,38,59,.09);border-radius:2px;margin:14px -4px}
.btn{pointer-events:auto;font-family:'Titan One';font-size:clamp(22px,6vw,27px);color:var(--ink);background:var(--yellow);border:4px solid var(--ink);border-radius:999px;padding:11px 52px;cursor:pointer;box-shadow:0 5px 0 var(--ink);letter-spacing:1px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:var(--cream);font-size:15px;padding:9px 24px}
.btnRow{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.secT{font-family:'Titan One';font-size:11px;color:#9A8AA0;letter-spacing:3px;margin-bottom:9px}
.skins{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.skin{width:60px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 2px 4px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'Baloo 2';font-weight:800;font-size:10.5px;color:var(--ink);transition:transform .12s}
.skin canvas{width:44px!important;height:44px!important}
.skin:hover{transform:translateY(-2px)}
.skin:active{transform:translateY(1px)}
.skin.sel{background:#FFE9A8;outline:3px solid var(--yellow)}
.skin.lock{opacity:.85}
.skin.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pill{margin-top:14px;display:inline-flex;gap:6px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 16px;font-family:'Titan One';font-size:12px;letter-spacing:1px;color:#8A7A90;box-shadow:0 3px 0 var(--ink)}
.pill b{color:var(--ink)}
.btn:focus-visible,.iconbtn:focus-visible,.skin:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
/* ============ death ============ */
#deadTitle{font-family:'Titan One';font-size:clamp(36px,11vw,56px);line-height:1;margin-bottom:10px}
.rank{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;font-family:'Titan One';font-size:14px;letter-spacing:1px;box-shadow:0 3px 0 var(--ink);margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 26px;margin:16px auto 2px;width:max-content}
.gL{font-size:10px;font-family:'Titan One';letter-spacing:2px;color:#9A8AA0;text-align:left}
.gV{font-family:'Titan One';font-size:22px;color:var(--ink);text-align:left;line-height:1.15}
#btnWatchAd{background:#6FE3A1;color:var(--ink)}
#btnWatchAd[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
#adHint{font-family:'Baloo 2';font-weight:800;color:#6B5A6E;font-size:13px;margin-top:8px;min-height:18px}
#dNew{background:var(--pink);color:var(--cream);font-family:'Titan One';font-size:13px;border:3px solid var(--ink);border-radius:999px;padding:4px 15px;display:inline-block;margin-top:10px;box-shadow:0 3px 0 var(--ink);animation:wig .5s infinite alternate}
@keyframes wig{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
@media(max-width:350px){
 .panel{padding:18px 12px 14px}
 .skin{width:54px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hHeight" class="otl"><span id="hHeightV">0</span><small> m</small></div>
  <div id="hLeft">
    <div class="stat otl"><svg width="19" height="19" viewBox="0 0 24 24"><ellipse cx="9" cy="9" rx="5" ry="2.6" fill="#fff" stroke="#35263B" stroke-width="1.6" transform="rotate(-24 9 9)"/><ellipse cx="15" cy="9" rx="5" ry="2.6" fill="#fff" stroke="#35263B" stroke-width="1.6" transform="rotate(24 15 9)"/><ellipse cx="12" cy="14.5" rx="4.4" ry="5.4" fill="#35263B"/><circle cx="10.6" cy="13" r="1" fill="#fff"/><circle cx="13.4" cy="13" r="1" fill="#fff"/></svg><span id="hFliesV">0</span></div>
    <div class="stat otl" style="font-size:.82em"><span id="hScoreV">0</span>&nbsp;PTS</div>
  </div>
  <div id="combo" class="off">×2</div>
  <div id="topRight">
    <button class="iconbtn" id="btnMute" title="mute (M)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#35263B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#35263B"/><path class="w" d="M16 9c1.4 1.6 1.4 4.4 0 6"/><path class="w" d="M18.5 6.5c2.6 3 2.6 8 0 11"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
    <button class="iconbtn" id="btnPause" title="pause (P)">
      <svg width="18" height="18" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="2" fill="#35263B"/><rect x="13.5" y="4" width="4.5" height="16" rx="2" fill="#35263B"/></svg>
    </button>
  </div>
</div>

<div id="banner"><div class="b1 otlBig" id="bMain"></div><div class="b2 otl" id="bSub"></div></div>
<div id="hint"></div>

<div id="menu" class="overlay">
  <div class="panel">
    <div class="logo otlBig">
      <div class="r1"><span style="--i:0">L</span><span style="--i:1">I</span><span style="--i:2">C</span><span style="--i:3">K</span><span style="--i:4">E</span><span style="--i:5">T</span><span style="--i:6">Y</span></div>
      <div class="r2"><span style="--i:2">S</span><span style="--i:3">P</span><span style="--i:4">L</span><span style="--i:5">I</span><span style="--i:6">T</span><span style="--i:7">!</span></div>
    </div>
    <div class="tag">Latch, reel, <b>SLINGSHOT</b> — outrun the hungry pond!</div>
    <button class="btn" id="btnPlay">PLAY</button>
    <div class="hr"></div>
    <div class="secT">FROG SKINS</div>
    <div class="skins" id="skinsRow"></div>
    <div class="pill" id="menuBest">BEST <b>0m</b></div>
  </div>
</div>

<div id="dead" class="overlay hidden">
  <div class="panel">
    <div id="deadTitle" class="otlBig">SPLAT!</div>
    <div class="rank" id="dRank">TADPOLE</div>
    <div class="grid">
      <div><div class="gL">HEIGHT</div><div class="gV" id="dHeight">0m</div></div>
      <div><div class="gL">SCORE</div><div class="gV" id="dScore">0</div></div>
      <div><div class="gL">FLIES</div><div class="gV" id="dFlies">0</div></div>
      <div><div class="gL">TOP COMBO</div><div class="gV" id="dCombo">×1</div></div>
    </div>
    <div><span id="dNew" class="hidden">NEW BEST!</span></div>
    <div class="pill" id="dBest">BEST <b>0m</b></div>
    <div id="adHint"></div>
    <div class="btnRow">
      <button class="btn" id="btnRetry">RETRY</button>
      <button class="btn" id="btnWatchAd">WATCH AD · CONTINUE</button>
      <button class="btn ghost" id="btnMenu2">MENU</button>
    </div>
  </div>
</div>

<div id="pauseOv" class="overlay hidden">
  <div class="panel">
    <div class="rank">PAUSED</div>
    <div class="btnRow">
      <button class="btn" id="btnResume">RESUME</button>
      <button class="btn ghost" id="btnQuit">QUIT</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================== utils ============================== */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.random()*a.length|0];
const frac=x=>x-Math.floor(x);
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function hexRGB(c){const n=parseInt(c.slice(1),16);return[n>>16&255,(n>>8)&255,n&255]}
function mix(c1,c2,t){const a=hexRGB(c1),b=hexRGB(c2);return`rgb(${lerp(a[0],b[0],t)|0},${lerp(a[1],b[1],t)|0},${lerp(a[2],b[2],t)|0})`}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const store={get(k,d){try{const v=localStorage.getItem('ls_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ls_'+k,JSON.stringify(v))}catch(e){}}};
function circle(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU)}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU)}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

/* ============================== constants ============================== */
const INK='#35263B', CREAM='#FFF6E4', PINK='#FF6B8A', RED='#FF5C5C';
/* PORTRAIT WORLD: the climbable column is always VW units wide.
   Vertical view (viewH) flexes with the device — tall phones see more sky. */
const VW=560, VH_MIN=900, PXM=42, MAXLEN=360, SHOOTV=3600, RETRV=4200, GRAV=1950, STARTY=109;
/* climbing feel */
const POPV=560, MINLEN=50;
/* exact-click tolerance: pointer must be ON the leaf's body (+ this much) */
const CLICK_TOL=12;
/* burrs only exist in OPEN SKY, far from every grab point */
const BURR_CLEAR=150, ANCHOR_CLEAR_BURR=120;
/* ===== DIFFICULTY CURVE: 0 = tutorial-easy (0m) → 1 = full brutal (DIFF_H) ===== */
const DIFF_H=500;
const diffNow=()=>clamp(G.maxH/DIFF_H,0,1);
const diffAt=m=>clamp(m/DIFF_H,0,1);
/* ===== POND PRESSURE — FAST: tiny grace, 2s ramp, hard chase ===== */
const POND_GRAB_WAIT=1, POND_IDLE_WAIT=5, POND_RAMP=2;
const POND_BASE=24, POND_SCALE=.7, POND_CAP=340;
const BIOMES=[
 {h:0,  name:'SUNNY POND',    skyT:'#8AD8E8',skyB:'#D9F2DC',cloud:'#FFFFFF',hillA:'#6FBF8E',hillB:'#4C9C74',water:'#2E9BC9',waterD:'#18608E',sun:'#FFE066',sunR:44,night:0,anc:['pad','vine']},
 {h:100,name:'BREEZY CANOPY', skyT:'#A5DCC0',skyB:'#ECF6C6',cloud:'#F6FFEC',hillA:'#3F8F5F',hillB:'#2C6E47',water:'#2FA0A8',waterD:'#175F66',sun:'#FFE066',sunR:44,night:0,anc:['leaf','branch']},
 {h:250,name:'SUNSET CLIFFS', skyT:'#FF8A5C',skyB:'#FFC96B',cloud:'#FFE3C2',hillA:'#8A4E6E',hillB:'#6A3A5C',water:'#9C6BA8',waterD:'#5E3A6E',sun:'#FF6B4A',sunR:92,night:0,anc:['branch','leaf']},
 {h:450,name:'FIREFLY NIGHTS',skyT:'#2E2A5E',skyB:'#54488F',cloud:'#6E66A8',hillA:'#241F4A',hillB:'#191538',water:'#2C2C64',waterD:'#161636',sun:'#FFF3C4',sunR:36,night:1,anc:['fruit','branch']},
 {h:700,name:'COSMIC POND',   skyT:'#171233',skyB:'#3A2160',cloud:'#544687',hillA:'#241747',hillB:'#150E2E',water:'#3A2E6E',waterD:'#1E1642',sun:'#FF9AC1',sunR:58,night:1,anc:['fruit','cloud']}
];
function biomeId(h){let i=0;for(let k=0;k<BIOMES.length;k++)if(h>=BIOMES[k].h)i=k;return i}
function paletteAt(h){h=Math.max(0,h);
 const i=biomeId(h),a=BIOMES[i],b=BIOMES[Math.min(i+1,BIOMES.length-1)];
 const t=b.h>a.h?clamp((h-(b.h-45))/45,0,1):0, s=t*t*(3-2*t);
 const m=k=>mix(a[k],b[k],s);
 return{name:s<.5?a.name:b.name,skyT:m('skyT'),skyB:m('skyB'),cloud:m('cloud'),hillA:m('hillA'),hillB:m('hillB'),water:m('water'),waterD:m('waterD'),sun:m('sun'),sunR:lerp(a.sunR,b.sunR,s),night:lerp(a.night,b.night,s)}
}
const SKINS=[
 {name:'Sprout', body:'#62C75A',belly:'#E9F7B4',dark:'#3E8E3F',need:0},
 {name:'Minty',  body:'#45C9A8',belly:'#DFFBEF',dark:'#2E8F77',need:100},
 {name:'Peachy', body:'#FF8FB2',belly:'#FFE3ED',dark:'#C95E86',need:250},
 {name:'Midnight',body:'#5A5FA8',belly:'#C9CDF5',dark:'#3A3E78',need:500},
 {name:'Solar',  body:'#FFB13D',belly:'#FFEDC4',dark:'#C77E17',need:750}
];
const VAL={fly:10,fire:15,dragon:25,gold:60};

/* ============================== canvas / stage ============================== */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,S=1,viewW=0,viewH=0,ox=0,stageL=0,stageW=0,sunX=0,moonX=0;
const worldW=VW;
function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 S=Math.min(W/VW,H/VH_MIN);
 viewW=W/S;viewH=H/S;
 ox=(viewW-VW)/2;
 stageW=VW*S;stageL=(W-stageW)/2;
 sunX=stageL+stageW*.78;moonX=stageL+stageW*.2;
 const hud=document.getElementById('hud');
 hud.style.left=stageL+'px';hud.style.width=stageW+'px';
 for(const a of G.anchors)a.x=clamp(a.x,60,worldW-60);
 G.frog.x=clamp(G.frog.x,30,worldW-30);
 G.aim.x=W/2;G.aim.y=H*.42;
}
addEventListener('resize',resize);

/* ============================== game state ============================== */
const G={state:'menu',paused:false,t:0,runT:0,ts:1,
 camY:-480,camY0:-480,shake:0,shx:0,shy:0,
 started:false,pondGo:0,floodY:150,eyeT:3,eyeX:200,eyeDur:0,pruneT:1,
 frog:{x:280,y:STARTY,vx:0,vy:0,r:26,blink:0,blinkT:2,eat:0,stun:0,safe:0,throat:0},
 tongue:{st:'none',tx:0,ty:0,dx:0,dy:-1,trav:0,tdist:0,ax:0,ay:0,len:0,anc:null,lastAnc:null,locked:null,fly:null},
 aim:{x:innerWidth/2,y:innerHeight/2,down:false},
 h:0,maxH:0,score:0,fliesEaten:0,combo:1,comboT:0,bestCombo:1,
 anchors:[],flies:[],burrs:[],shrooms:[],parts:[],floats:[],
 genY:-40,lastAX:280,nextMile:100,lastBiome:0,flash:0,dieT:0,cause:'',deadStats:null,
 farC:[{p:.22,kind:'c',items:[],genY:0},{p:.42,kind:'c',items:[],genY:0}],
 farH:[{p:.14,kind:'h',items:[],genY:0},{p:.30,kind:'h',items:[],genY:0}]
};
const keys={left:false,right:false};
const flags={grab:false,rise:false,hinted:false};
/* high score persistence — survives refresh & restarts */
let bestH=store.get('bestH',0), bestS=store.get('bestS',0), skinIdx=store.get('skin',0), muted=store.get('muted',false);

/* ============================== DOM refs ============================== */
const $=id=>document.getElementById(id);
const eHud=$('hud'),eHeightV=$('hHeightV'),eScoreV=$('hScoreV'),eFliesV=$('hFliesV'),eCombo=$('combo'),
 eBanner=$('banner'),eBMain=$('bMain'),eBSub=$('bSub'),eHint=$('hint'),
 eMenu=$('menu'),eMenuBest=$('menuBest'),eSkins=$('skinsRow'),eDead=$('dead'),eDBest=$('dBest'),

/* ============================== audio (all synthesized) ============================== */
let AC=null,master,sfxG,musicG,windG,nbuf;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
 sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
 musicG=AC.createGain();musicG.gain.value=.4;musicG.connect(master);
 const len=AC.sampleRate*2;nbuf=AC.createBuffer(1,len,AC.sampleRate);
 const d=nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const ws=AC.createBufferSource();ws.buffer=nbuf;ws.loop=true;
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.6;
 windG=AC.createGain();windG.gain.value=0;
 ws.connect(bp);bp.connect(windG);windG.connect(master);ws.start();
 startMusic();
}
function tone(f,dur,type,vol,slide,when){if(!AC)return;const t=AC.currentTime+(when||0);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(slide!=null)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
 g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+dur+.03)}
function noiseS(dur,freq,vol,type,when){if(!AC)return;const t=AC.currentTime+(when||0);
 const n=AC.createBufferSource();n.buffer=nbuf;
 const f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 n.connect(f);f.connect(g);g.connect(sfxG);n.start(t);n.stop(t+dur+.03)}
const SFX={
 thwip(){noiseS(.07,2500,.18);tone(700,.09,'square',.12,220)},
 stick(){tone(180,.1,'sine',.3,80);noiseS(.05,600,.12,'lowpass')},
 pop(){tone(900,.06,'square',.15,1400)},
 sling(){tone(240,.16,'triangle',.22,720);noiseS(.08,1400,.08,'bandpass')},
 gulp(c){const p=Math.pow(2,(c-1)/12*1.6);tone(520*p,.12,'sine',.3,140*p);tone(260*p,.08,'triangle',.2,120*p,.05);noiseS(.04,900,.1,'lowpass')},
 boing(){tone(160,.22,'triangle',.3,640);tone(320,.18,'sine',.15,900,.03)},
 sting(){tone(1400,.12,'sawtooth',.2,300);noiseS(.1,2000,.15)},
 splash(){noiseS(.35,700,.35,'lowpass');tone(300,.25,'sine',.25,90)},
 fall(){tone(1200,.7,'sine',.12,200);tone(200,.15,'sine',.28,50,.8)},
 chime(){[660,880,1320].forEach((f,i)=>tone(f,.25,'triangle',.16,null,i*.09))},
 croak(){tone(120,.09,'square',.16,90);tone(110,.12,'square',.16,70,.11)},
 whoosh(){noiseS(.12,900,.12,'bandpass')},
 deny(){tone(220,.12,'square',.15,180)}
};
let mStep=0,mNext=0,mTimer=null;const PENTA=[0,3,5,7,10,12,15,17];let mWalk=3;
function startMusic(){if(!AC||mTimer)return;mNext=AC.currentTime+.1;
 mTimer=setInterval(()=>{while(mNext<AC.currentTime+.3){playStep(mStep,mNext);mStep=(mStep+1)%32;mNext+=60/126/4}},90)}
function playStep(s,t){
 const mt=(f,dur,type,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(musicG);o.start(t);o.stop(t+dur+.02)};
 if(s%16===0||s%16===10){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(musicG);o.start(t);o.stop(t+.16)}
 if(s%8===4){const n=AC.createBufferSource();n.buffer=nbuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;
  const g=AC.createGain();g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  n.connect(f);f.connect(g);g.connect(musicG);n.start(t);n.stop(t+.06)}
 if(s%2===0&&Math.random()<.5){mWalk=clamp(mWalk+pick([-1,-1,0,1,1]),0,PENTA.length-1);mt(220*Math.pow(2,PENTA[mWalk]/12),.28,'triangle',.12)}
 if(s%16===0){mt(55,.5,'sine',.16);mt(110,.4,'triangle',.07)}
}

function addAnchor(x,y,bio,sc){sc=sc||1;const type=pick(bio.anc);
 const r={pad:34,leaf:30,branch:36,vine:24,fruit:22,cloud:30}[type]*sc;
 for(let i=G.burrs.length-1;i>=0;i--)if(dist(x,y,G.burrs[i].x,G.burrs[i].y)<ANCHOR_CLEAR_BURR)G.burrs.splice(i,1);
 G.anchors.push({x,y,r,type,seed:rand(0,TAU),rot:rand(-.5,.5),wob:0,wv:0,gre:Math.random()})}
function spawnFly(x,y,kind){G.flies.push({hx:x,hy:y,x,y,a:rand(0,TAU),sp:kind==='dragon'?2.2:kind==='gold'?0:rand(1.2,2),
 R:kind==='dragon'?40:kind==='gold'?0:rand(14,30),kind,r:kind==='dragon'?12:kind==='gold'?13:9,
 tx:x,ty:y,tt:0,grabbed:false,dead:false,seed:rand(0,9)})}
function genRow(y,diff){
 const m=(STARTY-y)/PXM, bid=biomeId(m), bio=BIOMES[bid];
 const spread=lerp(140,205,diff);
 const ax=clamp(G.lastAX+rand(-spread,spread),60,worldW-60);
 addAnchor(ax,y,bio,lerp(1.3,1,diff));
 if(Math.random()<lerp(.42,.3,diff)){
  const bx=clamp(ax+(Math.random()<.5?-1:1)*rand(150,260),60,worldW-60);
  if(Math.abs(bx-ax)>120)addAnchor(bx,y+rand(-50,30),bio,lerp(1.3,1,diff));
 }
 G.lastAX=ax;
 const home=G.anchors[G.anchors.length-1];
 const fk=bid>=3?'fire':'fly';
 if(Math.random()<.55){const k=randi(2,4);for(let i=0;i<k;i++)spawnFly(clamp(home.x+rand(-80,80),40,worldW-40),home.y-rand(30,110),fk)}
 if(Math.random()<.12)spawnFly(rand(70,worldW-70),y-rand(0,60),Math.random()<.3?'dragon':fk);
 if(Math.random()<.025)spawnFly(rand(100,worldW-100),y-rand(40,120),'gold');
 if(m>60&&Math.random()<lerp(.03,.22,diff)){
  const bx=clamp(home.x+(Math.random()<.5?-1:1)*rand(90,150),45,worldW-45);
  const by=y+rand(-20,20);
  let ok=true;
  for(const a of G.anchors)if(dist(bx,by,a.x,a.y)<BURR_CLEAR){ok=false;break}
  if(ok)G.burrs.push({x:bx,y:by,r:16,seed:rand(0,9)});
 }
 if(Math.random()<.13)G.shrooms.push({x:rand(70,worldW-70),y:y+rand(80,120),r:30,seed:rand(0,9),sq:0});
}
function spawnRowsUpTo(y){
 while(G.genY>y){
  const m=(STARTY-G.genY)/PXM, diff=diffAt(m);
  genRow(G.genY,diff);
  G.genY-=rand(lerp(82,112,diff),lerp(128,180,diff));
 }
}
function farSpawn(l){
 if(l.kind==='c')l.items.push({xf:rand(-.05,1.05),fy:l.genY,s:rand(.07,.15),spd:rand(4,14)*(Math.random()<.5?-1:1),big:l===G.farC[1]});
 else l.items.push({xf:rand(-.1,1),fy:l.genY,w:rand(.5,1.1),h:rand(.1,.2)});
 l.genY-=l.kind==='c'?rand(260,520)*(l.p+.4):rand(150,280);
}
function updFar(dt){
 for(const l of[...G.farC,...G.farH]){
  while(l.genY>G.camY*l.p-160)farSpawn(l);
  const lim=G.camY*l.p+viewH+220;
  l.items=l.items.filter(it=>it.fy<lim);
 }
 for(const l of G.farC)for(const c of l.items){c.xf+=c.spd*dt/W;if(c.xf>1.15)c.xf=-.15;if(c.xf<-.15)c.xf=1.15}
}

function reviveAfterAd(){
 if(G.state!=='dead')return;
 const F=G.frog,T=G.tongue;
 // Find a real anchor safely inside the current camera view.
 const lo=G.camY+120,hi=G.camY+viewH-180;

  if(x.y<lo||x.y>hi)continue;

 }

 if(!a){

  G.anchors.push(a);
 }
 F.x=a.x;F.y=a.y+145;F.vx=0;F.vy=0;F.stun=0;F.safe=3;
 T.st='att';T.anc=a;T.lastAnc=a;T.locked=null;T.fly=null;T.ax=a.x;T.ay=a.y;T.len=145;T.tx=a.x;T.ty=a.y;
 G.camY=clamp(a.y-viewH*.42,0,Math.max(0,G.genY-viewH*.25));

/* ============================== gameplay ============================== */
function aimWorld(){return{x:G.aim.x/S-ox,y:G.aim.y/S+G.camY}}
function anchorBlocked(a){const F=G.frog;return a===G.tongue.lastAnc&&a.y>F.y-80}
/* EXACT-CLICK GRAB: the tongue responds to YOUR pointer and nothing else.
   - the leaf must be directly under the pointer (its own body + CLICK_TOL)
   - no nearest-leaf snapping, no auto-aim, no magnet, no path-grabs
   - if the leaf is beyond MAXLEN from the frog it simply cannot be grabbed */
function anchorAt(aw){
 for(const a of G.anchors){
  if(anchorBlocked(a))continue;
  if(dist(a.x,a.y,aw.x,aw.y)<=a.r+CLICK_TOL)return a;
 }
 return null;
}
function tryShoot(){const T=G.tongue,F=G.frog;
 if(G.state!=='play'||G.paused||F.stun>0)return;
 if(T.st==='retr'){T.st='none';T.fly=null;T.locked=null}
 if(T.st!=='none')return;
 const m={x:F.x,y:F.y+F.r*.35},aw=aimWorld();
 let dx=aw.x-m.x,dy=aw.y-m.y,d=Math.hypot(dx,dy);
 if(d<8){dx=0;dy=-1;d=1}
 const ux=dx/d,uy=dy/d;
 const hit=anchorAt(aw);
 T.locked=(hit&&dist(m.x,m.y,hit.x,hit.y)<=MAXLEN)?hit:null;
 T.tdist=T.locked?dist(m.x,m.y,T.locked.x,T.locked.y):0;
 T.dx=ux;T.dy=uy;T.st='shoot';T.tx=m.x;T.ty=m.y;T.trav=0;T.fly=null;
 F.eat=Math.max(F.eat,.15);SFX.thwip();
}
function hitFly(x,y){for(const f of G.flies){if(f.grabbed||f.dead)continue;if(dist(x,y,f.x,f.y)<f.r+11)return f}return null}
function hitBurr(x,y){for(const b of G.burrs){if(dist(x,y,b.x,b.y)<b.r+9)return b}return null}
function attach(a){const T=G.tongue,F=G.frog;
 T.st='att';T.anc=a;T.lastAnc=a;T.locked=null;T.ax=a.x;T.ay=a.y;
 const m={x:F.x,y:F.y+F.r*.35};
 T.len=clamp(dist(m.x,m.y,a.x,a.y),MINLEN,MAXLEN);
 a.wv+=rand(4,8);F.eat=Math.max(F.eat,.12);addShake(2.5);SFX.stick();
 burst(a.x,a.y,4,'#DFFFD8','dot');
 if(!flags.grab){flags.grab=true;setHint('RELEASE to slingshot — the arrow shows your launch!')}
}
function release(silent){const T=G.tongue,F=G.frog;if(T.st!=='att')return;
 const ax=T.ax,ay=T.ay;T.st='none';T.anc=null;
 if(silent)return;
 F.vx*=1.06;F.vy*=1.06;
 const dx=ax-F.x,dy=ay-F.y,d=Math.hypot(dx,dy);
 if(d>4&&ay<F.y+14){F.vx+=dx/d*POPV;F.vy+=dy/d*POPV}
 F.vy-=40;
 SFX.sling();addShake(1.2);
}
function sting(){const T=G.tongue,F=G.frog;
 if(T.st==='att'){T.tx=T.ax;T.ty=T.ay;T.st='retr'}
 else if(T.st==='shoot')T.st='retr';
 T.anc=null;T.locked=null;
 F.stun=lerp(.25,.5,diffNow());
 F.safe=F.stun+.65;
 G.combo=1;G.comboT=0;G.flash=.3;addShake(6);SFX.sting();
 floatTxt(F.x,F.y-40,'OUCH!',RED,26);burst(F.x,F.y,8,RED,'dot')}
function eatFly(f){if(f.dead)return;
 f.dead=true;
 G.score+=VAL[f.kind]*G.combo;G.fliesEaten++;
 G.combo=Math.min(9,G.combo+1);G.comboT=lerp(5,4,diffNow());
 G.bestCombo=Math.max(G.bestCombo,G.combo);
 const word=G.combo>=8?'GLUTTONY!':G.combo>=6?'FEAST!':G.combo>=4?'TASTY!':pick(['YUM!','GULP!','NOM!','SLURP!']);
 floatTxt(f.x,f.y-14,word,'#FFC93C',20+G.combo*2);
 floatTxt(f.x,f.y-48,'+'+(VAL[f.kind]*G.combo),'#FFFFFF',15);
 burst(f.x,f.y,7,f.kind==='gold'?'#FFC93C':f.kind==='dragon'?'#3FC1C9':'#5A5468','dot');
 starAt(f.x,f.y);
 G.frog.eat=.22;SFX.gulp(G.combo);addShake(1.5);
 comboPop();
}
function die(cause){if(G.state!=='play')return;G.state='dying';G.cause=cause;G.ts=.3;G.dieT=1;
 release(true);addShake(cause==='glub'?10:14);
 const F=G.frog;
 if(cause==='glub'){splashAt(F.x,G.floodY)}
 burst(F.x,F.y,10,SKINS[skinIdx].body,'dot');
 G.deadStats={h:Math.floor(G.maxH),score:G.score,flies:G.fliesEaten,combo:G.bestCombo};
}

function updTongue(dt){const T=G.tongue,F=G.frog;
 if(T.st==='shoot'){
  const step=SHOOTV*dt,n=Math.ceil(step/12),sx=step/n;
  for(let i=0;i<n;i++){T.tx+=T.dx*sx;T.ty+=T.dy*sx;T.trav+=sx;
   const f=hitFly(T.tx,T.ty);if(f)eatFly(f);
   if(T.locked){
    /* COMMITTED: grabs ONLY the leaf you clicked — arrives exactly there */
    if(T.trav>=T.tdist-6||dist(T.tx,T.ty,T.locked.x,T.locked.y)<T.locked.r+12){
     attach(T.locked);break}
   }else{
    /* free shot into sky: never grabs leaves, burrs sting */
    if(hitBurr(T.tx,T.ty)){sting();break}
   }
   if(T.trav>=MAXLEN){T.st='retr';T.locked=null;break}
  }
 }else if(T.st==='retr'){
  const m={x:F.x,y:F.y+F.r*.35};
  let d=dist(T.tx,T.ty,m.x,m.y);
  const mv=Math.min(RETRV*dt,Math.max(0,d)),ux=d>0?(m.x-T.tx)/d:0,uy=d>0?(m.y-T.ty)/d:0;
  const n=Math.max(1,Math.ceil(mv/12)),sx=mv/n;
  for(let i=0;i<n;i++){T.tx+=ux*sx;T.ty+=uy*sx;
   const f=hitFly(T.tx,T.ty);if(f)eatFly(f);
   if(hitBurr(T.tx,T.ty)){sting();break}
   if(dist(T.tx,T.ty,m.x,m.y)<14){T.st='none';break}
  }
 }else if(T.st==='att'){
  const reel=lerp(215,175,diffNow());
  T.len=Math.max(MINLEN,T.len-reel*dt);
  const dx=F.x-T.ax,dy=F.y-T.ay,d=Math.hypot(dx,dy);
  if(d>T.len&&d>0){const nx=dx/d,ny=dy/d;
   F.x=T.ax+nx*T.len;F.y=T.ay+ny*T.len;
   const vn=F.vx*nx+F.vy*ny;
   if(vn>0){F.vx-=vn*nx;F.vy-=vn*ny}}
 }
}
function updFrog(dt){const F=G.frog,T=G.tongue;
 F.stun=Math.max(0,F.stun-dt);F.safe=Math.max(0,F.safe-dt);F.eat=Math.max(0,F.eat-dt);G.flash=Math.max(0,G.flash-dt);
 F.throat=Math.max(0,F.throat-dt*1.4);
 F.blinkT-=dt;if(F.blinkT<=0){F.blink=.12;F.blinkT=rand(2.2,4.5)}
 F.blink=Math.max(0,F.blink-dt);
 let ax=0;if(keys.left)ax-=1;if(keys.right)ax+=1;
 F.vx+=ax*850*dt;
 F.vy+=GRAV*dt;
 F.vx*=Math.exp(-.35*dt);F.vy*=Math.exp(-.06*dt);
 F.x+=F.vx*dt;F.y+=F.vy*dt;
 if(T.st==='att'){const dx=F.x-T.ax,dy=F.y-T.ay,d=Math.hypot(dx,dy);
  if(d>T.len){const nx=dx/d,ny=dy/d;F.x=T.ax+nx*T.len;F.y=T.ay+ny*T.len;
   const vn=F.vx*nx+F.vy*ny;if(vn>0){F.vx-=vn*nx;F.vy-=vn*ny}}}
 if(F.x<F.r){F.x=F.r;F.vx*=-.45}
 if(F.x>worldW-F.r){F.x=worldW-F.r;F.vx*=-.45}
 if(F.vy>0&&Math.abs(F.x-worldW/2)<76&&F.y+F.r>135&&F.y+F.r<178){
  F.y=135-F.r;
  if(F.vy>420){SFX.boing();F.eat=.22;addShake(2.5)}
  F.vy=Math.abs(F.vy)>150?F.vy*-.32:0;
 }
 const sp=Math.hypot(F.vx,F.vy);if(sp>2300){F.vx*=2300/sp;F.vy*=2300/sp}
}
function updCollide(){const F=G.frog;
 for(const f of G.flies){if(f.grabbed||f.dead)continue;
  if(dist(F.x,F.y,f.x,f.y)<F.r+f.r+4)eatFly(f)}
 if(F.stun<=0&&F.safe<=0)for(const b of G.burrs){if(dist(F.x,F.y,b.x,b.y)<F.r+b.r){sting();break}}
 for(const s of G.shrooms){
  if(F.vy>120&&Math.abs(F.x-s.x)<s.r*.95&&F.y+F.r>s.y-s.r*.85&&F.y<s.y+6){

   SFX.boing();addShake(3);burst(s.x,s.y-s.r,6,'#FFE9A8','star')}}
}

function updFlood(dt){

 }

function drawFrogGame(){

 const aw=aimWorld();let pdx=aw.x-F.x,pdy=aw.y-F.y;const pd=Math.hypot(pdx,pdy)||1;pdx/=pd;pdy/=pd;
 ctx.save();ctx.translate(F.x,F.y);

function menuIdle(dt){
 const F=G.frog;
 F.y=STARTY+Math.sin(G.t*1.7)*3;F.vx=0;F.vy=0;
 F.blinkT-=dt;if(F.blinkT<=0){F.blink=.12;F.blinkT=rand(2.2,4.5)}
 F.blink=Math.max(0,F.blink-dt);
 if(Math.random()<dt/5){SFX.croak();F.throat=.6}
 F.throat=Math.max(0,F.throat-dt*1.4);
 G.eyeT-=dt;if(G.eyeT<=0){G.eyeT=rand(3.5,6);G.eyeDur=1.3;G.eyeX=rand(80,worldW-80)}

/* ============================== main loop ============================== */
let lastT=0;
function frame(t){
 requestAnimationFrame(frame);
 const rdt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;
 const dt=rdt*G.ts;
 if(!G.paused){
  G.t+=dt;
  if(G.state==='play'){
   G.runT+=dt;
   updTongue(dt);updFrog(dt);updCollide();updFlies(dt);updFlood(dt);updCam(dt);updProgress();
   for(const s of G.shrooms)s.sq=Math.max(0,s.sq-dt*3);
   if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0&&G.combo>1){G.combo=1}}
   prune(dt);
   if(G.frog.y>G.camY+viewH+90)die('fell');
   updateHUD();
  }else if(G.state==='menu'){menuIdle(dt)}
  else if(G.state==='dying'){
   G.dieT-=dt;const F=G.frog;
   if(G.cause==='glub'){F.y+=60*dt}
   else{F.vy+=GRAV*dt;F.x+=F.vx*dt;F.y+=F.vy*dt}
   G.ts=Math.min(1,G.ts+dt*1.2);
   if(G.dieT<=0)showDead();
  }
  updParts(dt);updFar(dt);
  G.shake*=Math.exp(-6*rdt);
  G.shx=rand(-1,1)*G.shake;G.shy=rand(-1,1)*G.shake;
  if(windG){const sp=Math.hypot(G.frog.vx,G.frog.vy);
   windG.gain.value=(G.state==='play')?clamp((sp-300)/2200,0,1)*.25:0}
 }
 render();
}
