<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>HEXBOUND</title>
<style>
  html,body{margin:0;padding:0;background:#0A141B;height:100%;overflow:hidden;overscroll-behavior:none}
  canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================== CORE ============================== */
const TAU=Math.PI*2, HP=Math.PI/2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const norm=a=>((a%TAU)+TAU)%TAU;
const angDiff=(a,b)=>{let d=Math.abs(norm(a)-norm(b));return Math.min(d,TAU-d);};
const easeOut=t=>1-Math.pow(1-t,3);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  return'rgb('+Math.round(lerp(pa>>16&255,pb>>16&255,t))+','+Math.round(lerp(pa>>8&255,pb>>8&255,t))+','+Math.round(lerp(pa&255,pb&255,t))+')';}

const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;

/* ---- arcane theme ---- */
const INK='#EFF6F4',MUT='#8FA6A8',DIM='#54686C';
const PINK='#FF5C8F',GOLD='#EFBE5A',CYAN='#5FE3CE',BLUE='#6FA9FF',VIOLET='#B48CFF';
const PAL=[PINK,GOLD,CYAN,VIOLET];

/* ---- haptics ---- */
let hapOn=store.get('qr_hap',true);
function setHap(v){hapOn=v;store.set('qr_hap',v);}
const buzz=p=>{if(!hapOn)return;try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,SAT=0,SAB=0;
function readSafe(){const d=document.createElement('div');
  d.style.cssText='position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:-99px;width:1px;pointer-events:none;';
  document.body.appendChild(d);const r=getComputedStyle(d);
  SAT=parseFloat(r.top)||0;SAB=parseFloat(r.bottom)||0;document.body.removeChild(d);}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSafe();if(SM.cur&&SM.cur.relayout)SM.cur.relayout();}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
document.addEventListener('contextmenu',e=>e.preventDefault());

const S={t:0,timescale:1,hitStop:0,shake:0,flashA:0,flashC:INK,ptr:{x:-99,y:-99,moved:false}};
const FX={shake(a){S.shake=Math.min(1,S.shake+a);},hit(t){S.hitStop=Math.max(S.hitStop,t);},flash(c,a){S.flashC=c;S.flashA=Math.max(S.flashA,a);}};

/* ============================== TEXT ============================== */
const FONT='"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif';
function fnt(s,w=700){ctx.font=w+' '+s+'px '+FONT;}
function txt(s,x,y,sz,c,align='left',w=700,ls=0,up=false,al=0){
  if(up)s=String(s).toUpperCase();
  fnt(sz,w);ctx.fillStyle=c;ctx.textBaseline='middle';
  const oa=ctx.globalAlpha;
  if(al>0&&al<1)ctx.globalAlpha=oa*al;
  if(!ls){ctx.textAlign=align;ctx.fillText(s,x,y);}
  else{const ch=[...String(s)],ws=ch.map(h=>ctx.measureText(h).width);
    const sw=ws.reduce((a,b)=>a+b,0)+ls*(ch.length-1);
    let cx=align==='center'?x-sw/2:align==='right'?x-sw:x;
    ctx.textAlign='left';
    for(let i=0;i<ch.length;i++){ctx.fillText(ch[i],cx,y);cx+=ws[i]+ls;}}
  ctx.globalAlpha=oa;}
function bullets(arr,x,y,maxw,sz,c,lh){
  for(const s of arr){
    diamond(x+4,y,5,GOLD,.9);
    fnt(sz,600);ctx.fillStyle=c;ctx.textAlign='left';ctx.textBaseline='middle';
    const words=String(s).split(' ');let line='',yy=y;
    for(const wd of words){const test=line?line+' '+wd:wd;
      if(ctx.measureText(test).width>maxw&&line){ctx.fillText(line,x+18,yy);yy+=lh;line=wd;}
      else line=test;}
    if(line)ctx.fillText(line,x+18,yy);
    y=yy+lh+9;}
  return y;}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function glow(x,y,r,c,blur,a=1){ctx.save();ctx.globalAlpha=a;ctx.shadowColor=c;ctx.shadowBlur=blur;
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();}
function softDot(x,y,r,c,a){ctx.globalAlpha=a;ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=1;}
function star(x,y,r,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<5;i++){const a=-HP+i*TAU/5,b=a+TAU/10;
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(b)*r*.45,Math.sin(b)*r*.45);}
  ctx.closePath();ctx.fill();ctx.restore();}
function diamond(x,y,s,c,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=c;
  ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-s/2,-s/2,s,s);ctx.restore();}
function chev(x,y,dir,s,c,a){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=Math.max(2,s*.26);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  ctx.moveTo(x-dir*s*.5,y-s*.6);ctx.lineTo(x+dir*s*.5,y);ctx.lineTo(x-dir*s*.5,y+s*.6);ctx.stroke();ctx.restore();}
function runeGlyph(x,y,s,seed){const rng=mulberry(seed);
  ctx.beginPath();
  const n=2+Math.floor(rng()*2);
  for(let i=0;i<n;i++){ctx.moveTo((rng()-.5)*s,(rng()-.5)*s);ctx.lineTo((rng()-.5)*s,(rng()-.5)*s);}
  ctx.stroke();
  ctx.beginPath();ctx.arc((rng()-.5)*s*.5,(rng()-.5)*s*.5,1.1,0,TAU);ctx.fill();}
function runeRing(cx,cy,r,rot,color,alpha){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.globalAlpha=alpha;
  ctx.lineWidth=1.5;ctx.lineCap='round';
  ctx.setLineDash([3,9]);ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();
  ctx.setLineDash([1,15]);ctx.beginPath();ctx.arc(0,0,r+13,0,TAU);ctx.stroke();
  ctx.setLineDash([]);
  for(let i=0;i<10;i++){ctx.save();ctx.rotate(i*TAU/10);ctx.translate(r,0);ctx.rotate(HP);
    runeGlyph(0,0,9,i*7+3);ctx.restore();}
  ctx.restore();ctx.globalAlpha=1;}
function cornerDeco(x,y,w,h,c){ctx.strokeStyle=c;ctx.lineWidth=2;ctx.lineCap='round';
  const L=13,o=6;ctx.beginPath();
  ctx.moveTo(x-o+L,y-o);ctx.lineTo(x-o,y-o);ctx.lineTo(x-o,y-o+L);
  ctx.moveTo(x+w+o-L,y-o);ctx.lineTo(x+w+o,y-o);ctx.lineTo(x+w+o,y-o+L);
  ctx.moveTo(x-o,y+h+o-L);ctx.lineTo(x-o,y+h+o);ctx.lineTo(x-o+L,y+h+o);
  ctx.moveTo(x+w+o,y+h+o-L);ctx.lineTo(x+w+o,y+h+o);ctx.lineTo(x+w+o-L,y+h+o);
  ctx.stroke();}

/* ============================== AUDIO ============================== */
let sndOn=store.get('qr_snd',true),musOn=store.get('qr_mus',true);
const AU={ctx:null,master:null,comp:null,sfx:null,mus:null,nbuf:null,dly:null,
  ensure(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=this.ctx=new C();
    this.comp=c.createDynamicsCompressor();
    this.comp.threshold.value=-16;this.comp.knee.value=22;this.comp.ratio.value=6;
    this.comp.attack.value=.004;this.comp.release.value=.18;
    this.master=c.createGain();this.master.gain.value=.9;
    this.comp.connect(this.master);this.master.connect(c.destination);
    this.sfx=c.createGain();this.sfx.gain.value=sndOn?.6:0;this.sfx.connect(this.comp);
    this.mus=c.createGain();this.mus.gain.value=musOn?.4:0;this.mus.connect(this.comp);
    this.dly=c.createDelay(1);const fb=c.createGain();fb.gain.value=.32;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    this.dly.connect(lp);lp.connect(fb);fb.connect(this.dly);lp.connect(this.mus);
    const len=c.sampleRate,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nbuf=b;
    Music.kickoff();},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setSfx(v){sndOn=v;store.set('qr_snd',v);if(this.sfx)this.sfx.gain.value=v?.6:0;},
  setMus(v){musOn=v;store.set('qr_mus',v);if(this.mus)this.mus.gain.value=v?.4:0;},
  note(bus,f0,f1,d,type,v,{a=.005,send=0,cut=0,delay=0}={}){if(!this.ctx)return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    let n=o;if(cut){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);n=f;}
    n.connect(g);g.connect(bus);
    if(send&&this.dly){const s=c.createGain();s.gain.value=send;g.connect(s);s.connect(this.dly);}
    o.start(t);o.stop(t+d+.05);},
  nz(bus,d,v,type='highpass',freq=1200,delay=0){if(!this.ctx)return;
    const c=this.ctx,t=c.currentTime+delay,s=c.createBufferSource();s.buffer=this.nbuf;s.loop=true;
    const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;
    const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+d+.02);},
  kick(t,v=.5){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.16);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.19);
    o.connect(g);g.connect(this.mus);o.start(t);o.stop(t+.21);},
  hat(t,v){const c=this.ctx,s=c.createBufferSource();s.buffer=this.nbuf;s.loop=true;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=7500;
    const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.045);
    s.connect(f);f.connect(g);g.connect(this.mus);s.start(t);s.stop(t+.05);}};

const SFX={
  tap(){AU.note(AU.sfx,460,560,.05,'sine',.12);},
  move(){AU.note(AU.sfx,360,440,.04,'sine',.08);},
  sel(){buzz(8);AU.note(AU.sfx,520,780,.09,'sine',.14,{send:.3});AU.note(AU.sfx,780,1170,.12,'triangle',.1,{delay:.06});},
  jump(){buzz(8);AU.note(AU.sfx,240,540,.13,'triangle',.18);AU.nz(AU.sfx,.09,.06,'highpass',1600);},
  land(){AU.note(AU.sfx,150,70,.09,'sine',.2);AU.nz(AU.sfx,.04,.05,'lowpass',700);},
  match(i){buzz(10);const f=523*Math.pow(2,[0,2,4,7,9,12,14,16][Math.min(i,7)]/12);
    AU.note(AU.sfx,f,f*.995,.14,'sine',.2,{send:.25});AU.note(AU.sfx,f*3,f*3,.05,'sine',.05);},
  gem(){buzz(8);AU.note(AU.sfx,1175,1568,.11,'sine',.13,{send:.4});AU.note(AU.sfx,2349,2349,.06,'sine',.04,{delay:.03});},
  gate(){buzz(10);[659,880,1175].forEach((f,i)=>AU.note(AU.sfx,f,f,.1,'triangle',.12,{delay:i*.05,send:.3}));},
  wave(){buzz(15);AU.note(AU.sfx,300,900,.22,'triangle',.15,{send:.4});},
  death(){buzz([30,40,60]);AU.nz(AU.sfx,.35,.3,'lowpass',900);AU.note(AU.sfx,160,38,.45,'sawtooth',.22);},
  best(){[523,659,784,1047].forEach((f,i)=>AU.note(AU.sfx,f,f,.12,'triangle',.14,{delay:.7+i*.09,send:.4}));},
  over(){[392,311,262].forEach((f,i)=>AU.note(AU.sfx,f,f*.98,.22,'sine',.16,{delay:.15+i*.17}));},
  tick(){AU.note(AU.sfx,660,660,.05,'sine',.1);},
  go(){AU.note(AU.sfx,660,880,.16,'sine',.18,{send:.3});AU.note(AU.sfx,1320,1320,.14,'sine',.08,{delay:.02});},
  pause(){AU.note(AU.sfx,500,350,.09,'sine',.12);},
  whoosh(){AU.nz(AU.sfx,.28,.12,'bandpass',500);}};

const Music={want:'menu',kind:null,step:0,nextT:0,iv:null,lastKick:-9,arp:[],bassMap:{},
  cfg:{menu:{bpm:84,root:110,wave:'triangle',cut:900,hat:0,kick:[0,16],dens:.4},
       hue:{bpm:112,root:110,wave:'square',cut:1300,hat:1,kick:[0,8,16,24],dens:.6},
       orbit:{bpm:122,root:98,wave:'sawtooth',cut:750,hat:1,kick:[0,10,16,26],dens:.5},
       sky:{bpm:118,root:123,wave:'triangle',cut:1500,hat:1,kick:[0,8,16,24],dens:.55}},
  set(k){this.want=k;if(AU.ctx){if(!this.iv)this.kickoff();
    if(this.kind!==k){this.kind=k;this.step=0;this.seed();
      if(AU.dly)AU.dly.delayTime.value=60/this.cfg[k].bpm*.75;}}},
  stop(){this.want=null;if(AU.ctx)this.kind=null;},
  kickoff(){if(!AU.ctx)return;if(this.iv)clearInterval(this.iv);
    this.kind=this.want;this.step=0;
    if(AU.dly&&this.kind)AU.dly.delayTime.value=60/this.cfg[this.kind].bpm*.75;
    this.nextT=AU.ctx.currentTime+.1;this.seed();
    this.iv=setInterval(()=>this.sched(),30);},
  seed(){let s=11;for(const ch of(this.kind||'menu'))s=s*31+ch.charCodeAt(0);
    const rng=mulberry(s),sc=[0,3,5,7,10,12,15];this.arp=[];
    const dens=this.kind?this.cfg[this.kind].dens:.4;
    for(let i=0;i<32;i++)this.arp.push(rng()<dens?-1:sc[Math.floor(rng()*sc.length)]);
    const b0=rng()<.5?0:2;this.bassMap={0:b0,8:b0,16:rng()<.5?7:5,24:rng()<.5?3:0};},
  sched(){if(!AU.ctx||!this.kind)return;const cf=this.cfg[this.kind],sd=60/cf.bpm/4;
    if(this.nextT<AU.ctx.currentTime)this.nextT=AU.ctx.currentTime+.05;
    while(this.nextT<AU.ctx.currentTime+.15){this.playStep(this.step,this.nextT,cf,sd);
      this.step=(this.step+1)%32;this.nextT+=sd;}},
  playStep(st,at,cf,sd){
    if(cf.kick.includes(st))AU.kick(at,.45);
    if(cf.hat&&st%4===2)AU.hat(at,st%8===6?.06:.035);
    const bn=this.bassMap[st];
    if(bn!==undefined)AU.note(AU.mus,cf.root/2*Math.pow(2,bn/12),0,sd*2.2,'triangle',.2,{cut:cf.cut*.4});
    if(st%16===0){const ch=st%32===0?[0,3,7]:[-2,3,5];
      for(const iv of ch){const f=cf.root*2*Math.pow(2,iv/12);
        AU.note(AU.mus,f*.998,0,sd*14,'sawtooth',.028,{a:.3,cut:cf.cut*.55,send:.1});
        AU.note(AU.mus,f*1.004,0,sd*14,'sawtooth',.028,{a:.3,cut:cf.cut*.55});}}
    const ad=this.arp[st];
    if(ad>=0)AU.note(AU.mus,cf.root*2*Math.pow(2,ad/12),0,sd*1.7,cf.wave,.1,{cut:cf.cut,send:.35});},
  pulse(){if(!AU.ctx)return 0;const d=AU.ctx.currentTime-this.lastKick;
    return d<0||d>.3?0:1-d/.3;}};

/* ============================== PARTICLES / POPUPS ============================== */
const P={list:[],
  add(o){if(this.list.length>600)this.list.splice(0,60);this.list.push(o);},
  burst(x,y,c,n,sp=1){for(let i=0;i<n;i++){const a=rand(TAU),v=rand(60,300)*sp;
    this.add({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:rand(-100,400),dr:rand(1.5,3.5),
      life:rand(.3,.7),T:0,sz:rand(2,4),c});}},
  ring(x,y,c,r0=6,r1=64,w=3,life=.35){this.add({k:'r',x,y,r0,r1,w,life,T:0,c});},
  confetti(){for(let i=0;i<80;i++)this.add({k:'c',x:rand(W),y:rand(-H*.3,0),vx:rand(-60,60),
    vy:rand(120,300),g:380,dr:.4,life:rand(1.5,2.4),T:0,sz:rand(4,6.5),c:PAL[i%4],rot:rand(TAU),vr:rand(-6,6)});},
  update(dt){const L=this.list;
    for(let i=L.length-1;i>=0;i--){const p=L[i];p.T+=dt;
      if(p.T>=p.life){L[i]=L[L.length-1];L.pop();continue;}
      if(p.k==='r')continue;
      p.vy+=(p.g||0)*dt;const d=1-Math.min(1,(p.dr||0)*dt);p.vx*=d;p.vy*=d;
      p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;}},
  draw(){const L=this.list;
    for(const p of L){const a=1-p.T/p.life;
      if(p.k==='r'){ctx.globalAlpha=a*.9;ctx.strokeStyle=p.c;ctx.lineWidth=Math.max(.5,p.w*a);
        ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,lerp(p.r0,p.r1,easeOut(p.T/p.life))),0,TAU);ctx.stroke();}
      else if(p.k==='c'){ctx.globalAlpha=Math.min(1,a*2);ctx.fillStyle=p.c;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);ctx.restore();}
      else{ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.fillStyle=p.c;
        ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a+.5,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';}}
    ctx.globalAlpha=1;}};

const Pop={list:[],
  add(x,y,s,c,sz=16){this.list.push({x,y,s:String(s),c,sz,T:0,life:.85});},
  update(dt){for(let i=this.list.length-1;i>=0;i--){const p=this.list[i];p.T+=dt;p.y-=44*dt;
    if(p.T>=p.life)this.list.splice(i,1);}},
  draw(){for(const p of this.list){const a=1-p.T/p.life;
    txt(p.s,p.x+1.5,p.y+1.5,p.sz,'rgba(0,0,0,.45)','center',800,0,false,a);
    txt(p.s,p.x,p.y,p.sz,p.c,'center',800,0,false,a);}}};

/* ============================== INPUT ============================== */
let hot=[];
function hot_(x,y,w,h,cb,l=0){hot.push({x,y,w,h,cb,l});}
function hitHot(x,y,l=0){for(let i=hot.length-1;i>=0;i--){const h=hot[i];
  if(h.l!==l)continue;
  if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){SFX.tap();h.cb();return true;}}return false;}

const Input={keys:{},ptrs:new Map(),
  init(){
    window.addEventListener('keydown',e=>{
      if(e.repeat){if(['Space','ArrowUp','KeyW'].includes(e.code))e.preventDefault();return;}
      AU.ensure();AU.resume();const k=e.code;this.keys[k]=true;

      else{const g2=mcy+13;ctx.fillStyle='rgba(239,246,244,.3)';ctx.fillRect(mcx-22,g2,44,2);
        const cyc=(t*36)%88;
        for(let k=0;k<2;k++){const x=mcx+22-cyc+k*44;
          if(x>mcx-26&&x<mcx+26){ctx.fillStyle=PINK;
            ctx.beginPath();ctx.moveTo(x-5,g2);ctx.lineTo(x,g2-8);ctx.lineTo(x+5,g2);ctx.closePath();ctx.fill();}}
        const ph=Math.abs(Math.sin(t*3.2));
        softDot(mcx-5,g2-7-ph*20,6,BLUE,.8);}
      ctx.restore();
      txt(it.name,x0+86,yy+rh/2,rw>400?18:16,it.accent,'left',800,2,true);
      const b=store.get('qr_best_'+it.id,0);
      if(b>0)txt(String(b),x0+rw-18,yy+rh/2,15,MUT,'right',800,1);
      hot_(rx,yy,rw,rh,()=>{SFX.sel();SM.go(it.id);});}
    diamond(W/2,H-SAB-30,4,GOLD,.8);
    txt('REDUNDANT STUDIOS',W/2,H-SAB-14,11,hexA(MUT,.8),'center',700,3,true);
    helpBtn(14,SAT+12,()=>{HELP.show(this.sel);SFX.tap();});
    gearBtn(W-58,SAT+12,()=>{SET.open=true;SFX.tap();});}};

/* ============================== MAIN LOOP ============================== */
Input.init();
SM.add('menu',MENU);
resize();
SM.go('menu');TR.t=.49;
let last=performance.now();
function frame(now){requestAnimationFrame(frame);
  if(window.innerWidth!==W||window.innerHeight!==H)resize();
  const raw=Math.min(.04,(now-last)/1000);last=now;S.t+=raw;
  let dt=raw*S.timescale;
  if(S.hitStop>0){S.hitStop-=raw;dt=0;}
  TR.update(raw);
  if(SM.cur&&!SM.cur.paused)SM.cur.update(dt,raw);
  P.update(dt);Pop.update(dt);
  S.shake=Math.max(0,S.shake-raw*2.2);
  S.flashA=Math.max(0,S.flashA-raw*3);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#060F15';ctx.fillRect(0,0,W,H);
  hot=[];
  ctx.save();
  if(S.shake>0){const m=S.shake*S.shake*14;
    ctx.translate(rand(-m,m),rand(-m,m));ctx.rotate(rand(-m,m)*.0008);}
  if(SM.cur)SM.cur.draw();
  ctx.restore();
  P.draw();Pop.draw();
  if(SET.open)SET.draw();
  if(HELP.open)HELP.draw();
  if(S.flashA>0){ctx.globalAlpha=S.flashA;ctx.fillStyle=S.flashC;
    ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  TR.draw();
  S.ptr.moved=false;}
requestAnimationFrame(frame);
</script>
