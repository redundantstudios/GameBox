<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#10162a;font-family:Verdana,Geneva,'DejaVu Sans',sans-serif;touch-action:none;overscroll-behavior:none}

.screen.on{display:flex}

/* Fixed PC design sizes — fitUI() zooms the whole panel to fit any screen */
.panel{position:relative;background:#1c2540;border:2px solid #0a0f1e;border-radius:20px;box-shadow:0 18px 48px rgba(0,0,0,.55);padding:16px 20px 14px;width:640px;color:#eef2ff}
.panel.narrow{width:380px;text-align:center}

.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0f1e}
.btn.ghost{background:#2b3654;color:#d6e1fa}

@media(orientation:portrait){#rotate{display:flex}}
.foot{font-size:9px;color:#5d6b8c;text-align:center;margin-top:8px}
</style>

<script>
'use strict';
/* ============ shared font ============ */
const FONT="'Verdana',Geneva,'DejaVu Sans',sans-serif";
function font(sz,w){return(w||'bold')+' '+sz+'px '+FONT;}

/* ============ helpers ============ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x0,y0,x1,y1)=>Math.hypot(x1-x0,y1-y0);
const rnd=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rnd(a,b+1));
const angLerp=(a,b,t)=>{let d=(b-a+Math.PI*3)%TAU-Math.PI;return a+d*t;};
const angDiff=(a,b)=>Math.abs((a-b+Math.PI*3)%TAU-Math.PI);
const $=id=>document.getElementById(id);
function shade(hex,f){
if(typeof hex!=='string'||hex.charAt(0)!=='#'||hex.length<7)return'rgb(229,72,77)';
const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);return'rgb('+r+','+g+','+b+')';}
function rr2(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rrp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ============ fullscreen (guarded for preview iframes) ============ */
function goFull(){
const can=document.fullscreenEnabled!==undefined?document.fullscreenEnabled:(document.webkitFullscreenEnabled!==undefined?document.webkitFullscreenEnabled:true);
if(!can)return;
const el=document.documentElement;
const fsEl=document.fullscreenElement||document.webkitFullscreenElement;
if(!fsEl){
const req=el.requestFullscreen||el.webkitRequestFullscreen;
if(req){
try{
const p=req.call(el,{navigationUI:'hide'});
if(p&&p.then)p.then(()=>lockLand()).catch(()=>{});
else lockLand();
}catch(e){}
}else lockLand();
}else lockLand();}
function lockLand(){
try{
if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
}catch(e){}}
document.addEventListener('pointerdown',()=>goFull(),{capture:true});
document.addEventListener('fullscreenchange',()=>setTimeout(()=>{resize();fitUI();},80));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(()=>{resize();fitUI();},80));

/* ============ UI scaler ============ */
const UI_ZOOM_OK=(typeof CSS!=='undefined'&&CSS.supports&&CSS.supports('zoom:0.5'));
function fitUI(){
document.querySelectorAll('.screen.on .panel, .screen.on .menu-wrap').forEach(el=>{
el.style.zoom='';el.style.transform='';
const r=el.getBoundingClientRect();
const availW=Math.max(200,innerWidth-12),availH=Math.max(160,innerHeight-12);
let s=Math.min(1,availW/r.width,availH/r.height);
if(!isFinite(s)||s<=0)s=1;
if(s<0.999){
if(UI_ZOOM_OK)el.style.zoom=s;
else{el.style.transformOrigin='center center';el.style.transform='scale('+s+')';}}});}

/* ============ audio ============ */
const Sfx={ctx:null,out:null,muted:false,last:{},
unlock(){if(!this.ctx){try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();const cp=this.ctx.createDynamicsCompressor();this.out=this.ctx.createGain();this.out.gain.value=.5;this.out.connect(cp);cp.connect(this.ctx.destination);}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
ok(){return this.ctx&&!this.muted;},
thr(k,ms){const n=performance.now();if(this.last[k]&&n-this.last[k]<ms)return true;this.last[k]=n;return false;},
tone(f,dur,type,vol,slide,when){if(!this.ok())return;const c=this.ctx,t=c.currentTime+(when||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(24,f+slide),t+dur);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+dur+.03);},
noise(dur,vol,freq,slide){if(!this.ok())return;const c=this.ctx,t=c.currentTime;const n=Math.max(64,Math.floor(c.sampleRate*dur)+1);const buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq,t);if(slide)f.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(this.out);s.start(t);},

/* ============ control layout ============ */
/* 1P: stick BL + fire BR (large). 2P: side-stacked - P1 stick BL + fire TL, P2 stick TR + fire BR (large). 3-4P: compact corner clusters. */
const ctl=[null,null,null,null];
function layoutControls(){
const H=Math.max(1,cfg.players);
let jr=clamp(VW*.038,26,36),fr=clamp(VW*.032,22,32);
if(H===1){jr=clamp(VW*.062,40,58);fr=clamp(VW*.054,34,50);}
else if(H===2){jr=clamp(VW*.058,38,52);fr=clamp(VW*.058,38,52);}
/* 3P/4P: keep the corner layout but give each player a much larger joystick/fire area. */
else if(H>=3){jr=clamp(VW*.045,34,46);fr=clamp(VW*.038,30,40);}
const mg=Math.round(jr*.55)+12;
const bottom=VH-jr-mg,top=jr+mg;
const eg=Math.round(jr*.8)+12;
const gap=Math.round(Math.min(jr,fr)*.45)+8;
function cluster(sx,sy,fireIn){
const jx=sx==='l'?eg+jr:VW-eg-jr;
const jy=sy==='b'?VH-eg-jr:eg+jr;
const fx=fireIn==='r'?jx+jr+gap+fr:jx-jr-gap-fr;
return{jx,jy,fx,fy:jy,jr,fr};}
const P=[];
if(H===1){
P[0]={jx:VW*.09,jy:bottom,fx:VW*.91,fy:bottom,jr,fr};}
else if(H===2){
P[0]={jx:VW*.09,jy:bottom,fx:VW*.09,fy:top,jr,fr};
P[1]={jx:VW*.91,jy:top,fx:VW*.91,fy:bottom,jr,fr};}
else if(H===3){P[0]=cluster('l','b','r');P[1]=cluster('l','t','r');P[2]=cluster('r','b','l');}
else{P[0]=cluster('l','b','r');P[1]=cluster('l','t','r');P[2]=cluster('r','b','l');P[3]=cluster('r','t','l');}
for(let i=0;i<4;i++)ctl[i]=P[i]||null;}

/* ============ geometry ============ */
function segRect(x0,y0,dx,dy,r){let tmin=0,tmax=1;
if(Math.abs(dx)<1e-9){if(x0<r.x||x0>r.x+r.w)return -1;}else{let t1=(r.x-x0)/dx,t2=(r.x+r.w-x0)/dx;if(t1>t2){const t=t1;t1=t2;t2=t;}tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax)return -1;}
if(Math.abs(dy)<1e-9){if(y0<r.y||y0>r.y+r.h)return -1;}else{let t1=(r.y-y0)/dy,t2=(r.y+r.h-y0)/dy;if(t1>t2){const t=t1;t1=t2;t2=t;}tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax)return -1;}
return tmin;}
function segCircle(x0,y0,dx,dy,cx,cy,cr){const a=dx*dx+dy*dy;if(a<1e-9)return -1;const fx=x0-cx,fy=y0-cy;const b=2*(fx*dx+fy*dy),c=fx*fx+fy*fy-cr*cr;let d=b*b-4*a*c;if(d<0)return -1;const s=Math.sqrt(d);let t=(-b-s)/(2*a);if(t<0)t=(-b+s)/(2*a);if(t<0||t>1)return -1;return t;}
function losBlocked(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0;for(const o of map.rects)if(segRect(x0,y0,dx,dy,o)>=0)return true;for(const o of map.circles)if(segCircle(x0,y0,dx,dy,o.x,o.y,o.r)>=0)return true;return false;}
function hitObst(x,y){for(const o of map.rects)if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return true;for(const o of map.circles){const dx=x-o.x,dy=y-o.y;if(dx*dx+dy*dy<o.r*o.r)return true;}return false;}
function collideEnt(e){
for(const o of map.rects){const nx=clamp(e.x,o.x,o.x+o.w),ny=clamp(e.y,o.y,o.y+o.h);let dx=e.x-nx,dy=e.y-ny;const d2=dx*dx+dy*dy;
if(d2<e.r*e.r){if(d2===0){const l=e.x-o.x,ri=o.x+o.w-e.x,t=e.y-o.y,b=o.y+o.h-e.y,m=Math.min(l,ri,t,b);if(m===l)e.x=o.x-e.r;else if(m===ri)e.x=o.x+o.w+e.r;else if(m===t)e.y=o.y-e.r;else e.y=o.y+o.h+e.r;}else{const d=Math.sqrt(d2);e.x=nx+dx/d*e.r;e.y=ny+dy/d*e.r;}}}
for(const o of map.circles){const dx=e.x-o.x,dy=e.y-o.y,d=Math.hypot(dx,dy),mn=e.r+o.r;if(d<mn&&d>0){e.x=o.x+dx/d*mn;e.y=o.y+dy/d*mn;}}
e.x=clamp(e.x,e.r,1200-e.r);e.y=clamp(e.y,e.r,800-e.r);}
function resolveTankCollisions(){
for(let i=0;i<ents.length;i++)for(let j=i+1;j<ents.length;j++){
const a=ents[i],b=ents[j];
if(!a.alive||!b.alive)continue;
const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);
const min=a.r+b.r-2;
if(d<min){
if(d<.01){a.x-=1.5;a.y-=1.5;b.x+=1.5;b.y+=1.5;collideEnt(a);collideEnt(b);continue;}
const push=(min-d)/2,nx=dx/d,ny=dy/d;
a.x-=nx*push;a.y-=ny*push;
b.x+=nx*push;b.y+=ny*push;
collideEnt(a);collideEnt(b);
const rel=Math.abs((b.vx-a.vx)*nx+(b.vy-a.vy)*ny);
if(rel>90&&!demo)Sfx.bump();}}}

function makeEnt(i,human){return{i,human,team:i,name:PNAME[i],col:PCOL[i],x:600,y:400,r:19,hp:100,maxHp:100,alive:false,dir:0,tdir:0,weapon:'PISTOL',ammo:Infinity,fireCd:0,flash:0,recoil:0,hitT:0,kills:0,deaths:0,respT:0,ix:0,iy:0,imag:0,fireHeld:false,fAim:false,mCount:0,fCount:0,walk:0,moving:false,bot:!human,diff:1,aiT:0,navT:0,state:'wander',tgt:null,goal:null,lastSeen:null,wx:600,wy:400,bx:0,by:0,wantsFire:false,strafe:Math.random()<.5?1:-1,strafeT:rnd(1,3),vx:0,vy:0,cover:0,covT:0,spz:0,lx:600,ly:400,stuck:0};}
function zonePoints(z){return z==='L'?map.spL:z==='R'?map.spR:map.spawns[z];}
function placeEnt(e){
const zone=zonePoints(e.spz);
let best=null,bs=-1;
for(const s of zone){let m=1e9;for(const o of ents)if(o!==e&&o.alive)m=Math.min(m,dist(s[0],s[1],o.x,o.y));if(m>bs){bs=m;best=s;}}
e.x=best[0];e.y=best[1];e.hp=e.maxHp;e.alive=true;e.fireCd=.5;e.flash=0;e.hitT=0;e.recoil=0;
e.dir=Math.atan2(400-e.y,600-e.x);e.tdir=e.dir;
e.ix=0;e.iy=0;e.imag=0;e.mCount=0;e.fCount=0;e.fireHeld=false;e.fAim=false;e.walk=0;e.moving=false;
e.tgt=null;e.lastSeen=null;e.goal=null;e.state='wander';e.aiT=rnd(0,.3);e.navT=0;e.cover=0;e.covT=0;
e.lx=e.x;e.ly=e.y;e.stuck=0;}
function pickupFreePoint(x,y,r){
  if(pointFreeOn(map,x,y,r))return [x,y];
  // Move blocked pickup positions to the nearest clear floor location.
  for(let d=12;d<=180;d+=12){
    const n=Math.max(12,Math.ceil(TAU*d/18));
    for(let i=0;i<n;i++){
      const a=TAU*i/n;
      const px=clamp(x+Math.cos(a)*d,32,1168);
      const py=clamp(y+Math.sin(a)*d,32,768);
      if(pointFreeOn(map,px,py,r))return [px,py];
    }
  }
  // Final deterministic fallback: scan the arena for the closest valid point.
  let best=null,bd=1e9;
  for(let y0=45;y0<=755;y0+=30)for(let x0=45;x0<=1155;x0+=30){
    if(!pointFreeOn(map,x0,y0,r))continue;
    const d=(x0-x)*(x0-x)+(y0-y)*(y0-y);
    if(d<bd){bd=d;best=[x0,y0];}
  }
  return best||[x,y];
}
function setupPickups(){
  pks=[];

    const q=pickupFreePoint(w[0],w[1],24);
    pks.push({x:q[0],y:q[1],t:'W',key:WEAPON_KEYS[irand(0,3)],cd:0,on:true});
  }
  for(const h of map.hp){
    const q=pickupFreePoint(h[0],h[1],20);
    pks.push({x:q[0],y:q[1],t:'H',cd:0,on:true});
  }
}

/* ============ combat ============ */
function tryFire(e){if(!e.alive||e.fireCd>0)return;
if(e.ammo<=0){e.weapon='PISTOL';e.ammo=Infinity;return;}
const w=WEAPONS[e.weapon];e.fireCd=w.rate;

e.recoil=1;e.flash=.06;

b.on=true;b.x=e.x+Math.cos(a)*BULLET_SPAWN;b.y=e.y+Math.sin(a)*BULLET_SPAWN;b.vx=Math.cos(a)*w.spd;b.vy=Math.sin(a)*w.spd;b.dmg=w.dmg;b.own=e;b.rng=w.range;b.trv=0;b.rocket=!!w.rocket;b.spd=w.spd;}
/* hearing: nearby idle bots investigate the shooter */
for(const o of ents){
if(o===e||!o.alive||!o.bot||o.state==='attack'||o.state==='pickup'||o.state==='flee')continue;
if(dist(o.x,o.y,e.x,e.y)<560){
o.lastSeen={x:e.x,y:e.y};
if(o.state==='wander'||o.state==='search'){o.state='search';o.goal={x:e.x,y:e.y};o.navT=0;}}}}
function damage(e,amt,atk){if(!e.alive)return;e.hp-=amt;e.hitT=.12;fxSparks(e.x,e.y,5,'#fff');if(!demo)Sfx.hit();if(e.hp<=0){e.hp=0;killEnt(e,atk);}}
function killEnt(e,atk){e.alive=false;e.deaths++;fxDeath(e);if(!demo)Sfx.death();shake(5,.25);
if(atk&&atk!==e){atk.kills++;if(atk.kills>=KTARGET){endMatch(atk);return;}}}

for(const e of ents){if(!e.alive||e===own)continue;const d=dist(x,y,e.x,e.y);if(d<115)damage(e,Math.round(60*(1-d/135)),own);}}

/* ============ bot AI (rebuilt) ============ */
function nearestPk(t,e){let b=null,bd=1e9;for(const p of pks)if(p.on&&p.t===t){const d=dist(e.x,e.y,p.x,p.y);if(d<bd){bd=d;b=p;}}return b;}
function navTo(e,tx,ty){if(!losBlocked(e.x,e.y,tx,ty)){e.wx=tx;e.wy=ty;return;}
let best=null,bs=1e9;for(const n of map.nav){if(losBlocked(e.x,e.y,n.x,n.y))continue;const s=dist(e.x,e.y,n.x,n.y)+dist(n.x,n.y,tx,ty);if(s<bs){bs=s;best=n;}}
if(best){e.wx=best.x;e.wy=best.y;}else{e.wx=e.x;e.wy=e.y;}}
function navAway(e){let best=map.nav[0],bs=-1;const t=e.tgt;
for(const n of map.nav){const d=t?dist(n.x,n.y,t.x,t.y):0;const s=d-dist(e.x,e.y,n.x,n.y)*.5;if(s>bs){bs=s;best=n;}}
return{x:best.x,y:best.y};}
function botAI(e,dt){
const D=DIFFS[e.diff];
e.aiT-=dt;e.strafeT-=dt;e.navT-=dt;
if(e.strafeT<=0){e.strafeT=rnd(.8,2);e.strafe*=-1;}
/* instant re-target when current target dies */
if(e.tgt&&!e.tgt.alive){e.tgt=null;e.lastSeen=null;e.aiT=Math.min(e.aiT,.05);}
if(e.aiT<=0){e.aiT=D.react*rnd(.7,1.4);
/* perception: nearest visible enemy anywhere in the arena */
let best=null,bd=1e9;
for(const o of ents)if(o!==e&&o.alive){const d=dist(e.x,e.y,o.x,o.y);if(d<bd&&d<D.view&&!losBlocked(e.x,e.y,o.x,o.y)){bd=d;best=o;}}
if(best){e.tgt=best;e.lastSeen={x:best.x,y:best.y};e.state='attack';}
else{
/* needs: health / ammo */
const wantHp=e.hp<65;
const wantWp=(e.weapon==='PISTOL'||(e.ammo!==Infinity&&e.ammo<WEAPONS[e.weapon].ammo*.4));
let pick=null;
if(wantHp)pick=nearestPk('H',e);
if(!pick&&wantWp)pick=nearestPk('W',e);
if(pick&&dist(e.x,e.y,pick.x,pick.y)<560){e.state='pickup';e.goal={x:pick.x,y:pick.y};}
else if(e.tgt&&e.tgt.alive&&e.hp<40){e.state='flee';e.goal=navAway(e);}
else if(e.lastSeen){e.state='search';e.goal={x:e.lastSeen.x,y:e.lastSeen.y};}
else{e.state='wander';
/* biased wandering: stay in the fight instead of roaming a far corner */
if(Math.random()<.6){let bn=null,bb=1e9;
for(let i=0;i<12;i++){const n=map.nav[irand(0,map.nav.length-1)];const d=dist(e.x,e.y,n.x,n.y);
if(d>140&&d<560&&d<bb){bb=d;bn=n;}}
e.goal=bn?{x:bn.x,y:bn.y}:{x:rnd(200,1000),y:rnd(160,640)};}
else{const n=map.nav[irand(0,map.nav.length-1)];e.goal={x:n.x,y:n.y};}}}}
if(e.state==='search'&&e.lastSeen)e.goal={x:e.lastSeen.x,y:e.lastSeen.y};
let mx=0,my=0,wantFire=false;
const attacking=e.state==='attack'&&e.tgt&&e.tgt.alive;
if(attacking){
const t=e.tgt,d=Math.max(1,dist(e.x,e.y,t.x,t.y));
if(losBlocked(e.x,e.y,t.x,t.y)){e.state='search';e.lastSeen={x:t.x,y:t.y};e.goal={x:t.x,y:t.y};e.navT=0;}
else{e.lastSeen={x:t.x,y:t.y};
const w=WEAPONS[e.weapon];let ax=0,ay=0;
if(d>w.pref+50){ax=(t.x-e.x)/d;ay=(t.y-e.y)/d;}
else if(d<w.pref-70){ax=(e.x-t.x)/d;ay=(e.y-t.y)/d;}
ax+=-(t.y-e.y)/d*e.strafe*.75;ay+=(t.x-e.x)/d*e.strafe*.75;
/* dodge incoming shells */
for(const b of bl){if(!b.on||b.own===e)continue;
const bd=dist(b.x,b.y,e.x,e.y);
if(bd<150){const bs=Math.hypot(b.vx,b.vy)||1;
const tx=(e.x-b.x)/bd,ty=(e.y-b.y)/bd;
if((b.vx*tx+b.vy*ty)/bs>.72){ax+=-(b.vy/bs)*1.15;ay+=(b.vx/bs)*1.15;break;}}}
mx=ax;my=ay;
/* turret: lead the target and track it independently of the hull */
const tt=d/w.spd,px=t.x+t.vx*tt*D.lead,py=t.y+t.vy*tt*D.lead;
const aim=Math.atan2(py-e.y,px-e.x)+(Math.random()-.5)*2*D.err;
e.tdir=angLerp(e.tdir,aim,clamp(dt*10,0,1));
const aligned=angDiff(e.tdir,aim)<.35;
const gate=Math.sin((tGlob+e.i*1.7)*3.4)>-.35;
wantFire=aligned&&gate&&d<w.range+80;}}
if(!attacking){
if(e.goal){
if(e.navT<=0){e.navT=.4;navTo(e,e.goal.x,e.goal.y);}
const dg=dist(e.x,e.y,e.wx,e.wy);
if(dg<28){
if(dist(e.x,e.y,e.goal.x,e.goal.y)<34){e.goal=null;if(e.state==='search'){e.lastSeen=null;e.state='wander';}}
else{e.navT=0;navTo(e,e.goal.x,e.goal.y);}}
if(e.goal){const dg2=dist(e.x,e.y,e.wx,e.wy);
if(dg2>1){mx=(e.wx-e.x)/dg2;my=(e.wy-e.y)/dg2;}}}
/* opportunistic grabs on the way */
if(Math.random()<dt*1.5){
for(const p of pks){if(!p.on)continue;
const d=dist(e.x,e.y,p.x,p.y);
if(d<150&&((p.t==='H'&&e.hp<75)||(p.t==='W'&&(e.weapon==='PISTOL'||(e.ammo!==Infinity&&e.ammo<WEAPONS[e.weapon].ammo*.5))))){e.goal={x:p.x,y:p.y};e.navT=0;break;}}}}
const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
e.bx=mx;e.by=my;
/* twin-stick bot: hull steers toward movement; turret already tracks the aim */
if(ml>.08)e.dir=angLerp(e.dir,Math.atan2(my,mx),clamp(dt*9,0,1));
if(!attacking)e.tdir=angLerp(e.tdir,e.dir,clamp(dt*6,0,1));
e.wantsFire=wantFire;}

/* ============ update ============ */
function calcCover(e){let n=0,h=0;for(const o of ents)if(o!==e&&o.alive){n++;if(losBlocked(e.x,e.y,o.x,o.y))h++;}return n?h/n:0;}
function updateEnt(e,dt){
e.fireCd-=dt;e.flash-=dt;e.hitT-=dt;e.recoil=Math.max(0,e.recoil-dt*6);
if(!e.alive){e.respT-=dt;if(e.respT<=0)placeEnt(e);return;}
e.covT-=dt;if(e.covT<=0){e.covT=.2;e.cover=calcCover(e);}
if(e.bot)botAI(e,dt);
else{
let hasPtr=false,firePtr=false;
for(const k in PTRS){const p=PTRS[k];if(p.e===e){hasPtr=true;if(p.k==='f')firePtr=true;}}
if(hasPtr){e.fireHeld=firePtr;}
else{e.fireHeld=!!keys[' '];
let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const kl=Math.hypot(kx,ky);
if(kl){e.ix=kx/kl;e.iy=ky/kl;e.imag=1;}else e.imag=0;}}
let mx,my,mg;
if(e.bot){mx=e.bx;my=e.by;mg=1;}else{mx=e.ix;my=e.iy;mg=e.imag;}
const sp=170*(e.bot?DIFFS[e.diff].speed:1);
e.vx=mx*sp*mg;e.vy=my*sp*mg;
e.x+=e.vx*dt;e.y+=e.vy*dt;
collideEnt(e);
e.moving=Math.hypot(e.vx,e.vy)>20;
if(e.moving)e.walk+=dt*12;
/* stuck detection: bump into geometry for too long -> hop to a nearby nav node */
if(e.bot){
const moved=dist(e.x,e.y,e.lx,e.ly);
const want=Math.hypot(e.vx,e.vy);
if(want>60&&moved<want*dt*.35){
e.stuck+=dt;
if(e.stuck>.55){
let bn=null,bb=1e9;
for(const n of map.nav){const d=dist(e.x,e.y,n.x,n.y);if(d>60&&d<300&&d<bb){bb=d;bn=n;}}
if(bn){e.goal={x:bn.x,y:bn.y};e.navT=0;}
e.strafe*=-1;
e.stuck=-.5;}}
else e.stuck=Math.min(0,e.stuck+dt*.8);
e.lx=e.x;e.ly=e.y;}
/* twin-stick: hull turns toward movement; turret aims independently via FIRE drag */
if(mg>.05&&!e.bot)e.dir=angLerp(e.dir,Math.atan2(my,mx),clamp(dt*10,0,1));
if(!e.bot&&!e.fAim)e.tdir=angLerp(e.tdir,e.dir,clamp(dt*7,0,1));
if(e.fireHeld||(e.bot&&e.wantsFire))tryFire(e);
for(const p of pks){if(!p.on)continue;
if(dist(e.x,e.y,p.x,p.y)<e.r+16){
if(p.t==='H'){if(e.hp<e.maxHp){e.hp=Math.min(e.maxHp,e.hp+35);p.on=false;p.cd=9;fxPickupBig(p.x,p.y,'#4ade80','+35 HP');if(!demo)Sfx.pickup();}}
else{e.weapon=p.key;e.ammo=WEAPONS[p.key].ammo;p.on=false;p.cd=12;p.key=WEAPON_KEYS[irand(0,3)];fxPickupBig(p.x,p.y,WCOL[e.weapon],WEAPONS[e.weapon].name);if(!demo)Sfx.pickup();}}}}
function updateBullets(dt){
for(const b of bl){if(!b.on)continue;
const steps=2,sdt=dt/steps;
for(let s=0;s<steps&&b.on;s++){
const nx=b.x+b.vx*sdt,ny=b.y+b.vy*sdt;
if(hitObst(nx,ny)||hitObst((b.x+nx)/2,(b.y+ny)/2)){
if(b.rocket)explode(b.x,b.y,b.own);else fxSparks(b.x,b.y,3,'#ffd28a');
b.on=false;break;}
b.x=nx;b.y=ny;b.trv+=b.spd*sdt;
for(const e of ents){
if(!e.alive||e===b.own)continue;
if(dist(b.x,b.y,e.x,e.y)<e.r+4){
if(b.rocket)explode(b.x,b.y,b.own);
else{damage(e,b.dmg,b.own);fxSparks(b.x,b.y,4,'#ff8a5c');}
b.on=false;break;}}
if(b.on&&b.trv>b.rng){if(b.rocket)explode(b.x,b.y,b.own);else b.on=false;}}
if(b.on&&b.rocket){const p=getP();if(p){p.on=true;p.x=b.x;p.y=b.y;p.vx=rnd(-20,20);p.vy=rnd(-20,20);p.life=p.max=.35;p.col='#9aa0a8';p.sz=5;p.type=0;}}}}
function updatePickups(dt){
for(const p of pks){
if(!p.on){p.cd-=dt;if(p.cd<=0)p.on=true;continue;}
if(Math.random()<dt*2.6){
const sp=getP();
if(sp){sp.on=true;sp.x=p.x+rnd(-13,13);sp.y=p.y+rnd(-8,8);sp.vx=rnd(-8,8);sp.vy=rnd(-48,-22);
sp.life=sp.max=rnd(.5,.9);sp.col=p.t==='W'?WCOL[p.key]:'#ff9a9a';sp.sz=rnd(1.4,2.4);sp.type=0;}}}}
function updateParticles(dt){for(const p of pt)if(p.on){p.life-=dt;if(p.life<=0){p.on=false;continue;}
if(p.type!==2){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-4*dt);p.vy*=Math.max(0,1-4*dt);}
else{p.y+=p.vy*dt;p.vy*=Math.max(0,1-1.5*dt);}}}
function update(dt){
if(phase==='count'){countT-=dt;
const c=Math.ceil(countT);
if(c!==lastCnt){lastCnt=c;if(c>0)Sfx.count();}
if(countT<=0){phase='run';announce('FIGHT!',1);Sfx.go();}
return;}
matchT-=dt;
if(matchT<=0){endMatch(null);return;}
for(const e of ents)updateEnt(e,dt);
resolveTankCollisions();
updateBullets(dt);updatePickups(dt);updateParticles(dt);
if(shakeT>0){shakeT-=dt;if(shakeT<=0)shakeM=0;}
if(ann.t>0)ann.t-=dt;}

rrp(g,-16,-12,32,24,5);g.fill();g.stroke();
g.fillStyle='rgba(0,0,0,.18)';rrp(g,-16,4,32,8,4);g.fill();
g.fillStyle='rgba(255,255,255,.25)';rrp(g,-13,-9.5,26,7,3.5);g.fill();
g.fillStyle='rgba(0,0,0,.22)';rrp(g,11,-12,5,24,3);g.fill();

g.beginPath();g.moveTo(c*6,s*6);g.lineTo(c*blen,s*blen);g.stroke();
g.strokeStyle='#2b3037';g.lineWidth=6;
g.beginPath();g.moveTo(c*6,s*6);g.lineTo(c*blen,s*blen);g.stroke();

g.beginPath();g.arc(-c*3-s*2.5,-s*3+c*2.5,3,0,TAU);g.fill();
g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.arc(c*2,s*2,3.4,0,TAU);g.fill();

/* ============ match flow ============ */
function buildRoster(){
if(cfg.n===1){
const list=['human'];
for(let i=0;i<cfg.bots1;i++)list.push('bot');
return list;}
const list=[];
for(let i=0;i<cfg.n;i++)list.push(i===0?'human':types[i]);
return list;}
function assignZones(list){
return list.map((t,i)=>{
if(cfg.n===1)return i===0?'L':i;
if(list.length<=2)return i===0?'L':'R';
return i;});}
function spawnRoster(list,zones){
ents=[];humans=[];
list.forEach((t,i)=>{
const e=makeEnt(i,t==='human');
e.spz=zones[i];
ents.push(e);if(e.human)humans.push(e);});
cfg.players=humans.length;}
function startMatch(){
demo=false;goFull();
map=MAPS[cfg.map];renderMap(map);setupPickups();
const list=buildRoster();
const zones=assignZones(list);
spawnRoster(list,zones);
for(const b of bl)b.on=false;for(const p of pt)p.on=false;
matchT=180;
for(const e of ents)placeEnt(e);
layoutControls();
applyFixedCamera();
shakeT=0;shakeM=0;ann={txt:'',t:0};
phase='count';countT=3.4;lastCnt=4;
state='play';showScreen(null);}
function startDemo(){
demo=true;
map=MAPS[cfg.map];renderMap(map);setupPickups();
spawnRoster(['bot','bot','bot','bot'],[0,1,2,3]);
for(const e of ents)placeEnt(e);
for(const b of bl)b.on=false;for(const p of pt)p.on=false;
matchT=180;
applyFixedCamera();
shakeT=0;shakeM=0;ann.t=0;
phase='run';}
function resetDemo(){for(const e of ents){e.kills=0;e.deaths=0;placeEnt(e);}for(const b of bl)b.on=false;for(const p of pt)p.on=false;matchT=180;}
function endMatch(w){
if(demo){resetDemo();return;}
if(state==='over')return;
state='over';
let title='DRAW',tcol='#ffb545',winEnt=w||null;
if(!winEnt&&ents.length===1){title='TIME UP';}
else if(!winEnt){
let best=null;for(const e of ents)if(!best||e.kills>best.kills)best=e;
const tied=ents.filter(e=>e.kills===best.kills);
if(tied.length===1)winEnt=best;}
if(winEnt){title=winEnt.name+(winEnt.bot?' BOT':'')+' WINS!';tcol=winEnt.col;}
 $('ov-title').textContent=title;$('ov-title').style.color=tcol;
let html='<div class="trow th"><span></span><b>PLAYER</b><span>KILLS</span><span>DEATHS</span><span>SCORE</span></div>';
const list=(winEnt?[winEnt].concat(ents.filter(e=>e!==winEnt)):ents.slice().sort((a,b)=>b.kills-a.kills));
for(const e of list){
const sc=e.kills*100-e.deaths*25;
html+='<div class="trow'+(e===winEnt?' winrow':'')+'"><span class="chip" style="background:'+e.col+'"></span><b>'+e.name+(e.bot?' \u00B7BOT':'')+'</b><span>'+e.kills+'</span><span>'+e.deaths+'</span><span>'+sc+'</span></div>';}
 $('ov-table').innerHTML=html;
showScreen('s-over');
if(winEnt)Sfx.win();else Sfx.lose();}
const screens=['s-menu','s-setup','s-howto','s-settings','s-pause','s-over'];

 $('pauseBtn').style.display=(id===null&&state==='play')?'block':'none';
fitUI();}

g.fillStyle=m.theme.floor;g.fillRect(0,0,120,80);
g.fillStyle=m.theme.wall;
for(const o of m.rects)g.fillRect(o.x*sx,o.y*sy,Math.max(1.5,o.w*sx),Math.max(1.5,o.h*sy));
g.fillStyle=m.theme.barrel;
for(const o of m.circles){g.beginPath();g.arc(o.x*sx,o.y*sy,Math.max(1.5,o.r*sx),0,TAU);g.fill();}});}

/* ============ input ============ */
function mvPtr(e,si,x,y){
const c=ctl[si];if(!c)return;
let dx=x-c.jx,dy=y-c.jy;const l=Math.hypot(dx,dy);
if(l<6){e.imag=0;return;}
e.ix=dx/l;e.iy=dy/l;e.imag=Math.min(l,c.jr)/c.jr;}
function aimPtr(e,si,x,y){
const c=ctl[si];if(!c)return;
const dx=x-c.fx,dy=y-c.fy;
if(Math.hypot(dx,dy)<7)return;
e.fAim=true;
e.tdir=Math.atan2(dy,dx);}
function pickControl(x,y){
let best=null,bd=1e9;
for(let i=0;i<cfg.players;i++){
const c=ctl[i];if(!c)continue;
const dj=dist(x,y,c.jx,c.jy),df=dist(x,y,c.fx,c.fy);
if(dj<c.jr*2.2&&dj<bd){bd=dj;best={i,k:'m'};}
if(df<c.fr*2.3&&df<bd){bd=df;best={i,k:'f'};}}
if(!best&&cfg.players===1){
const c=ctl[0];
best={i:0,k:dist(x,y,c.fx,c.fy)<dist(x,y,c.jx,c.jy)?'f':'m'};}
return best;}
cv.addEventListener('pointerdown',ev=>{
Sfx.unlock();
if(state!=='play')return;
const pick=pickControl(ev.clientX,ev.clientY);
if(!pick)return;
const e=humans[pick.i];if(!e)return;
if(pick.k==='f'){PTRS[ev.pointerId]={e,si:pick.i,k:'f'};e.fCount++;}
else{PTRS[ev.pointerId]={e,si:pick.i,k:'m'};e.mCount++;mvPtr(e,pick.i,ev.clientX,ev.clientY);}
ev.preventDefault();});
addEventListener('pointermove',ev=>{
const p=PTRS[ev.pointerId];
if(!p)return;
if(p.k==='m'){mvPtr(p.e,p.si,ev.clientX,ev.clientY);ev.preventDefault();}
else if(p.k==='f'){aimPtr(p.e,p.si,ev.clientX,ev.clientY);ev.preventDefault();}});
function releasePtr(ev){
const p=PTRS[ev.pointerId];if(!p)return;
if(p.k==='f'){p.e.fCount=Math.max(0,p.e.fCount-1);if(p.e.fCount<=0)p.e.fAim=false;}
else{p.e.mCount--;if(p.e.mCount<=0){p.e.mCount=0;p.e.imag=0;}}
delete PTRS[ev.pointerId];}
addEventListener('pointerup',releasePtr);
addEventListener('pointercancel',releasePtr);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';showScreen('s-pause');}});

 $('pauseBtn').addEventListener('click',()=>{Sfx.unlock();if(state==='play'){Sfx.click();state='pause';showScreen('s-pause');}});
function syncSeg(el,v){el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',+o.dataset.v===v));}
const mapEl=$('seg-map');
syncSeg(mapEl,cfg.map);
mapEl.addEventListener('click',ev=>{

function tog(id,key){
const b=$(id);
b.addEventListener('click',()=>{Sfx.unlock();Sfx.click();opt[key]=!opt[key];
b.classList.toggle('on',opt[key]);b.classList.toggle('off',!opt[key]);
b.textContent=opt[key]?'ON':'OFF';
if(key==='sound')Sfx.muted=!opt.sound;});}
tog('t-sound','sound');tog('t-shake','shake');tog('t-aim','aim');

/* ============ main loop ============ */
let lastT=0;
function frame(t){
requestAnimationFrame(frame);
const dt=Math.min(.045,(t-lastT)/1000||.016);lastT=t;
tGlob+=dt;
if(state==='play'||(state==='menu'&&demo))update(dt);
if(map&&mapCv)render();}
buildSlots2();
resize();
startDemo();
requestAnimationFrame(frame);
</script>
