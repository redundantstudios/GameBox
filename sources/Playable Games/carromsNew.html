/* ============================================================
   CONFETTI
============================================================ */
let confetti=[];
function launchConfetti(){
  const fx=$('#fx'),th=THEMES.find(t=>t.id===state.theme);
  const cols=[th.ui.btn,'#ffe6b0','#ffffff',th.board.red,th.ui.btn2];
  confetti=[];
  for(let i=0;i<130;i++)confetti.push({
    x:Math.random()*fx.clientWidth,y:-30-Math.random()*160,
    vx:rnd(-50,50),vy:rnd(140,340),rot:rnd(0,TAU),vr:rnd(-5,5),
    w:rnd(6,11),h:rnd(8,16),col:cols[i%cols.length],shape:i%3});
}
function stepConfetti(dt){
  if(!confetti.length)return;
  const fx=$('#fx'),g=fx.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,fx.clientWidth,fx.clientHeight);
  confetti=confetti.filter(p=>p.y<fx.clientHeight+40);
  for(const p of confetti){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.rot+=p.vr*dt;
    g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;
    if(p.shape===0)g.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    else{g.beginPath();g.arc(0,0,p.w/2,0,TAU);g.fill()}
    g.restore();
  }
  if(!confetti.length)g.clearRect(0,0,fx.clientWidth,fx.clientHeight);
}

/* ============================================================
   TUTORIAL — two interactive steps
============================================================ */
const Tutorial={
  active:false,step:-1,moveProg:0,fingerMode:null,
  start(){
    this.active=true;Game.session++;Game.phase='tutorial';
    Striker.side='bottom';
    setupRack();resetStriker();
    setTopbar('tutorial');updateTurnPill();
    $('#topHint').classList.remove('show');$('#boardLabel').classList.remove('show');
    $('#tutBack').classList.remove('show');
    this.goto(0);
  },
  card(title,text,btn,fn){
    $('#tutTitle').textContent=title;$('#tutText').textContent=text;
    const b=$('#tutBtn');b.textContent=btn;b.onclick=fn;
    Panels.show('p-tut');
  },
  goto(n){
    this.step=n;Panels.hide();
    const top=$('#topHint'),label=$('#boardLabel');
    if(n===0){
      setTopbar('tutorial');
      this.card('Tutorial','Welcome! Before your first match, we will teach you the controls. Follow the instructions.','CONTINUE',()=>this.goto(1));
    }else if(n===1){
      Game.phase='placing';this.moveProg=0;resetStriker();
      top.textContent='Drag the slider to select where you want to place the striker';top.classList.add('show');
      label.classList.remove('show');setHint('');
      $('#tutBack').classList.add('show');this.finger('slider');
    }else if(n===2){
      Game.phase='placing';
      top.textContent='Drag the striker to aim and adjust force. Release to shoot.';top.classList.add('show');
      label.textContent='Drag the striker';label.classList.add('show');
      setHint('');
      $('#tutBack').classList.add('show');this.finger('aim');
    }else if(n===3){
      this.finger(null);top.classList.remove('show');label.classList.remove('show');setHint('');
      $('#tutBack').classList.remove('show');
      this.card('Congratulations','You are ready for the first match!','PLAY NOW',()=>this.finish());
    }
  },
  onSettled(){
    if(this.step===2)later(650,()=>this.goto(3));
  },
  positionDone(){
    if(this.step!==1)return;
    this.step=1.5;this.finger(null);boardToast('Nice!');
    later(750,()=>this.goto(2));
  },
  back(){
    if(this.step===2)this.goto(1);
    else if(this.step===1)this.goto(0);
    else if(this.step===0)showHome();
  },
  finish(){
    this.active=false;state.tutorialSeen=true;saveState();
    this.finger(null);setTopbar('menu');updateTurnPill();
    Panels.show('p-cmode');
  },
  exit(){showHome()},
  finger(mode){
    this.fingerMode=mode;
    $('#fingerHint').classList.toggle('show',!!mode);
  },
  tick(t){
    const fh=$('#fingerHint');
    if(!this.fingerMode)return;
    const r=canvas.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();
    const mx=px=>r.left-ar.left+px/1000*r.width, my=py=>r.top-ar.top+py/1000*r.height;
    let gx,gy;
    if(this.fingerMode==='slider'){
      const gm=sliderGeom();
      const tp=sliderThumbXY();
      const k=(Math.sin(t*2.2)+1)/2;
      const osc=lerp(-40,40,k);
      gx=gm.hor?clamp(tp.x+osc,gm.a0+24,gm.a1-24):gm.c;
      gy=gm.hor?gm.c:clamp(tp.y+osc,gm.a0+24,gm.a1-24);
    }else if(this.fingerMode==='aim'&&strikerP()){
      const s=strikerP();
      const [nx,ny]=sideOutward(Striker.side);
      const k=(Math.sin(t*2.4)+1)/2;
      const pull=14+k*58;
      gx=s.x+nx*pull;
      gy=s.y+ny*pull;
    }else return;
    fh.style.left=mx(gx)+'px';
    fh.style.top=my(gy)+'px';
  }
};
 $('#tutBack').onclick=()=>Tutorial.back();
