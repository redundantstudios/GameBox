}
function drawGear(x,y,r){
  ctx.save();
  ctx.translate(x,y);
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.lineWidth=r*0.28;
  for(let i=0;i<8;i++){
    const a=i*TAU/8;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*0.62,Math.sin(a)*r*0.62);
    ctx.lineTo(Math.cos(a)*r*1.0,Math.sin(a)*r*1.0);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,r*0.66,0,TAU);
  ctx.lineWidth=r*0.24; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,r*0.24,0,TAU); ctx.fill();
  ctx.restore();
}
function renderMenu(){
  if(FELT) ctx.drawImage(FELT,0,0,W,H);
  else{ ctx.fillStyle=C.table; ctx.fillRect(0,0,W,H); }
  const appear=Math.min(1,(simTime-menuStart)/0.5), sc=easeOutBack(appear);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const bw=Math.max(170,Math.min(340,W-40));
  const compact=H<640;
  const sel=on=>({bg:on?C.tile:C.btn,fg:'#fff',r:13,active:on});
  if(MENU.step==='root'||MENU.step==='howto'){
    uiButtons.push({id:'settings',x:W-56,y:10,w:44,h:44});
    ctx.fillStyle=C.btn; rr(ctx,W-56,10,44,44,22); ctx.fill();
    ctx.strokeStyle=C.btnStroke; ctx.lineWidth=1.3; rr(ctx,W-56,10,44,44,22); ctx.stroke();
    drawGear(W-34,32,8);
  }
  if(MENU.step==='root'){
    const S=clamp(Math.min(W*0.62,H*0.36),160,290);
    const blockH=S+(compact?236:268);
    const top=(H-blockH)/2;
    ctx.save(); ctx.translate(W/2,top+S/2); ctx.scale(sc,sc);
    drawMiniHero(0,0,S);
    ctx.restore();
    const ty=top+S+(compact?8:12);
    ctx.save(); ctx.translate(W/2,ty); ctx.scale(sc,sc);
    const ts=Math.round(clamp(W*0.11,32,48));
    ctx.font='900 '+ts+'px '+FONT;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillText('CARROM',0,4);
    ctx.fillStyle='#f2e6c8'; ctx.fillText('CARROM',0,0);
    ctx.restore();
    const tagY=ty+ts*0.62+(compact?4:8);
    ctx.font='700 10px '+FONT; ctx.fillStyle='rgba(242,230,200,.6)';
    ctx.fillText('F L I C K   •   P O C K E T   •   Q U E E N',W/2,tagY);
    const byy=tagY+(compact?16:26);
    uiBtn('menu-play',W/2-bw/2,byy,bw,compact?50:56,'PLAY',{bg:C.tile,fg:'#fff',fs:20,r:18,shadow:true});
    uiBtn('menu-howto',W/2-bw/2,byy+(compact?50:56)+10,bw,compact?42:46,'How To Play?',{bg:C.btn,fg:'rgba(255,255,255,.88)',fs:13,r:16});
  }else if(MENU.step==='howto'){
    ctx.fillStyle='#000'; ctx.globalAlpha=0.55; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
    const pw=Math.min(320,Math.max(220,W-36)), rows=3;
    const ph=64+rows*62+16;
    const x=W/2-pw/2, y=Math.max(20,Math.round((H-ph)/2));
    ctx.fillStyle=C.panel; rr(ctx,x,y,pw,ph,20); ctx.fill();
    ctx.strokeStyle=C.btnStroke; ctx.lineWidth=1.5; rr(ctx,x,y,pw,ph,20); ctx.stroke();
    ctx.fillStyle=C.tile; rr(ctx,x,y,pw,44,20); ctx.fill(); ctx.fillRect(x,y+24,pw,20);
    ctx.fillStyle='#fff'; ctx.font='900 15px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('HOW TO PLAY',W/2,y+22);
    const descs={duel:'First pocket sets your colour',classic:'Fixed colours, 1v1 to 4 free',business:'Coins are money, win the pot'};
    ['duel','classic','business'].forEach((m,i)=>{
      const ry=y+58+i*62;
      uiBtn('tutopen:'+m,x+16,ry,pw-32,54,MODES[m],{bg:C.btn,fg:'#fff',fs:14,r:14});
      ctx.font='600 9.5px '+FONT; ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.textAlign='center';
      ctx.fillText(descs[m],W/2,ry+40);
    });
  }else{
    const duel=MENU.modeKind==='duel';
    const rowH=compact?34:40, gap=compact?12:16, headH=compact?12:14;
    const rowsN=3+(MENU.vsAi?1:0);
    const blockH=2+rowsN*(headH+rowH+gap)+8+(compact?42:48)+36;
    const panelW=bw+40, panelH2=blockH+(compact?58:80);
    const pxp=Math.round(W/2-panelW/2), pyp=Math.max(6,Math.round((H-panelH2)/2));
    ctx.fillStyle=C.panel; rr(ctx,pxp,pyp,panelW,panelH2,18); ctx.fill();
    ctx.strokeStyle=C.btnStroke; ctx.lineWidth=1.5; rr(ctx,pxp,pyp,panelW,panelH2,18); ctx.stroke();
    ctx.fillStyle=C.tile;
    rr(ctx,pxp,pyp,panelW,compact?36:42,18); ctx.fill();
    ctx.fillRect(pxp,pyp+(compact?19:23),panelW,20);
    ctx.fillStyle='#fff'; ctx.font='900 15px '+FONT;
    ctx.fillText('NEW GAME',W/2,pyp+(compact?18:21));
    let y=pyp+(compact?52:74);
    const head=(s,yy)=>{ ctx.font='800 10px '+FONT; ctx.fillStyle='rgba(255,255,255,.65)'; ctx.fillText(s,W/2,yy); };
    head('MODE',y); y+=headH;
    const w3=(bw-16)/3;
    ['duel','classic','business'].forEach((m,i)=>{
      uiBtn('mode:'+m,pxp+20+i*(w3+8),y,w3,rowH,MODES[m],sel(MENU.modeKind===m));
    });
    y+=rowH+gap;
    head('PLAYERS',y); y+=headH;
    const w2=(bw-20)/3;
    uiBtn('players:2',W/2-bw/2,y,w2,rowH,'1 VS 1',sel(MENU.players==='2'));
    uiBtn('players:22',W/2-bw/2+w2+10,y,w2,rowH,'2 VS 2',sel(MENU.players==='22'));
    uiBtn('players:4',W/2-bw/2+(w2+10)*2,y,w2,rowH,'4 FREE',
      duel?{bg:C.btn,fg:'#fff',r:13,off:true}:sel(MENU.players==='4'));
    y+=rowH+gap;
    head('OPPONENT',y); y+=headH;
    uiBtn('opp:ai',W/2-bw/2,y,(bw-10)/2,rowH,'VS COMPUTER',sel(MENU.vsAi));
    uiBtn('opp:pass',W/2-bw/2+(bw-10)/2+10,y,(bw-10)/2,rowH,'PASS & PLAY',sel(!MENU.vsAi));
    y+=rowH+gap;
    if(MENU.vsAi){
      head('DIFFICULTY',y); y+=headH;
      const wd=(bw-16)/3;
      ['easy','normal','hard'].forEach((s2,i)=>uiBtn('skill:'+s2,W/2-bw/2+i*(wd+8),y,wd,rowH-2,s2.toUpperCase(),sel(MENU.skill===s2)));
      y+=rowH+gap;
    }
    uiBtn('start',W/2-110,y,220,compact?44:50,'START MATCH',{bg:C.tile,fg:'#fff',fs:17,r:18,shadow:true});
    y+=(compact?44:50)+gap;
    uiBtn('botx',W/2-90,y,180,compact?28:32,'⚙ BOT TEST ×5',{bg:C.btn,fg:'rgba(255,255,255,.85)',fs:11,r:12});
    uiBtn('menu-root',12,12,92,36,'BACK',{bg:C.btn,fg:'#fff',fs:13,r:12});
  }
  if(SETT.open){
    ctx.fillStyle='#000'; ctx.globalAlpha=0.55; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
    const pw=Math.min(300,Math.max(220,W-40)), ph=190;
    const x=W/2-pw/2, y=Math.max(30,Math.round(H/2-ph/2));
    ctx.fillStyle=C.panel; rr(ctx,x,y,pw,ph,20); ctx.fill();
    ctx.strokeStyle=C.btnStroke; ctx.lineWidth=1.5; rr(ctx,x,y,pw,ph,20); ctx.stroke();
    ctx.fillStyle=C.tile; rr(ctx,x,y,pw,42,20); ctx.fill(); ctx.fillRect(x,y+24,pw,18);
    ctx.fillStyle='#fff'; ctx.font='900 15px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('SETTINGS',W/2,y+21);
    uiBtn('tgl-sound',x+20,y+58,pw-40,44,'SOUND: '+(store.sound?'ON':'OFF'),{bg:C.btn,fg:'#fff',fs:13,r:13});
    uiBtn('tgl-haptic',x+20,y+112,pw-40,44,'HAPTICS: '+(store.haptics?'ON':'OFF'),{bg:C.btn,fg:'#fff',fs:13,r:13});
    uiBtn('settings',x+20,y+ph-52,pw-40,36,'CLOSE',{bg:C.tile,fg:'#fff',fs:12,r:12});
  }
  ctx.font='600 13px '+FONT; ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillText('Redundant studios',W/2,H-22);
  if(FX.fade>0){ ctx.fillStyle='#0a0603'; ctx.globalAlpha=FX.fade*0.9; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
}

function drawDebug(){
  const lines=[
    'fps '+(fps|0)+' speed x'+G.speed,
    'phase '+G.phase+' cur '+G.cur+' side '+G.sides[G.cur],
    'mode '+G.modeKind+' seats '+G.seatCount+(G.teamPlay?' 2v2':'')+' '+(G.mode==='ai'?'AI':'PASS')+(G.botAll?' BOTS':''),
    'bodies '+aliveBodies().length+' sink '+G.sinking.length,
    'teams '+G.teams.map(t=>(t.coin||'?')+':'+(G.modeKind==='business'?'₹'+t.bank:t.pocketed+'/'+t.needed)+(t.queen?'*':'')+(t.alive?'':'X')).join(' | '),
    'pot ₹'+G.pot+' shot ['+G.shotPocketed.join(',')+'] foul:'+G.strikerFell
  ];
  ctx.save();
  ctx.fillStyle='#000'; ctx.globalAlpha=.55; ctx.fillRect(4,H/2-70,280,16*lines.length+10); ctx.globalAlpha=1;
  ctx.font='10px monospace'; ctx.fillStyle='#e8d8b8'; ctx.textAlign='left'; ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,8,H/2-64+i*16));
  ctx.restore();
}

function tick(now){
  raf=requestAnimationFrame(tick);
  if(!lastT) lastT=now;
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.05) dt=0.05;
  fps=fps*0.9+(1/Math.max(dt,1e-4))*0.1;
  if(window.innerWidth!==W||window.innerHeight!==H) resize();
  uiButtons=[];
  if(!paused){
    try{
      if(TUTV.open) tsTick(dt);
      const steps=(G.screen==='game')?G.speed:1;
      for(let i=0;i<steps;i++) update(dt);
    }
    catch(err){ cancelAnimationFrame(raf); showFatal(err); return; }
  }
  try{
    if(TUTV.open) drawTutScreen();
    else if(G.screen==='menu') renderMenu();
    else renderGame();
    if(DEBUG&&G.screen==='game'&&!TUTV.open) drawDebug();
    if(FX.inter&&!TUTV.open) drawInter();
  }
  catch(err){ cancelAnimationFrame(raf); showFatal(err); }
}
function showFatal(err){
  const el=document.getElementById('err');
  el.style.display='flex';
  el.innerHTML='<div style="max-width:520px"><h2>Game Error</h2><p style="font-weight:600;margin:4px 0 10px">Something went wrong.</p><small>'+String(err&&err.stack||err&&err.message||err).replace(/[<>]/g,'')+'</small></div>';
}
window.Game={
  pause(){ if(G.screen==='game') paused=true; },
  resume(){ paused=false; lastT=0; },
  setMuted(m){ store.sound=!m; syncShell(); saveStore(); },
  destroy(){
    try{ cancelAnimationFrame(raf); }catch(e){}
    window.removeEventListener('resize',resize);
    window.removeEventListener('keydown',onKey);
    document.removeEventListener('visibilitychange',onVis);
    document.removeEventListener('contextmenu',onCtx);
    if(cv){
      cv.removeEventListener('pointerdown',onDown);
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);
      window.removeEventListener('pointercancel',onUp);
      cv.removeEventListener('touchstart',onTouch);
    }
    cancelTasks(); uiButtons=[]; SFX.close();
  }
};
function onTouch(e){ e.preventDefault(); }
function onVis(){ if(document.hidden&&G.screen==='game'&&G.phase!=='OVER'){ paused=true; lastT=0; } }

let booted=false;
function boot(){
  if(booted) return; booted=true;
  cv=document.getElementById('c');
  ctx=cv.getContext('2d');
  loadStore();
  const qp=new URLSearchParams(location.search);
  DEBUG=qp.get('debug')==='1';
  resize();
  if(qp.get('mode')==='solo'){
    const skill=['easy','normal','hard'].includes(qp.get('skill'))?qp.get('skill'):'normal';
    newGame('classic','2',skill,true,false);
  }else{
    goMenu();
  }
  window.addEventListener('resize',resize);
  window.addEventListener('keydown',onKey);
  document.addEventListener('visibilitychange',onVis);
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  cv.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
  cv.addEventListener('touchstart',onTouch,{passive:false});
  raf=requestAnimationFrame(tick);
}
try{ boot(); }
catch(err){ showFatal(err); }
</script>
