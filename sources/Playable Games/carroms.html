let rngSeed = (Date.now() ^ (Math.random()*0xffffffff))>>>0;
function rng(){ rngSeed|=0; rngSeed=(rngSeed+0x6D2B79F5)|0; let t=Math.imul(rngSeed^(rngSeed>>>15),1|rngSeed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }
const rand=(a,b)=>a+rng()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutQuad=t=>t*(2-t);
const easeInQuad=t=>t*t;
const easeOutBack=t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2);
const easeInOutQ=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function lighten(h,t){ const c=parseInt(h.slice(1),16); return 'rgb('+Math.round(((c>>16)&255)+(255-((c>>16)&255))*t)+','+Math.round(((c>>8)&255)+(255-((c>>8)&255))*t)+','+Math.round((c&255)+(255-(c&255))*t)+')'; }
function rr(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function gauss(){ return (rng()+rng()+rng()-1.5)/1.5; }
function trunc(c,str,maxW){ if(c.measureText(str).width<=maxW) return str; while(str.length>1&&c.measureText(str+'…').width>maxW) str=str.slice(0,-1); return str+'…'; }
function wrap(c,text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    const words=para.split(' ');
    let line='';
    for(const w2 of words){
      const t=line?line+' '+w2:w2;
      if(c.measureText(t).width>maxW&&line){ out.push(line); line=w2; }
      else line=t;
    }
    out.push(line);
  }
  return out;
}
function forceColor(p){
  p=clamp(p,0,1);
  const stops=[[0,[239,227,200]],[0.55,[255,215,94]],[1,[192,57,43]]];
  for(let i=1;i<stops.length;i++){
    if(p<=stops[i][0]){
      const t=(p-stops[i-1][0])/(stops[i][0]-stops[i-1][0]);
      const a=stops[i-1][1], b=stops[i][1];
      return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';
    }
  }
  return 'rgb(192,57,43)';
}
function powderPuff(x,y,n){
  for(let i=0;i<n;i++){
    const a=rng()*TAU, sp=10+rng()*40;
    FX.parts.push({x:x+(rng()*6-3),y:y+(rng()*6-3),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-12,g:40,t:0,ttl:0.35+rng()*0.3,s:1+rng()*2,c:'rgba(246,238,214,0.55)',rect:false});
  }
  if(FX.parts.length>220) FX.parts.splice(0,FX.parts.length-220);
}

let simTime=0;
const tasks=[];
function after(sec,fn){ tasks.push({t:simTime+sec,fn}); }
function cancelTasks(){ tasks.length=0; }
function runTasks(){ for(let i=tasks.length-1;i>=0;i--){ if(simTime>=tasks[i].t){ const f=tasks[i].fn; tasks.splice(i,1); f(); } } }

const SFX=(()=>{
  let ctx=null, master=null; const last={};
  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=CFG.audio.master; master.connect(ctx.destination);
  }
  function tone(f,o){
    o=o||{}; const t0=ctx.currentTime+(o.delay||0);
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t0);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30,f+o.slide),t0+(o.a||0.005)+(o.d||0.12));
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(o.v||0.2,t0+(o.a||0.005));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+(o.a||0.005)+(o.d||0.12));
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0+(o.a||0.005)+(o.d||0.12)+0.06);
  }
  function noise(o){
    o=o||{}; const t0=ctx.currentTime+(o.delay||0), dur=o.d||0.08;
    const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,len,ctx.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=o.f||1800; f.Q.value=o.q||1;
    const g=ctx.createGain(); g.gain.setValueAtTime(o.v||0.15,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t0);
  }
  const lib={
    click(){ tone(950,{type:'triangle',v:.13,d:.05}); },
    invalid(){ tone(220,{type:'triangle',v:.1,d:.09}); tone(180,{type:'triangle',v:.08,d:.11,delay:.05}); },
    flick(){ noise({v:.22,d:.06,f:2600,q:0.8}); tone(340,{type:'triangle',v:.12,d:.08,slide:-160}); },
    clack(o){ const v=clamp((o&&o.v)||0.4,0.08,1); noise({v:v*0.24,d:.035,f:3200,q:1.4}); tone(720+v*380,{type:'square',v:v*0.05,d:.03}); },
    wall(o){ const v=clamp((o&&o.v)||0.4,0.1,1); noise({v:v*0.2,d:.05,f:900,q:1}); tone(150,{type:'sine',v:v*0.14,d:.07,slide:-40}); },
    pocket(){ noise({v:.16,d:.06,f:1400}); tone(520,{type:'sine',v:.16,d:.16,slide:-260}); },
    drop(){ tone(180,{type:'sine',v:.2,d:.16,slide:-90}); noise({v:.12,d:.08,f:600,q:0.8,delay:.02}); },
    foul(){ tone(330,{type:'triangle',v:.11,d:.12,slide:-140}); tone(240,{type:'triangle',v:.09,d:.16,slide:-80,delay:.09}); },
    queen(){ [740,932,1109].forEach((f,i)=>tone(f,{type:'triangle',v:.09,d:.16,delay:i*.08})); },
    cash(){ tone(880,{type:'triangle',v:.11,d:.07}); tone(1320,{type:'triangle',v:.09,d:.1,delay:.06}); },
    turn(){ tone(720,{type:'sine',v:.035,d:.045}); },
    win(){ [392,523,659,784].forEach((f,i)=>tone(f,{type:'triangle',v:.12,d:.34,delay:i*.14})); tone(1046,{type:'sine',v:.1,d:.6,delay:.62}); }
  };
  function play(name,arg){
    if(!ctx||!store.sound) return;
    const now=performance.now();
    if(last[name]&&now-last[name]<CFG.audio.debounceMs) return;
    last[name]=now; lib[name](arg);
  }
  return { init, play, resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); }, close(){ try{ if(ctx){ctx.close(); ctx=null;} }catch(e){} } };
})();
function haptic(k){ if(!store.haptics) return; Studio.haptic(k); }

let store={ sound:true, haptics:true, games:0, wins:0 };
function loadStore(){
  try{ const s=Studio.load('carroms:save'); if(s) store=Object.assign(store,JSON.parse(s)); }catch(e){}
  if(Studio.settings){
    if(typeof Studio.settings.sound==='boolean') store.sound=Studio.settings.sound;
    if(typeof Studio.settings.haptics==='boolean') store.haptics=Studio.settings.haptics;
  }
}
function saveStore(){ try{ Studio.save('carroms:save',JSON.stringify(store)); }catch(e){} }
function syncShell(){ try{ Studio.save('shell:settings',JSON.stringify({sound:store.sound,haptics:store.haptics})); if(Studio.settings){Studio.settings.sound=store.sound; Studio.settings.haptics=store.haptics;} }catch(e){} }

function showInterstitial(next){ FX.inter={ t:0, dur:CFG.ads.interDur, next }; }
function runInter(){ const n=FX.inter&&FX.inter.next; FX.inter=null; if(n)n(); }

const G={ screen:'menu', mode:'ai', modeKind:'classic', skill:'normal',
          seatCount:2, teamPlay:false, sides:[0,2],
          teams:[], teamMap:[], cur:0, phase:'IDLE', winner:-1,
          players:[], bodies:[], sinking:[], shotPocketed:[], strikerFell:false,
          pot:0, roundNo:1, bet:null, cfg:null,
          tut:false, tutDone:true,
          botAll:false, speed:1, strikerBlocked:false };
const MENU={ step:'root', modeKind:'classic', players:'2', skill:'normal', vsAi:true };
const FX={ parts:[], parts2:[], texts:[], rings:[], shake:0,

let paused=false, lastT=0, fps=60, menuStart=0, DEBUG=false, raf=0;
const C = CFG.colors;

function resetFx(){
  FX.parts=[]; FX.parts2=[]; FX.texts=[]; FX.rings=[]; FX.shake=0;
  FX.boardBounce=0; FX.confettiUntil=0; FX.aiSlide=null;
}
function isHuman(seat){ return !G.botAll&&(G.mode==='pass'||seat===0); }
function teamIdxOf(seat){ return G.teamMap[seat]||0; }
function aliveTeams(){ return G.teams.filter(t=>t.alive); }
function seatLabel(s){ return NAMES[s]||('S'+s); }
function betTeamLabel(ti){
  const t=G.teams[ti]; if(!t) return '?';
  return t.members.map(seatLabel).join('+');
}
function coinVal(type){ return type==='W'?CFG.biz.valWhite:type==='Q'?CFG.biz.valQueen:CFG.biz.valBlack; }

function newGame(modeKind,players,skill,vsAi,botTest){
  cancelTasks(); resetFx();
  G.modeKind=modeKind; G.skill=skill;
  G.mode = vsAi===false?'pass':'ai';
  G.seatCount = (players==='4'||players==='22')?4:2;
  G.teamPlay = players==='22';
  G.sides = G.seatCount===4?[0,1,2,3]:[0,2];
  G.botAll = !!botTest;
  G.speed = botTest?5:1;
  G.cfg={modeKind,players,skill,vsAi:G.mode==='ai',botTest:G.botAll};
  G.cur=0; G.winner=-1;
  setupTeams();
  G.players=[];
  for(let s=0;s<G.seatCount;s++){ G.players.push({lastU:0.5,shots:0}); }
  G.pot=0; G.roundNo=1; G.bet=null;
  layout();
  prevBS=BS;
  setupCoins();
  paused=false; FX.fade=1; G.screen='game';
  store.games++; saveStore();
  buildCaches();
  after(0.45,beginTurn);
}
function goMenu(){
  cancelTasks(); resetFx();
  paused=false; G.screen='menu'; G.phase='IDLE'; G.winner=-1; G.bet=null;
  G.botAll=false; G.speed=1;
  MENU.step='root';
  menuStart=simTime; FX.fade=1;
}
function setupTeams(){
  G.teams=[]; G.teamMap=[];
  const mk=(i,members,coin)=>({i,members,coin,pocketed:0,queen:false,bank:0,alive:true,roundEarn:0,needed:CFG.rules.coinsPerSide});
  if(G.seatCount===2){
    G.teams=[mk(0,[0],'W'),mk(1,[1],'B')]; G.teamMap=[0,1];
  }else if(G.teamPlay){
    G.teams=[mk(0,[0,2],'W'),mk(1,[1,3],'B')]; G.teamMap=[0,1,0,1];
  }else{
    G.teams=[mk(0,[0],'W'),mk(1,[1],'B'),mk(2,[2],'W'),mk(3,[3],'B')];
    G.teamMap=[0,1,2,3];
  }
  if(G.modeKind!=='business'){
    const ffa=(G.seatCount===4&&!G.teamPlay);
    for(const t of G.teams) t.needed = ffa?CFG.rules.ffaCoins:CFG.rules.coinsPerSide;
    if(G.modeKind==='duel') for(const t of G.teams) t.coin=null;
  }
}

let cv,ctx,dpr=1,W=0,H=0,BX=0,BY=0,BS=300,BG=null,FELT=null,sideM=8,boxH=30,prevBS=null;
const GEO={};
function layout(){
  boxH=30;
  const edgeM=boxH+12;
  sideM = G.seatCount===4?edgeM:8;
  const topM=edgeM, botM=edgeM;
  const marg=8;
  const availH=H-topM-botM-marg*2;
  const availW=W-sideM*2-marg*2;
  BS=Math.max(150,Math.min(availW,availH));
  BX=Math.round(sideM+marg+(availW-BS)/2);
  BY=Math.round(topM+(availH-BS)/2);
  GEO.frame=BS*0.048;
  GEO.pocketInset=BS*0.105;
  GEO.pocketR=BS*0.056;
  GEO.coinR=BS*0.031;
  GEO.strikerR=BS*0.043;
  GEO.baseY0=BS-GEO.frame-BS*0.088;
  GEO.baseY1=GEO.frame+BS*0.088;
  GEO.baseHalf=BS*0.29;
  GEO.playLo=GEO.frame;
  GEO.playHi=BS-GEO.frame;
  GEO.pockets=[
    {x:GEO.pocketInset,y:GEO.pocketInset},{x:BS-GEO.pocketInset,y:GEO.pocketInset},
    {x:GEO.pocketInset,y:BS-GEO.pocketInset},{x:BS-GEO.pocketInset,y:BS-GEO.pocketInset}
  ];
}
function sidePos(side,u){
  const off=(u-0.5)*2*GEO.baseHalf;
  if(side===0) return {x:BS/2+off,y:GEO.baseY0};
  if(side===1) return {x:BS-GEO.baseY1,y:BS/2+off};
  if(side===2) return {x:BS/2+off,y:GEO.baseY1};
  return {x:GEO.baseY1,y:BS/2+off};
}
function clampU(u){ return clamp(u,0.04,0.96); }
function strikerPos(){ return sidePos(G.sides[G.cur],G.players[G.cur].lastU); }
function handleGeom(){
  const side=G.sides[G.cur], u=G.players[G.cur].lastU;
  const p=sidePos(side,u);
  let x=p.x, y=p.y;
  if(side===0) y=lerp(GEO.baseY0,BS-GEO.frame*0.4,0.55);
  if(side===2) y=lerp(GEO.baseY1,GEO.frame*0.4,0.55);
  if(side===1) x=lerp(BS-GEO.baseY1,BS-GEO.frame*0.4,0.55);
  if(side===3) x=lerp(GEO.baseY1,GEO.frame*0.4,0.55);
  const horiz=(side===0||side===2);
  return {x,y,horiz};
}
function inSlideStrip(x,y){
  const side=G.sides[G.cur], c=BS/2, half=GEO.baseHalf+GEO.strikerR*1.6;
  if(side===0) return y>GEO.baseY0 && Math.abs(x-c)<=half;
  if(side===2) return y<GEO.baseY1 && Math.abs(x-c)<=half;
  if(side===1) return x>BS-GEO.baseY1 && Math.abs(y-c)<=half;
  return x<GEO.baseY1 && Math.abs(y-c)<=half;
}
function strikerOverlapsAt(x,y){
  for(const b of G.bodies){
    if(!b.alive||b.type==='S') continue;
    if(Math.hypot(b.x-x,b.y-y)<b.r+GEO.strikerR+0.5) return true;
  }
  return false;
}
function strikerOverlaps(){
  const s=G.bodies.find(b=>b.type==='S');
  if(!s) return false;
  return strikerOverlapsAt(s.x,s.y);
}

function setupCoins(){
  G.bodies=[]; G.sinking=[]; G.shotPocketed=[]; G.strikerFell=false;
  const R=GEO.coinR, cx=BS/2, cy=BS/2;
  const mk=(type,x,y,alive)=>G.bodies.push({type,x,y,vx:0,vy:0,r:type==='S'?GEO.strikerR:R,
    m:type==='S'?CFG.phys.strikerMass:CFG.phys.coinMass,alive:!!alive,sink:0,pop:0});
  mk('S',cx,GEO.baseY0,false);
  if(G.modeKind==='business'){
    mk('Q',cx,cy,true);
    const g=[['W','B','W'],['B',null,'B'],['W','B','W']];
    for(let r2=0;r2<3;r2++) for(let q=0;q<3;q++){
      if(!g[r2][q]) continue;
      mk(g[r2][q], cx+(q-1)*(R*2+0.3), cy+(r2-1)*(R*2+0.3), true);
    }
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*TAU/10;
      mk(i%2===0?'B':'W', cx+Math.cos(a)*(R*4+0.6), cy+Math.sin(a)*(R*4+0.6), true);
    }
  }else{
    mk('Q',cx,cy,true);
    for(let i=0;i<6;i++){
      const a=-Math.PI/2+i*TAU/6;
      mk(i%2===0?'W':'B', cx+Math.cos(a)*(R*2+0.2), cy+Math.sin(a)*(R*2+0.2), true);
    }
    for(let i=0;i<12;i++){
      const a=-Math.PI/2+TAU/24+i*TAU/12;
      mk(i%2===0?'B':'W', cx+Math.cos(a)*(R*4+0.4), cy+Math.sin(a)*(R*4+0.4), true);
    }
  }
}
function aliveBodies(){ return G.bodies.filter(b=>b.alive); }
function boardHasCoins(){ return G.bodies.some(b=>b.alive&&b.type!=='S'); }

function spotFree(x,y,r){
  if(x<GEO.playLo+r||x>GEO.playHi-r||y<GEO.playLo+r||y>GEO.playHi-r) return false;
  for(const p of GEO.pockets){ if(Math.hypot(x-p.x,y-p.y)<GEO.pocketR*1.25) return false; }
  for(const b of G.bodies){ if(b.alive&&Math.hypot(x-b.x,y-b.y)<r+b.r+1) return false; }
  return true;
}
function freeSpot(){
  const c=BS/2;
  for(let rad=0;rad<BS*0.32;rad+=GEO.coinR*1.1){
    const steps=Math.max(8,Math.floor(rad/GEO.coinR)||1);
    for(let i=0;i<steps;i++){
      const a=i/steps*TAU+(rad?0.3:0);
      const x=c+Math.cos(a)*rad, y=c+Math.sin(a)*rad;
      if(spotFree(x,y,GEO.coinR*1.02)) return {x,y};
    }
  }
  return {x:c,y:c};
}
function returnCoin(type){
  const sp=freeSpot();
  const b=G.bodies.find(b=>!b.alive&&b.type===type);
  if(b){ b.alive=true; b.x=sp.x; b.y=sp.y; b.vx=0; b.vy=0; b.pop=1; }
  return b;
}
function returnQueen(){
  const sp={x:BS/2,y:BS/2};
  if(!spotFree(sp.x,sp.y,GEO.coinR)){ const f=freeSpot(); sp.x=f.x; sp.y=f.y; }
  const q=G.bodies.find(b=>b.type==='Q');
  if(q){ q.alive=true; q.x=sp.x; q.y=sp.y; q.vx=0; q.vy=0; q.pop=1; }
}

function fireStriker(seat,dirx,diry,power){
  const s=G.bodies.find(b=>b.type==='S');
  if(strikerOverlaps()){ SFX.play('invalid'); return; }
  s.alive=true;
  s.vx=dirx*power*CFG.phys.maxV*BS; s.vy=diry*power*CFG.phys.maxV*BS;
  G.shotPocketed=[]; G.strikerFell=false;
  G.tut=false; G.tutDone=true;
  G.phase='SIM';
  powderPuff(BX+s.x-dirx*GEO.strikerR,BY+s.y-diry*GEO.strikerR,5);
  SFX.play('flick'); haptic('light');
}
let physAcc=0;
function stepPhysics(dt){
  const P=CFG.phys;
  physAcc+=dt;
  let n=0;
  while(physAcc>=P.substep&&n++<P.maxSub){ physAcc-=P.substep; substep(P.substep); }
  if(n>=P.maxSub) physAcc=0;
  const stopV=P.stopSpeed*BS;
  const moving=aliveBodies().some(b=>Math.hypot(b.vx,b.vy)>stopV);
  if(!moving&&G.phase==='SIM'){
    for(const b of aliveBodies()){ b.vx=0; b.vy=0; }
    G.phase='RESOLVE';
    after(CFG.fx.settleDelay,evaluateShot);
  }
}
function substep(dt){
  const P=CFG.phys, lo=GEO.playLo, hi=GEO.playHi;
  const prR=GEO.pocketR;
  const capR=prR*P.pocketCapture;
  const wellR=prR*P.pocketWell;
  const stopV=P.stopSpeed*BS;
  const linF=P.fric*BS;
  const damp=Math.exp(-P.damping*dt);
  for(const b of G.bodies){
    if(!b.alive) continue;
    b.vx*=damp; b.vy*=damp;
    let sp=Math.hypot(b.vx,b.vy);
    if(sp>0){
      const ns=Math.max(0,sp-linF*dt);
      const k=ns/sp; b.vx*=k; b.vy*=k; sp=ns;
    }
    if(sp<stopV){ b.vx=0; b.vy=0; sp=0; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    for(const p of GEO.pockets){
      const dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy);
      if(d<capR){ captureBody(b,p); break; }
      if(d<wellR&&d>0.001){
        const pull=P.wellPull*BS*dt;
        b.vx+=(dx/d)*pull; b.vy+=(dy/d)*pull;
        b.vx*=P.wellDrag; b.vy*=P.wellDrag;
        if(sp<stopV*2.5){
          b.vx+=(dx/d)*stopV*2.5;
          b.vy+=(dy/d)*stopV*2.5;
        }
      }
    }
    if(!b.alive) continue;
    if(b.x<lo+b.r){ b.x=lo+b.r; if(b.vx<0){ wallHit(b); b.vx*=-P.restWall; } }
    else if(b.x>hi-b.r){ b.x=hi-b.r; if(b.vx>0){ wallHit(b); b.vx*=-P.restWall; } }
    if(b.y<lo+b.r){ b.y=lo+b.r; if(b.vy<0){ wallHit(b); b.vy*=-P.restWall; } }
    else if(b.y>hi-b.r){ b.y=hi-b.r; if(b.vy>0){ wallHit(b); b.vy*=-P.restWall; } }
  }
  const act=G.bodies.filter(b=>b.alive);
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++) collide(act[i],act[j]);
}
function wallHit(b){
  const v=Math.hypot(b.vx,b.vy);
  if(v>BS*0.05){
    SFX.play('wall',{v:clamp(v/(BS*2.2),0.1,1)});
    if(v>BS*0.55) powderPuff(BX+b.x,BY+b.y,3);
  }
}
function collide(a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||0.0001;
  const rs=a.r+b.r;
  if(d>=rs) return;
  const nx=dx/d, ny=dy/d;
  const im1=1/a.m, im2=1/b.m, imt=im1+im2;
  const overlap=rs-d;
  a.x-=nx*overlap*(im1/imt); a.y-=ny*overlap*(im1/imt);
  b.x+=nx*overlap*(im2/imt); b.y+=ny*overlap*(im2/imt);
  const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
  const vn=rvx*nx+rvy*ny;
  if(vn>=0) return;
  const j=-(1+CFG.phys.restCoin)*vn/imt;
  a.vx-=j*nx*im1; a.vy-=j*ny*im1;
  b.vx+=j*nx*im2; b.vy+=j*ny*im2;
  const tx=-ny, ty=nx;
  const vt=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty;
  const jt=vt*0.06;
  a.vx+=jt*tx*im1; a.vy+=jt*ty*im1;
  b.vx-=jt*tx*im2; b.vy-=jt*ty*im2;
  const imp=clamp(-vn/(CFG.phys.maxV*BS*0.5),0,1);
  if(imp>0.06){
    SFX.play('clack',{v:imp});
    if(imp>0.5){ haptic('light'); powderPuff(BX+(a.x+b.x)/2,BY+(a.y+b.y)/2,2); }
  }
}
function captureBody(b,p){
  b.alive=false;
  b.sink=CFG.fx.sinkTime;
  G.sinking.push({b,sx:b.x,sy:b.y,px:p.x,py:p.y});
  G.shotPocketed.push(b.type);
  if(b.type==='S') G.strikerFell=true;
  const px=BX+p.x, py=BY+p.y;
  burst(px,py,b.type==='Q'?'#e05050':(b.type==='W'?'#f2ead6':'#5a4a38'),CFG.fx.burstCount);
  addRing(px,py,GEO.pocketR*0.35,GEO.pocketR*1.5,'#ffffff',2.5,0.35,false);
  addRing(px,py,GEO.pocketR*0.1,GEO.pocketR*1.1,b.type==='Q'?'#ffd75e':'rgba(255,255,255,.7)',0,0.3,true);
  FX.shake=Math.max(FX.shake,b.type==='S'?3:1.8);
  if(b.type==='Q') SFX.play('queen'); else SFX.play('pocket');
  haptic(b.type==='S'?'heavy':'medium');
  after(CFG.fx.sinkTime*0.72,()=>{
    SFX.play('drop');
    addRing(BX+p.x,BY+p.y,GEO.pocketR*0.2,GEO.pocketR*0.85,'#000000',2,0.3,false);
  });
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rng()*TAU, sp=50+rng()*180;
    FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,g:380,t:0,ttl:0.4+rng()*0.35,s:1.5+rng()*2.5,c:color,rect:rng()<0.4});
  }
  if(FX.parts.length>200) FX.parts.splice(0,FX.parts.length-200);
}
function addRing(x,y,r0,r1,c,lw,ttl,fill){ FX.rings.push({x,y,r0,r1,c,lw,t:0,ttl:ttl||0.4,fill:!!fill}); }
function floatText(str,x,y,c){ FX.texts.push({str,x,y,c:c||'#fff',t:0,ttl:1.0}); }
function spawnConfetti(){
  if(FX.parts2.length>240) return;
  for(let i=0;i<8;i++) FX.parts2.push({x:rng()*W,y:-14,vx:(rng()*2-1)*40,vy:60+rng()*130,rot:rng()*TAU,vr:(rng()*2-1)*6,t:0,ttl:2.4+rng(),s:5+rng()*5,c:['#f2ead6','#c0392b','#3f7db8','#ffd75e'][Math.floor(rng()*4)]});
}

function evaluateShot(){
  const me=G.cur, mt=teamIdxOf(me), my=G.teams[mt];
  const gp={x:BX+BS/2,y:BY+BS/2};
  let ty=gp.y-BS*0.16;
  const say=(str,col)=>{ floatText(str,gp.x,ty,col); ty-=20; };

  if(G.modeKind==='business'){
    let ownVal=0;
    for(const t of G.shotPocketed){
      if(t==='S') continue;
      const v=coinVal(t);
      my.bank+=v; my.roundEarn+=v; ownVal+=v;
      if(t==='Q'){ SFX.play('queen'); say('QUEEN ₹'+CFG.biz.valQueen+'!',C.gold); }
    }
    if(G.strikerFell){
      const rb=returnCoin('W')||returnCoin('B');
      if(rb){ const v=coinVal(rb.type); my.bank=Math.max(0,my.bank-v); say('PENALTY ₹'+v,'#ff9c8a'); }
      else say('FOUL!','#ff9c8a');
      SFX.play('foul'); haptic('heavy');
    }else if(ownVal>0){
      say('EARNED ₹'+ownVal,'#ffffff');
      SFX.play('cash');
    }
    if(my.bank>=CFG.biz.winTarget){ G.winner=me; after(0.7,showVictory); return; }
    if(!boardHasCoins()){ after(0.6,settleRound); return; }
    if(!G.strikerFell&&ownVal>0){ after(0.35,beginTurn); return; }
    after(0.35,nextTurn);
    return;
  }

  let own=0, gifted=false, queen=false;
  for(const t of G.shotPocketed){
    if(t==='S') continue;
    if(t==='Q'){ queen=true; continue; }
    if(G.modeKind==='duel'&&!my.coin){
      my.coin=t;
      G.teams[1-mt].coin=(t==='W'?'B':'W');
      say(my.coin+' IS YOURS','#ffe9a8');
    }
    if(my.coin===t) own++;
    else{
      for(const o of G.teams){ if(o!==my&&o.coin===t){ o.pocketed++; gifted=true; } }
    }
  }
  my.pocketed+=own;
  if(own>0) say('POCKET!','#ffffff');
  if(gifted) say('GIFTED!','#ffb0a0');
  if(G.strikerFell){
    if(my.pocketed>0){ my.pocketed--; returnCoin(my.coin||'W'); }
    say('FOUL!','#ff9c8a');
    SFX.play('foul'); haptic('heavy');
  }
  if(queen){
    if(my.coin&&own>0&&!G.strikerFell){
      my.queen=true;
      say('QUEEN COVERED!',C.gold);
      addRing(gp.x,gp.y,BS*0.03,BS*0.14,C.gold,3.5,0.6,false);
    }else{
      returnQueen();
      say('QUEEN RETURNS','#f0b0a8');
    }
  }
  if(!G.strikerFell&&my.coin&&my.pocketed>=my.needed&&!my.queen){
    my.pocketed--;
    returnCoin(my.coin);
    say('COVER THE QUEEN FIRST!','#ffd0a0');
  }
  for(const t of G.teams){
    if(t.pocketed>=t.needed&&t.queen){
      G.winner=t.members[0];
      after(0.7,showVictory);
      return;
    }
  }
  const extra=!G.strikerFell&&own>0;
  if(extra) after(0.35,beginTurn);
  else after(0.35,nextTurn);
}
function nextTurn(){
  if(G.screen!=='game'||G.winner>=0) return;
  let guard=0;
  do{ G.cur=(G.cur+1)%G.seatCount; guard++; }
  while(guard<G.seatCount*2&&G.teams[teamIdxOf(G.cur)]&&!G.teams[teamIdxOf(G.cur)].alive&&aliveTeams().length>0);
  beginTurn();
}
function beginTurn(){
  if(G.screen!=='game'||G.winner>=0) return;
  G.phase='PLACE';
  G.shotPocketed=[]; G.strikerFell=false; G.strikerBlocked=false;
  const s=G.bodies.find(b=>b.type==='S');
  s.alive=false; s.vx=0; s.vy=0; s.sink=0;
  const p=strikerPos();
  s.x=p.x; s.y=p.y;
  SFX.play('turn');
  if(isHuman(G.cur)&&!G.tutDone) G.tut=true;
  if(!isHuman(G.cur)) after(rand(CFG.turn.aiThinkMin,CFG.turn.aiThinkMax)/G.speed,aiTakeTurn);
}

function settleRound(){
  if(G.screen!=='game'||G.winner>=0) return;
  let best=null, tie=false;
  for(const t of G.teams){
    if(t.roundEarn<=0) continue;
    if(!best||t.roundEarn>best.roundEarn){ best=t; tie=false; }
    else if(t.roundEarn===best.roundEarn) tie=true;
  }
  if(best&&!tie&&G.pot>0){
    best.bank+=G.pot;
    floatText(betTeamLabel(best.i)+' WINS POT ₹'+G.pot,BX+BS/2,BY+BS*0.30,C.gold);
    SFX.play('cash');
    G.pot=0;
  }else if(G.pot>0){
    floatText('POT CARRIES OVER',BX+BS/2,BY+BS*0.30,'#cfe0f0');
  }
  for(const t of G.teams){
    if(t.alive&&t.bank<CFG.biz.stakeStep){
      t.alive=false;
      floatText(betTeamLabel(t.i)+' ELIMINATED',BX+BS/2,BY+BS*0.42,'#ff9c8a');
      SFX.play('foul');
    }
  }
  const al=aliveTeams();
  if(al.length<=1){
    const w=al.length?al[0]:G.teams.slice().sort((a,b)=>b.bank-a.bank)[0];
    if(w){ w.bank+=G.pot; G.pot=0; G.winner=w.members[0]; }
    after(0.8,showVictory);
    return;
  }
  let n=G.cur, guard=0;
  do{ n=(n+1)%G.seatCount; guard++; }while(guard<G.seatCount*2&&!G.teams[teamIdxOf(n)].alive);
  G.cur=n;
  G.roundNo++;
  for(const t of G.teams) t.roundEarn=0;
  openStake();
}
function openStake(){
  if(G.screen!=='game'||G.winner>=0) return;
  const al=aliveTeams();
  let cap=Infinity;
  for(const t of al) cap=Math.min(cap,t.bank);
  cap=Math.max(0,Math.floor(cap/CFG.biz.stakeStep)*CFG.biz.stakeStep);
  G.phase='BET';
  G.bet={stake:0,cap,decider:G.cur,open:true,ui:null};
  if(!isHuman(G.cur)) after(CFG.turn.aiBetDelay/G.speed,aiConfirmBet);
}
function aiConfirmBet(){
  if(G.phase!=='BET'||!G.bet||!G.bet.open) return;
  const cap=G.bet.cap;
  let frac=CFG.biz.aiNormal;
  if(G.skill==='easy') frac=CFG.biz.aiEasy;
  if(G.skill==='hard') frac=CFG.biz.aiHard;
  let stake=Math.round(cap*frac/CFG.biz.stakeStep)*CFG.biz.stakeStep;
  if(rng()<0.25) stake=0;
  confirmBet(clamp(stake,0,cap));
}
function confirmBet(stake){
  if(G.phase!=='BET'||!G.bet||!G.bet.open) return;
  G.bet.open=false;
  const al=aliveTeams();
  for(const t of al) t.bank-=stake;
  G.pot+=stake*al.length;
  if(stake>0) floatText('POT ₹'+G.pot,BX+BS/2,BY+BS*0.24,C.gold);
  G.bet=null;
  setupCoins();
  SFX.play('click');
  beginTurn();
}

function showVictory(){
  if(G.winner<0) return;
  G.phase='OVER';
  FX.boardBounce=1; FX.confettiUntil=simTime+CFG.fx.victory;
  const cp={x:BX+BS/2,y:BY+BS/2};
  const wt=teamIdxOf(G.winner);
  addRing(cp.x,cp.y,BS*0.04,BS*0.5,SEAT[wt].accent,4,0.9,false);
  addRing(cp.x,cp.y,BS*0.04,BS*0.35,C.gold,3,0.7,false);
  SFX.play('win'); haptic('success');
  if(G.mode==='ai'&&wt===0){ store.wins++; saveStore(); }
}

function pathClear(ax,ay,bx,by,ignoreList){
  const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy);
  if(len<1) return true;
  const ux=dx/len, uy=dy/len;
  for(const b of G.bodies){
    if(!b.alive||b.type==='S'||ignoreList.includes(b)) continue;
    const rx=b.x-ax, ry=b.y-ay;
    const t=clamp(rx*ux+ry*uy,0,len);
    const px2=ax+ux*t, py2=ay+uy*t;
    if(Math.hypot(b.x-px2,b.y-py2)<b.r+GEO.strikerR*0.92) return false;
  }
  return true;
}
function aiTakeTurn(){
  if(G.screen!=='game'||G.phase!=='PLACE'||G.winner>=0) return;
  const me=G.cur, mt=teamIdxOf(me), my=G.teams[mt];
  const D=CFG.ai[G.skill]||CFG.ai.normal;
  const side=G.sides[me];
  let targets;
  if(G.modeKind==='business'){
    targets=G.bodies.filter(b=>b.alive&&b.type!=='S');
  }else{
    targets=G.bodies.filter(b=>b.alive&&(b.type===my.coin||(b.type==='Q'&&my.pocketed>0)));
  }
  const cand=[];
  for(let i=0;i<=16;i++) cand.push(0.05+(i/16)*0.9);
  let best=null;
  for(const t of targets){
    for(const p of GEO.pockets){
      const ddx=p.x-t.x, ddy=p.y-t.y, dd=Math.hypot(ddx,ddy);
      if(dd<1) continue;
      const ux=ddx/dd, uy=ddy/dd;
      const cx2=t.x-ux*(GEO.strikerR+t.r), cy2=t.y-uy*(GEO.strikerR+t.r);
      if(cx2<GEO.playLo+GEO.strikerR||cx2>GEO.playHi-GEO.strikerR||cy2<GEO.playLo+GEO.strikerR||cy2>GEO.playHi-GEO.strikerR) continue;
      for(const u of cand){
        const sp=sidePos(side,u);
        if(strikerOverlapsAt(sp.x,sp.y)) continue;
        if(!pathClear(sp.x,sp.y,cx2,cy2,[t])) continue;
        const d1=Math.hypot(cx2-sp.x,cy2-sp.y);
        let score=10/(d1*0.55+dd+BS*0.06);
        if(t.type==='Q') score*=0.85;
        if(!best||score>best.score) best={score,u,tx:cx2,ty:cy2,dist:d1+dd};
      }
    }
  }
  let u,dirx,diry,power;
  if(best&&rng()>D.random){
    u=best.u;
    const sp=sidePos(side,u);
    const ang=Math.atan2(best.ty-sp.y,best.tx-sp.x)+gauss()*D.sigma;
    dirx=Math.cos(ang); diry=Math.sin(ang);
    power=clamp(best.dist/(BS*1.35)+0.30+gauss()*D.pnoise,0.3,0.95);
  }else{
    const free=cand.filter(u2=>{ const sp=sidePos(side,u2); return !strikerOverlapsAt(sp.x,sp.y); });
    if(free.length===0){
      after(0.3/G.speed,nextTurn);
      return;
    }
    u=free[Math.floor(rng()*free.length)];
    const any=G.bodies.filter(b=>b.alive&&b.type!=='S');
    const mine=targets.length?targets:any;
    const t=mine.length?mine[Math.floor(rng()*mine.length)]:null;
    const sp=sidePos(side,u);
    if(t){
      const ang=Math.atan2(t.y-sp.y,t.x-sp.x)+gauss()*D.sigma*1.6;
      dirx=Math.cos(ang); diry=Math.sin(ang);
    }else{
      dirx=0; diry=side===0?-1:side===2?1:(side===1?-1:1);
    }
    power=clamp(0.45+gauss()*D.pnoise,0.3,0.9);
  }
  const fromU=G.players[me].lastU;
  const toU=clamp(u,0.05,0.95);
  G.phase='AI_SLIDE';
  FX.aiSlide={t:0,dur:CFG.turn.aiSlideTime,from:fromU,to:toU,side};
  after(CFG.turn.aiSlideTime+CFG.turn.aiPreFire,()=>{
    if(G.screen!=='game'||G.winner>=0||G.phase!=='AI_SLIDE') return;
    G.players[me].lastU=toU;
    FX.aiSlide=null;
    fireStriker(me,dirx,diry,power);
  });
}

function castRay(sx,sy,dx,dy,maxLen){
  let bestT=maxLen, hit=null;
  for(const b of G.bodies){
    if(!b.alive||b.type==='S') continue;
    const rx=b.x-sx, ry=b.y-sy;
    const proj=rx*dx+ry*dy;
    if(proj<=0) continue;
    const perp2=(rx*rx+ry*ry)-proj*proj;
    const R=b.r+GEO.strikerR;
    if(perp2>R*R) continue;
    const t=proj-Math.sqrt(R*R-perp2);
    if(t>0&&t<bestT){ bestT=t; hit=b; }
  }
  const lo=GEO.playLo+GEO.strikerR, hi=GEO.playHi-GEO.strikerR;
  let tw=maxLen;
  if(dx>0.0001) tw=Math.min(tw,(hi-sx)/dx);
  if(dx<-0.0001) tw=Math.min(tw,(lo-sx)/dx);
  if(dy>0.0001) tw=Math.min(tw,(hi-sy)/dy);
  if(dy<-0.0001) tw=Math.min(tw,(lo-sy)/dy);
  if(tw<bestT){ bestT=Math.max(0,tw); hit=null; }
  return {t:bestT,hit};
}

let dragMode=null, dragStart=null, aimDir=null, aimPower=0;
function pauseRect(){ return {x:W-58,y:2,w:52,h:36}; }
function onDown(e){
  SFX.init(); SFX.resume();
  if(e.preventDefault) e.preventDefault();
  if(FX.inter){ if(FX.inter.t>=1) runInter(); return; }
  const rect=cv.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  if(TUTV.open){
    const R=TUTV.rects||{};
    const hitR=r=>r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
    if(hitR(R.close)){ handleAction('tut:close'); return; }
    if(hitR(R.prev)){ handleAction('tut:prev'); return; }
    if(hitR(R.next)){ handleAction('tut:next'); return; }
    if(hitR(R.finish)){ handleAction('tut:finish'); return; }
    return;
  }
  for(let i=uiButtons.length-1;i>=0;i--){
    const b=uiButtons[i];
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ handleAction(b.id); return; }
  }
  if(G.screen==='menu'&&MENU.step==='howto'){ MENU.step='root'; return; }
  if(SETT.open){ SETT.open=false; return; }
  if(!paused){
    const pr=pauseRect();
    if(x>=pr.x&&x<=pr.x+pr.w&&y>=pr.y&&y<=pr.y+pr.h){ handleAction('pause'); return; }
  }
  if(G.tut){ G.tut=false; G.tutDone=true; }
  if(G.phase==='BET'&&G.bet&&G.bet.open&&isHuman(G.bet.decider)&&G.bet.ui&&!paused){
    const u=G.bet.ui;
    if(x>=u.x-16&&x<=u.x+u.w+16&&y>=u.y-18&&y<=u.y+u.h+18){ dragMode='stake'; setStakeFromX(x); }
    return;
  }
  if(G.screen!=='game'||paused||G.phase!=='PLACE'||!isHuman(G.cur)) return;
  const bx2=x-BX, by2=y-BY;
  if(inSlideStrip(bx2,by2)){ dragMode='slide'; slideTo(bx2,by2); return; }
  if(bx2>GEO.playLo&&bx2<GEO.playHi&&by2>GEO.playLo&&by2<GEO.playHi){
    dragMode='aim'; dragStart={x,y};
    aimDir=null; aimPower=0;
  }
}
function slideTo(bx2,by2){
  const side=G.sides[G.cur];
  let u;
  if(side===0||side===2) u=((bx2)-BS/2)/(2*GEO.baseHalf)+0.5;
  else u=((by2)-BS/2)/(2*GEO.baseHalf)+0.5;
  u=clampU(u);
  G.players[G.cur].lastU=u;
  const s=G.bodies.find(b=>b.type==='S');
  const p=sidePos(side,u);
  s.x=p.x; s.y=p.y;
  G.strikerBlocked=strikerOverlaps();
}
function setStakeFromX(x){
  const u=G.bet.ui;
  const t=clamp((x-u.x)/u.w,0,1);
  G.bet.stake=Math.round(t*G.bet.cap/CFG.biz.stakeStep)*CFG.biz.stakeStep;
}
function onMove(e){
  if(!dragMode) return;
  if(e.preventDefault) e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  if(dragMode==='stake'){ setStakeFromX(x); return; }
  if(dragMode==='slide'){
    if(G.phase!=='PLACE'||!isHuman(G.cur)) return;
    slideTo(x-BX,y-BY);
  }else if(dragMode==='aim'){
    const dx=dragStart.x-x, dy=dragStart.y-y;
    const len=Math.hypot(dx,dy);
    if(len>10){
      aimDir={x:dx/len,y:dy/len};
      aimPower=clamp(len/(CFG.aim.maxDrag*BS),0,1);
    }else{ aimDir=null; aimPower=0; }
  }
}
function onUp(e){
  if(dragMode==='aim'&&G.phase==='PLACE'&&isHuman(G.cur)&&G.screen==='game'&&!paused){
    if(G.strikerBlocked){
      SFX.play('invalid'); haptic('heavy');
      floatText('STRIKER IS ON A COIN',BX+BS/2,BY+GEO.baseY0-BS*0.1,'#ff8a80');
    }else if(aimDir&&aimPower>=CFG.aim.minPower){
      G.players[G.cur].shots++;
      fireStriker(G.cur,aimDir.x,aimDir.y,aimPower);

    }
  }

}
function handleAction(id){
  if(id.indexOf('tutopen:')===0){
    const m=id.slice(8);
    TUTV.open=true; TUTV.mode=m; TUTV.cards=TUT[m]; TUTV.idx=0; TUTV.done=null; TUTV.rects={};
    FX.inter=null;
    SFX.play('click');
    return;
  }
  if(id==='tut:prev'){ if(TUTV.idx>0){TUTV.idx--; TUTV.rects={}; SFX.play('click');} return; }
  if(id==='tut:next'){ if(TUTV.idx<TUTV.cards.length-1){TUTV.idx++; TUTV.rects={}; SFX.play('click');} return; }
  if(id==='tut:close'||id==='tut:finish'){
    TUTV.open=false;
    const d=TUTV.done; TUTV.done=null;
    if(d) d();
    return;
  }
  switch(id){
    case 'pause': if(G.screen==='game'&&G.phase!=='OVER') paused=true; break;
    case 'resume': paused=false; lastT=0; break;
    case 'bet:ok': if(G.bet&&G.bet.open) confirmBet(G.bet.stake); break;
    case 'settings': SETT.open=!SETT.open; SFX.play('click'); break;
    case 'menu-howto': MENU.step='howto'; SFX.play('click'); break;
    case 'to-menu':
      if(G.phase==='OVER'&&G.winner>=0) showInterstitial(goMenu);
      else goMenu();

    case 'rematch':
      if(G.phase==='OVER'&&G.winner>=0&&G.cfg) showInterstitial(()=>newGame(G.cfg.modeKind,G.cfg.players,G.cfg.skill,G.cfg.vsAi,G.cfg.botTest));
      else if(G.cfg) newGame(G.cfg.modeKind,G.cfg.players,G.cfg.skill,G.cfg.vsAi,G.cfg.botTest);
      break;
    case 'menu-play': MENU.step='setup'; SFX.play('click'); break;
    case 'menu-root': MENU.step='root'; break;
    case 'mode:duel': MENU.modeKind='duel'; if(MENU.players==='4')MENU.players='22'; SFX.play('click'); break;
    case 'mode:classic': MENU.modeKind='classic'; SFX.play('click'); break;
    case 'mode:business': MENU.modeKind='business'; SFX.play('click'); break;
    case 'players:2': MENU.players='2'; SFX.play('click'); break;
    case 'players:22': MENU.players='22'; SFX.play('click'); break;
    case 'players:4': MENU.players='4'; SFX.play('click'); break;
    case 'opp:ai': MENU.vsAi=true; SFX.play('click'); break;
    case 'opp:pass': MENU.vsAi=false; SFX.play('click'); break;
    case 'skill:easy': MENU.skill='easy'; SFX.play('click'); break;
    case 'skill:normal': MENU.skill='normal'; SFX.play('click'); break;
    case 'skill:hard': MENU.skill='hard'; SFX.play('click'); break;
    case 'start': {
      SFX.play('click');
      const play=()=>newGame(MENU.modeKind,MENU.players,MENU.skill,MENU.vsAi,false);
      if(!seenTut[MENU.modeKind]){
        seenTut[MENU.modeKind]=true;
        TUTV.open=true; TUTV.mode=MENU.modeKind; TUTV.cards=TUT[MENU.modeKind]; TUTV.idx=0; TUTV.done=play; TUTV.rects={};
        FX.inter=null;

    }

    case 'tgl-haptic': store.haptics=!store.haptics; syncShell(); saveStore(); SFX.play('click'); haptic('light'); break;
  }

function paintFelt(c){
  c.fillStyle=C.table; c.fillRect(0,0,W,H);
  let s=12345; const nr=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<700;i++){ c.fillStyle='rgba(0,0,0,.07)'; c.fillRect(nr()*W,nr()*H,2,2); }
  for(let i=0;i<400;i++){ c.fillStyle='rgba(255,230,190,.03)'; c.fillRect(nr()*W,nr()*H,1.5,1.5); }
  const vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.45)');

function drawPocket(c,px,py,R){
  c.save();
  c.beginPath(); c.arc(px,py,R,0,TAU);
  const pg=c.createRadialGradient(px-R*0.25,py-R*0.25,R*0.08,px,py,R);
  pg.addColorStop(0,'#241505'); pg.addColorStop(0.55,'#0d0702'); pg.addColorStop(1,'#000000');
  c.fillStyle=pg; c.fill();
  c.strokeStyle='rgba(0,0,0,.7)'; c.lineWidth=R*0.22;
  c.beginPath(); c.arc(px,py,R*0.88,0,TAU); c.stroke();
  c.strokeStyle='#3a2410'; c.lineWidth=3;
  c.beginPath(); c.arc(px,py,R,0,TAU); c.stroke();
  c.strokeStyle='rgba(255,220,160,.4)'; c.lineWidth=1.5;
  c.beginPath(); c.arc(px,py,R+1.5,Math.PI*0.85,Math.PI*1.75); c.stroke();
  c.restore();
}
function drawRosette(c,CX,CY,S){
  c.save();
  c.strokeStyle=C.line; c.lineWidth=2;
  c.beginPath(); c.arc(CX,CY,S*0.115,0,TAU); c.stroke();
  c.beginPath(); c.arc(CX,CY,S*0.085,0,TAU); c.stroke();
  c.fillStyle='rgba(122,90,48,.45)';
  for(let i=0;i<8;i++){
    c.save(); c.translate(CX,CY); c.rotate(i*TAU/8);
    c.beginPath(); c.ellipse(0,-S*0.068,S*0.011,S*0.024,0,0,TAU); c.fill();
    c.restore();
  }
  c.fillStyle=C.red; c.beginPath(); c.arc(CX,CY,S*0.024,0,TAU); c.fill();
  c.strokeStyle=C.red; c.lineWidth=1.5;
  c.beginPath(); c.arc(CX,CY,S*0.035,0,TAU); c.stroke();
  c.restore();
}
function drawBoardSurface(c,x0,y0,S){
  const bx=x=>x0+x, by=y=>y0+y;
  c.save(); c.shadowColor='rgba(0,0,0,.6)'; c.shadowBlur=26; c.shadowOffsetY=12;
  const g=c.createLinearGradient(x0,y0,x0+S,y0+S);
  g.addColorStop(0,C.boardA); g.addColorStop(1,C.boardB);
  c.fillStyle=g; rr(c,x0,y0,S,S,S*0.03); c.fill(); c.restore();
  let s=987654321; const nr=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<44;i++){
    const y=y0+nr()*S;
    c.strokeStyle='rgba('+(nr()<0.5?'90,55,20':'255,225,170')+','+(0.04+nr()*0.06)+')';
    c.lineWidth=1+nr()*1.5;
    c.beginPath(); c.moveTo(x0,y);
    c.bezierCurveTo(x0+S*0.3,y+(nr()*22-11),x0+S*0.7,y+(nr()*22-11),x0+S,y+(nr()*14-7));
    c.stroke();
  }
  const fr=S*0.048;
  const sheen=c.createRadialGradient(x0+S*0.38,y0+S*0.32,S*0.1,x0+S/2,y0+S/2,S*0.75);
  sheen.addColorStop(0,'rgba(255,244,214,.16)');
  sheen.addColorStop(1,'rgba(255,244,214,0)');
  c.fillStyle=sheen; c.fillRect(x0+fr,y0+fr,S-fr*2,S-fr*2);
  c.strokeStyle=C.frame; c.lineWidth=fr*0.9;
  rr(c,x0+fr*0.45,y0+fr*0.45,S-fr*0.9,S-fr*0.9,S*0.02); c.stroke();
  c.strokeStyle=C.frameHi; c.lineWidth=2;
  rr(c,x0+fr-1,y0+fr-1,S-fr*2+2,S-fr*2+2,S*0.012); c.stroke();
  c.fillStyle=C.brass; c.strokeStyle='#7a5730'; c.lineWidth=1;
  for(const cc of [[fr*0.5,fr*0.5],[S-fr*0.5,fr*0.5],[fr*0.5,S-fr*0.5],[S-fr*0.5,S-fr*0.5]]){
    c.beginPath(); c.arc(x0+cc[0],y0+cc[1],fr*0.26,0,TAU); c.fill(); c.stroke();
  }
  c.strokeStyle='rgba(60,38,14,.5)'; c.lineWidth=1.5;
  c.strokeRect(x0+fr,y0+fr,S-fr*2,S-fr*2);
  const inset=S*0.105, pr=S*0.056;
  for(const p of [[inset,inset],[S-inset,inset],[inset,S-inset],[S-inset,S-inset]]){
    drawPocket(c,x0+p[0],y0+p[1],pr);
  }
  const bY0=S-fr-S*0.088, bY1=fr+S*0.088, bh=S*0.29;
  const dBase=(x1,y1,x2,y2)=>{
    c.strokeStyle=C.line; c.lineWidth=Math.max(1.2,S*0.004);
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    for(const cc of [[x1,y1],[x2,y2]]){
      c.fillStyle=C.red; c.beginPath(); c.arc(cc[0],cc[1],S*0.02,0,TAU); c.fill();
      c.strokeStyle='rgba(0,0,0,.25)'; c.lineWidth=1; c.stroke();
    }
  };
  dBase(bx(S/2-bh),by(bY1),bx(S/2+bh),by(bY1));
  dBase(bx(S/2-bh),by(bY0),bx(S/2+bh),by(bY0));
  dBase(bx(bY1),by(S/2-bh),bx(bY1),by(S/2+bh));
  dBase(bx(S-bY1),by(S/2-bh),bx(S-bY1),by(S/2+bh));
  c.strokeStyle=C.line; c.lineWidth=Math.max(1.2,S*0.004);
  const arrow=(x1,y1,x2,y2)=>{
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    const a=Math.atan2(y2-y1,x2-x1), ah=S*0.018;
    c.beginPath();
    c.moveTo(x2,y2); c.lineTo(x2-Math.cos(a-0.5)*ah,y2-Math.sin(a-0.5)*ah);
    c.moveTo(x2,y2); c.lineTo(x2-Math.cos(a+0.5)*ah,y2-Math.sin(a+0.5)*ah);
    c.stroke();
  };
  const off=S*0.17, off2=S*0.34;
  arrow(bx(S/2-off),by(S/2-off),bx(S/2-off2),by(S/2-off2));
  arrow(bx(S/2+off),by(S/2-off),bx(S/2+off2),by(S/2-off2));
  arrow(bx(S/2-off),by(S/2+off),bx(S/2-off2),by(S/2+off2));
  arrow(bx(S/2+off),by(S/2+off),bx(S/2+off2),by(S/2+off2));
  drawRosette(c,x0+S/2,y0+S/2,S);
  for(let i=0;i<240;i++){
    const px2=x0+fr+nr()*(S-fr*2), py2=y0+fr+nr()*(S-fr*2);
    c.fillStyle='rgba(255,248,228,'+(0.04+nr()*0.07)+')';
    c.beginPath(); c.arc(px2,py2,0.4+nr()*0.8,0,TAU); c.fill();
  }
  for(let i=0;i<4;i++){
    const px2=x0+fr+S*(0.2+nr()*0.6), py2=y0+fr+S*(0.2+nr()*0.6), r2=S*(0.05+nr()*0.07);
    const sm=c.createRadialGradient(px2,py2,0,px2,py2,r2);
    sm.addColorStop(0,'rgba(255,250,235,.05)');
    sm.addColorStop(1,'rgba(255,250,235,0)');
    c.fillStyle=sm; c.beginPath(); c.arc(px2,py2,r2,0,TAU); c.fill();
  }
  const vg=c.createRadialGradient(x0+S/2,y0+S/2,S*0.3,x0+S/2,y0+S/2,S*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(40,22,6,.18)');
  c.fillStyle=vg; c.fillRect(x0+fr,y0+fr,S-fr*2,S-fr*2);
}

function resize(){

  ctx.setTransform(dpr,0,0,dpr,0,0);

    const f=BS/prevBS;

    const s=G.bodies.find(b=>b.type==='S');

function update(dt){
  simTime+=dt;
  runTasks();
  if(FX.inter){ FX.inter.t+=dt; if(FX.inter.t>=FX.inter.dur) runInter(); }
  if(G.screen==='game'){
    if(G.phase==='SIM'){
      stepPhysics(dt);
      const fast=CFG.phys.maxV*BS*0.42;
      for(const b of aliveBodies()){
        const v=Math.hypot(b.vx,b.vy);
        if(v>fast&&rng()<0.12) powderPuff(BX+b.x-b.vx/v*b.r,BY+b.y-b.vy/v*b.r,1);
      }
    }
    if(FX.aiSlide){
      const sl=FX.aiSlide;
      sl.t+=dt;
      const p=clamp(sl.t/sl.dur,0,1), e=easeOutQuad(p);
      const u=lerp(sl.from,sl.to,e);
      const s=G.bodies.find(b=>b.type==='S');
      const pos=sidePos(sl.side,u);
      s.x=pos.x; s.y=pos.y;
      G.players[G.cur].lastU=u;
    }
    for(let i=G.sinking.length-1;i>=0;i--){
      const sk=G.sinking[i];
      sk.b.sink-=dt;
      if(sk.b.sink<=0) G.sinking.splice(i,1);
    }
    if(G.phase==='PLACE') G.strikerBlocked=strikerOverlaps();
  }
  updateFx(dt);
}
function updateFx(dt){
  for(let i=FX.parts.length-1;i>=0;i--){ const p=FX.parts[i]; p.t+=dt; if(p.t>=p.ttl){FX.parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; }
  for(let i=FX.parts2.length-1;i>=0;i--){ const p=FX.parts2[i]; p.t+=dt; if(p.t>=p.ttl){FX.parts2.splice(i,1);continue;} p.x+=(p.vx+Math.sin(p.t*4+p.rot)*30)*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; }
  for(let i=FX.texts.length-1;i>=0;i--){ const t=FX.texts[i]; t.t+=dt; t.y-=26*dt; if(t.t>=t.ttl) FX.texts.splice(i,1); }
  for(let i=FX.rings.length-1;i>=0;i--){ const r=FX.rings[i]; r.t+=dt; if(r.t>=r.ttl) FX.rings.splice(i,1); }
  FX.shake=Math.max(0,FX.shake-dt*14);
  FX.boardBounce=Math.max(0,FX.boardBounce-dt*0.8);
  FX.fade=Math.max(0,FX.fade-dt*2.5);
  if(G.phase==='OVER'&&simTime<FX.confettiUntil) spawnConfetti();

let uiButtons=[];
function crown(c,x,y,s,col){
  c.save(); c.fillStyle=col;
  c.beginPath();
  c.moveTo(x-s*0.5,y+s*0.32);
  c.lineTo(x-s*0.5,y-s*0.02);
  c.lineTo(x-s*0.22,y+s*0.06);
  c.lineTo(x,y-s*0.34);
  c.lineTo(x+s*0.22,y+s*0.06);
  c.lineTo(x+s*0.5,y-s*0.02);
  c.lineTo(x+s*0.5,y+s*0.32);
  c.closePath(); c.fill();
  c.restore();
}
function drawCoin(c,x,y,r,type,alpha){
  const col = type==='W'?{a:'#f5eeda',b:'#cdbb92',ring:'#8a744a'}
            : type==='B'?{a:'#4a4038',b:'#241d16',ring:'#0f0b08'}
            :             {a:'#e06058',b:'#a12f28',ring:'#6e1c16'};
  c.save(); c.translate(x,y);
  if(alpha!=null) c.globalAlpha=alpha;
  c.fillStyle='rgba(0,0,0,.32)';
  c.beginPath(); c.ellipse(r*0.12,r*0.16,r*0.98,r*0.9,0,0,TAU); c.fill();
  const g=c.createRadialGradient(-r*0.35,-r*0.35,r*0.15,0,0,r);
  g.addColorStop(0,col.a); g.addColorStop(1,col.b);
  c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
  c.strokeStyle=col.ring; c.lineWidth=Math.max(1,r*0.1);
  c.beginPath(); c.arc(0,0,r*0.68,0,TAU); c.stroke();
  c.lineWidth=Math.max(1,r*0.06);
  c.beginPath(); c.arc(0,0,r*0.42,0,TAU); c.stroke();
  if(type==='Q'){
    crown(c,0,r*0.02,r*0.66,'#f8d8b0');
  }else{
    c.fillStyle='rgba(255,255,255,'+(type==='W'?'.5':'.15')+')';
    c.beginPath(); c.ellipse(-r*0.3,-r*0.32,r*0.22,r*0.12,-0.6,0,TAU); c.fill();
  }
  c.restore();
}
function drawStriker(c,x,y,r,alpha,red){
  c.save(); c.translate(x,y);
  if(alpha!=null) c.globalAlpha=alpha;
  c.fillStyle='rgba(0,0,0,.34)';
  c.beginPath(); c.ellipse(r*0.12,r*0.16,r*1.0,r*0.92,0,0,TAU); c.fill();
  const g=c.createRadialGradient(-r*0.35,-r*0.35,r*0.15,0,0,r);
  if(red){ g.addColorStop(0,'#f6c9b8'); g.addColorStop(1,'#cf8a70'); }
  else{ g.addColorStop(0,'#fdf8ea'); g.addColorStop(1,'#d9c9a4'); }
  c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
  c.strokeStyle=red?'rgba(200,50,40,.85)':'rgba(70,50,25,.55)';
  c.lineWidth=Math.max(2,r*0.16);
  c.beginPath(); c.arc(0,0,r*0.76,0,TAU); c.stroke();
  c.strokeStyle='rgba(0,0,0,.2)'; c.lineWidth=1.5;
  c.beginPath(); c.arc(0,0,r*0.96,0,TAU); c.stroke();
  c.fillStyle='rgba(255,255,255,.65)';
  c.beginPath(); c.ellipse(-r*0.3,-r*0.34,r*0.26,r*0.14,-0.6,0,TAU); c.fill();
  c.fillStyle='rgba(70,50,25,.4)';
  c.beginPath(); c.arc(0,0,r*0.12,0,TAU); c.fill();

}
function drawSlideHandle(){
  if(G.phase!=='PLACE'||!isHuman(G.cur)||paused) return;
  const hg=handleGeom();
  const w=BS*0.13, h=BS*0.056;
  ctx.save();
  ctx.translate(BX+hg.x,BY+hg.y);
  if(!hg.horiz) ctx.rotate(Math.PI/2);
  ctx.fillStyle='rgba(25,16,6,.85)';
  rr(ctx,-w/2,-h/2,w,h,h/2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2;
  rr(ctx,-w/2,-h/2,w,h,h/2); ctx.stroke();
  ctx.fillStyle='#ffffff';
  const ch=h*0.28;
  const tri=(x,dir)=>{
    ctx.beginPath();
    ctx.moveTo(x+dir*ch,0);
    ctx.lineTo(x-dir*ch*0.7,-ch*0.85);
    ctx.lineTo(x-dir*ch*0.7,ch*0.85);
    ctx.closePath(); ctx.fill();
  };
  tri(-w*0.28,-1);
  tri(w*0.28,1);
  ctx.restore();
  const side=G.sides[G.cur], u=G.players[G.cur].lastU;
  const a=sidePos(side,clamp(u-0.12,0,1)), b=sidePos(side,clamp(u+0.12,0,1));

  ctx.beginPath(); ctx.moveTo(BX+a.x,BY+a.y); ctx.lineTo(BX+b.x,BY+b.y); ctx.stroke();
  ctx.restore();
}
function drawAimDots(){
  if(!(dragMode==='aim'&&aimDir&&G.phase==='PLACE')) return;
  const s=G.bodies.find(b=>b.type==='S');
  const sx=s.x, sy=s.y;
  const len=CFG.aim.guideLen*BS;
  const ray=castRay(sx,sy,aimDir.x,aimDir.y,len);
  const gap=CFG.aim.dotGap*BS, dr=CFG.aim.dotR*BS;
  const start=GEO.strikerR+3;
  ctx.save();
  for(let d=start;d<=ray.t;d+=gap){
    const k=clamp((d-start)/Math.max(1,ray.t-start),0,1);
    const a=0.85*Math.pow(1-k,1.35)+0.05;
    ctx.globalAlpha=a;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(BX+sx+aimDir.x*d, BY+sy+aimDir.y*d, dr*(1-k*0.35), 0, TAU);
    ctx.fill();
  }
  if(ray.hit){
    const hx=sx+aimDir.x*ray.t, hy=sy+aimDir.y*ray.t;
    ctx.globalAlpha=0.85;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(BX+hx,BY+hy,ray.hit.r*0.9,0,TAU); ctx.stroke();
    let gx=ray.hit.x-hx, gy=ray.hit.y-hy;
    const gl=Math.hypot(gx,gy)||1; gx/=gl; gy/=gl;
    const gLen=CFG.aim.ghostLen*BS;
    ctx.fillStyle='#ffe9a8';
    for(let d=GEO.coinR+4;d<=gLen;d+=gap*0.8){
      const k=d/gLen;
      ctx.globalAlpha=0.7*(1-k)+0.08;
      ctx.beginPath();
      ctx.arc(BX+ray.hit.x+gx*d, BY+ray.hit.y+gy*d, dr*0.85, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  if(dragStart){
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(BX+sx,BY+sy); ctx.lineTo(dragStart.x,dragStart.y); ctx.stroke();
  }
  ctx.restore();
  drawPowerBar();
}
function drawPowerBar(){
  const h=BS*0.3, w=10;
  const x=BX+BS-w-10, y=BY+BS/2-h/2;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.4)'; rr(ctx,x-2,y-2,w+4,h+4,6); ctx.fill();
  const fh=Math.max(2,h*aimPower);
  const grad=ctx.createLinearGradient(0,y+h,0,y+h-fh);
  grad.addColorStop(0,forceColor(aimPower*0.35));
  grad.addColorStop(1,forceColor(aimPower));
  ctx.fillStyle=grad;
  rr(ctx,x,y+h-fh,w,fh,4); ctx.fill();
  ctx.restore();
}
function drawBoard(){
  ctx.save();
  const bsc=FX.boardBounce>0?1+0.04*Math.sin(simTime*20)*FX.boardBounce:1;
  if(bsc!==1){ ctx.translate(BX+BS/2,BY+BS/2); ctx.scale(bsc,bsc); ctx.translate(-(BX+BS/2),-(BY+BS/2)); }
  if(BG) ctx.drawImage(BG,0,0,W,H);
  drawSlideHandle();
  for(const b of G.bodies){
    if(!b.alive||b.type==='S') continue;
    const pop=1+(b.pop||0)*0.25;
    drawCoin(ctx,BX+b.x,BY+b.y,b.r*pop,b.type);
  }
  for(const sk of G.sinking){
    const b=sk.b;
    const t=1-clamp(b.sink/CFG.fx.sinkTime,0,1);
    const e=easeInQuad(t);
    ctx.save();
    ctx.beginPath();
    ctx.arc(BX+sk.px,BY+sk.py,GEO.pocketR*0.98,0,TAU);
    ctx.clip();
    const ang0=Math.atan2(sk.sy-sk.py,sk.sx-sk.px);
    const r0=Math.min(Math.hypot(sk.sx-sk.px,sk.sy-sk.py),GEO.pocketR*0.6);
    const rr2=lerp(r0,GEO.pocketR*0.1,e);
    const ang=ang0+t*2.4;
    const x=BX+sk.px+Math.cos(ang)*rr2;
    const y=BY+sk.py+Math.sin(ang)*rr2;
    if(b.type==='S') drawStriker(ctx,x,y,Math.max(2,GEO.strikerR*(1-e*0.8)),1-e*0.5,false);
    else drawCoin(ctx,x,y,GEO.coinR*(1-e*0.8),b.type,1-e*0.55);
    ctx.restore();
  }
  const s=G.bodies.find(b=>b.type==='S');
  const idle=(G.phase==='PLACE'||G.phase==='AI_SLIDE');
  if(s&&(s.alive||idle)){
    const x=BX+s.x, y=BY+s.y;
    const canPlace=G.phase==='PLACE'&&isHuman(G.cur)&&!paused;
    drawStriker(ctx,x,y,GEO.strikerR,null,G.strikerBlocked);
    if(canPlace){
      ctx.save();
      if(G.strikerBlocked){
        ctx.strokeStyle='#ff5656';
        ctx.globalAlpha=0.55+0.3*Math.sin(simTime*9);
      }else{
        ctx.strokeStyle='rgba(255,255,255,.75)';
        ctx.globalAlpha=0.45+0.25*Math.sin(simTime*5);
      }
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y,GEO.strikerR*1.5,0,TAU); ctx.stroke();
      ctx.restore();
    }
  }
  drawAimDots();
  for(const r of FX.rings){
    const t=Math.min(1,r.t/r.ttl);
    ctx.save();
    const rr2=Math.max(0,lerp(r.r0,r.r1,easeOutQuad(t)));
    if(r.fill){
      ctx.globalAlpha=Math.max(0,(1-t)*0.5);
      ctx.fillStyle=r.c;
      ctx.beginPath(); ctx.arc(r.x,r.y,rr2,0,TAU); ctx.fill();
    }else{
      ctx.globalAlpha=Math.max(0,1-t);
      ctx.strokeStyle=r.c; ctx.lineWidth=r.lw*(1-t*0.5);
      ctx.beginPath(); ctx.arc(r.x,r.y,rr2,0,TAU); ctx.stroke();
    }
    ctx.restore();
  }
  for(const p of FX.parts){
    ctx.globalAlpha=Math.max(0,1-p.t/p.ttl); ctx.fillStyle=p.c;
    if(p.rect){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.t*8); ctx.fillRect(-p.s,-p.s*0.6,p.s*2,p.s*1.2); ctx.restore(); }
    else{ ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0,p.s),0,TAU); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawSideBox(seat){
  const t=G.teams[teamIdxOf(seat)]; if(!t) return;
  const side=G.sides[seat];
  const active=G.cur===seat&&G.phase!=='OVER';
  const dead=!t.alive;
  const business=G.modeKind==='business';
  ctx.font='800 10px '+FONT;
  const nameW=ctx.measureText(seatLabel(seat)).width;
  let row2W;
  if(business){
    ctx.font='900 13px '+FONT;
    row2W=ctx.measureText('₹'+t.bank).width;
  }else{
    row2W=t.needed*11+(t.queen?16:0);
  }
  const w=Math.max(86,Math.max(nameW,row2W)+26), h=boxH;
  const gap=5;
  let cx,cy,rot=0;
  if(side===0){ cx=BX+BS/2; cy=BY+BS+h/2+gap; }
  else if(side===2){ cx=BX+BS/2; cy=BY-h/2-gap; }
  else if(side===1){ cx=BX+BS+w/2+gap; cy=BY+BS/2; rot=Math.PI/2; }
  else{ cx=BX-w/2-gap; cy=BY+BS/2; rot=-Math.PI/2; }
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.globalAlpha=dead?0.4:1;
  ctx.fillStyle='rgba(12,7,2,.82)';
  rr(ctx,-w/2,-h/2,w,h,9); ctx.fill();
  ctx.strokeStyle=active?'rgba(255,255,255,.92)':'rgba(255,255,255,.22)';
  ctx.lineWidth=active?2:1.2;
  rr(ctx,-w/2,-h/2,w,h,9); ctx.stroke();
  ctx.fillStyle=active?'#fff':'rgba(255,255,255,.82)';
  ctx.font='800 10px '+FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(trunc(ctx,seatLabel(seat)+(dead?' ✕':''),w-12),0,-h*0.22);
  if(business){
    ctx.fillStyle=active?C.gold:'rgba(255,215,94,.8)';
    ctx.font='900 13px '+FONT;
    ctx.fillText('₹'+t.bank,0,h*0.26);
  }else{
    const n=t.needed, pw=Math.min(11,(w-20)/n);
    const total=n*pw, startX=-total/2+pw/2;
    for(let k=0;k<n;k++){
      ctx.beginPath(); ctx.arc(startX+k*pw,h*0.26,Math.min(3.4,pw*0.36),0,TAU);
      if(k<t.pocketed){
        ctx.fillStyle=t.coin==='B'?'#4a4038':'#efe3c8';
        ctx.fill(); ctx.strokeStyle='#8a744a'; ctx.lineWidth=1;
      }else{
        ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1;
      }
      ctx.stroke();
    }
    if(t.queen){
      ctx.font='900 9px '+FONT;
      ctx.fillStyle=C.gold;
      ctx.fillText('♛',total/2+pw*0.7+5,h*0.26);
    }
  }
  ctx.restore();
}

/* ============================================================
   TUTORIAL SCREEN — real mini-physics sims (launch, no control)
============================================================ */
function tPh(t,a,b){ return clamp((t-a)/(b-a),0,1); }
const TSIM={key:null,kind:null,x0:0,y0:0,S:0,t:0,dur:5,bodies:[],sink:[],fired:false,
            script:[],st:0,sIndex:0,sliding:false,slT:0,slDur:0,slFrom:0,slTo:0,slDone:0,
            holdStart:-1,aimDir:null};
function tsBuild(kind,x0,y0,S){
  const R=S*0.030,SR=S*0.042,fr=S*0.048;
  const bl=S-fr-S*0.088, half=S*0.29, inset=S*0.105;
  TSIM.kind=kind;TSIM.x0=x0;TSIM.y0=y0;TSIM.S=S;TSIM.t=0;
  TSIM.bodies=[];TSIM.sink=[];TSIM.fired=false;
  TSIM.bl=bl;TSIM.half=half;TSIM.R=R;TSIM.SR=SR;TSIM.pr=S*0.056;
  TSIM.pks=[{x:inset,y:inset},{x:S-inset,y:inset},{x:inset,y:S-inset},{x:S-inset,y:S-inset}];
  TSIM.script=[];TSIM.sIndex=0;TSIM.sliding=false;TSIM.slT=0;TSIM.slDone=0;TSIM.aimDir=null;
  TSIM.holdStart=-1;
  const mk=(t2,x,y,al)=>{const b={t:t2,x,y,vx:0,vy:0,r:t2==='S'?SR:R,m:t2==='S'?CFG.phys.strikerMass:CFG.phys.coinMass,alive:true,al:al==null?1:al,ignore:false};TSIM.bodies.push(b);return b;};
  const striker=()=>{ TSIM.st=mk('S',S/2,bl); return TSIM.st; };
  // Aim helper: given the target coin, a pocket and a shot speed, compute the
  // striker spot + direction so that a REAL launch (pure physics afterwards)
  // pockets the coin. Power is solved so momentum survives the travel.
  TSIM.aim=(coin,pk,speed)=>{
    const dx=coin.x-pk.x, dy=coin.y-pk.y, dl=Math.hypot(dx,dy);
    const ux=dx/dl, uy=dy/dl;
    const c2={x:coin.x-ux*(SR+R), y:coin.y-uy*(SR+R)};
    const d2=(bl-pk.y)/uy;
    const sx=pk.x+ux*d2;
    const spot={x:sx,y:bl};
    const slU=clamp((sx-S/2)/(2*half)+0.5,0.06,0.94);
    const dirx=(c2.x-sx), diry=(c2.y-bl);
    const dl2=Math.hypot(dirx,diry);
    return {spot,c2,dx:dirx/dl2,dy:diry/dl2,slU,
      power:clamp(speed*0.5+dl2/(S*6),0.5,0.92)};
  };
  const shoot=(u,dir,power)=>{
    TSIM.sliding=true; TSIM.slT=0;
    TSIM.slDur=0.55;
    TSIM.slFrom=G.st.lastU!=null?G.st.lastU:0.5;
    TSIM.slTo=u; TSIM.slDone=power;
    TSIM.aimDir=dir;
  };
  TSIM.st=striker();
  if(kind==='slide'){
    mk('Q',S/2,S/2);
    for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;mk(i%2===0?'W':'B',S/2+Math.cos(a)*(R*2+0.2),S/2+Math.sin(a)*(R*2+0.2));}
    for(let i=0;i<12;i++){const a=-Math.PI/2+TAU/24+i*TAU/12;mk(i%2===0?'B':'W',S/2+Math.cos(a)*(R*4+0.4),S/2+Math.sin(a)*(R*4+0.4));}
    // aim at a coin on the flower: pocket TL, coin at left of the ring
    const coin={x:S*0.5-R*2-0.2,y:S/2};
    const a=TSIM.aim(coin,TSIM.pks[0],0.95);
    G.st.lastU=a.slU;
    TSIM.shoot=a;
    TSIM.dur=6.0;
  }else if(kind==='assign'){
    striker();
    const pk={x:0.895*S,y:0.105*S};
    const coin={x:S*0.56,y:S*0.52};
    const a=TSIM.aim(coin,pk,0.85);
    G.st.lastU=a.slU;
    TSIM.shoot=a;
    const sc=[[0.26,0.26,'Q'],[0.22,0.52,'B'],[0.40,0.40,'B'],[0.16,0.70,'W'],[0.54,0.28,'B'],[0.46,0.20,'W'],[0.30,0.66,'B'],[0.66,0.36,'W'],[0.36,0.58,'B'],[0.86,0.47,'B'],[0.55,0.70,'W'],[0.72,0.28,'B']];
    for(const c2 of sc) mk(c2[2],c2[0]*S,c2[1]*S,0.35);
    TSIM.dur=6.6;
  }else if(kind==='queen'){
    striker();
    // queen + cover coin placed at an angle near the top-right pocket;
    // one real launch into the pair pockets BOTH (physics does the work)
    const pk={x:0.895*S,y:0.105*S};
    const near=SR*2+R*2;
    const dirA=-2.55;
    const queen={x:pk.x+Math.cos(dirA)*near, y:pk.y+Math.sin(dirA)*near};
    const coverOff=2.35;
    const cover={x:queen.x+Math.cos(dirA+coverOff)*R*2.05, y:queen.y+Math.sin(dirA+coverOff)*R*2.05};
    const a=TSIM.aim(queen,pk,1.0);
    TSIM.qB=mk('Q',queen.x,queen.y);
    TSIM.wB=mk('W',cover.x,cover.y);
    G.st.lastU=a.slU;
    TSIM.shoot=a;
    TSIM.dur=6.6;
  }else if(kind==='foul'){
    striker();
    for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;mk(i%2===0?'W':'B',S/2+Math.cos(a)*(R*2+0.2),S/2+Math.sin(a)*(R*2+0.2),0.3);}
    for(let i=0;i<12;i++){const a=-Math.PI/2+TAU/24+i*TAU/12;mk(i%2===0?'B':'W',S/2+Math.cos(a)*(R*4+0.4),S/2+Math.sin(a)*(R*4+0.4),0.3);}
    // keyframed slide to the top-left pocket is safe: this shot is aimed
    // straight at the pocket, so physics carries the striker in.
    const pk={x:0.105*S,y:0.105*S};
    const slU=clamp((S*0.34-S/2)/(2*half)+0.5,0.06,0.94);
    G.st.lastU=slU;
    TSIM.shoot={slU,dx:(pk.x-S*0.34),dy:(pk.y-bl),power:0.8};
    TSIM.dur=5.8;
  }else if(kind==='value'){
    striker();
    // three coins on a horizontal line with value tags
    const y=S*0.46;
    TSIM.tags=[{x:S*0.36,y,type:'B',v:'₹10'},{x:S*0.5,y,type:'W',v:'₹20'},{x:S*0.64,y,type:'Q',v:'₹50'}];
    TSIM.tB=mk('B',S*0.36,y);
    TSIM.wB=mk('W',S*0.5,y);
    TSIM.qB=mk('Q',S*0.64,y);
    const a=TSIM.aim({x:S*0.5,y},TSIM.pks[0],0.9);
    G.st.lastU=a.slU;
    TSIM.shoot=a;
    TSIM.dur=6.2;
  }else if(kind==='extra'){
    striker();
    const y1=S*0.46;
    TSIM.w1=mk('W',S*0.52,y1);
    const pk1={x:0.895*S,y:0.105*S};
    const a1=TSIM.aim({x:S*0.52,y:y1},pk1,0.85);
    G.st.lastU=a1.slU;
    TSIM.shoot1=a1;
    // second shot: black coin
    const y2=S*0.44;
    TSIM.b1=mk('B',S*0.48,y2);
    const pk2={x:0.105*S,y:0.105*S};
    const a2=TSIM.aim({x:S*0.48,y:y2},pk2,0.85);
    TSIM.shoot2=a2;
    TSIM.dur=7.6;
    TSIM.stage=0;
  }else{
    TSIM.dur=5;
  }
}
function tsEnsure(kind,x0,y0,S){
  const key=kind+'|'+x0+'|'+y0+'|'+S;
  if(TSIM.key!==key){ TSIM.key=key; tsBuild(kind,x0,y0,S); }
}
function tsPhys(dt){
  const P=CFG.phys,S=TSIM.S,lo=S*0.048,hi=S-S*0.048;
  const stopV=P.stopSpeed*S,linF=P.fric*S,damp=Math.exp(-P.damping*dt);
  for(const b of TSIM.bodies){
    if(!b.alive) continue;
    b.vx*=damp;b.vy*=damp;
    let sp=Math.hypot(b.vx,b.vy);
    if(sp>0){const ns=Math.max(0,sp-linF*dt);const k=ns/sp;b.vx*=k;b.vy*=k;sp=ns;}
    if(sp<stopV){b.vx=0;b.vy=0;sp=0;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    for(const p of TSIM.pks){
      const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);
      if(d<TSIM.pr*P.pocketCapture){
        b.alive=false;TSIM.sink.push({type:b.t,sx:b.x,sy:b.y,pk:p,prog:0});
        if(b.t==='Q') SFX.play('queen'); else SFX.play('pocket');
        break;
      }
      if(d<TSIM.pr*P.pocketWell&&d>0.001){
        const pull=P.wellPull*S*dt;
        b.vx+=(dx/d)*pull;b.vy+=(dy/d)*pull;
        b.vx*=P.wellDrag;b.vy*=P.wellDrag;
      }
    }
    if(!b.alive) continue;
    if(b.x<lo+b.r){b.x=lo+b.r;if(b.vx<0)b.vx*=-P.restWall;}
    else if(b.x>hi-b.r){b.x=hi-b.r;if(b.vx>0)b.vx*=-P.restWall;}
    if(b.y<lo+b.r){b.y=lo+b.r;if(b.vy<0)b.vy*=-P.restWall;}
    else if(b.y>hi-b.r){b.y=hi-b.r;if(b.vy>0)b.vy*=-P.restWall;}
  }
  const act=TSIM.bodies.filter(b=>b.alive);
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i],b=act[j];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.0001,rs=a.r+b.r;
    if(d>=rs) continue;
    const nx=dx/d,ny=dy/d,im1=1/a.m,im2=1/b.m,imt=im1+im2,ov=rs-d;
    a.x-=nx*ov*(im1/imt);a.y-=ny*ov*(im1/imt);
    b.x+=nx*ov*(im2/imt);b.y+=ny*ov*(im2/imt);
    const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(vn>=0) continue;
    const jimp=-(1+P.restCoin)*vn/imt;
    a.vx-=jimp*nx*im1;a.vy-=jimp*ny*im1;
    b.vx+=jimp*nx*im2;b.vy+=jimp*ny*im2;
    const imp=clamp(-vn/(P.maxV*S*0.5),0,1);
    if(imp>0.1) SFX.play('clack',{v:imp});
  }
}
function tsLaunch(){
  const a=TSIM.shoot, st=TSIM.st;
  st.x=S()/2+(a.slU-0.5)*2*TSIM.half; st.y=TSIM.bl;
  st.alive=true;
  st.vx=a.dx*a.power*CFG.phys.maxV*S();
  st.vy=a.dy*a.power*CFG.phys.maxV*S();
  TSIM.fired=true;
  SFX.play('flick');
}
function S(){ return TSIM.S; }
function tsTick(dt){
  if(!TSIM.kind) return;
  TSIM.t+=dt;
  if(TSIM.t>=TSIM.dur){ tsBuild(TSIM.kind,TSIM.x0,TSIM.y0,TSIM.S); return; }
  const t=TSIM.t,S=TSIM.S,bl=TSIM.bl,half=TSIM.half,st=TSIM.st;
  for(const sk of TSIM.sink) sk.prog=Math.min(1,sk.prog+dt/0.4);
  TSIM.sink=TSIM.sink.filter(s2=>s2.prog<1);
  // striker slide phase -> launch -> pure physics, zero control
  if(TSIM.sliding&&!TSIM.fired){
    TSIM.slT+=dt;
    const p=clamp(TSIM.slT/TSIM.slDur,0,1);
    const u=lerp(TSIM.slFrom,TSIM.slTo,easeInOutQ(p));
    st.x=S/2+(u-0.5)*2*half; st.y=bl;
    if(p>=1){
      TSIM.sliding=false;
      st.x=S/2+(TSIM.slTo-0.5)*2*half; st.y=bl;
      st.alive=true;
      st.vx=TSIM.aimDir.x*TSIM.slDone*CFG.phys.maxV*S;
      st.vy=TSIM.aimDir.y*TSIM.slDone*CFG.phys.maxV*S;
      TSIM.fired=true;
      SFX.play('flick');
    }
    return;
  }
  if(TSIM.fired){
    tsPhys(dt*0.5); // slow motion
    return;
  }
  // not yet launched: handle the per-kind schedule
  if(TSIM.kind==='foul'){
    // foul: aim straight at the top-left pocket; the striker sinks itself
    const pk={x:0.105*S,y:0.105*S};
    if(TSIM.sliding||TSIM.fired) return;
    const u=clamp((S*0.34-S/2)/(2*half)+0.5,0.06,0.94);
    st.x=S/2+(u-0.5)*2*half; st.y=bl;
    TSIM.sliding=true; TSIM.slT=0; TSIM.slDur=0.55;
    TSIM.slFrom=st.lastU!=null?0.5:0.5; TSIM.slFrom=0.5;
    TSIM.slTo=u; TSIM.slDone=0.62;
    TSIM.aimDir={x:(pk.x-S*0.34),y:(pk.y-bl)};
    const dl=Math.hypot(TSIM.aimDir.x,TSIM.aimDir.y);
    TSIM.aimDir.x/=dl; TSIM.aimDir.y/=dl;
  }
}
function tsDrawSink(sk){
  const e=easeInQuad(sk.prog);
  ctx.save();
  ctx.beginPath(); ctx.arc(TSIM.x0+sk.pk.x,TSIM.y0+sk.pk.y,TSIM.pr*0.98,0,TAU); ctx.clip();
  const ang0=Math.atan2(sk.sy-sk.pk.y,sk.sx-sk.pk.x);
  const r0=Math.min(Math.hypot(sk.sx-sk.pk.x,sk.sy-sk.pk.y),TSIM.pr*0.6);
  const rr2=lerp(r0,TSIM.pr*0.1,e);
  const ang=ang0+sk.prog*2.4;
  const x=TSIM.x0+sk.pk.x+Math.cos(ang)*rr2;
  const y=TSIM.y0+sk.pk.y+Math.sin(ang)*rr2;
  if(sk.type==='S') drawStriker(ctx,x,y,Math.max(2,TSIM.SR*(1-e*0.8)),1-e*0.5,false);
  else drawCoin(ctx,x,y,TSIM.R*(1-e*0.8),sk.type,1-e*0.55);
  ctx.restore();
}
function tutAssignChips(x0,y0,S,prog){
  const e=easeOutBack(clamp(prog,0,1));
  const draw=(cx,cy,type,label)=>{
    ctx.save();
    ctx.translate(cx,cy); ctx.scale(e,e);
    ctx.fillStyle='rgba(12,7,2,.88)';
    rr(ctx,-48,-17,96,34,17); ctx.fill();
    ctx.strokeStyle=type==='W'?'#efe3c8':'rgba(120,108,96,.95)'; ctx.lineWidth=1.5;
    rr(ctx,-48,-17,96,34,17); ctx.stroke();
    drawCoin(ctx,-30,0,9.5,type);
    ctx.fillStyle='#fff'; ctx.font='800 9px '+FONT;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(label,-15,-6.5);
    ctx.font='700 8px '+FONT;
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.fillText(type==='W'?'YOURS':'RIVAL',-15,7);
    ctx.restore();
  };
  draw(x0+S*0.30,y0+S*0.20,'W','WHITE');
  draw(x0+S*0.70,y0+S*0.20,'B','BLACK');
}
function drawTutScene(x0,y0,S,kind){
  drawBoardSurface(ctx,x0,y0,S);
  if(kind==='slide'||kind==='assign'||kind==='queen'||kind==='foul'||kind==='value'||kind==='extra'){
    tsEnsure(kind,x0,y0,S);
    const t=TSIM.t;
    // live physics sim for every shot card
    for(const b of TSIM.bodies){
      if(!b.alive||b.t==='S') continue;
      drawCoin(ctx,x0+b.x,y0+b.y,b.r,b.t,b.al);
    }
    for(const sk of TSIM.sink) tsDrawSink(sk);
    const st=TSIM.st;
    if(st){
      const showAim=TSIM.sliding&&TSIM.aimDir;
      if(showAim){
        ctx.save();
        ctx.globalAlpha=0.6;
        ctx.fillStyle='#fff';
        for(let d=1;d<=4;d++){
          ctx.beginPath();
          ctx.arc(x0+st.x+TSIM.aimDir.x*(TSIM.SR+10+d*13),y0+st.y+TSIM.aimDir.y*(TSIM.SR+10+d*13),2.5-d*0.2,0,TAU);
          ctx.fill();
        }
        ctx.restore();
      }
      if(!TSIM.fired){
        drawStriker(ctx,x0+st.x,y0+st.y,TSIM.SR,null,false);
        const pu=0.5+0.5*Math.sin(simTime*5);
        ctx.save();
        ctx.strokeStyle=TSIM.kind==='foul'?'rgba(255,138,128,'+(0.4+0.3*pu)+')':'rgba(255,255,255,'+(0.4+0.3*pu)+')';
        ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(x0+st.x,y0+st.y,TSIM.SR*1.5,0,TAU); ctx.stroke();
        ctx.restore();
        if(TSIM.sliding){
          const hx=x0+st.x, hy=y0+TSIM.bl+S*0.045;
          ctx.save();
          ctx.fillStyle='rgba(25,16,6,.85)';
          rr(ctx,hx-S*0.06,hy-S*0.026,S*0.12,S*0.052,S*0.026); ctx.fill();
          ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.5;
          rr(ctx,hx-S*0.06,hy-S*0.026,S*0.12,S*0.052,S*0.026); ctx.stroke();
          ctx.restore();
        }
      }else{
        drawStriker(ctx,x0+st.x,y0+st.y,TSIM.SR,null,false);
      }
    }
    // per-scene overlays
    if(kind==='assign'){
      const wb=TSIM.wB;
      if(!wb.alive&&t>=1.9) tutAssignChips(x0,y0,S,tPh(t,1.9,2.9));
      if(t>=3.6){
        ctx.save();
        ctx.font='800 9.5px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=Math.min(1,(t-3.6)/0.2);
        ctx.fillStyle='rgba(255,255,255,.85)';
        ctx.fillText('THE OTHER COLOUR GOES TO YOUR RIVAL',x0+S/2,y0+S*0.84);
        ctx.restore();
      }
    }
    if(kind==='queen'){
      const q=TSIM.qB, w=TSIM.wB;
      if(!q.alive&&!w.alive&&t>=2.6){
        ctx.save();
        ctx.font='900 12px '+FONT; ctx.fillStyle=C.gold;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=Math.min(1,(t-2.6)/0.2);
        ctx.fillText('QUEEN COVERED ✓',x0+S/2,y0+S*0.24);
        ctx.restore();
      }
    }
    if(kind==='foul'&&TSIM.fired&&TSIM.sink.some(s2=>s2.type==='S')&&TSIM.t>=2.4){
      ctx.save();
      ctx.font='900 12px '+FONT; ctx.fillStyle='#ff8a80';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.globalAlpha=Math.min(1,(TSIM.t-2.4)/0.15);
      ctx.fillText('FOUL',x0+S*0.36,y0+S*0.5);
      ctx.restore();
    }
    if(kind==='foul'&&TSIM.t>=3.4){
      const rp=tPh(TSIM.t,3.4,4.4);
      const cx2=x0+S/2, cy2=lerp(y0+S*0.94,y0+S/2,easeInOutQ(rp));
      if(rp<1){
        drawCoin(ctx,cx2,cy2,TSIM.R,'W');
      }else{
        drawCoin(ctx,cx2,cy2,TSIM.R,'W');
        ctx.save();
        ctx.strokeStyle='rgba(255,255,255,'+(0.8*(1-tPh(TSIM.t,4.4,4.9)))+')'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cx2,cy2,TSIM.R*(1+tPh(TSIM.t,4.4,4.9)*1.3),0,TAU); ctx.stroke();
        ctx.font='800 9px '+FONT; ctx.fillStyle='rgba(255,255,255,.85)';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('COIN RETURNS',cx2,cy2+TSIM.R*2.3);
        ctx.restore();
      }
    }
    if(kind==='value'){
      // value tags on the three coins
      ctx.save();
      ctx.font='900 10px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
      for(const tg of (TSIM.tags||[])){
        const live=(tg.type==='B'&&TSIM.tB.alive)||(tg.type==='W'&&TSIM.wB.alive)||(tg.type==='Q'&&TSIM.qB.alive);
        if(!live) continue;
        ctx.fillStyle='rgba(12,7,2,.85)';
        rr(ctx,x0+tg.x-17,y0+tg.y-TSIM.R*2.6-9,34,18,9); ctx.fill();
        ctx.strokeStyle=tg.type==='Q'?C.gold:'#efe3c8'; ctx.lineWidth=1; rr(ctx,x0+tg.x-17,y0+tg.y-TSIM.R*2.6-9,34,18,9); ctx.stroke();
        ctx.fillStyle=tg.type==='Q'?C.gold:'#efe3c8';
        ctx.fillText(tg.v,x0+tg.x,y0+tg.y-TSIM.R*2.6+0.5);
      }
      // bank pill fills when the white coin drops
      const bk=Math.round(lerp(0,20,TSIM.wB.alive?0:1));
      ctx.fillStyle='#2a1c0e'; rr(ctx,x0+S/2-40,y0+S*0.16-13,80,26,13); ctx.fill();
      ctx.strokeStyle=C.gold; ctx.lineWidth=1.2; rr(ctx,x0+S/2-40,y0+S*0.16-13,80,26,13); ctx.stroke();
      ctx.fillStyle=C.gold; ctx.font='900 12px '+FONT;
      ctx.fillText('BANK ₹'+bk,x0+S/2,y0+S*0.16+0.5);
      ctx.restore();
    }
    if(kind==='extra'){
      // two real shots, staged
      const w1=TSIM.w1, b1=TSIM.b1;
      if(TSIM.stage===0){
        if(!w1.alive&&TSIM.fired){
          TSIM.stage=1;
          TSIM.holdStart=TSIM.t;
        }
      }else if(TSIM.stage===1){
        if(TSIM.t>TSIM.holdStart+1.0){
          // stage 2: re-slide to the black coin shot
          TSIM.stage=2;
          TSIM.fired=false;
          TSIM.sliding=true; TSIM.slT=0; TSIM.slDur=0.55;
          TSIM.slFrom=0.5; TSIM.slTo=TSIM.shoot2.slU;
          TSIM.slDone=TSIM.shoot2.power;
          TSIM.aimDir={x:TSIM.shoot2.dx,y:TSIM.shoot2.dy};
        }
      }else if(TSIM.stage===2){
        if(TSIM.slT>=TSIM.slDur){
          const st2=TSIM.st;
          st2.x=S/2+(TSIM.slTo-0.5)*2*TSIM.half; st2.y=TSIM.bl;
          st2.alive=true;
          st2.vx=TSIM.aimDir.x*TSIM.slDone*CFG.phys.maxV*S;
          st2.vy=TSIM.aimDir.y*TSIM.slDone*CFG.phys.maxV*S;
          TSIM.fired=true;
          TSIM.sliding=false;
          SFX.play('flick');
        }
      }
      if(!w1.alive||!b1.alive){
        ctx.save();
        ctx.font='900 11px '+FONT; ctx.fillStyle=C.gold;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=0.6+0.4*Math.sin(simTime*6);
        ctx.fillText('+1 SHOT',x0+S*0.5,y0+S*0.20);
        ctx.restore();
      }
    }
    return;
  }
  /* classic non-sim scenes reuse the simulated slide card's engine too */
  const R=S*0.030, SR=S*0.042;
  const inset=S*0.105, pr=S*0.056;
  const bx=x=>x0+x, by=y=>y0+y;
  const t=(simTime%4.2)/4.2;
  function flowerIn2(wA,bA,hideQ){
    const cx=x0+S/2, cy=y0+S/2;
    if(!hideQ) drawCoin(ctx,cx,cy,R,'Q');
    for(let i=0;i<6;i++){
      const a=-Math.PI/2+i*TAU/6;
      const t2=i%2===0?'W':'B';
      drawCoin(ctx,cx+Math.cos(a)*(R*2+0.2),cy+Math.sin(a)*(R*2+0.2),R,t2,t2==='W'?wA:bA);
    }
    for(let i=0;i<12;i++){
      const a=-Math.PI/2+TAU/24+i*TAU/12;
      const t2=i%2===0?'B':'W';
      drawCoin(ctx,cx+Math.cos(a)*(R*4+0.4),cy+Math.sin(a)*(R*4+0.4),R,t2,t2==='W'?wA:bA);
    }
  }
  function tutAssignChips2(prog){
    const e=easeOutBack(clamp(prog,0,1));
    const draw=(cx,cy,type,label)=>{
      ctx.save();
      ctx.translate(cx,cy); ctx.scale(e,e);
      ctx.fillStyle='rgba(12,7,2,.88)';
      rr(ctx,-48,-17,96,34,17); ctx.fill();
      ctx.strokeStyle=type==='W'?'#efe3c8':'rgba(120,108,96,.95)'; ctx.lineWidth=1.5;
      rr(ctx,-48,-17,96,34,17); ctx.stroke();
      drawCoin(ctx,-30,0,9.5,type);
      ctx.fillStyle='#fff'; ctx.font='800 9px '+FONT;
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(label,-15,-6.5);
      ctx.font='700 8px '+FONT;
      ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.fillText(type==='W'?'YOURS':'RIVAL',-15,7);
      ctx.restore();
    };
    draw(x0+S*0.30,y0+S*0.20,'W','WHITE');
    draw(x0+S*0.70,y0+S*0.20,'B','BLACK');
  }
  if(kind==='nine'){
    flowerIn2(1,1,false);
    tutAssignChips2(tPh(t,0.02,0.14));
    drawCoin(ctx,bx(S*0.52),by(S*0.62),R,'W');
    const pulse=0.5+0.5*Math.sin(simTime*5);
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,'+(0.4+0.35*pulse)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx(S*0.52),by(S*0.62),R*1.6,0,TAU); ctx.stroke();
    ctx.restore();
    if(t>=0.62){
      const cnt=t>=0.86?4:3;
      ctx.save();
      const pu=t>=0.86?1+0.25*Math.sin(Math.min(1,(t-0.86)/0.06)*Math.PI):1;
      ctx.translate(bx(S*0.30),by(S*0.20)+26); ctx.scale(pu,pu);
      ctx.fillStyle='rgba(12,7,2,.85)'; rr(ctx,-24,-9,48,18,9); ctx.fill();
      ctx.strokeStyle=C.gold; ctx.lineWidth=1; rr(ctx,-24,-9,48,18,9); ctx.stroke();
      ctx.fillStyle=C.gold; ctx.font='900 9px '+FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(cnt+'/9',0,0.5);
      ctx.restore();
    }
  }else if(kind==='free'){
    flowerIn2(0.85,0.85,false);
    const chips=[[0.5,0.895,'YOU'],[0.895,0.5,'OPPONENT 1'],[0.5,0.105,'OPPONENT 2'],[0.105,0.5,'OPPONENT 3']];
    const cols=SEAT.map(s2=>s2.accent);
    chips.forEach((c2,i)=>{
      ctx.save();
      ctx.fillStyle='rgba(12,7,2,.8)';
      rr(ctx,bx(c2[0])-26,by(c2[1])-10,52,20,10); ctx.fill();
      ctx.strokeStyle=cols[i]; ctx.lineWidth=1.5;
      rr(ctx,bx(c2[0])-26,by(c2[1])-10,52,20,10); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='800 7px '+FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(c2[2],bx(c2[0]),by(c2[1])+0.5);
      ctx.restore();
    });
  }else if(kind==='pot'){
    flowerIn2(0.6,0.6,true);
    const coins=[];
    const cx=x0+S/2, cy=y0+S/2;
    coins.push([cx,cy,'Q']);
    for(let i=0;i<6;i++){
      const a=-Math.PI/2+i*TAU/6;
      coins.push([cx+Math.cos(a)*(R*2+0.2),cy+Math.sin(a)*(R*2+0.2),i%2===0?'W':'B']);
    }
    for(let i=0;i<12;i++){
      const a=-Math.PI/2+TAU/24+i*TAU/12;
      coins.push([cx+Math.cos(a)*(R*4+0.4),cy+Math.sin(a)*(R*4+0.4),i%2===0?'B':'W']);
    }
    coins.forEach((c2,i)=>{
      const gone=tPh(t,0.08+i*0.028,0.16+i*0.028);
      if(gone<1) drawCoin(ctx,c2[0],c2[1],R,c2[2],1-gone*0.9);
    });
    const potP=tPh(t,0.66,0.8);
    if(potP>0){
      ctx.save();
      const scl=easeOutBack(Math.min(1,potP*1.4));
      ctx.translate(bx(S/2),by(S/2)); ctx.scale(scl,scl);
      ctx.fillStyle='#2a1c0e'; rr(ctx,-56,-17,112,34,17); ctx.fill();
      ctx.strokeStyle=C.gold; ctx.lineWidth=1.5; rr(ctx,-56,-17,112,34,17); ctx.stroke();
      ctx.fillStyle=C.gold; ctx.font='900 14px '+FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('POT ₹150',0,0.5);
      ctx.restore();
    }
  }else if(kind==='target'){
    // empty board: just the ₹350 plate and the filling bank bar
    ctx.save();
    ctx.fillStyle=C.gold; rr(ctx,bx(S/2)-56,by(S*0.34)-17,112,34,17); ctx.fill();
    ctx.fillStyle='#3a2a08'; ctx.font='900 15px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('₹350',bx(S/2),by(S*0.34)+0.5);
    const p=tPh(t,0.15,0.8);
    const bw2=S*0.56;
    const bx0=bx(S/2-bw2/2), byy2=by(S*0.34)+34;
    ctx.fillStyle='rgba(0,0,0,.45)'; rr(ctx,bx0,byy2,bw2,12,6); ctx.fill();
    ctx.fillStyle=forceColor(p); rr(ctx,bx0,byy2,Math.max(6,bw2*p),12,6); ctx.fill();
    ctx.font='800 9px '+FONT; ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.fillText('BANK ₹'+Math.round(lerp(240,350,p)),bx(S/2),byy2+24);
    ctx.restore();
  }
}
function drawTutScreen(){

  const total=TUTV.cards.length;

  ctx.fillStyle='rgba(255,255,255,.02)';
  for(let i=0;i<120;i++) ctx.fillRect(nr()*W,nr()*H,2,2);

    ctx.fillStyle='#fff'; ctx.font='900 14px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('◀',pr.x+pr.w/2,pr.y+pr.h/2+0.5);
  }
  if(TUTV.idx<total-1){
    const nx={x:W-16-108,y:navY,w:108,h:bh};

    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
    ctx.fillStyle=C.tile; rr(ctx,nx.x,nx.y,nx.w,nx.h,14); ctx.fill();
    ctx.restore();
    ctx.strokeStyle=C.btnStroke; ctx.lineWidth=1.3; rr(ctx,nx.x,nx.y,nx.w,nx.h,14); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='800 12px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('NEXT ▶',nx.x+nx.w/2,nx.y+nx.h/2+0.5);
  }else{

    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
    ctx.fillStyle=C.gold; rr(ctx,fx2.x,fx2.y,fx2.w,fx2.h,14); ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#3a2a08'; ctx.lineWidth=1.3; rr(ctx,fx2.x,fx2.y,fx2.w,fx2.h,14); ctx.stroke();
    ctx.fillStyle='#3a2a08'; ctx.font='800 12px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('✓ FINISH',fx2.x+fx2.w/2,fx2.y+fx2.h/2+0.5);
  }
}

function drawMiniHero(cx,cy,S){

  }
  for(let i=0;i<12;i++){
    const a=-Math.PI/2+TAU/24+i*TAU/12;
    drawCoin(ctx,hcx+Math.cos(a)*(R*4+0.4),hcy+Math.sin(a)*(R*4+0.4),R,i%2===0?'B':'W');
